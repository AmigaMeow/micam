// ---- 热力图叠加层 ----
var _heatCanvases = {}; // name -> canvas element

function toggleGridHeatmap(tile, did, name){
  var existing = tile.querySelector('.gtile-heat-canvas');
  if(existing){
    existing.remove();
    delete _heatCanvases[name];
    var btn = tile.querySelector('[data-gheat]');
    if(btn) btn.style.color = '';
    return;
  }
  api('/api/events/heatmap?did=' + encodeURIComponent(did) + '&days=30')
    .then(function(d){
      if(!d.cells || !d.cells.length){ toast('该摄像头暂无热力数据（需要AI识别到目标才有检测框）', 'warn'); return; }
      var canvas = document.createElement('canvas');
      canvas.className = 'gtile-heat-canvas';
      canvas.width = tile.offsetWidth || 320;
      canvas.height = tile.offsetHeight || 240;
      canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:.75;border-radius:inherit;';
      tile.style.position = 'relative';
      tile.appendChild(canvas);
      _heatCanvases[name] = canvas;
      var ctx = canvas.getContext('2d');
      var cols = d.cols || 20, rows = d.rows || 20;
      var maxCnt = 1;
      d.cells.forEach(function(cell){ if(cell.count > maxCnt) maxCnt = cell.count; });
      var cw = canvas.width / cols, ch = canvas.height / rows;
      d.cells.forEach(function(cell){
        var ratio = cell.count / maxCnt;
        // heat color: blue -> green -> yellow -> red
        var r, g, b;
        if(ratio < 0.33){ r=0; g=Math.round(ratio*3*255); b=255-g; }
        else if(ratio < 0.66){ var t=(ratio-0.33)*3; r=Math.round(t*255); g=255; b=0; }
        else { var t=(ratio-0.66)*3; r=255; g=Math.round((1-t)*255); b=0; }
        ctx.fillStyle = 'rgba('+r+','+g+','+b+','+(0.3+ratio*0.6)+')';
        ctx.fillRect(cell.col*cw, cell.row*ch, cw+1, ch+1);
      });
      var btn = tile.querySelector('[data-gheat]');
      if(btn) btn.style.color = '#f59e0b';
      toast('热力图：近30天 ' + d.total + ' 个事件', 'ok', 3000);
    })
    .catch(function(e){ toast('热力图加载失败：' + e.message, 'err'); });
}

      + '</nav>'

      + '<div class="list-head">'
      +   '<div class="list-head__main">'
      +     '<h1 class="list-head__title">多路预览</h1>'
      +     '<div class="list-head__en">多路同屏预览</div>'
      +   '</div>'
      +   '<div class="list-head__acts">'
      +     '<div class="segmented" id="gridLayout">'
      +       [1,4,9,16].map(function(n){
                return '<button class="segmented__btn' + (gridLayout===n?' is-active':'') + '" data-gl="' + n + '">' + n + ' 路</button>';
              }).join('')
      +     '</div>'
      +   '</div>'
      + '</div>'

      + '<div class="gbar">'
      +   '<button class="gbar__btn' + (gridPatrol ? ' is-active' : '') + '" id="gPatrol">'
      +     icon('refresh',14) + '轮巡' + (gridPatrol ? '中' : '') + '</button>'
      +   '<label class="gbar__sel">' + icon('eye',14)
      +     '<select id="gInfo">'
      +       '<option value="full"' + (gridInfoMode==='full'?' selected':'') + '>显示名称+时间</option>'
      +       '<option value="name"' + (gridInfoMode==='name'?' selected':'') + '>仅显示名称</option>'
      +       '<option value="none"' + (gridInfoMode==='none'?' selected':'') + '>隐藏信息</option>'
      +     '</select></label>'
      +   '<label class="gbar__sel">' + icon('gauge',14)
      +     '<select id="gFps">'
      +       [1,3,5,10].map(function(v){
                return '<option value="' + v + '"' + (gridFps===v?' selected':'') + '>' + v + ' fps</option>';
              }).join('')
      +     '</select></label>'
      +   '<span class="gbar__right">在线 ' + all.filter(function(d){ return d.isOnline; }).length + ' / 共 ' + all.length + ' 台</span>'
      +   '<button class="gbar__btn" id="gFullscreen" title="全屏">'
      +     icon('maximize',14) + '全屏'
      +   '</button>'

      +   '<div class="ggrid ggrid--' + (gridLayout === 1 ? 1 : (gridLayout === 16 ? 4 : gridLayout === 9 ? 3 : 2))

      +     gridTilesHTML
      +   '</div>'
      +   '<aside class="gd-panel" id="gdPanel">' + devicePanel() + '</aside>'
      + '</div>'

      + '</div>';

    // ---- 开流 ----

      var dev = all.filter(function(d){ return d.name === img.dataset.stream; })[0];

    });

    // ---- 时间戳 ----

      Array.prototype.forEach.call(document.querySelectorAll('[data-gclock]'), function(el){
        el.textContent = clockNow();
      });
    }, 1000));

    // ---- 轮巡 ----
    function setPatrol(on){
      gridPatrol = on;
      if(gridPatrolTimer){ clearInterval(gridPatrolTimer); gridPatrolTimer = null; }
      if(!on) return;
      gridPatrolTimer = setInterval(function(){
        if(shown.length < 2) return;
        var i = -1;
        shown.forEach(function(d, k){ if(d.name === gridFocus) i = k; });
        var next = shown[(i + 1) % shown.length];
        gridFocus = next.name;
        Array.prototype.forEach.call(c.querySelectorAll('.gtile'), function(el){
          el.classList.toggle('is-focus', el.dataset.dev === gridFocus);
        });
      }, 15000);
    }
    setPatrol(gridPatrol);

    // ---- 交互 ----
    function setFocus(name){
      gridFocus = name;
      Array.prototype.forEach.call(c.querySelectorAll('.gtile'), function(el){
        el.classList.toggle('is-focus', el.dataset.dev === name);
      });
    }

    Array.prototype.forEach.call(c.querySelectorAll('.gtile[data-dev]'), function(el){
      var name = el.dataset.dev;
      el.onclick = function(ev){
        if(ev.target.closest('[data-gmax]')){ gotoLiveByName(name); return; }
        if(ev.target.closest('[data-gfocus]')){ setFocus(name); return; }
        if(ev.target.closest('[data-gheat]')){
          var dev = (devices||[]).filter(function(d){ return d.name === name; })[0];
          var did = dev ? dev.did : name;
          toggleGridHeatmap(el, did, name);
          return;
        }
        setFocus(name);
      };
      el.ondblclick = function(){ gotoLiveByName(name); };
    });

    Array.prototype.forEach.call(c.querySelectorAll('.gtile--empty'), function(el){
      el.onclick = function(){
        var gs = document.getElementById('gdSearch');
        if(gs){ gs.focus(); if(gs.select) gs.select(); }

      };
    });

    Array.prototype.forEach.call(c.querySelectorAll('[data-gl]'), function(b){
      b.onclick = function(){
        var v = parseInt(this.dataset.gl, 10);
        if(v === gridLayout) return;
        gridLayout = v;
        stopGrid();
        renderGrid(c);
      };
    });

    var gp = document.getElementById('gPatrol');
    if(gp) gp.onclick = function(){ stopGrid(); gridPatrol = !gridPatrol; renderGrid(c); };

    var gi = document.getElementById('gInfo');
    if(gi) gi.onchange = function(){ gridInfoMode = this.value; stopGrid(); renderGrid(c); };

    var gf = document.getElementById('gFps');
    if(gf) gf.onchange = function(){ gridFps = parseInt(this.value,10) || 3; stopGrid(); renderGrid(c); };

    var gs = document.getElementById('gdSearch');
    if(gs){
      var deb = null;
      gs.oninput = function(){
        gridQuery = this.value;
        if(deb) clearTimeout(deb);
        deb = setTimeout(function(){
          var panel = document.getElementById('gdPanel');
          if(panel){ panel.innerHTML = devicePanel(); bindPanel(); }
        }, 200);
      };
    }

    function bindPanel(){
      Array.prototype.forEach.call(document.querySelectorAll('[data-gtoggle]'), function(b){
        b.onclick = function(){
          var name = this.dataset.gtoggle;
          var sel2 = gridLoad().slice();
          var i = sel2.indexOf(name);
          if(i >= 0){ sel2.splice(i,1); toast('已移除'); }
          else {
            if(sel2.length >= gridLayout){ toast('最多 ' + gridLayout + ' 路，请先调大布局', 'warn'); return; }
            sel2.push(name); toast('已添加', 'ok');
          }
          gridSelected = sel2; gridSave();
          stopGrid();
          renderGrid(c);
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('img[data-gdthumb]'), function(img, i){
        var name = img.dataset.gdthumb;
        var dev = all.filter(function(d){ return d.name === name; })[0];
        if(!dev || !dev.isOnline) return;
        setTimeout(function(){
          fetch(apiUrl('/api/live/thumb?did=' + encodeURIComponent(dev.did) + '&w=320'), { cache:'no-store' })
            .then(function(r){ return r.ok ? r.blob() : null; })
            .then(function(b){ if(b && document.body.contains(img)) img.src = URL.createObjectURL(b); })
            .catch(function(){});

    // ---- 全屏 ----

    if(gfs) gfs.onclick = function(){

      if(!document.fullscreenElement){
        (gw.requestFullscreen || gw.webkitRequestFullscreen || function(){}).call(gw);
        this.innerHTML = icon('minimize',14) + '退出全屏';
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
        this.innerHTML = icon('maximize',14) + '全屏';

    document.addEventListener('fullscreenchange', function(){

        : icon('maximize',14) + '全屏';

    // ---- 事件角标 & PiP 提醒 ----
    var _gridLastEvTime = null;
    var _gridBadges = {};      // deviceName -> count
    var _gridPipQueue = [];
    var _gridPipShowing = false;

    function showGridPip(ev){
      var pip = document.createElement('div');
      pip.className = 'grid-pip';
      pip.style.cssText = 'position:fixed;bottom:80px;right:20px;width:260px;background:var(--surface-2);'
        + 'border:1px solid var(--border);border-radius:10px;padding:10px 12px;z-index:9999;'
        + 'box-shadow:0 4px 20px rgba(0,0,0,.5);cursor:pointer;animation:slideUp .25s ease;';
      var devObj = (devices||[]).filter(function(d){ return d.name === ev.device || d.did === ev.did; })[0];
      var thumbSrc = ev.thumb ? apiUrl('/api/events/thumb/' + encodeURIComponent(ev.thumb)) : '';
      pip.innerHTML = '<div style="display:flex;gap:8px;align-items:center">'
        + (thumbSrc ? '<img src="' + thumbSrc + '" style="width:56px;height:42px;object-fit:cover;border-radius:4px;flex-shrink:0">' : '')
        + '<div style="min-width:0">'
        +   '<div style="font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
        +     (devObj ? (devObj.alias || devObj.name) : ev.device) + '</div>'
        +   '<div style="font-size:13px;font-weight:600;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
        +     (ev.aiTitle || ev.desc || ev.type) + '</div>'
        +   '<div style="font-size:11px;color:var(--text-3)">' + (ev.time || '').slice(11,16) + '</div>'
        + '</div>'
        + '<button onclick="this.parentNode.parentNode.remove();_gridPipShowing=false;showNextPip();" '
        +   'style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-3);font-size:16px;flex-shrink:0">✕</button>'
        + '</div>';
      pip.onclick = function(e){
        if(e.target.tagName === 'BUTTON') return;
        openEventDetail(ev);
        pip.remove(); _gridPipShowing = false; showNextPip();
      };
      document.body.appendChild(pip);
      _gridPipShowing = true;
      setTimeout(function(){ if(pip.parentNode){ pip.remove(); _gridPipShowing=false; showNextPip(); } }, 5000);
    }

    function showNextPip(){
      if(_gridPipShowing || !_gridPipQueue.length) return;
      showGridPip(_gridPipQueue.shift());
    }

    function updateGridBadges(newEvents){
      newEvents.forEach(function(ev){
        var name = ev.device;
        _gridBadges[name] = (_gridBadges[name] || 0) + 1;
      });
      // Update badge DOM on tiles
      Object.keys(_gridBadges).forEach(function(name){
        var cnt = _gridBadges[name];
        var tile = c.querySelector('.gtile[data-dev="' + name + '"]');
        if(!tile) return;
        var badge = tile.querySelector('.gtile-badge');
        if(!badge){
          badge = document.createElement('span');
          badge.className = 'gtile-badge';
          badge.style.cssText = 'position:absolute;top:6px;right:6px;background:#ef4444;color:#fff;'
            + 'border-radius:999px;font-size:11px;font-weight:700;padding:1px 5px;z-index:10;'
            + 'min-width:18px;text-align:center;line-height:16px;';
          tile.style.position = 'relative';
          tile.appendChild(badge);
        }
        badge.textContent = cnt > 9 ? '9+' : String(cnt);
      });
    }

    // Poll for new events every 10s
    var _gridPollTimer = setInterval(function(){
      if(page !== 'grid'){ clearInterval(_gridPollTimer); return; }
      api('/api/events?limit=10').then(function(d){
        var evs = d.events || d || [];
        if(!Array.isArray(evs)) return;
        if(_gridLastEvTime === null){
          if(evs.length) _gridLastEvTime = evs[0].time;
          return;
        }
        var newEvs = evs.filter(function(e){ return e.time > _gridLastEvTime; });
        if(newEvs.length){
          _gridLastEvTime = newEvs[0].time;
          updateGridBadges(newEvs);
          newEvs.forEach(function(ev){ _gridPipQueue.push(ev); });
          showNextPip();
        }
      }).catch(function(){});
    }, 10000);
    gridTimers.push(_gridPollTimer);

    // Clear badge on tile click
    Array.prototype.forEach.call(c.querySelectorAll('.gtile[data-dev]'), function(el){
      el.addEventListener('click', function(){
        var name = el.dataset.dev;
        delete _gridBadges[name];
        var badge = el.querySelector('.gtile-badge');
        if(badge) badge.remove();
      }, true);
    });

    var gb = c.querySelector('[data-go]');
    if(gb) gb.onclick = function(){ page='devices'; renderMenu(); render(); };
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderGrid(c); }) + '</div>';
  });
}

function fmtDur(sec){
  if(!sec || sec <= 0) return "0:00";
  var total = Math.round(sec);
  var m = Math.floor(total / 60), s = total % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function fmtSizeMB(v){
  if(v == null) return "—";
  if(v < 1) return (v * 1024).toFixed(0) + " KB";
  if(v < 1024) return v.toFixed(1) + " MB";
  return (v / 1024).toFixed(2) + " GB";
}

function showEventMenu(el, ev){
  var id = ev.id;
  var fav = evIsFav(id);
  var watch = evIsWatch(id);
  openModal('事件操作',
    '<div class="ev-menu">'
    + '<button class="ev-menu__item" data-evact="play">' + icon('play',15) + '播放该时刻录像</button>'
    + '<button class="ev-menu__item" data-evact="book">' + icon('bookmark',15) + (fav ? '取消收藏' : '收藏此事件') + '</button>'
    + '<button class="ev-menu__item" data-evact="watch">' + icon('alert',15) + (watch ? '取消「需关注」' : '标记为需关注') + '</button>'
    + '<button class="ev-menu__item" data-evact="copy">' + icon('copy',15) + '复制事件 ID</button>'
    + '<button class="ev-menu__item is-danger" data-evact="close">' + icon('close',15) + '关闭</button>'
    + '</div>',
    function(root){
      Array.prototype.forEach.call(root.querySelectorAll('[data-evact]'), function(b){
        b.onclick = function(){
          var a = this.dataset.evact;
          if(a === 'play'){ closeModal(); gotoReplay(ev.did, ev.time); }
          else if(a === 'book'){ setEvMark(id, { bookmark: !fav }); closeModal(); }
          else if(a === 'watch'){ setEvMark(id, { watch: !watch }); closeModal(); }
          else if(a === 'copy'){ copyText(id, '事件 ID 已复制'); }
          else closeModal();
        };
      });
    });
}

// ===== 24 小时专业连续录像时间轴 =====
function paintTimeline24(c){
  var box = document.getElementById('pbTimeline24');
  if(!box) return;

  var curDate = recState.date || (recState.dates.length ? recState.dates[0].date : localDate());
  var list = (recState.files || []).filter(function(f){
    return (!recState.dev || f.dev === recState.dev || f.name.indexOf(recState.dev) >= 0 || (f.device && f.device === recState.dev)) &&
           (f.date === curDate);
  });

  // 1. 整理时间跨度并合并相连/重叠片段
  var rawSpans = list.map(function(f){
    var s = timeToSec(f.startTime);
    var d = Math.round(f.duration || 0);
    return { start: s, end: Math.min(86400, s + d), file: f };
  }).sort(function(a, b){ return a.start - b.start; });

  var mergedSpans = [];
  rawSpans.forEach(function(sp){
    if(!mergedSpans.length){
      mergedSpans.push({ start: sp.start, end: sp.end, files: [sp.file] });
    } else {
      var last = mergedSpans[mergedSpans.length - 1];
      if(sp.start <= last.end + 2){
        last.end = Math.max(last.end, sp.end);
        last.files.push(sp.file);
      } else {
        mergedSpans.push({ start: sp.start, end: sp.end, files: [sp.file] });
      }
    }
  });

  var totalRecSec = 0;
  rawSpans.forEach(function(s){ totalRecSec += (s.end - s.start); });

  // 2. 刻度文字（00:00, 03:00, 06:00, ..., 24:00）
  var ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(function(h){
    var pct = (h / 24) * 100;
    var label = pad2(h) + ':00';
    return '<span style="left:' + pct + '%">' + label + '</span>';
  }).join('');

  // 3. 渲染已录制绿色片段
  var spanElements = mergedSpans.map(function(sp){
    var leftPct = (sp.start / 86400) * 100;
    var widthPct = ((sp.end - sp.start) / 86400) * 100;
    return '<div class="pb-t24__span" style="left:' + leftPct.toFixed(3) + '%;width:' + Math.max(0.2, widthPct).toFixed(3) + '%;"></div>';
  }).join('');

  var titleDev = recState.dev ? esc(recState.dev) : '全部设备';
  var statsTxt = list.length + ' 个片段 · 共 ' + fmtDur(totalRecSec);

  box.innerHTML = ''
    + '<div class="pb-t24__head">'
    +   '<div class="pb-t24__title">'
    +     icon('video', 16)
    +     '<span>24 小时连续录像轴</span>'
    +     '<span class="pb-t24__date">' + esc(curDate) + ' · ' + titleDev + '</span>'
    +     '<span class="pb-t24__stats">' + statsTxt + '</span>'
    +   '</div>'
    +   '<div class="pb-t24__cur">'
    +     '<span class="pb-t24__cur-label">播放时刻</span>'
    +     '<span class="pb-t24__cur-val" id="pbCurTimeVal">00:00:00</span>'
    +   '</div>'
    + '</div>'
    + '<div class="pb-t24__ruler-box">'
    +   '<div class="pb-t24__ticks">' + ticks + '</div>'
    +   '<div class="pb-t24__track" id="pbT24Track">'
    +     spanElements
    +     '<div id="pbT24Events"></div>'
    +     '<div class="pb-t24__needle" id="pbT24Needle" style="left:0%">'
    +       '<span class="pb-t24__needle-tag" id="pbT24NeedleTag">00:00:00</span>'
    +     '</div>'
    +     '<div class="pb-t24__hover" id="pbT24Hover">'
    +       '<span class="pb-t24__hover-tag" id="pbT24HoverTag">00:00:00</span>'
    +     '</div>'
    +   '</div>'
    + '</div>';

  // 4. 异步加载并渲染事件标记
  function renderEvents(evList){
    var evBox = document.getElementById('pbT24Events');
    if(!evBox) return;
    var EV_MAP = {
      person: 'pb-t24__ev--person',
      vehicle: 'pb-t24__ev--vehicle',
      package: 'pb-t24__ev--package',
      motion: 'pb-t24__ev--motion'
    };
    evBox.innerHTML = (evList || []).map(function(e){
      var es = timeToSec(e.time);
      var pct = (es / 86400) * 100;
      var cls = EV_MAP[e.type] || 'pb-t24__ev--motion';
      var timeStr = (e.time || '').slice(11, 19);
      var tip = timeStr + ' ' + (e.device || '') + (e.aiCls ? ' · ' + e.aiCls : '');
      return '<div class="pb-t24__ev ' + cls + '" style="left:' + pct.toFixed(3) + '%" title="' + esc(tip) + '"></div>';
    }).join('');
  }

  // 4. 事件标记带缓存（跨天查询 7 天数据在内存中瞬时命中）
  if(recState.allEvents){
    var matchedEv = (recState.allEvents || []).filter(function(e){ return String(e.time||'').slice(0,10) === curDate; });
    renderEvents(matchedEv);
  } else {
    api('/api/events?days=7&limit=1000').then(function(r){
      recState.allEvents = r.events || [];
      var matchedEv = recState.allEvents.filter(function(e){ return String(e.time||'').slice(0,10) === curDate; });
      renderEvents(matchedEv);
    }).catch(function(){});
  }

  // 5. 绑定鼠标悬停、流畅拖拽寻道 (Scrubbing) 与点击定位
  var track = document.getElementById('pbT24Track');
  var hoverLine = document.getElementById('pbT24Hover');
  var hoverTag = document.getElementById('pbT24HoverTag');

  if(track){
    var isDragging = false;
    var rafId = null;

    function handleSeek(clientX, commit){
      var rect = track.getBoundingClientRect();
      var x = Math.max(0, Math.min(rect.width, clientX - rect.left));
      var sec = Math.round((x / rect.width) * 86400);

      // 实时指针跟随（高频更新，requestAnimationFrame 节流）
      if(hoverLine){
        hoverLine.style.display = '';
        hoverLine.style.left = x + 'px';
      }
      if(hoverTag){
        hoverTag.style.display = '';
        hoverTag.textContent = secToHms(sec);
      }
      var curVal = document.getElementById('pbCurTimeVal');
      if(curVal) curVal.textContent = secToHms(sec);

      // 若处于拖拽中，让红线指针也跟着移动，极速反馈
      if(isDragging){
        var needle = document.getElementById('pbT24Needle');
        var needleTag = document.getElementById('pbT24NeedleTag');
        if(needle) needle.style.left = ((sec / 86400) * 100).toFixed(3) + '%';
        if(needleTag) needleTag.textContent = secToHms(sec);
      }

      if(!commit) return;

      // 查找落在范围内的录像
      var matched = null;
      var seekOffset = 0;
      var curDev = (curRecFileObj() || {}).dev || '';
      for(var i = 0; i < list.length; i++){
        var f = list[i];
        var s = timeToSec(f.startTime);
        var dur = Math.round(f.duration || 0);
        if(sec >= s && sec <= s + dur){
          if(!matched || (curDev && f.dev === curDev)){
            matched = f;
            seekOffset = sec - s;
            if(f.dev === curDev) break;
          }
        }
      }

      if(!matched && list.length){
        // 查找点击时刻之后的最近一段录像（按最小正差值查找，避免降序误选最后一项）
        var nextF = null;
        var minDiff = 86400;
        for(var ni = 0; ni < list.length; ni++){
          var item = list[ni];
          if(curDev && item.dev && item.dev !== curDev) continue;
          var itemSec = timeToSec(item.startTime);
          if(itemSec >= sec){
            var diff = itemSec - sec;
            if(diff < minDiff){
              minDiff = diff;
              nextF = item;
            }
          }
        }
        if(nextF){
          toast('该时段未录制，已跳至下一段 ' + (nextF.startTime || '').slice(11, 19), 'info');
          matched = nextF;
          seekOffset = 0;
        } else {
          toast('该时段未录制（绿色区域为录像）', 'warn');
          var needle2 = document.getElementById('pbT24Needle');
          var needleTag2 = document.getElementById('pbT24NeedleTag');
          var curVal2 = document.getElementById('pbCurTimeVal');
          if(needle2) needle2.style.left = ((sec / 86400) * 100).toFixed(3) + '%';
          if(needleTag2) needleTag2.textContent = secToHms(sec);
          if(curVal2) curVal2.textContent = secToHms(sec);
          return;
        }
      }

      if(matched){
        var actualSec = timeToSec(matched.startTime) + seekOffset;
        var hms = secToHms(actualSec);
        var needle = document.getElementById('pbT24Needle');
        var needleTag = document.getElementById('pbT24NeedleTag');
        var curVal = document.getElementById('pbCurTimeVal');
        if(needle) needle.style.left = ((actualSec / 86400) * 100).toFixed(3) + '%';
        if(needleTag) needleTag.textContent = hms;
        if(curVal) curVal.textContent = hms;

        var v = document.getElementById('recVideo');
        var targetKey = (matched.dev || '') + '/' + (matched.date || '') + '/' + matched.name;
        var isCurrentLoaded = (window._currentRecKey === targetKey && v && v.src && v.src.indexOf(encodeURIComponent(matched.name)) >= 0);

        if(isCurrentLoaded){
          // 关键优化：静态 MP4 具有全文件 Range 寻道能力，直接就地定位并起播，绝不重设 v.src！
          if(isStaticMP4Cache(v, matched.duration)){
            try { v.currentTime = Math.min(seekOffset, v.duration - 0.2); } catch(e){}
            v.play().catch(function(){});
            updateTimeline24Needle();
          } else {
            playRecFile(matched, seekOffset);
          }
        } else {
          recState.file = matched.name;
          highlightActiveFile(matched.name, matched.dev);
          playRecFile(matched, seekOffset);
        }
      } else {
        toast('该时段没有录像', 'warn');
      }
    }

    var didMove = false;
    var startX = 0;
    track.onmousemove = function(e){
      if(!isDragging){
        handleSeek(e.clientX, false);
      }
    };

    var seekDebounceTimer = null;
    function commitSeek(clientX){
      if(seekDebounceTimer) clearTimeout(seekDebounceTimer);
      seekDebounceTimer = setTimeout(function(){
        handleSeek(clientX, true);
      }, 50);
    }

    track.onmousedown = function(e){
      isDragging = true;
      didMove = false;
      startX = e.clientX;
      handleSeek(e.clientX, false);

      function onMove(me){
        if(!isDragging) return;
        if(Math.abs(me.clientX - startX) > 4) didMove = true;
        if(rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(function(){
          handleSeek(me.clientX, false);
        });
      }

      function onUp(ue){
        if(!isDragging) return;
        isDragging = false;
        if(rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        if(didMove){
          commitSeek(ue.clientX);
        }
      }

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    };

    track.onclick = function(e){
      // 单击直接跳播（若已通过拖拽松手提交过，则不再重复触发）
      if(!didMove){
        commitSeek(e.clientX);
      }
    };

    track.onmouseleave = function(){
      if(isDragging) return;
      if(hoverLine) hoverLine.style.display = 'none';
      if(hoverTag) hoverTag.style.display = 'none';
      updateTimeline24Needle();
    };

    track.onmouseenter = function(){
      if(hoverLine) hoverLine.style.display = '';
      if(hoverTag) hoverTag.style.display = '';
    };
  }

  updateTimeline24Needle();
}

function updateTimeline24Needle(){
  var needle = document.getElementById('pbT24Needle');
  var needleTag = document.getElementById('pbT24NeedleTag');
  var curVal = document.getElementById('pbCurTimeVal');
  var v = document.getElementById('recVideo');
  var f = curRecFileObj();
  if(!needle || !v || !f) return;

  // 关键保护：若当前视频源并非当前活动片段，不要用旧视频的 currentTime 更新新片段的时间轴指针！
  if(!v.src || v.src.indexOf(encodeURIComponent(f.name)) < 0) return;

  var fStart = timeToSec(f.startTime);
  var streamOff = window._currentStreamOffset || 0;
  var curSec = Math.min(86399, fStart + streamOff + (v.currentTime || 0));
  var pct = (curSec / 86400) * 100;
  var hms = secToHms(curSec);

  needle.style.left = pct.toFixed(3) + '%';
  if(needleTag) needleTag.textContent = hms;
  if(curVal) curVal.textContent = hms;
}

// ===== 播放器控制栏自动隐藏（无鼠标活动 2.5 秒后自动淡出避让画面）=====
(function(){
  var idleTimer = null;
  var activeWrap = null;
  var isOverBar = false;

  function resetIdle(wrap){
    if(!wrap) return;
    wrap.classList.remove('is-idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      // 若鼠标正停留在控制栏上，或正在操作下拉菜单/输入项，保持常驻
      if(isOverBar){
        resetIdle(wrap);
        return;
      }
      var bar = wrap.querySelector('.player__bar');
      if(bar){
        try {
          if(bar.matches(':hover') || bar.matches(':focus-within')){
            resetIdle(wrap);
            return;
          }
        } catch(e){}
      }
      wrap.classList.add('is-idle');
    }, 2500);
  }

  // 跟踪鼠标是否正悬停在控制栏（按钮/下拉列表）上方
  document.addEventListener('mouseover', function(e){
    if(e.target && e.target.closest && e.target.closest('.player__bar')){
      isOverBar = true;
    } else {
      isOverBar = false;
    }
  }, { passive: true });

  document.addEventListener('mousemove', function(e){
    var wrap = e.target && e.target.closest ? e.target.closest('.player-wrap') : null;
    if(wrap){
      activeWrap = wrap;
      resetIdle(wrap);
    } else if(activeWrap){
      activeWrap.classList.add('is-idle');
      clearTimeout(idleTimer);
      activeWrap = null;
    }
  }, { passive: true });

  document.addEventListener('mouseleave', function(){
    if(activeWrap){
      activeWrap.classList.add('is-idle');
      clearTimeout(idleTimer);
      activeWrap = null;
    }
  }, { passive: true });

  document.addEventListener('touchstart', function(e){
    var wrap = e.target && e.target.closest ? e.target.closest('.player-wrap') : null;
    if(wrap){
      activeWrap = wrap;
      resetIdle(wrap);
    }
  }, { passive: true });

  // 页面切换或初次挂载时，延迟 2.5 秒自动沉浸
  document.addEventListener('routechange', function(){
    setTimeout(function(){
      var w = document.querySelector('.player-wrap');
      if(w) resetIdle(w);
    }, 400);
  });
})();

// ===== 顶栏右上角：用户菜单 + 全局搜索 =====
//
// ⚠️ 重要：这段代码**必须自包含**！
//
// 原因：应用主体脚本的作用域被包裹（esc/api/icon/render 不在 window 上），
// 而这段代码在包裹之外，**访问不到那些函数**。
// 之前直接调 api()/esc()/icon() -> ReferenceError -> 菜单点不开。
//
// 所以这里：
//   · 自己定义转义函数（不用 app 的 esc）
//   · 直接 fetch（不用 app 的 api）
//   · 内联 SVG（不用 app 的 icon）
//   · 导航靠【模拟点击导航按钮】触发 app 自己的路由（不直接改 page 变量）
//   · 所有跨作用域调用都包在 try/catch 里

var _tnHome = { homes: [], current: '' };

function _tnEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

function _tnApi(path){
  return fetch(apiPath(path)).then(function(r){ return r.json(); });
}

// apiPath 计算接口前缀（飞牛网关下路径会被重写）
function apiPath(path){
  // 复用 app 的逻辑：如果页面在 /app/micam/ 下，接口也在那里
  var base = '';
  try {
    var p = location.pathname;
    var i = p.indexOf('/app/micam');
    if(i >= 0) base = '/app/micam';
  } catch(e){}
  return base + path;
}

// _tnIcon 内联 SVG（不能用 app 的 icon）
function _tnIcon(name, size){
  var sz = size || 15;
  var paths = {
    home:    '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    check:   '<path d="M20 6 9 17l-5-5"/>',
    user:    '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    bell:    '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/>',
    code:    '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
    info:    '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
  };
  return '<svg class="icon" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + (paths[name] || paths.info) + '</svg>';
}

// _tnGoto 切页 —— 通过模拟点击导航按钮，交给 app 自己的路由
function _tnGoto(key){
  var el = document.querySelector('.tabnav[data-k="' + key + '"]');
  if(el){ el.click(); return true; }
  return false;
}

function bindThemeToggle(){
  var btn = document.getElementById('btnThemeToggle');
  if(!btn || btn.dataset.tnBound) return;
  btn.dataset.tnBound = '1';
  if(window.__micamUpdateThemeUI) window.__micamUpdateThemeUI();
  btn.onclick = function(e){
    e.stopPropagation();
    var isDark = window.__micamIsDark ? window.__micamIsDark() : document.documentElement.classList.contains('dark');
    var nextTheme = isDark ? 'light' : 'dark';
    if(window.__micamApplyTheme){
      window.__micamApplyTheme(nextTheme, true);
    }
    var t = document.getElementById('tnToast');
    if(!t){
      t = document.createElement('div');
      t.id = 'tnToast';
      t.className = 'tn-toast';
      document.body.appendChild(t);
    }
    t.textContent = nextTheme === 'dark' ? '已切换为深色模式' : '已切换为浅色模式';
    t.classList.add('is-on');
    setTimeout(function(){ t.classList.remove('is-on'); }, 2000);
  };
}

// _tnHomeNamed 家庭是否「有名字」
//
// 小米 API 对未命名的家庭会返回纯数字（常见是 "0" 或 userId）。
// 直接显示会变成 [0] 0，很难看，所以这类视为未命名。
function _tnHomeNamed(h){
  var n = String((h && h.name) || '').trim();
  if(!n) return false;
  if(/^\d+$/.test(n)) return false;   // 纯数字 -> 未命名
  if(/^[0-9a-f]{16,}$/i.test(n)) return false; // 看起来像 id
  return true;
}

// _tnHomeLabel 取用于显示的名字
//
// 未命名的家庭都叫「我的家」会重名，所以加短 id 后缀区分：
//   我的家 · 8561
function _tnHomeLabel(h){
  if(_tnHomeNamed(h)) return String(h.name).trim();
  var id = String((h && h.id) || '');
  // 取尾 4 位（id 通常很长，尾部位区分度够）
  var tail = id.length > 4 ? id.slice(-4) : id;
  return tail ? ('我的家 · ' + tail) : '我的家';
}

// loadTopNavHome 读家庭列表，更新显示
function loadTopNavHome(){
  _tnApi('/api/homes').then(function(d){
    var hs = (d && d.homes) || (Array.isArray(d) ? d : []);
    if(!hs.length) return;

    // 选「当前家庭」：
    //   1) 有名字的自己的家庭
    //   2) 有名字的家庭（含共享）
    //   3) 自己的第一台
    //   4) 兜底第一台
    var own = hs.filter(function(h){ return !h.shared; });
    var cur = own.filter(_tnHomeNamed)[0]
           || hs.filter(_tnHomeNamed)[0]
           || own[0] || hs[0];

    _tnHome.homes = hs;
    _tnHome.current = _tnHomeLabel(cur);

    var el = document.getElementById('userName');
    if(el) el.textContent = _tnHome.current;
    var av = document.getElementById('userAvatar');
    // 头像用第一个汉字；「我的家」-> 家
    if(av) av.textContent = (_tnHome.current || '家').slice(0, 1);
  }).catch(function(){ /* 读不到就保持 shell 的默认文案 */ });
}

// bindUserMenu 「我的家」下拉
function bindUserMenu(){
  var btn = document.getElementById('btnUser');

  btn.onclick = function(e){
    e.stopPropagation();

    var hs = _tnHome.homes || [];

    menu.id = 'userMenu';

    menu.innerHTML = ''
      + '<div class="usermenu__head">'
      +   '<div class="usermenu__avatar">' + _tnEsc((_tnHome.current || '家').slice(0, 1)) + '</div>'
      +   '<div class="usermenu__body">'
      +     '<div class="usermenu__name">' + _tnEsc(_tnHome.current || '我的家') + '</div>'
      +     '<div class="usermenu__sub">' + hs.length + ' 个家庭</div>'
      +   '</div>'
      + '</div>'
      + (hs.length > 1
          ? '<div class="usermenu__label">家庭</div>'
            + hs.map(function(h){
                var label = _tnHomeLabel(h);
                var on = (label === _tnHome.current);
                return '<button class="usermenu__item' + (on ? ' is-on' : '') + '" data-tn-home="' + _tnEsc(h.id) + '">'
                  + _tnIcon(on ? 'check' : 'home', 14)
                  + '<span>' + _tnEsc(label) + '</span>'
                  + (h.shared ? '<em>共享</em>' : '')
                  + '</button>';
              }).join('')
          : '')
      + '<div class="usermenu__sep"></div>'
      + '<button class="usermenu__item" data-tn-go="accounts">' + _tnIcon('user',14) + '<span>账号管理</span></button>'
      + '<button class="usermenu__item" data-tn-go="settings">' + _tnIcon('settings',14) + '<span>设置</span></button>'
      + '<button class="usermenu__item" data-tn-go="events">' + _tnIcon('bell',14) + '<span>事件中心</span></button>'
      + '<button class="usermenu__item" data-tn-go="dev">' + _tnIcon('code',14) + '<span>开发者</span></button>';

    document.body.appendChild(menu);
    var r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 8) + 'px';
    menu.style.right = Math.max(12, window.innerWidth - r.right) + 'px';

    Array.prototype.forEach.call(menu.querySelectorAll('[data-tn-go]'), function(el){
      el.onclick = function(){
        _tnGoto(this.dataset.tnGo);
        menu.remove();
      };
    });
    Array.prototype.forEach.call(menu.querySelectorAll('[data-tn-home]'), function(el){
      el.onclick = function(){
        var id = this.dataset.tnHome;
        var h = (_tnHome.homes || []).filter(function(x){ return String(x.id) === String(id); })[0];
        if(h){
          _tnHome.current = _tnHomeLabel(h);
          var el2 = document.getElementById('userName');
          if(el2) el2.textContent = _tnHome.current;
          try { localStorage.setItem('micam.home', JSON.stringify({ id: id, name: _tnHome.current })); } catch(e3){}
          var t = document.getElementById('tnToast');
          if(!t){
            t = document.createElement('div');
            t.id = 'tnToast';
            t.className = 'tn-toast';
            document.body.appendChild(t);
          }
          t.textContent = '已切换到「' + _tnHome.current + '」（设备列表暂未按家庭过滤）';
          t.classList.add('is-on');
          setTimeout(function(){ t.classList.remove('is-on'); }, 2600);
        }
        menu.remove();
      };
    });

    setTimeout(function(){
      document.addEventListener('click', function close(ev){
        if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('click', close); }
      });
    }, 0);
  };
}

// bindGlobalSearch 顶栏搜索（回车跳到事件中心搜索）
function bindGlobalSearch(){
  var inp = document.getElementById('globalSearch');
  if(!inp || inp.dataset.tnBound) return;
  inp.dataset.tnBound = '1';
  inp.onkeydown = function(ev){
    if(ev.key === 'Escape'){ this.blur(); return; }
    if(ev.key !== 'Enter') return;
    var q = this.value.trim();
    if(!q) return;
    // 交给事件页：先把关键字写进 sessionStorage，再切页
    try { sessionStorage.setItem('micam.search', q); } catch(e){}
    _tnGoto('events');
  };

  // 快捷键提示 + ⌘K / Ctrl+K 聚焦（用户反馈第 8 条）。
  //
  // 自包含：本段在 app 作用域之外运行，只能用 DOM API，
  // 不能调 esc()/icon()（它们不在 window 上 —— 见 HANDOFF 文档的陷阱说明）。
  try {
    var wrap = inp.parentElement;
    var isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
    if(wrap && !wrap.querySelector('.search__kbd')){
      var kbd = document.createElement('kbd');
      kbd.className = 'search__kbd';
      kbd.textContent = isMac ? '⌘K' : 'Ctrl K';
      wrap.appendChild(kbd);
    }
    if(!window._tnSearchKey){
      window._tnSearchKey = true;
      document.addEventListener('keydown', function(ev){
        var k = ev.key || '';
        if((ev.metaKey || ev.ctrlKey) && (k === 'k' || k === 'K')){
          var el = document.getElementById('globalSearch');
          if(!el) return;
          ev.preventDefault();
          el.focus();
          if(el.select) el.select();
        }
      });
    }
  } catch(e){}
}

// 顶栏初始化（DOM 就绪后执行一次）
(function(){
  function boot(){
    if(window._tnInited) return;
    window._tnInited = true;
    try { initTopNav(); } catch(e){ console.error('initTopNav 失败', e); }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

// 离开页面前若有未保存的 AI 设置改动，拦一次确认。
//
// 只在「确实有脏数据」时拦截（window._aiDirty 由设置页的脏标记维护）——
// 无条件拦截会骚扰正常的刷新/关闭操作。
window.addEventListener('beforeunload', function(e){
  if(!window._aiDirty) return;
  e.preventDefault();
  e.returnValue = '';   // 现代浏览器忽略文案，但必须设置才会弹确认
  return '';
});


</script>
