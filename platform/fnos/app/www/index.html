// bindSetMain 绑定中间内容里的控件
function bindSetMain(){
  var box = document.getElementById('setMain');
  if(!box) return;

  // 单选 + 开关 + 下拉：改动即保存
  Array.prototype.forEach.call(box.querySelectorAll('input[type=radio]'), function(r){
    r.onchange = function(){
      var body = {};
      if(this.name === 'uiTheme') body.theme = this.value;
      else if(this.name === 'uiTime') body.timeFormat = this.value;
      if(Object.keys(body).length) saveUI(body);
    };
  });

  var lang = document.getElementById('uiLang');
  if(lang) lang.onchange = function(){ saveUI({ language: this.value }); };
  var q = document.getElementById('uiQuality');
  if(q) q.onchange = function(){ saveUI({ defaultQuality: this.value }); };
  var pr = document.getElementById('uiProto');
  if(pr) pr.onchange = function(){ saveUI({ defaultProtocol: this.value }); };
  var ev = document.getElementById('uiEvView');
  if(ev) ev.onchange = function(){ saveUI({ eventsDefaultView: this.value }); };
  var sc = document.getElementById('uiSched');
  if(sc) sc.onchange = function(){ saveUI({ recordSchedule: this.value }); };

  var swMap = {
    uiAutoplay:'autoplayLive', uiMute:'autoplayMute',
    uiHomeCam:'homeShowCameras', uiHomeEv:'homeShowEvents', uiHomeSt:'homeShowStorage',
    uiEnAlias:'showEnglishAlias', uiCompact:'compactMode',
    uiLoop:'loopOverwrite', uiPush:'pushEnabled', uiEmail:'emailEnabled',
    uiAutoUpd:'autoUpdate',
  };
  Object.keys(swMap).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){
      var b = {}; b[swMap[id]] = this.checked; saveUI(b);
    };
  });

  // 数字输入：失焦保存
  [['uiKeep','keepDays'],['uiSeg','segmentSec'],['uiThresh','thresholdPct']].forEach(function(x){
    var el = document.getElementById(x[0]);
    if(el) el.onchange = function(){
      var v = parseInt(this.value, 10);
      if(!v) return;
      if(x[1] === 'keepDays'){ saveUI({ keepDays: v }); return; }
      // 分片/阈值走录像配置
      api('/api/recordings/config', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(x[1] === 'segmentSec' ? { segmentSec: v } : {}) })
        .then(function(){ toast('已保存', 'ok'); }).catch(function(e){ toast(e.message, 'err'); });
    };
  });

  // 免打扰
  ['uiQuietFrom','uiQuietTo'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){
      saveUI({ quietFrom: (document.getElementById('uiQuietFrom')||{}).value,
               quietTo:   (document.getElementById('uiQuietTo')||{}).value });
    };
  });

  // 通知相关
  var ne = document.getElementById('ntEnabled');
  if(ne) ne.onchange = function(){ saveNotify({ enabled: this.checked }); };
  var nw = document.getElementById('ntWebhook');
  if(nw) nw.onchange = function(){ saveNotify({ webhook: this.value }); };
  Array.prototype.forEach.call(box.querySelectorAll('[data-ev]'), function(cb){
    cb.onchange = function(){
      var evs = [];
      Array.prototype.forEach.call(box.querySelectorAll('[data-ev]'), function(x){
        if(x.checked) evs.push(x.dataset.ev);
      });
      saveNotify({ events: evs });
    };
  });
  var nt = document.getElementById('btnNotifyTest');
  if(nt) nt.onclick = function(){
    api('/api/notify/test', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' })
      .then(function(r){ toast(r.ok ? '测试通知已发送' : ('失败：' + (r.error||'')), r.ok?'ok':'err'); })
      .catch(function(e){ toast(e.message, 'err'); });
  };

  // 跳转按钮
  var go = function(id, target){
    var el = document.getElementById(id);
    if(el) el.onclick = function(){ page = target; renderMenu(); render(); };
  };
  go('setGoRec','recordings'); go('setGoStorage','storage'); go('setGoAI','ai'); go('setGoDev','devices'); go('setGoWizard','setup');

  var db = document.getElementById('btnDiagBundle');
  if(db) db.onclick = function(){ window.open(apiUrl('/api/diag/bundle'), '_blank'); };
  var lg = document.getElementById('btnShowLog');
  if(lg) lg.onclick = function(){ toast('日志在 /vol1/@appdata/micam/micamd.log', 'warn'); };
}

function saveUI(patch){
  api('/api/ui/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) })
    .then(function(r){
      if(r.warn) toast(r.warn, 'warn'); else toast('已保存', 'ok');
      if(r.config) setCfg = r.config;
      // 刷新右卡（有些值影响摘要）
      api('/api/ui/config').then(function(d){ setSum = d.summary || {}; paintSettings(document.getElementById('content')); });
    })
    .catch(function(e){ toast('保存失败：' + e.message, 'err'); });
}

function saveNotify(patch){
  api('/api/notify/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) })
    .then(function(){ toast('已保存', 'ok'); })
    .catch(function(e){ toast('保存失败：' + e.message, 'err'); });
}

function bindSettings(c){
  Array.prototype.forEach.call(c.querySelectorAll('[data-settab]'), function(el){
    el.onclick = function(){
      setTab = this.dataset.settab;
      paintSettings(c);
    };
  });
}

// ===== 凭据状态提示 =====
//
// 为什么要显示：cs2 凭据有有效期（实测 8 小时），
// 过期后需要向小米云申请，而小米云有限流。
// 限流期间用户什么都不做就一直是黑屏 —— 必须让他知道原因。
function loadCredBar(){
  var bar = $("#credBar");
  if(!bar) return;
  api("/api/live/cred-status").then(function(d){
    var devs = d.devices || [];
    var dev = null;
    for(var i=0;i<devs.length;i++){ if(devs[i].did === currentDid){ dev = devs[i]; break; } }
    if(!dev || !dev.hasCred){ bar.style.display = "none"; return; }

    var msg = "", bg = "", color = "";
    if(dev.cooldownMinutes > 0){
      bg = "rgba(255,77,79,.12)"; color = "var(--danger)";
      msg = "⚠️ 摄像头凭据需要刷新，但小米云正在限流。约 " + dev.cooldownMinutes + " 分钟后自动重试。"
          + "<br>期间可能无法播放。可稍后再试，或重启路由器换个出口 IP。";
    } else if(dev.expiresInMinutes < 60){
      bg = "rgba(250,173,20,.12)"; color = "var(--warning)";
      msg = "⚠️ 摄像头凭据约 " + dev.expiresInMinutes + " 分钟后过期，到期会自动续期。";
    } else {
      return;   // 正常状态不打扰
    }

    bar.style.display = "block";
    bar.style.background = bg;
    bar.style.color = color;
    bar.innerHTML = msg
      + "<div style=\"margin-top:8px\">"
      +   "<button class=\"btn btn--sm\" id=\"btnRenew\">立即重试刷新</button>"
      + "</div>";

    var btn = $("#btnRenew");
    if(btn) btn.onclick = function(){
      btn.disabled = true;
      btn.textContent = "刷新中…";
      api("/api/live/renew?did=" + encodeURIComponent(currentDid), { method: "POST" })
        .then(function(r){
          var res = (r.results || [])[0] || {};
          if(res.ok){
            toast("凭据已刷新", "ok");
            loadCredBar();
          } else {
            toast("刷新失败：" + (res.error || "未知错误"), "err");
          }
        })
        .catch(function(e){ toast("刷新失败：" + e.message, "err"); })
        .then(function(){ btn.disabled = false; btn.textContent = "立即重试刷新"; });
    };
  }).catch(function(){});
}

// ===== 云台方向翻转（按设备记住）=====
//
// 为什么需要：不同摄像头安装方向不同（正装/倒装/侧装），
// 实测 CW300 的云台方向与标称不一致。
// 让用户在界面上自己校正，比在代码里写死更灵活。
function ptzFlipKey(axis){
  return "micam.flip." + axis + "." + (currentDid || "default");
}
function ptzFlip(){
  return {
    pan:  localStorage.getItem(ptzFlipKey("pan")) === "1",
    tilt: localStorage.getItem(ptzFlipKey("tilt")) === "1"
  };
}
function setPtzFlip(axis, on){
  localStorage.setItem(ptzFlipKey(axis), on ? "1" : "0");
  toast(axis === "pan" ? "左右方向已保存" : "上下方向已保存", "ok");
}

// ===== 动作 =====
function snap(did){
  toast("正在抓图…");
  fetch(apiUrl("/api/live/snapshot?did="+encodeURIComponent(did)+"&w=0"+lensParam()))
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.blob(); })
    .then(function(b){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = did+"_"+Date.now()+".jpg";
      a.click();
      toast("截图已保存","ok");
    })
    .catch(function(e){ toast("截图失败："+e.message,"err"); });
}

function startRec(did){
  api("/api/recordings", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({did:did})
  }).then(function(r){
    if(r.ok) toast("已开始录像","ok");
    else toast(r.msg||"启动失败","err");

}

function stopRec(did){
  api("/api/recordings/stop", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({did:did})
  }).then(function(){ toast("已停止录像","ok"); render(); });
}

function cleanup(){
  api("/api/recordings/cleanup", {method:"POST"}).then(function(r){
    toast("已清理 "+(r.deleted||0)+" 个文件，释放 "+(r.freedMB||0)+" MB","ok");
  });
}

// ===== 扫码登录 =====
function showQR(){
  var mask = document.createElement("div");
  mask.className = "mask is-open";
  mask.innerHTML = "<div class=\"dialog\">"
    + "<div class=\"dialog__head\">扫码添加小米账号</div>"
    + "<div class=\"dialog__body\"><div class=\"qr-wrap\" id=\"qrWrap\">"+loading("正在获取二维码…")+"</div></div>"
    + "<div class=\"dialog__foot\"><button class=\"btn\" id=\"qrClose\">关闭</button></div></div>";
  document.body.appendChild(mask);
  var timer = null;
  mask.querySelector("#qrClose").onclick = function(){ if(timer) clearInterval(timer); mask.remove(); };
  mask.onclick = function(e){ if(e.target===mask){ if(timer) clearInterval(timer); mask.remove(); } };

  api("/api/accounts/qr", {method:"POST"}).then(function(r){
    if(!r.id){
      mask.querySelector("#qrWrap").innerHTML = empty("close","获取失败", r.msg||"","");
      return;
    }
    mask.querySelector("#qrWrap").innerHTML =
      "<img src=\""+r.qrBase64+"\" alt=\"二维码\"><div class=\"qr-tip\">请用 <b>米家 App</b> 扫码登录</div>";
    timer = setInterval(function(){
      api("/api/accounts/qr/status?id="+encodeURIComponent(r.id)).then(function(s){
        if(s.state==="success"){
          clearInterval(timer); mask.remove();
          toast("登录成功","ok");
          loadDevices().then(function(){ render(); });
        } else if(s.state==="scanned"){
          var tip = mask.querySelector(".qr-tip");
          if(tip) tip.innerHTML = "已扫码，请在手机上确认";
        } else if(s.state==="failed"){
          clearInterval(timer);
          mask.querySelector("#qrWrap").innerHTML = empty("close","登录失败", s.error||"","");
        }
      });
    }, 2000);
  }).catch(function(e){
    mask.querySelector("#qrWrap").innerHTML = empty("close","错误", e.message,"");
  });
}

// ===== 宿主 SDK 集成 =====
function initSDK(){
  // 动态加载宿主 SDK（失败则降级为独立模式）
  import("https://unpkg.com/@trimjs/web-app/dist/index.js")
    .then(function(m){
      var app = new m.TrimApp();
      return app.getPlatformConfig().then(function(c){
        // 主题：默认 dark（对齐效果图）。飞牛是浅色时去掉 dark 类。
        if(c.theme && c.theme !== "dark"){
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
        var el = document.getElementById("sysInfo");
        if(el) el.textContent = "系统 " + (c.systemVersion || "") + " · " + (c.language || "");
        if(app.isWeb === true && app.isStandaloneWeb === false){
          // 宿主主题变化不影响我们（保持 Haven 暗色）
        }
        return app.setTitle("小米摄像头");
      });
    })
    .catch(function(){
      var el = document.getElementById("sysInfo");
      if(el) el.textContent = "独立模式";
    });
}

// ===== 事件通知配置 =====
// ===== AI 设置 =====
//
// 设计原则：**默认关闭**。
// 开源后用户环境各异，环境不具备时给清晰提示，不报错。

function loadAICfg(){
  var box = document.getElementById('aiCfg');
  if(!box) return;

  api('/api/ai/status').then(function(st){
    var s = st.status || {};
    var env = st.env || {};
    var models = st.models || [];
    var cfg = {};

    api('/api/ai/config').then(function(cr){
      cfg = cr.config || {};
      paintAI(box, cfg, s, env, models);
    }).catch(function(){ paintAI(box, cfg, s, env, models); });
  }).catch(function(e){
    box.innerHTML = '<div class="text-sm text-muted">读取失败：' + esc(e.message) + '</div>';
  });
}

function paintAI(box, cfg, status, env, models){
  var on = !!cfg.enabled;
  var ready = status.status === 'ready';
  var envOk = !!env.available;

  // 状态徽章
  var badge = '';
  if(!on)        badge = '<span class="chip"><span class="status-dot"></span>未启用</span>';
  else if(ready) badge = '<span class="chip is-active"><span class="status-dot is-online"></span>运行中</span>';
  else           badge = '<span class="chip" style="color:var(--warning)"><span class="status-dot" style="background:var(--warning)"></span>' + esc(status.status || '异常') + '</span>';

  // 模型选项
  var modelOpts = models.map(function(m){
    return '<option value="' + esc(m.name) + '"' + (cfg.model === m.name ? ' selected' : '')
      + (m.downloaded ? '' : ' disabled') + '>'
      + esc(m.name) + (m.downloaded ? '（已下载 ' + (m.sizeMB||0).toFixed(1) + ' MB）' : '（未下载）')
      + '</option>';
  }).join('');

  box.innerHTML = ''

    + '<div class="switch-row">'
    +   '<div class="switch-row__main">'
    +     '<div class="switch-row__title">启用 AI 识别 ' + badge + '</div>'
    +     '<div class="switch-row__hint">'
    +       '把「有变化」升级为「有人 / 有车辆 / 有包裹」。'
    +       '关闭时只用画面变化侦测，<b>不影响其它功能</b>。'
    +     '</div>'
    +   '</div>'
    +   '<label class="switch"><input type="checkbox" id="aiOn"' + (on ? ' checked' : '')
    +     (envOk ? '' : ' disabled') + '><span class="switch__track"></span></label>'
    + '</div>'

    // 环境不可用提示
    + (!envOk
        ? '<div class="ai-warn">' + icon('alert',15)
          + '<div><b>当前环境不支持 AI</b><div class="ai-warn__sub">'
          + esc(env.error || '未找到 onnxruntime')
          + '<br>提示：在飞牛应用中心安装「AI」应用后重试。</div></div></div>'
        : '')

    // 详细设置（只在启用时展开）
    + (on && envOk ? ''
      + '<div class="ai-grid">'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">识别模型</label>'
      +     '<div class="cfg-row__control"><select class="input" id="aiModel">' + modelOpts + '</select></div>'
      +     '<div class="cfg-row__hint">yolov8n 轻量（12MB，约 260ms）· yolov8s 更准（43MB，约 750ms）</div>'
      +   '</div>'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">置信度阈值</label>'
      +     '<div class="cfg-row__control">'
      +       '<input class="input cfg-row__num" type="number" id="aiConf" min="0.1" max="0.95" step="0.05" value="' + (cfg.confThreshold || 0.45) + '">'
      +     '</div>'
      +     '<div class="cfg-row__hint">越高越严格（漏报多），越低越灵敏（误报多）。建议 0.4 ~ 0.5</div>'
      +   '</div>'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">识别频率上限</label>'
      +     '<div class="cfg-row__control">'
      +       '<input class="input cfg-row__num" type="number" id="aiRate" min="1" max="120" value="' + (cfg.maxPerMinute || 12) + '">'
      +       '<span class="cfg-row__unit">次 / 分钟</span>'
      +     '</div>'
      +     '<div class="cfg-row__hint">防止 CPU 被占满。画面一直有变化时按此限流</div>'
      +   '</div>'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">CPU 线程</label>'
      +     '<div class="cfg-row__control">'
      +       '<input class="input cfg-row__num" type="number" id="aiThreads" min="1" max="8" value="' + (cfg.threads || 4) + '">'
      +     '</div>'
      +     '<div class="cfg-row__hint">推理线程数。设太高会影响视频流</div>'
      +   '</div>'

      + '</div>'

      + '<div class="ai-actions">'
      +   '<button class="btn" id="aiTest">' + icon('cpu',14) + '测试识别</button>'
      +   '<button class="btn" id="aiSave">' + icon('check',14) + '保存设置</button>'
      +   '<span class="ai-result" id="aiResult"></span>'
      + '</div>'

      // 模型管理
      + '<div class="ai-models">'
      +   '<div class="ai-models__title">模型文件</div>'
      +   models.map(function(m){
            return '<div class="ai-model">'
              + '<span class="ai-model__name">' + esc(m.name) + '</span>'
              + '<span class="ai-model__meta">' + (m.downloaded ? (m.sizeMB||0).toFixed(1) + ' MB' : '未下载') + '</span>'
              + (m.downloaded
                  ? '<button class="btn btn--sm" data-ai-del="' + esc(m.name) + '">删除</button>'
                  : '<button class="btn btn--sm btn--primary" data-ai-dl="' + esc(m.name) + '">下载</button>')
              + '</div>';
          }).join('')
      +   '<div class="ai-models__hint">存放位置：' + esc('/vol1/@appdata/micam/models') + '</div>'
      + '</div>'
      : '')

    + '<div class="ai-foot">'
    +   'AI 在本机运行，<b>不上传任何画面</b>。'
    +   '识别结果为「有人 / 车辆 / 包裹」，写入事件记录。'
    + '</div>';

  // ---- 绑定 ----
  var sw = document.getElementById('aiOn');
  if(sw) sw.onchange = function(){
    aiSaveCfg({ enabled: this.checked }, function(){
      if(!this.checked) return;
      loadAICfg();
    }.bind(this));
  };

  var sv = document.getElementById('aiSave');
  if(sv) sv.onclick = function(){
    aiSaveCfg({
      enabled: true,
      model: (document.getElementById('aiModel')||{}).value,
      confThreshold: parseFloat((document.getElementById('aiConf')||{}).value) || 0.45,
      maxPerMinute: parseInt((document.getElementById('aiRate')||{}).value, 10) || 12,
      threads: parseInt((document.getElementById('aiThreads')||{}).value, 10) || 4,
    });
  };

  var ts = document.getElementById('aiTest');
  if(ts) ts.onclick = function(){
    var r = document.getElementById('aiResult');
    if(r) r.textContent = '识别中…';
    api('/api/ai/test').then(function(d){
      var objs = d.objects || [];
      if(!objs.length){
        if(r) r.textContent = '✅ 未检出目标（' + d.ms + 'ms）';
      } else {
        if(r) r.textContent = '✅ ' + objs.map(function(o){ return o.cls + ' ' + Math.round(o.conf*100) + '%'; }).join('、')
          + '（' + d.ms + 'ms）';
      }
    }).catch(function(e){
      if(r) r.textContent = '❌ ' + e.message;
    });
  };

  Array.prototype.forEach.call(box.querySelectorAll('[data-ai-dl]'), function(b){
    b.onclick = function(){
      b.disabled = true; b.textContent = '下载中…';
      api('/api/ai/model', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'download', name: b.dataset.aiDl }) })
        .then(function(){
          toast('开始下载，稍后刷新查看', 'ok');
          var t = setInterval(function(){
            api('/api/ai/status').then(function(st){
              var m = (st.models||[]).filter(function(x){ return x.name === b.dataset.aiDl; })[0];
              if(m && m.downloaded){ clearInterval(t); loadAICfg(); }
            }).catch(function(){});
          }, 3000);
          setTimeout(function(){ clearInterval(t); loadAICfg(); }, 180000);
        }).catch(function(e){ toast('下载失败：' + e.message, 'err'); b.disabled = false; b.textContent = '下载'; });
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-ai-del]'), function(b){
    b.onclick = function(){
      if(!confirm('删除模型 ' + b.dataset.aiDel + '？')) return;
      api('/api/ai/model', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'delete', name: b.dataset.aiDel }) })
        .then(function(){ toast('已删除', 'ok'); loadAICfg(); })
        .catch(function(e){ toast('删除失败：' + e.message, 'err'); });
    };
  });
}

function aiSaveCfg(patch, done){
  api('/api/ai/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) })
    .then(function(r){
      if(r.warn){ toast(r.warn, 'warn'); } else { toast('已保存', 'ok'); }
      var hs = document.getElementById('aiHeadStatus');
      loadAICfg();
      if(done) done();
    })
    .catch(function(e){ toast('保存失败：' + e.message, 'err'); });
}

function loadNotifyCfg(){
  var box = $("#notifyCfg");
  if(!box) return;
  api("/api/notify/config").then(function(c){
    var types = c.types || [];
    var sel = {};
    (c.events || []).forEach(function(e){ sel[e] = true; });
    var allOn = (c.events || []).length === 0;

    var rows = types.map(function(t){
      var checked = allOn || sel[t.key];

// ===== 加载 hls.js（HLS 播放库）=====
//
// ===== 为什么不用相对路径 =====
//
// 飞牛网关转发时会改变路径形态，实测日志：
//
//   GET /app/micam/       <- 页面
//   GET /hls.min.js       <- 相对路径被解析到根！应该是 /app/micam/hls.min.js
//
// 所以按顺序尝试多个候选路径，哪个通用哪个。
// 全部失败 -> 降级 MJPEG 模式（功能不受影响，只是 CPU 高些）。
(function(){
  var candidates = [
    "assets/vendor/hls.min.js",             // 标准相对路径（直连 8900 时）
    "/app/micam/assets/vendor/hls.min.js",  // 飞牛网关绝对路径
    "/assets/vendor/hls.min.js"             // 直连绝对路径
  ];
  var idx = 0;

  function tryNext(){
    if(idx >= candidates.length){
      console.warn("[micam] hls.js 全部路径加载失败，降级 MJPEG 模式");
      window.__hlsFailed = true;
      return;
    }
    var url = candidates[idx++];
    var sc = document.createElement("script");
    sc.src = url;
    sc.onload = function(){
      window.__hlsReady = true;
      console.log("[micam] hls.js 已加载: " + url);
    };
    sc.onerror = function(){
      console.warn("[micam] hls.js 加载失败: " + url);
      tryNext();
    };
    document.head.appendChild(sc);
  }

  tryNext();
})();

      +     '<div class="segmented" id="gridLayout">'
      +       [1,4,9,16].map(function(n){
                return '<button class="segmented__btn' + (gridLayout===n?' is-active':'') + '" data-gl="' + n + '">' + n + ' 路</button>';
              }).join('')
      +     '</div>'
      +   '</div>'
      + '</div>'

      + '<div class="gbar">'
      +   '<button class="gbar__btn' + (gridPatrol ? ' is-active' : '') + '" id="gPatrol">'
      +     icon('refresh',14) + '轮巡' + (gridPatrol ? '中' : '') + '</button>'
      +   '<label class="gbar__sel">' + icon('eye',14)
      +     '<select id="gInfo">'
      +       '<option value="full"' + (gridInfoMode==='full'?' selected':'') + '>显示名称+时间</option>'
      +       '<option value="name"' + (gridInfoMode==='name'?' selected':'') + '>仅显示名称</option>'
      +       '<option value="none"' + (gridInfoMode==='none'?' selected':'') + '>隐藏信息</option>'
      +     '</select></label>'
      +   '<label class="gbar__sel">' + icon('gauge',14)
      +     '<select id="gFps">'
      +       [1,3,5,10].map(function(v){
                return '<option value="' + v + '"' + (gridFps===v?' selected':'') + '>' + v + ' fps</option>';
              }).join('')
      +     '</select></label>'
      +   '<span class="gbar__right">在线 ' + all.filter(function(d){ return d.isOnline; }).length + ' / 共 ' + all.length + ' 台</span>'
      + '</div>'

      + '<div class="grid-wrap">'
      +   '<div class="ggrid ggrid--' + (shown.length === 1 ? 1 : (gridLayout === 16 ? 4 : gridLayout === 9 ? 3 : 2))
      +     '" id="gridBox">'
      +     (shown.length ? shown.map(tile).join('') : empty('camera','还没有添加摄像头','从右侧选择要看的设备',''))
      +   '</div>'
      +   '<aside class="gd-panel" id="gdPanel">' + devicePanel() + '</aside>'
      + '</div>'

      + '</div>';

    // ---- 开流 ----
    // 注意：宫格用**设备名**作 key（录像接口的 name 参数），
    // 但实时流接口要的是 **did**，所以这里要查一次。
    Array.prototype.forEach.call(c.querySelectorAll('img[data-stream]'), function(img){
      var dev = all.filter(function(d){ return d.name === img.dataset.stream; })[0];
      if(!dev){ return; }
      img.src = apiUrl('/api/live/mjpeg?did=' + encodeURIComponent(dev.did) + '&fps=' + gridFps + '&w=640');
    });

    // ---- 时间戳 ----
    gridTimers.push(setInterval(function(){
      Array.prototype.forEach.call(document.querySelectorAll('[data-gclock]'), function(el){
        el.textContent = clockNow();
      });
    }, 1000));

    // ---- 轮巡 ----
    function setPatrol(on){
      gridPatrol = on;
      if(gridPatrolTimer){ clearInterval(gridPatrolTimer); gridPatrolTimer = null; }
      if(!on) return;
      gridPatrolTimer = setInterval(function(){
        if(shown.length < 2) return;
        var i = -1;
        shown.forEach(function(d, k){ if(d.name === gridFocus) i = k; });
        var next = shown[(i + 1) % shown.length];
        gridFocus = next.name;
        Array.prototype.forEach.call(c.querySelectorAll('.gtile'), function(el){
          el.classList.toggle('is-focus', el.dataset.dev === gridFocus);
        });
      }, 15000);
    }
    setPatrol(gridPatrol);

    // ---- 交互 ----
    function setFocus(name){
      gridFocus = name;
      Array.prototype.forEach.call(c.querySelectorAll('.gtile'), function(el){
        el.classList.toggle('is-focus', el.dataset.dev === name);
      });
    }

    Array.prototype.forEach.call(c.querySelectorAll('.gtile'), function(el){
      var name = el.dataset.dev;
      el.onclick = function(ev){
        if(ev.target.closest('[data-gmax]')){ gotoLiveByName(name); return; }
        if(ev.target.closest('[data-gfocus]')){ setFocus(name); return; }
        setFocus(name);
      };
      el.ondblclick = function(){ gotoLiveByName(name); };
    });

    Array.prototype.forEach.call(c.querySelectorAll('[data-gl]'), function(b){
      b.onclick = function(){
        var v = parseInt(this.dataset.gl, 10);
        if(v === gridLayout) return;
        gridLayout = v;
        stopGrid();
        renderGrid(c);
      };
    });

    var gp = document.getElementById('gPatrol');
    if(gp) gp.onclick = function(){ stopGrid(); gridPatrol = !gridPatrol; renderGrid(c); };

    var gi = document.getElementById('gInfo');
    if(gi) gi.onchange = function(){ gridInfoMode = this.value; stopGrid(); renderGrid(c); };

    var gf = document.getElementById('gFps');
    if(gf) gf.onchange = function(){ gridFps = parseInt(this.value,10) || 3; stopGrid(); renderGrid(c); };

    var gs = document.getElementById('gdSearch');
    if(gs){
      var deb = null;
      gs.oninput = function(){
        gridQuery = this.value;
        if(deb) clearTimeout(deb);
        deb = setTimeout(function(){
          var panel = document.getElementById('gdPanel');
          if(panel){ panel.innerHTML = devicePanel(); bindPanel(); }
        }, 200);
      };
    }

    function bindPanel(){
      Array.prototype.forEach.call(document.querySelectorAll('[data-gtoggle]'), function(b){
        b.onclick = function(){
          var name = this.dataset.gtoggle;
          var sel2 = gridLoad().slice();
          var i = sel2.indexOf(name);
          if(i >= 0){ sel2.splice(i,1); toast('已移除'); }
          else {
            if(sel2.length >= gridLayout){ toast('最多 ' + gridLayout + ' 路，请先调大布局', 'warn'); return; }
            sel2.push(name); toast('已添加', 'ok');
          }
          gridSelected = sel2; gridSave();
          stopGrid();
          renderGrid(c);
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('img[data-gdthumb]'), function(img, i){
        var name = img.dataset.gdthumb;
        var dev = all.filter(function(d){ return d.name === name; })[0];
        if(!dev || !dev.isOnline) return;
        setTimeout(function(){
          fetch(apiUrl('/api/live/thumb?did=' + encodeURIComponent(dev.did) + '&w=320'), { cache:'no-store' })
            .then(function(r){ return r.ok ? r.blob() : null; })
            .then(function(b){ if(b && document.body.contains(img)) img.src = URL.createObjectURL(b); })
            .catch(function(){});
        }, i * 100);
      });
    }
    bindPanel();

    var gb = c.querySelector('[data-go]');
    if(gb) gb.onclick = function(){ page='devices'; renderMenu(); render(); };
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderGrid(c); }) + '</div>';
  });
}

function showExportManager(){

    var list = d.exports || [];
    var html = "<div style=\"max-height:60vh;overflow:auto\">";

    if(!list.length){
      html += "<div style=\"padding:20px;text-align:center;color:var(--text-3);font-size:13px\">暂无导出文件</div>";
    } else {
      html += "<div style=\"font-size:12px;color:var(--text-3);margin-bottom:10px\">"
        + "共 " + list.length + " 个 · " + fmtSizeMB(d.totalMB||0) + " · 目录 " + esc(d.dir||"") + "</div>";
      html += "<table style=\"font-size:12px\"><thead><tr>"
        + "<th>文件</th><th style=\"width:80px\">大小</th><th style=\"width:140px\">时间</th><th style=\"width:110px\"></th>"
        + "</tr></thead><tbody>";
      list.forEach(function(x){
        html += "<tr>"
          + "<td style=\"font-family:ui-monospace,monospace;font-size:11px\">" + esc(x.id) + "</td>"
          + "<td>" + fmtSizeMB(x.sizeMB||0) + "</td>"
          + "<td style=\"color:var(--text-3)\">" + esc(x.createdAt||"") + "</td>"
          + "<td><a class=\"btn btn--sm\" href=\"" + apiUrl("/api/recordings/export/download?id=" + encodeURIComponent(x.id)) + "\" download>下载</a>"
          + " <button class=\"btn btn--sm\" data-exdel=\"" + esc(x.id) + "\">删除</button></td>"
          + "</tr>";
      });
      html += "</tbody></table>";
    }

    html += "</div>"
      + "<div class=\"row gap-2\" style=\"margin-top:14px\">"
      +   "<button class=\"btn btn--danger\" id=\"btnExpClear\">清空全部</button>"
      +   "<button class=\"btn\" id=\"btnExpClose\">关闭</button>"
      + "</div>";

    openModal("导出文件管理", html, function(root){
      var cl = root.querySelector("#btnExpClear");
      if(cl) cl.onclick = function(){
        if(!confirm("清空所有导出文件？\n\n已下载的不受影响，未下载的会丢失。")) return;
        api("/api/recordings/export/clear", { method: "POST" }).then(function(r){
          toast("已清空 " + (r.count||0) + " 个，释放 " + fmtSizeMB(r.freedMB||0), "ok");
          closeModal();
        }).catch(function(e){ toast("失败：" + e.message, "err"); });
      };
      var cc = root.querySelector("#btnExpClose");
      if(cc) cc.onclick = closeModal;

      Array.prototype.forEach.call(root.querySelectorAll("[data-exdel]"), function(b){
        b.onclick = function(){
          var id = this.dataset.exdel;
          if(!confirm("删除导出 " + id + "？")) return;
          api("/api/recordings/export/delete?id=" + encodeURIComponent(id), { method: "POST" }).then(function(){
            toast("已删除", "ok");
            closeModal();
            showExportManager();
          }).catch(function(e){ toast("失败：" + e.message, "err"); });
        };
      });
    });
  }).catch(function(e){ toast("加载失败：" + e.message, "err"); });
}

function fmtDur(sec){
  if(!sec || sec <= 0) return "—";
  var m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function fmtSizeMB(v){
  if(v == null) return "—";
  if(v < 1) return (v * 1024).toFixed(0) + " KB";
  if(v < 1024) return v.toFixed(1) + " MB";
  return (v / 1024).toFixed(2) + " GB";
}

// 但调用点一直在（点「···」、点「新建调查」会直接 ReferenceError）。
// 这里按调用点既有的语义补齐，不引入新交互：

//     setEvMark / gotoReplay / copyText，样式用现成的 .ev-menu

function showEventMenu(el, ev){
  var id = ev.id;
  var fav = evIsFav(id);
  var watch = evIsWatch(id);
  openModal('事件操作',
    '<div class="ev-menu">'
    + '<button class="ev-menu__item" data-evact="play">' + icon('play',15) + '播放该时刻录像</button>'
    + '<button class="ev-menu__item" data-evact="book">' + icon('bookmark',15) + (fav ? '取消收藏' : '收藏此事件') + '</button>'
    + '<button class="ev-menu__item" data-evact="watch">' + icon('alert',15) + (watch ? '取消「需关注」' : '标记为需关注') + '</button>'
    + '<button class="ev-menu__item" data-evact="copy">' + icon('copy',15) + '复制事件 ID</button>'
    + '<button class="ev-menu__item is-danger" data-evact="close">' + icon('close',15) + '关闭</button>'
    + '</div>',
    function(root){
      Array.prototype.forEach.call(root.querySelectorAll('[data-evact]'), function(b){
        b.onclick = function(){
          var a = this.dataset.evact;
          if(a === 'play'){ closeModal(); gotoReplay(ev.did, ev.time); }
          else if(a === 'book'){ setEvMark(id, { bookmark: !fav }); closeModal(); }
          else if(a === 'watch'){ setEvMark(id, { watch: !watch }); closeModal(); }
          else if(a === 'copy'){ copyText(id, '事件 ID 已复制'); }
          else closeModal();
        };
      });
    });
}

// ===== 顶栏右上角：用户菜单 + 全局搜索 =====
//
// ⚠️ 重要：这段代码**必须自包含**！
//
// 原因：应用主体脚本的作用域被包裹（esc/api/icon/render 不在 window 上），
// 而这段代码在包裹之外，**访问不到那些函数**。
// 之前直接调 api()/esc()/icon() -> ReferenceError -> 菜单点不开。
//
// 所以这里：
//   · 自己定义转义函数（不用 app 的 esc）
//   · 直接 fetch（不用 app 的 api）
//   · 内联 SVG（不用 app 的 icon）
//   · 导航靠【模拟点击导航按钮】触发 app 自己的路由（不直接改 page 变量）
//   · 所有跨作用域调用都包在 try/catch 里

var _tnHome = { homes: [], current: '' };

function _tnEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

function _tnApi(path){
  return fetch(apiPath(path)).then(function(r){ return r.json(); });
}

// apiPath 计算接口前缀（飞牛网关下路径会被重写）
function apiPath(path){
  // 复用 app 的逻辑：如果页面在 /app/micam/ 下，接口也在那里
  var base = '';
  try {
    var p = location.pathname;
    var i = p.indexOf('/app/micam');
    if(i >= 0) base = '/app/micam';
  } catch(e){}
  return base + path;
}

// _tnIcon 内联 SVG（不能用 app 的 icon）
function _tnIcon(name, size){
  var sz = size || 15;
  var paths = {
    home:    '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    check:   '<path d="M20 6 9 17l-5-5"/>',
    user:    '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    bell:    '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/>',
    code:    '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
    info:    '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
  };
  return '<svg class="icon" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" '
    + 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + (paths[name] || paths.info) + '</svg>';
}

// _tnGoto 切页 —— 通过模拟点击导航按钮，交给 app 自己的路由
function _tnGoto(key){
  var el = document.querySelector('.tabnav[data-k="' + key + '"]');
  if(el){ el.click(); return true; }
  return false;
}

function initTopNav(){
  try { bindUserMenu(); } catch(e){ console.error('bindUserMenu 失败', e); }
  try { bindGlobalSearch(); } catch(e){ console.error('bindGlobalSearch 失败', e); }
  try { loadTopNavHome(); } catch(e){ console.error('loadTopNavHome 失败', e); }
}

// _tnHomeNamed 家庭是否「有名字」
//
// 小米 API 对未命名的家庭会返回纯数字（常见是 "0" 或 userId）。
// 直接显示会变成 [0] 0，很难看，所以这类视为未命名。
function _tnHomeNamed(h){
  var n = String((h && h.name) || '').trim();
  if(!n) return false;
  if(/^\d+$/.test(n)) return false;   // 纯数字 -> 未命名
  if(/^[0-9a-f]{16,}$/i.test(n)) return false; // 看起来像 id
  return true;
}

// _tnHomeLabel 取用于显示的名字
//
// 未命名的家庭都叫「我的家」会重名，所以加短 id 后缀区分：
//   我的家 · 8561
function _tnHomeLabel(h){
  if(_tnHomeNamed(h)) return String(h.name).trim();
  var id = String((h && h.id) || '');
  // 取尾 4 位（id 通常很长，尾部位区分度够）
  var tail = id.length > 4 ? id.slice(-4) : id;
  return tail ? ('我的家 · ' + tail) : '我的家';
}

// loadTopNavHome 读家庭列表，更新显示
function loadTopNavHome(){
  _tnApi('/api/homes').then(function(d){
    var hs = (d && d.homes) || (Array.isArray(d) ? d : []);
    if(!hs.length) return;

    // 选「当前家庭」：
    //   1) 有名字的自己的家庭
    //   2) 有名字的家庭（含共享）
    //   3) 自己的第一台
    //   4) 兜底第一台
    var own = hs.filter(function(h){ return !h.shared; });
    var cur = own.filter(_tnHomeNamed)[0]
           || hs.filter(_tnHomeNamed)[0]
           || own[0] || hs[0];

    _tnHome.homes = hs;
    _tnHome.current = _tnHomeLabel(cur);

    var el = document.getElementById('userName');
    if(el) el.textContent = _tnHome.current;
    var av = document.getElementById('userAvatar');
    // 头像用第一个汉字；「我的家」-> 家
    if(av) av.textContent = (_tnHome.current || '家').slice(0, 1);
  }).catch(function(){ /* 读不到就保持 shell 的默认文案 */ });
}

// bindUserMenu 「我的家」下拉
function bindUserMenu(){
  var btn = document.getElementById('btnUser');
  if(!btn || btn.dataset.tnBound) return;
  btn.dataset.tnBound = '1';

  btn.onclick = function(e){
    e.stopPropagation();
    var old = document.getElementById('userMenu');
    if(old){ old.remove(); return; }

    var hs = _tnHome.homes || [];
    var menu = document.createElement('div');
    menu.className = 'usermenu';
    menu.id = 'userMenu';

    var devCount = 0;
    try { devCount = (document.querySelectorAll('.tabnav').length ? 0 : 0); } catch(e2){}

    menu.innerHTML = ''
      + '<div class="usermenu__head">'
      +   '<div class="usermenu__avatar">' + _tnEsc((_tnHome.current || '家').slice(0, 1)) + '</div>'
      +   '<div class="usermenu__body">'
      +     '<div class="usermenu__name">' + _tnEsc(_tnHome.current || '我的家') + '</div>'
      +     '<div class="usermenu__sub">' + hs.length + ' 个家庭</div>'
      +   '</div>'
      + '</div>'
      + (hs.length > 1
          ? '<div class="usermenu__label">家庭</div>'
            + hs.map(function(h){
                var label = _tnHomeLabel(h);
                var on = (label === _tnHome.current);
                return '<button class="usermenu__item' + (on ? ' is-on' : '') + '" data-tn-home="' + _tnEsc(h.id) + '">'
                  + _tnIcon(on ? 'check' : 'home', 14)
                  + '<span>' + _tnEsc(label) + '</span>'
                  + (h.shared ? '<em>共享</em>' : '')
                  + '</button>';
              }).join('')
          : '')
      + '<div class="usermenu__sep"></div>'
      + '<button class="usermenu__item" data-tn-go="accounts">' + _tnIcon('user',14) + '<span>账号管理</span></button>'
      + '<button class="usermenu__item" data-tn-go="settings">' + _tnIcon('settings',14) + '<span>设置</span></button>'
      + '<button class="usermenu__item" data-tn-go="events">' + _tnIcon('bell',14) + '<span>事件中心</span></button>'
      + '<button class="usermenu__item" data-tn-go="dev">' + _tnIcon('code',14) + '<span>开发者</span></button>';

    document.body.appendChild(menu);
    var r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 8) + 'px';
    menu.style.right = Math.max(12, window.innerWidth - r.right) + 'px';

    Array.prototype.forEach.call(menu.querySelectorAll('[data-tn-go]'), function(el){
      el.onclick = function(){
        _tnGoto(this.dataset.tnGo);
        menu.remove();
      };
    });
    Array.prototype.forEach.call(menu.querySelectorAll('[data-tn-home]'), function(el){
      el.onclick = function(){
        var id = this.dataset.tnHome;
        var h = (_tnHome.homes || []).filter(function(x){ return String(x.id) === String(id); })[0];
        if(h){
          _tnHome.current = _tnHomeLabel(h);
          var el2 = document.getElementById('userName');
          if(el2) el2.textContent = _tnHome.current;
          try { localStorage.setItem('micam.home', JSON.stringify({ id: id, name: _tnHome.current })); } catch(e3){}
          var t = document.getElementById('tnToast');
          if(!t){
            t = document.createElement('div');
            t.id = 'tnToast';
            t.className = 'tn-toast';
            document.body.appendChild(t);
          }
          t.textContent = '已切换到「' + _tnHome.current + '」（设备列表暂未按家庭过滤）';
          t.classList.add('is-on');
          setTimeout(function(){ t.classList.remove('is-on'); }, 2600);
        }
        menu.remove();
      };
    });

    setTimeout(function(){
      document.addEventListener('click', function close(ev){
        if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('click', close); }
      });
    }, 0);
  };
}

// bindGlobalSearch 顶栏搜索（回车跳到事件中心搜索）
function bindGlobalSearch(){
  var inp = document.getElementById('globalSearch');
  if(!inp || inp.dataset.tnBound) return;
  inp.dataset.tnBound = '1';
  inp.onkeydown = function(ev){
    if(ev.key !== 'Enter') return;
    var q = this.value.trim();
    if(!q) return;
    // 交给事件页：先把关键字写进 sessionStorage，再切页
    try { sessionStorage.setItem('micam.search', q); } catch(e){}
    _tnGoto('events');
  };
}

// 顶栏初始化（DOM 就绪后执行一次）
(function(){
  function boot(){
    if(window._tnInited) return;
    window._tnInited = true;
    try { initTopNav(); } catch(e){ console.error('initTopNav 失败', e); }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
