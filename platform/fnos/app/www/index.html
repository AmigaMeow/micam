}
.st-chart__empty .icon {
  color: var(--text-muted);
  opacity: 0.6;
}
.st-chart__empty-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}
.st-chart__empty-sub {
  font-size: 12px;
  color: var(--text-muted);
  max-width: 320px;
  line-height: 1.5;
}

/* 按类型统计卡片 */
.st-types {
  padding: var(--space-3) var(--space-5) var(--space-3);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.st-type {
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  transition: background .15s ease;
}
.st-type:hover {
  background: var(--surface-hover);
}
.st-type__row {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  font-size: 14px;
}
.st-type__row > span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.st-type__row > b {
  font-weight: 600;
  color: var(--text);
}
.st-type__row > em {
  font-style: normal;
  width: 52px;
  text-align: right;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.st-type__sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}
.st-type .st-bar {
  margin-top: 6px;
}

/* 摄像头统计表格优化 */
.st-table-wrap {
  overflow-x: auto;
  padding: 0 var(--space-5) var(--space-4);
}
.st-table {
  min-width: 620px;
}
.st-table__head {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) 88px 84px 92px;
  align-items: center;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--surface-2);
  border-radius: 6px;
  margin-bottom: 6px;
}
.st-table__row {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) 88px 84px 92px;
  align-items: center;
  padding: 12px 14px;
  border-radius: 6px;
  border-bottom: 1px solid var(--border-subtle);
  transition: background .15s ease;
}
.st-table__row:hover {
  background: var(--surface-hover);
}
.st-table__row:last-child {
  border-bottom: none;
}
.st-table__row--orphan {
  background: rgba(245, 158, 11, 0.06);
  border-left: 3px solid #F59E0B;
}
.st-orphan-tag {
  flex: 0 0 auto;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(245, 158, 11, 0.16);
  color: #F59E0B;
  font-size: 11px;
}
.st-cam {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.st-cam__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.st-cell {
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}
.st-cell__val {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

/* 语义化标签 */
.st-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.st-tag--ok {
  background: rgba(16, 185, 129, 0.12);
  color: #10B981;
  border: 1px solid rgba(16, 185, 129, 0.25);
}
.st-tag--warn {
  background: rgba(245, 158, 11, 0.12);
  color: #F59E0B;
  border: 1px solid rgba(245, 158, 11, 0.25);
}

/* 存储策略表单 */
.st-policy {
  padding: var(--space-3) var(--space-5) var(--space-5);
}
.st-field {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  font-size: var(--text-base);
  border-bottom: 1px solid var(--border-subtle);
}
.st-field:last-child {
  border-bottom: none;
}
.st-field__label {
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
}
.st-field__num {
  width: 96px;
  height: 36px;
}
.st-field__unit {
  color: var(--text-muted);
  font-size: 13px;
}
.st-field__hint {
  color: var(--text-muted);
  font-size: 12px;
}
.st-policy .st-field {
  grid-template-columns: 96px 100px 36px minmax(0, 1fr);
}
.st-switchrow {
  display: grid;
  grid-template-columns: 96px auto minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.st-switchrow__label {
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
}
.st-switchrow__hint {
  color: var(--text-muted);
  font-size: 12px;
}
.st-save {
  margin-top: var(--space-4);
  width: 100%;
  justify-content: center;
  height: 38px;
}

/* 缓存管理 */
.st-cache {
  padding: var(--space-3) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.st-kv {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: 10px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border-subtle);
}
.st-kv:last-child {
  border-bottom: 0;
}
.st-kv > span {
  flex: 0 0 96px;
  color: var(--text-secondary);
}
.st-kv > b {
  color: var(--text);
  font-weight: 500;
}
.st-cache__acts {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-5) var(--space-5);
}

/* 迁移 */
.st-migrate {
  padding: var(--space-3) var(--space-5) var(--space-5);
}
.st-migrate .st-field {
  grid-template-columns: 88px minmax(0, 1fr);
}
.st-migrate .st-field--range {
  grid-template-columns: 88px minmax(0, 1fr) auto minmax(0, 1fr);
}
.st-migrate__foot {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
}
.st-migrate__foot .st-hint {
  margin: 0;
  flex: 1;
}

/* 清理预览增强 */
.st-clean {
  padding: var(--space-4) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.st-clean__box {
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.st-clean__box.is-empty {
  border-left: 4px solid #10B981;
}
.st-clean__box.is-warn {
  border-left: 4px solid #F59E0B;
}
.st-clean__status-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.st-clean__desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.st-clean__metric-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
}
.st-clean__metric-row b {
  color: var(--text);
}
.st-clean__acts {
  padding: 0 var(--space-5) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.st-clean__alert {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 8px;
  font-size: 12px;
  color: #F59E0B;
  line-height: 1.5;
}
.st-clean__alert .icon {
  flex-shrink: 0;
  margin-top: 2px;
}

/* 底部状态栏 */
.st-footbar__label { font-size: var(--text-sm); color: var(--text-muted); }
.st-footbar__sel { max-width: 420px; height: 28px; font-size: var(--text-sm); }
.st-footbar__item { font-size: var(--text-sm); color: var(--text-muted); }
.st-footbar { display:flex; align-items:center; gap: var(--space-5); flex-wrap:wrap; padding: var(--space-3) var(--space-4); background: var(--surface-1); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); font-size: var(--text-sm); color: var(--text-muted); }
.st-footbar__spacer { flex:1; }
.st-health { display:inline-flex; align-items:center; gap:6px; }
.st-health.is-ok b { color: #10B981; }
.st-health.is-warn b { color: #F59E0B; }


/* ---- 存储录像目录卡片增强 ---- */
.st-dir-card {
  margin-top: var(--space-5);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.st-dir-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}
.st-dir-card__title-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.st-dir-card__title {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  color: var(--text);
}
.st-dir-card__subtitle {
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.st-dir-card__actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

/* 当前生效目录高亮展示卡 */
.st-active-box {
  background: var(--surface-1);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.st-active-box__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.st-active-box__name-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.st-active-box__name {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--text);
}
.st-active-box__path {
  font-family: var(--font-mono, monospace);
  font-size: var(--text-sm);
  color: var(--accent);
  background: var(--surface-2);
  padding: 6px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  word-break: break-all;
  display: flex;
  align-items: center;
  gap: 8px;
}
.st-active-box__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
}
.st-active-box__capacity {
  flex: 1;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.st-active-box__btns {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* 目录分组与列表项 */
.st-locs-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-top: 4px;
}
.st-loc-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.st-loc-group__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-secondary);
  padding: 0 4px;
}
.st-loc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.st-loc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 12px 16px;
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  transition: all .15s ease;
}
.st-loc-item:hover {
  background: var(--surface-hover);
  border-color: var(--border-strong);
}
.st-loc-item.is-current {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface-1));
}
.st-loc-item__left {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  flex: 1;
}
.st-loc-item__icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}
.st-loc-item.is-unwritable .st-loc-item__icon {
  color: var(--text-muted);
}
.st-loc-item__body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.st-loc-item__title-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.st-loc-item__title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.st-loc-item__path {
  font-family: var(--font-mono, monospace);
  font-size: var(--text-xs);
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.st-loc-item__meta {
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.st-loc-item__right {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
}

/* 权限指引卡片 */
.st-perm-guide {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.st-perm-guide__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text);
}
.st-perm-steps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-3);
  margin-top: 4px;
}

  .st-perm-steps {
    grid-template-columns: repeat(2, minmax(0, 1fr));

}
@media (max-width: 540px) {
  .st-perm-steps {
    grid-template-columns: 1fr;
  }
}
.st-perm-step {
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.st-perm-step__num {
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--accent);
}
.st-perm-step__title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text);
}
.st-perm-step__desc {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  line-height: 1.5;
}
.st-perm-guide__tip {
  font-size: var(--text-xs);
  color: var(--text-muted);
  line-height: 1.6;
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-2);
}


.st-dir-card {
  margin-top: var(--space-5);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.st-dir-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
}
.st-dir-card__title {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  color: var(--text);
}
.st-dir-card__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.st-dir-current {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  flex-wrap: wrap;
}
.st-dir-current__label {
  font-size: var(--text-xs);
  color: var(--text-muted);
  flex: 0 0 auto;
}
.st-dir-current__path {
  font-family: var(--font-mono, monospace);
  font-size: var(--text-sm);
  color: var(--accent);

}
.st-dir-select-row {

}
.st-dir-select-row .input, .st-dir-select-row .st-recdir-select {

.st-dir-meta-grid {

}
@media (max-width: 860px) {
  .st-dir-meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.st-dir-meta-item {
  padding: var(--space-3);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.st-dir-meta-item__label {
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.st-dir-meta-item__val {
  font-size: var(--text-sm);

  border-radius: var(--radius-md);
  font-size: var(--text-xs);
  color: var(--text-muted);

.st-recdir-save, .st-go-migrate {

/* ==========================================================================
   SETTINGS 3-COL — 设置页（左 Tab + 中内容 + 右摘要）
   ========================================================================== */

/* 页面内面板：左侧导航切换（设置页同款骨架；账号 / 存储页复用） */
.pnl { display: none; }
.pnl.is-on { display: block; }

/* 账号页：账号卡片内的设备清单 */
.acct-dev { display:flex; align-items:center; gap: var(--space-3); margin-top: var(--space-3); padding-top: var(--space-3); border-top:1px solid var(--border-subtle); }
.acct-dev__hint { font-size: var(--text-xs); color: var(--text-muted); }
.acct-dev__list { margin-top: var(--space-3); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow:hidden; }
.acct-dev__row { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom:1px solid var(--border-subtle); }
.acct-dev__row:last-child { border-bottom:0; }
.acct-dev__row.is-hidden { opacity:.55; }
.acct-dev__thumb { position:relative; width:72px; height:44px; flex:0 0 72px; border-radius: var(--radius-md); overflow:hidden; background: var(--surface-3); display:flex; align-items:center; justify-content:center; color: var(--text-muted); }
.acct-dev__thumb .icon { position:absolute; }
.acct-dev__thumb img { position:relative; width:100%; height:100%; object-fit:cover; display:block; }
.acct-dev__body { flex:1 1 auto; min-width:140px; display:flex; flex-direction:column; gap:2px; }
.acct-dev__name { font-size: var(--text-base); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acct-dev__meta { font-size: var(--text-xs); color: var(--text-muted); white-space:nowrap; }
.acct-dev__acts { display:flex; gap:6px; flex:0 0 auto; flex-wrap:nowrap; }
.acct-dev__acts .btn { white-space:nowrap; }
.acct-dev__acts .btn--icon.btn--sm { width:26px; padding:0; }
.acct-dev__none { padding: var(--space-4); font-size: var(--text-sm); color: var(--text-muted); }

/* 账号页：卡片改成网格，消灭"左列下面一大片空白" */
.set3__main .acct-list { display:grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: var(--space-4); align-items:start; }
.set3__main .acct-side { display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: var(--space-5); align-items:start; }

/* 两栏：左导航 + 内容。v0.40.1 去掉右列摘要卡（标题与左栏完全重复） */
.set3 { display:grid; gap: var(--space-5); grid-template-columns: 200px minmax(0,1fr); align-items:start; }
@media (max-width:900px){ .set3{ grid-template-columns:1fr;} }

/* 左：竖排 Tab */
.set3__nav { display:flex; flex-direction:column; gap:2px; position:sticky; top:var(--space-4); }
.set3__tab {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 11px 14px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  text-align: left;
  width: 100%;
  transition: all .2s ease;
}
.set3__tab:hover {
  background: var(--surface-2);
  color: var(--text);
}
.set3__tab.is-active {
  background: color-mix(in srgb, var(--accent) 12%, var(--surface-1));
  color: var(--accent);
  font-weight: 500;
}
.set3__tab.is-active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 3.5px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}
.set3__tab .icon { flex:0 0 auto; }
.set3__tab-body { display:flex; flex-direction:column; gap:1px; min-width:0; }
.set3__tab-name { font-size: var(--text-base); }
.set3__tab-en { font-size: var(--text-xs); color: var(--text-muted); }
.set3__tab.is-active .set3__tab-en { color: color-mix(in oklab, var(--accent) 70%, transparent); }

/* 中：内容（去除历史遗留的 max-width:840px 限制，自然铺满 grid 列） */
.set3__main { display:flex; flex-direction:column; gap: var(--space-5); min-width:0; width:100%; }
.set3__sec { background: var(--surface-1); border:1px solid var(--border-subtle); border-radius: var(--radius-xl); overflow:hidden; }
.set3__sec-head { display:flex; align-items:baseline; gap:var(--space-2); padding: var(--space-4) var(--space-5) var(--space-3); border-bottom:1px solid var(--border-subtle); }
.set3__sec-head > span { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.set3__sec-head > em { font-style:normal; font-size: var(--text-sm); color: var(--text-muted); }

.set3__row { display:grid; grid-template-columns: minmax(0,1fr) auto; gap: var(--space-4); align-items:center; padding: var(--space-4) var(--space-5); border-bottom:1px solid var(--border-subtle); }
.set3__row:last-child { border-bottom:0; }
.set3__row.is-wide { grid-template-columns: minmax(0,1fr); }
.set3__row.is-wide .set3__row-ctl { justify-content:flex-start; }
.set3__row-title { font-size: var(--text-base); color: var(--text); }
.set3__row-hint { font-size: var(--text-sm); color: var(--text-muted); margin-top:3px; }
.set3__row-ctl { display:flex; align-items:center; gap: var(--space-2); flex-wrap:wrap; }

/* 单选组 */
.set3__radios { display:flex; align-items:center; gap: var(--space-5); }
.set3__radio { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size: var(--text-base); color: var(--text-secondary); }
.set3__radio input { display:none; }
.set3__radio-dot { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border-strong); flex:0 0 auto; }
.set3__radio input:checked + .set3__radio-dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 4px, transparent 4px); }
.set3__radio input:checked ~ span:last-child { color: var(--text); }

/* 控件尺寸 */
.set3__sel { width: 200px; }
.set3__num { width: 88px; }
.set3__time { width: 120px; }
.set3__wide { flex:1; min-width:220px; }
.set3__unit { font-size: var(--text-sm); color: var(--text-muted); }
.set3__val { font-size: var(--text-base); color: var(--text-secondary); }

/* 右：摘要卡 */
.set3__side { display:flex; flex-direction:column; gap: var(--space-4); }
.set3__card { background: var(--surface-1); border:1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: var(--space-4) var(--space-5); cursor:pointer; transition: border-color var(--duration-fast) var(--ease-out); }
.set3__card:hover { border-color: var(--border-strong); }
.set3__card.is-current { border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
.set3__card-head { display:flex; align-items:center; gap:8px; font-size: var(--text-base); font-weight: var(--weight-medium); margin-bottom: var(--space-3); }
.set3__card-head .icon:first-child { color: var(--text-muted); }
.set3__card-head .icon:last-child { margin-left:auto; color: var(--text-muted); }
.set3__kv { display:flex; align-items:baseline; gap: var(--space-3); padding: 6px 0; font-size: var(--text-base); }
.set3__kv > span { flex:1; min-width:0; color: var(--text-muted); }
.set3__kv > b { font-weight: var(--weight-normal); color: var(--text-secondary); }
.set3__link { display:inline-flex; align-items:center; gap:3px; color: var(--accent); }


/* ===== ACCOUNTS — 账号管理（对齐效果图）===== */
.acct-bar { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-5); }
.acct-bar__spacer { flex:1; }
.acct-bar__auto { display:inline-flex; align-items:center; gap:8px; font-size:var(--text-sm); color:var(--text-muted); }

.acct-grid { display:grid; gap:var(--space-5); grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); align-items:start; }
@media (max-width:1200px){ .acct-grid{ grid-template-columns:1fr;} }

/* 账号卡片 */
.acct-list { display:flex; flex-direction:column; gap:var(--space-4); }
.acct-card { display:flex; gap:var(--space-4); background:var(--surface-1); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); padding:var(--space-4); }
.acct-card__thumb { width:120px; height:78px; flex:0 0 120px; border-radius:var(--radius-lg); overflow:hidden; background:#0a0d12; }
.acct-card__thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.acct-card__ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
.acct-card__body { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.acct-card__top { display:flex; align-items:center; gap:var(--space-3); }
.acct-card__name { font-size:var(--text-lg); font-weight:var(--weight-medium); }
.acct-state { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:var(--text-xs); }
.acct-state.is-ok { background:rgba(34,197,94,.14); color:#4ade80; }
.acct-state.is-warn { background:rgba(245,158,11,.14); color:var(--warning); }
.acct-card__id { font-size:var(--text-sm); color:var(--text-muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.acct-card__meta { display:flex; align-items:center; gap:6px; font-size:var(--text-sm); color:var(--text-muted); }
.acct-card__sep { opacity:.4; }

.acct-pills { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:2px; }
.acct-pill { display:inline-flex; flex-direction:column; gap:1px; padding:5px 10px; border-radius:var(--radius-md); background:var(--surface-2); border:1px solid var(--border-subtle); font-size:var(--text-xs); color:var(--text-muted); }
.acct-pill b { font-size:var(--text-sm); font-weight:var(--weight-medium); }
.acct-pill.is-ok b { color:#4ade80; }
.acct-pill.is-warn b { color:var(--warning); }
.acct-pill.is-bad b { color:var(--danger); }

.acct-card__acts { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:4px; }

/* 右栏 */
.acct-side { display:flex; flex-direction:column; gap:var(--space-4); }
.acct-cred { padding:var(--space-3) var(--space-5) var(--space-4); }
.acct-cred__item { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:var(--space-3); padding:var(--space-3) 0; border-bottom:1px solid var(--border-subtle); align-items:start; }
.acct-cred__item:last-child { border-bottom:0; }
.acct-cred__num { width:22px; height:22px; border-radius:50%; background:var(--surface-3); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; font-size:var(--text-xs); }
.acct-cred__body { display:flex; flex-direction:column; gap:2px; min-width:0; }
.acct-cred__title { font-size:var(--text-base); }
.acct-cred__desc { font-size:var(--text-sm); color:var(--text-muted); line-height:1.6; }
.acct-cred__st { display:inline-flex; align-items:center; gap:5px; font-size:var(--text-sm); white-space:nowrap; }
.acct-cred__st.is-ok { color:#4ade80; }
.acct-cred__st.is-warn { color:var(--warning); }

.acct-bak__acts { display:flex; gap:var(--space-2); padding:var(--space-3) var(--space-5); flex-wrap:wrap; }
.acct-bak__list { padding:0 var(--space-5) var(--space-4); }
.acct-bak { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 60px 28px; gap:var(--space-2); align-items:center; padding:9px 0; border-bottom:1px solid var(--border-subtle); font-size:var(--text-sm); }
.acct-bak:last-child { border-bottom:0; }
.acct-bak__time { color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.acct-bak__meta { color:var(--text-muted); }
.acct-bak__size { color:var(--text-muted); text-align:right; }
.acct-bak__empty, .acct-act__empty { padding:var(--space-4); text-align:center; color:var(--text-muted); font-size:var(--text-sm); }

.acct-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--space-3); padding:var(--space-3) var(--space-5); }
.acct-stat { display:flex; align-items:flex-start; gap:var(--space-2); }
.acct-stat__icon { color:var(--text-muted); margin-top:2px; }
.acct-stat__body { display:flex; flex-direction:column; gap:1px; min-width:0; }
.acct-stat__val { font-size:var(--text-lg); font-weight:var(--weight-semibold); line-height:1.2; }
.acct-stat__label { font-size:var(--text-xs); color:var(--text-muted); }
.acct-stat__hint { font-size:var(--text-xs); color:var(--text-muted); opacity:.8; }

.acct-act__head { padding:var(--space-3) var(--space-5) 0; font-size:var(--text-sm); color:var(--text-muted); border-top:1px solid var(--border-subtle); margin:0 var(--space-5); padding-left:0; padding-right:0; }
.acct-act { padding:var(--space-2) var(--space-5) var(--space-4); }
.acct-act__item { display:grid; grid-template-columns:8px 44px minmax(0,1fr); gap:var(--space-2); align-items:baseline; padding:5px 0; font-size:var(--text-sm); }
.acct-act__time { color:var(--text-muted); font-variant-numeric:tabular-nums; }
.acct-act__text { color:var(--text-secondary); }



/* ===== 顶栏用户菜单 ===== */
.usermenu {
  position: fixed; z-index: 60;
  min-width: 240px; max-width: 300px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg, 0 8px 28px rgba(0,0,0,.45));
  padding: var(--space-2);
  animation: menu-in .14s var(--ease-out, ease-out);
}
@keyframes menu-in { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

.usermenu__head { display:flex; align-items:center; gap:var(--space-3); padding: var(--space-3); }
.usermenu__avatar {
  width:34px; height:34px; flex:0 0 34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: var(--accent); color:#fff; font-size: var(--text-lg);
}
.usermenu__body { min-width:0; display:flex; flex-direction:column; gap:1px; }
.usermenu__name { font-size: var(--text-base); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.usermenu__sub { font-size: var(--text-xs); color: var(--text-muted); }

.usermenu__label { padding: var(--space-2) var(--space-3) 4px; font-size: var(--text-xs); color: var(--text-muted); }
.usermenu__item {
  display:flex; align-items:center; gap: var(--space-3);
  width:100%; padding: 8px var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: var(--text-base); text-align:left;
  transition: background var(--duration-fast) var(--ease-out);
}
.usermenu__item:hover { background: var(--surface-2); color: var(--text); }
.usermenu__item .icon { flex:0 0 auto; color: var(--text-muted); }
.usermenu__item > span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.usermenu__item > em { font-style:normal; font-size: var(--text-xs); color: var(--text-muted); }
.usermenu__item.is-on { color: var(--accent); }
.usermenu__item.is-on .icon { color: var(--accent); }
.usermenu__sep { height:1px; background: var(--border-subtle); margin: var(--space-2) var(--space-3); }


/* ==========================================================================
   开发者页（v0.40，对齐效果图：7 个 Tab）
   ========================================================================== */

/* 概览：左宽右窄两列 */
.dev-cols { display: grid; gap: var(--space-5); grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); align-items: start; }
@media (max-width: 1100px) { .dev-cols { grid-template-columns: 1fr; } }
.dev-col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
.dev-col > .card + .card { margin-top: 0; }

.dev-hint { font-size: var(--text-sm); color: var(--text-muted); }
/* 卡片头：标题 + 副标题（参考图每张卡标题下都有一行说明） */
.dev-head__main { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.dev-head__hint { font-size: var(--text-sm); color: var(--text-muted); }
.dev-note { padding: var(--space-3) var(--space-5); font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6; }
.dev-note--tight { padding: 0 0 var(--space-3); }
.dev-dim { color: var(--text-muted); font-size: var(--text-sm); }
.dev-err { padding: var(--space-3) 0; color: var(--danger); font-size: var(--text-base); word-break: break-all; }
.dev-code-inline { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface-3); padding: 1px 5px; border-radius: var(--radius-sm); }

/* 空状态 */
.dev-empty { display:flex; flex-direction:column; align-items:center; gap:6px; padding: var(--space-6) var(--space-5); color: var(--text-muted); font-size: var(--text-base); }
.dev-empty__sub { font-size: var(--text-sm); opacity:.85; text-align:center; }

/* 开发者页 Tab：选中态用浅色块（参考图），不是下划线 */
/* Tab 行：给下方横线留出呼吸（原来紧贴卡片头） */
#devTabs.tabs-line { padding-bottom: 10px; margin-bottom: var(--space-5); }
#devTabs .tabline { border-radius: var(--radius-md); padding: 8px var(--space-4); }
#devTabs .tabline::after { display: none; }
#devTabs .tabline.is-active { background: var(--surface-2); color: var(--text); font-weight: var(--weight-medium); }

/* 开放能力卡 */
.dev-caps { display:flex; flex-direction:column; gap: var(--space-2); }
.dev-caps--dim { opacity:.55; }
.dev-cap { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-2); }
.dev-cap__icon { width:32px; height:32px; flex:0 0 32px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; background: var(--accent-soft); color: var(--accent); }
.dev-cap.is-off .dev-cap__icon { background: var(--surface-3); color: var(--text-muted); }
.dev-cap--master { background: var(--surface-1); border-color: var(--border); }
.dev-cap__body { flex:1; min-width:0; }
.dev-cap__title { font-size: var(--text-base); font-weight: var(--weight-medium); }
.dev-cap__desc { font-size: var(--text-sm); color: var(--text-muted); margin-top:2px; }
.dev-cap__right { display:flex; align-items:center; gap: var(--space-3); flex:0 0 auto; }
.dev-cap__state { font-size: var(--text-sm); color: var(--text-muted); white-space:nowrap; }
.dev-cap__chev { color: var(--text-muted); }
.dev-cap__chev.is-open { color: var(--accent); }

/* 「本地 API」卡详情：旧调试开关 */
.dev-cap-detail { margin: -4px 0 var(--space-2) 44px; padding: var(--space-2) var(--space-4); border-left: 2px solid var(--border-subtle); }
.dev-sub { display:flex; align-items:center; gap: var(--space-3); padding: 6px 0; }
.dev-sub__body { flex:1; min-width:0; }
.dev-sub__name { font-size: var(--text-sm); }
.dev-sub__desc { font-size: var(--text-xs); color: var(--text-muted); margin-top:1px; }
.dev-sub__tip { display:flex; align-items:center; gap:6px; margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-muted); }

/* Token 表 */
.dev-tokname { font-size: var(--text-base); }
.dev-tokpre { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); margin-top:1px; }
.dev-state { display:inline-flex; align-items:center; gap:5px; font-size: var(--text-sm); }
.dev-state.is-on { color: var(--online); }
.dev-state.is-off { color: var(--text-muted); }
.dev-acts { display:flex; gap: var(--space-2); justify-content:flex-end; }

/* 调用统计 */
.dev-sel { width: auto; height: 30px; padding: 0 var(--space-3); font-size: var(--text-sm); }
.dev-kpis { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--space-3); padding: var(--space-4) var(--space-5) 0; }
@media (max-width: 700px) { .dev-kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.dev-kpi { display:flex; flex-direction:column; gap:2px; min-width:0; }
.dev-kpi__label { font-size: var(--text-xs); color: var(--text-muted); }
.dev-kpi__value { font-size: var(--text-title); font-weight: var(--weight-semibold); letter-spacing:-.02em; white-space:nowrap; }
.dev-kpi__delta { font-size: var(--text-xs); color: var(--text-muted); white-space:nowrap; }
.dev-kpi__delta.is-up { color: var(--online); }
.dev-kpi__delta.is-down { color: var(--danger); }
.dev-kpi__delta.is-flat { color: var(--text-muted); }

/* 折线图 */
.dev-chart { padding: var(--space-4) var(--space-5) 0; }
.dev-chart__svg { width:100%; height:190px; display:block; }
.dev-chart__grid { stroke: var(--border-subtle); stroke-width:1; }
.dev-chart__ylab { font-size: var(--text-xs); fill: var(--text-muted); }
.dev-chart__xlab { font-size: var(--text-xs); fill: var(--text-muted); }
.dev-chart__empty { height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color: var(--text-muted); font-size: var(--text-base); }
.dev-chart__empty-sub { font-size: var(--text-sm); opacity:.8; }
.dev-chart__foot { padding: var(--space-2) var(--space-5) var(--space-4); font-size: var(--text-sm); color: var(--text-muted); text-align:right; }

/* API 访问信息 */
.dev-url { margin-top: var(--space-2); }
.dev-url__label { font-size: var(--text-xs); color: var(--text-muted); margin-bottom:4px; }
.dev-url__row { display:flex; align-items:center; gap: var(--space-2); }
.dev-url__val { flex:1; min-width:0; font-family: var(--font-mono); font-size: var(--text-sm); background: var(--surface-2); border:1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 6px var(--space-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dev-quick { margin-top: var(--space-5); }
.dev-quick__head { display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); margin-bottom: var(--space-2); font-size: var(--text-sm); color: var(--text-secondary); }
/* .segmented__btn 是给「图标切换」用的（固定 30px 宽）；
   快速开始是文字按钮，必须放开宽度，否则 cURL / Python / JS 挤成一团 */
.dev-quick__head .segmented__btn { width: auto; height: 24px; padding: 0 var(--space-3); font-size: var(--text-sm); }
.dev-code { position: relative; }
/* 参考图里快速开始的代码块是深色的 */
.dev-code .code-block {
  max-height: 190px;
  background: #0b1017; color: #c9d4e3; border-color: #1d2634;
}
.dev-code .code-block { white-space: pre; }
.dev-code__copy { position:absolute; top: var(--space-2); right: var(--space-2); }

/* 工具与资源 */
/* 右列只有 ~540px：3 列会把「下载 OpenAPI」「Webhook 测试」截断，用 2 列 */
.dev-tools { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-3); }
@media (max-width: 900px) { .dev-tools { grid-template-columns: 1fr; } }
.dev-tools--wide { padding: 0 0 var(--space-3); }
.dev-tool { display:flex; flex-direction:column; align-items:stretch; gap: var(--space-3); padding: var(--space-3) var(--space-4); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-2); text-align:left; width:100%; transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out); }
.dev-tool:hover { border-color: var(--border-strong); background: var(--surface-3); }
.dev-tool__top { display:flex; align-items:center; gap: var(--space-3); min-width:0; }
.dev-tool__icon { width:30px; height:30px; flex:0 0 30px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; background: var(--surface-3); color: var(--text-secondary); }
.dev-tool__body { min-width:0; display:flex; flex-direction:column; gap:1px; }
.dev-tool__label { font-size: var(--text-base); color: var(--text); }
.dev-tool__desc { font-size: var(--text-xs); color: var(--text-muted); }
.dev-tool--danger { border-color: color-mix(in srgb, var(--danger) 40%, var(--border-subtle)); }
.dev-tool--danger .dev-tool__icon { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.dev-tool--danger .dev-tool__label { color: var(--danger); }

/* 请求日志表 */
.dev-method { display:inline-block; padding:1px 6px; border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: var(--weight-semibold); background: var(--surface-3); color: var(--text-secondary); }
.dev-method.is-get { background: color-mix(in srgb, var(--online) 16%, transparent); color: var(--online); }
.dev-method.is-post { background: var(--accent-soft); color: var(--accent); }
.dev-path { font-family: var(--font-mono); font-size: var(--text-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* 右列窄：日志表用固定列宽，路径列吃掉剩余宽度并用省略号 */
.dev-logtable { table-layout: fixed; }
.dev-logtable td, .dev-logtable th { white-space: nowrap; padding-left:6px; padding-right:6px; }
.dev-logtable td.dev-dim { font-size: var(--text-xs); }

/* Webhook 测试 */
.dev-field { display:flex; gap: var(--space-3); align-items:center; margin-bottom: var(--space-3); }
.dev-field .input { flex:1; min-width:0; }
.dev-wh__head { display:flex; align-items:center; gap: var(--space-3); margin: var(--space-2) 0; }

/* 新建 Token 弹窗 */
.dev-tokenbox { display:flex; flex-direction:column; gap: var(--space-2); }
.dev-tokenbox__label { font-size: var(--text-sm); color: var(--warning); }
.dev-tokenbox__val { font-family: var(--font-mono); font-size: var(--text-base); background: var(--surface-2); border:1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-3); word-break: break-all; }

/* ---- 接口文档：子 Tab / 参考手册 ---- */
.dev-seg .segmented__btn { width:auto; padding:0 var(--space-3); font-size: var(--text-sm); }
.acct-login__seg { margin-bottom: var(--space-4); }
.acct-login { display:flex; flex-direction:column; gap: var(--space-3); }
.acct-login .field { margin:0; }
.dev-ref-head { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-3) var(--space-5) var(--space-2); }
.dev-ref-item { border-bottom: 1px solid var(--border-subtle); }
.dev-ref-item:last-child { border-bottom: 0; }
.dev-ref-item__head { display:flex; align-items:center; gap: var(--space-3); width:100%; text-align:left; padding: 10px var(--space-4); transition: background var(--duration-fast) var(--ease-out); }
.dev-ref-item__head:hover { background: var(--surface-2); }
.dev-ref-item__head .icon { color: var(--text-muted); flex:0 0 auto; transition: transform var(--duration-normal) var(--ease-out); }
.dev-ref-item.is-open .dev-ref-item__head .icon { transform: rotate(180deg); }
.dev-ref-item__summary { flex:1; min-width:0; font-size: var(--text-sm); color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dev-ref-item__body { padding: 0 var(--space-4) var(--space-4); }
.dev-ref-params__title, .dev-ref-resp__title { font-size: var(--text-sm); color: var(--text-muted); margin: var(--space-3) 0 var(--space-2); }
.dev-ref-params .table { font-size: var(--text-sm); }
.dev-ref-item__acts { margin-top: var(--space-3); }

/* ---- 接口文档：左侧目录 + 右侧渲染正文 ---- */
.dev-doc { display:grid; grid-template-columns: 200px minmax(0,1fr); gap: var(--space-5); padding: var(--space-4) var(--space-5) var(--space-5); align-items:start; }
/* 开发者页：卡头下那根横线离标题/正文都太紧，单独加点间距 */
.dev-doc { margin-top: 0; }
#devBody .card__head { padding-bottom: var(--space-4); }
#devBody .card__head .dev-head__main { gap: 3px; }
#devBody .card__body { padding-top: var(--space-5); }
@media (max-width: 1000px){ .dev-doc{ grid-template-columns:1fr; } .dev-doc__toc{ display:none; } }
.dev-doc__toc { position:sticky; top: var(--space-4); display:flex; flex-direction:column; gap:1px; max-height:72vh; overflow:auto; }
.dev-doc__toc-title { font-size: var(--text-xs); color: var(--text-muted); margin-bottom:4px; }
.dev-doc__toc-item { text-align:left; font-size: var(--text-sm); color: var(--text-secondary); padding:4px 8px; border-radius: var(--radius-sm); }
.dev-doc__toc-item:hover { background: var(--surface-2); color: var(--text); }
.dev-doc__toc-item--h3 { padding-left:18px; font-size: var(--text-xs); }
.dev-doc__search { width: 190px; height: 28px; font-size: var(--text-sm); }
.dev-md { font-size: var(--text-base); line-height:1.75; color: var(--text-secondary); min-width:0; }
.dev-md-h { color: var(--text); }
.dev-md-h1 { font-size: var(--text-xl); margin: 0 0 var(--space-4); }
.dev-md-h2 { font-size: var(--text-lg); margin: var(--space-6) 0 var(--space-3); padding-bottom:6px; border-bottom:1px solid var(--border-subtle); }
.dev-md-h3 { font-size: var(--text-base); font-weight: var(--weight-semibold); margin: var(--space-5) 0 var(--space-2); }
.dev-md-h4 { font-size: var(--text-base); margin: var(--space-4) 0 var(--space-2); }
.dev-md-p { margin: 0 0 var(--space-3); }
.dev-md-pre { background:#0b1017; color:#c9d4e3; border:1px solid #1d2634; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-family: var(--font-mono); font-size: var(--text-sm); line-height:1.7; overflow-x:auto; margin: 0 0 var(--space-4); white-space: pre; }
.dev-md-code { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--surface-3); padding:1px 5px; border-radius: var(--radius-sm); }
.dev-md-ul { margin: 0 0 var(--space-3); padding-left: 22px; }
.dev-md-ul li { margin-bottom:4px; list-style: disc; }
.dev-md-hr { border:0; border-top:1px solid var(--border-subtle); margin: var(--space-5) 0; }
.dev-md-ol { margin: 0 0 var(--space-3); padding-left: 22px; }
.dev-md-ol li { margin-bottom: 4px; list-style: decimal; }
.dev-md-quote { margin: 0 0 var(--space-4); padding: var(--space-3) var(--space-4); border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--radius-md) var(--radius-md) 0; color: var(--text-secondary); }
.dev-md-quote > div + div { margin-top: 4px; }
.dev-md-tablewrap { margin: 0 0 var(--space-4); overflow-x:auto; }
.dev-md-table { font-size: var(--text-sm); }
.dev-md-table th { color: var(--text-muted); font-weight: var(--weight-medium); }
.dev-api-group__head { display:flex; align-items:center; gap:8px; padding: var(--space-3) var(--space-4) 6px; font-size: var(--text-sm); color: var(--text-muted); }
.dev-api-group__head > em { font-style:normal; background: var(--surface-3); border-radius:999px; padding:0 6px; font-size: var(--text-xs); }

/* 能力探测键值 */
.dev-kv { display:flex; flex-direction:column; }
.dev-kv__row { display:flex; gap: var(--space-4); padding: 6px 0; border-bottom:1px solid var(--border-subtle); font-size: var(--text-sm); }
.dev-kv__row:last-child { border-bottom:0; }
.dev-kv__row > span { width:96px; flex:0 0 96px; color: var(--text-muted); }
.dev-kv__row > b { font-weight: var(--weight-normal); min-width:0; }
.dev-kv__wrap { word-break: break-all; }


/* 顶栏自包含 toast（不依赖 app 的 toast） */
.tn-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
  z-index: 70; max-width: 80vw;
  padding: 10px 18px; border-radius: var(--radius-lg);
  background: var(--surface-1); border: 1px solid var(--border);
  color: var(--text); font-size: var(--text-base);
  box-shadow: 0 8px 28px rgba(0,0,0,.45);
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.tn-toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }


/* ===== 凭据异常提示（实时预览页）===== */
.cred-warn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 32px 24px; text-align: center;
  background: var(--surface-1); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl); min-height: 260px;
}
.cred-warn__icon { color: var(--warning); }
.cred-warn__title { font-size: var(--text-lg); font-weight: var(--weight-medium); }
.cred-warn__desc { font-size: var(--text-base); color: var(--text-muted); line-height: 1.8; max-width: 460px; }
.cred-warn__acts { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.cred-warn__hint { font-size: var(--text-sm); color: var(--text-muted); opacity: .8; margin-top: 4px; }


/* ===== 小米设备管理（账号页重构版）=====
   对齐用户给的参考设计：左右两栏
     左：用户列表（添加/删除/设备列表按钮）
     右：设备表格（名称/型号/信息/状态/操作）
*/
.acct2 { display:grid; grid-template-columns: minmax(320px, 380px) minmax(0,1fr); gap: var(--space-5); align-items:start; }
@media (max-width:1100px){ .acct2 { grid-template-columns:1fr; } }

.acct2__users, .acct2__devs {
  background: var(--surface-1); border:1px solid var(--border-subtle);
  border-radius: var(--radius-xl); overflow:hidden; min-height: 380px;
}
.acct2__head {
  display:flex; align-items:center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5); border-bottom:1px solid var(--border-subtle);
}
.acct2__head > div:first-child { flex:1; min-width:0; }
.acct2__title { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.acct2__sub { font-size: var(--text-sm); color: var(--text-muted); margin-top:2px; }
.acct2__body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }

/* 用户卡片：上下分层卡片设计，杜绝文字拥挤与折行混乱 */
.acct2__user {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: var(--surface-2);
  cursor: pointer;
  position: relative;
  transition: background var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
}
.acct2__user:hover {
  background: var(--surface-3);
  border-color: var(--border-hover);
}
.acct2__user.is-on {
  background: color-mix(in oklab, var(--accent) 7%, var(--surface-2));
  border-color: color-mix(in oklab, var(--accent) 45%, transparent);
  box-shadow: 0 4px 14px -3px color-mix(in oklab, var(--accent) 20%, transparent);
}

/* 卡片上层：头像 + 账号名 + 操作按钮 */
.acct2__user-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}
.acct2__user-profile {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  flex: 1;
}
.acct2__avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-3);
  color: var(--text-muted);
}
.acct2__user.is-on .acct2__avatar {
  background: color-mix(in oklab, var(--accent) 22%, transparent);
  color: var(--accent);
}
.acct2__info {
  flex: 1;
  min-width: 0;
}
.acct2__uid {
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}
.acct2__meta {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.acct2__ops {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
}

/* 卡片下层：设备数量 + 状态点徽章 + 查看设备交互条 */
.acct2__user-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--border-subtle);
  font-size: var(--text-xs);
}
.acct2__dev-summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  min-width: 0;
  overflow: hidden;
}
.acct2__dev-txt {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.acct2__user-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}
.acct2__status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  background: var(--surface-3);
  color: var(--text-muted);
  white-space: nowrap;
}
.acct2__status-badge.is-ok {
  background: color-mix(in oklab, var(--online) 14%, transparent);
  color: var(--online);
}
.acct2__status-badge.is-err {
  background: color-mix(in oklab, var(--danger) 14%, transparent);
  color: var(--danger);
}
.acct2__view-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: var(--text-xs);
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: var(--radius-md);
  background: var(--surface-3);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--duration-fast) var(--ease-out);
}
.acct2__user:hover .acct2__view-pill {
  color: var(--text);
  background: var(--surface-4, var(--surface-3));
}
.acct2__user.is-on .acct2__view-pill {
  color: var(--accent);
  background: color-mix(in oklab, var(--accent) 15%, transparent);
  font-weight: var(--weight-medium);
}

/* 设备表格 */
.dev-table { width:100%; border-collapse: collapse; font-size: var(--text-base); }
.dev-table thead th {
  text-align:left; padding: 10px var(--space-4);
  background: var(--surface-2); color: var(--text-muted);
  font-weight: var(--weight-medium); font-size: var(--text-sm);
  border-bottom:1px solid var(--border-subtle);
}
.dev-table thead th:first-child { border-top-left-radius: var(--radius-md); }
.dev-table thead th:last-child { border-top-right-radius: var(--radius-md); }
.dev-table tbody td { padding: 12px var(--space-4); border-bottom:1px solid var(--border-subtle); vertical-align: middle; }
.dev-table tbody tr:last-child td { border-bottom:0; }
.dev-table tbody tr:hover { background: var(--surface-2); }
.dev-table__name { font-weight: var(--weight-medium); }
.dev-table__model { color: var(--text-secondary); font-size: var(--text-sm); }
.dev-table__info { color: var(--text-muted); font-size: var(--text-sm); font-family: ui-monospace, Menlo, monospace; }
/* 序列号「显示/复制」控件（UI-SPEC §4.1）。
   默认只显示遮罩值，点眼睛才露出完整串并 30 秒后自动收起。
   刻意做得很轻（灰色小图标），不抢表格主体的注意力。 */
.did-reveal { display: inline-flex; align-items: center; gap: 6px; }
.did-reveal__txt { font-variant-numeric: tabular-nums; }
.did-reveal__btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; flex: 0 0 auto;
  border-radius: var(--radius-sm);
  color: var(--text-muted); cursor: pointer;
  transition: color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.did-reveal__btn:hover { color: var(--accent); background: var(--surface-3); }
.did-reveal__btn[hidden] { display: none; }
.dev-table__state { display:inline-flex; align-items:center; gap:5px; font-size: var(--text-sm); }
.dev-table__state.is-on { color: #4ade80; }
.dev-table__state.is-off { color: var(--text-muted); }
.dev-table__ops { display:flex; gap:4px; }

/* 空状态 */
.acct2__empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding: 56px 20px; text-align:center; }
.acct2__empty-icon { color: var(--text-muted); opacity:.5; }
.acct2__empty-title { font-size: var(--text-base); color: var(--text-secondary); }
.acct2__empty-desc { font-size: var(--text-sm); color: var(--text-muted); }

/* 底部信息条 */
.acct2__foot {
  display:flex; align-items:center; gap: var(--space-4); flex-wrap:wrap;
  margin-top: var(--space-5); padding: var(--space-3) var(--space-5);
  background: var(--surface-1); border:1px solid var(--border-subtle); border-radius: var(--radius-xl);
  font-size: var(--text-sm); color: var(--text-muted);
}
.acct2__foot-item b { color: var(--text); font-size: var(--text-base); margin-right:3px; }
.acct2__foot-spacer { flex:1; }


/* 设备表格工具条 + 纳入列 */
.dev-toolbar {
  display:flex; align-items:center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4); border-bottom:1px solid var(--border-subtle);
  font-size: var(--text-sm); color: var(--text-muted);
}
.dev-toolbar__all { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
.dev-toolbar__all input { cursor:pointer; }
.dev-toolbar__info b { color: var(--text); }

.dev-table__cb { width:38px; }
.dev-table__cb input { cursor:pointer; }
.dev-table tr.is-managed td { background: color-mix(in oklab, var(--accent) 4%, transparent); }
.dev-table__alias-tag, .dev-table__share-tag {
  display:inline-block; margin-left:6px; padding:1px 6px; border-radius:999px;
  font-size: var(--text-xs); font-weight: var(--weight-normal);
}
.dev-table__alias-tag { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--accent); }
.dev-table__share-tag { background: var(--surface-3); color: var(--text-muted); }


/* 缩略图失败提示（区别于「摄像头坏了」） */
.camera-card__placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color: var(--text-muted); }
.camera-card__placeholder > span:first-of-type { font-size: var(--text-base); }

/* ===== 容器类补全（2026-09-23）=====
 *
 * 背景：build/check-classes.js 报「JS 用了但 CSS 未定义」11 个类。
 * 逐一视觉确认后，它们都是 BEM 的【结构容器】——
 * 视觉由子元素或父级 grid/flex 承担，所以原先没有自己的规则。
 *
 * 但「没有规则」有个真实风险：
 *   · grid/flex 子项默认 min-width:auto，长文本会撑破布局
 *   · 操作区会被同行的标题压缩到换行
 * 下面只补【防止错位与溢出】的声明，不引入任何视觉效果，
 * 因此不会改变现有观感（改完已做截图对比）。
 */

/* 空状态里的操作按钮区（父级 .empty 已是 column flex + gap） */
.empty__action { display: flex; gap: var(--space-2); }

/* 事件列表容器：卡片纵向排列，间距交给卡片自身的 margin/grid */
.ev-list { display: block; min-width: 0; }

/* AI 示例行里的说明文字：在 flex 行里垂直居中 */
.ai-examples__label { align-self: center; font-size: var(--text-sm); color: var(--text-muted); }

/* AI 证据两栏（父级 .ai-evidence 是 2 列 grid）
 * min-width:0 是 grid/flex 子项防溢出的关键声明 ——
 * 缺了它，长描述会把整行撑出容器 */
.ai-evidence__main,
.ai-evidence__side { min-width: 0; }

/* AI 检索卡片：视觉全部来自 .card，这里只约束内部不溢出 */
.ai-find { min-width: 0; }

/* 播放器占位：JS 选择器同时匹配 player__pl / player__ph，
 * 实际只会渲染 player__ph；给 pl 一条声明避免它成为"幽灵类" */
.player__pl { display: block; }

/* 列表头右侧操作区：不允许被标题压缩换行 */
.list-head__ops { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }

/* 开发者页 API 分组容器：组内纵向排列 */
.dev-api-group { display: flex; flex-direction: column; min-width: 0; }

/* 设置项左侧标签列（父级 .set3__row 是 grid）—— 同样防溢出 */
.set3__row-label { min-width: 0; }

/* 开发者页预览区（JS 用它做统一挂载点） */
.dev-preview { min-width: 0; }

/* ===== 历史画面标记（2026-09-24）=====
 *
 * 静默期缩略图会回退到磁盘上的历史帧。如果角标仍显示当前时间，
 * 用户会误以为画面是实时的（实测被误导过："好像恢复了"）。
 *
 * 这里用琥珀色把「历史」和「实时」在视觉上分开：
 *   .is-historic  -> 角标变琥珀底 + 去掉录制红点（红点 = 正在录）
 */
.cam-card__time.is-historic {
  background: rgba(245, 158, 11, .18);
  border-color: rgba(245, 158, 11, .45);
  color: #fbbf24;
}
.cam-card__time.is-historic::before {
  content: "历史";
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: .02em;
  opacity: .9;
  margin-right: 2px;
}
.cam-card__time .rec-dot.is-historic {

  animation: none;   /* 历史画面不该有「正在录制」的呼吸效果 */
}


/* ===== 缩略图加载态（2026-10-11）=====
 *
 * 用户反馈：「图片���加载起来的时候，应该有个缓冲的效果」。
 *
 * 原来 fetch 完成前是纯黑框，看不出是在加载还是坏了。
 * 这里给三种状态明确的视觉：
 *   .thumb-skel  加载中（骨架 + 转圈）
 *   .thumb-retry 失败（点击重试）
 */
.thumb-skel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  /* 用 cam-tile 自己的底色（#0a0d12），这样加载态和卡片浑然一体 */
  background: #0a0d12;
  z-index: 2;
  pointer-events: none;
}
/* 附加一层缓慢扫过的高光，暗示"在加载"而不是"坏了" */
.thumb-skel::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg,
    transparent 30%,
    rgba(255,255,255,.035) 50%,
    transparent 70%);
  background-size: 220% 100%;
  animation: skeleton 1.8s ease-in-out infinite;
}
.thumb-skel__spin {
  width: 22px; height: 22px;
  border: 2px solid rgba(255,255,255,.14);
  border-top-color: var(--accent, #6b7cff);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.thumb-skel__text {
  font-size: var(--text-sm);
  color: #8b8d98;
  letter-spacing: .02em;
}

.thumb-retry {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: #0a0d12;
  color: #8b8d98;
  font-size: var(--text-sm);
  cursor: pointer;
  z-index: 3;
  transition: background .15s;
}
.thumb-retry:hover { background: var(--surface-3, #212228); }
.thumb-retry em {
  font-style: normal;
  font-size: var(--text-xs);
  color: var(--accent, #6b7cff);
}

/* cam-tile 需要作为定位上下文（骨架屏用 absolute 覆盖） */
.cam-tile { position: relative; }

}

.pb-t24__ruler-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  user-select: none;
}
.pb-t24__ticks {
  position: relative;
  height: 18px;
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-family: ui-monospace, Menlo, monospace;
}
.pb-t24__ticks span {
  position: absolute;
  transform: translateX(-50%);
  white-space: nowrap;
}
.pb-t24__ticks span:first-child { transform: translateX(0); }
.pb-t24__ticks span:last-child { transform: translateX(-100%); }

.pb-t24__track {
  position: relative;
  height: 28px;
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  cursor: pointer;
  overflow: visible;
  transition: border-color var(--duration-fast);
}
.pb-t24__track:hover {
  border-color: var(--border-hover);
}
.pb-t24__span {
  position: absolute;
  top: 0;
  bottom: 0;
  background: color-mix(in oklab, #22c55e 55%, transparent);
  border-radius: 2px;
  pointer-events: none;
  transition: background var(--duration-fast);
}

  background: color-mix(in oklab, #22c55e 75%, transparent);
}
.pb-t24__ev {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid var(--surface-1);
  background: var(--warning);
  pointer-events: none;
  z-index: 2;
}

.pb-t24__ev--package { background: #14b8a6; }

.pb-t24__needle {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 2px;
  background: #ef4444;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 4;
  box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
}
.pb-t24__needle-tag {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: #ef4444;
  color: #fff;
  font-size: 10px;

}
.pb-t24__hover {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--text-muted);
  transform: translateX(-50%);
  pointer-events: none;
  opacity: 0;
  z-index: 3;
  transition: opacity var(--duration-fast);
}
.pb-t24__track:hover .pb-t24__hover { opacity: 1; }

  position: absolute;
  top: calc(100% + 4px);
  left: 50%;
