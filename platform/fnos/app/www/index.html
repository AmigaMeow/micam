function dot2(cls){ return '<span class="status-dot ' + cls + '"></span>'; }

// loadCloudDevices 读取云端设备清单缓存，渲染右栏表格。
//
// 注意：这里【不带 refresh=1】—— 只读缓存，不触发云端拉取。
// 拉取必须由用户点「获取设备」。
function loadCloudDevices(userId){
  api('/api/devices/cloud').then(function(d){
    var body = document.getElementById('acctDevBody');
    if(!body) return;
    var all = ((d && d.devices) || []).filter(function(x){
      return !x.accountId || String(x.accountId) === String(userId);
    });
    acctCloudDevs = all;
    body.innerHTML = all.length ? acctDevTable(all) : acctDevEmpty();
    bindDevTable();
    // 同步左栏用户卡片的计数（否则会出现「左栏说未获取、右栏却有三台」）
    syncUserCardCount(userId, all.length, all.filter(function(x){ return x.managed !== false; }).length);
  }).catch(function(e){
    console.error('loadCloudDevices 失败:', e);
    var body = document.getElementById('acctDevBody');
    if(body) body.innerHTML = acctDevEmpty();
  });
}

// modelLabel 把小米内部型号转成用户能看懂的名字。
function modelLabel(m){
  if(!m) return '—';
  var map = {
    'isa.camera.hlmax':'CW500 双摄版', 'isa.camera.hlmax2':'CW500 双摄版',
    'mxiang.camera.moc001':'CW300', 'mxiang.camera.moc006':'C400',
    'chuangmi.camera.029a02':'小白智能摄像机',
    'chuangmi.camera.ipc019':'米家智能摄像机',
    'isa.camera.hlc6':'C500 双摄',
  };
  if(map[m]) return map[m];
  var parts = String(m).split('.');
  return parts.length >= 3 ? parts[parts.length-1].toUpperCase() : m;
}

// syncUserCardCount 把云端清单的统计同步到左栏用户卡片。
//
// 为什么需要：左栏用 accounts/detail 的 byAccount（后端按账号聚合），
// 右栏用 /api/devices/cloud（云端清单）—— 两个数据源可能不同步，
// 会出现「左栏说未获取设备、右栏却有三台」的矛盾显示。
function syncUserCardCount(userId, total, managed){
  var el = document.querySelector('[data-acct-sel="' + userId + '"]');
  if(!el) return;
  var txtEl = el.querySelector('.acct2__dev-txt');
  if(txtEl){
    txtEl.textContent = total ? (managed + ' / ' + total + ' 台已纳入') : '未获取设备';
    return;
  }
  var metas = el.querySelectorAll('.acct2__meta');
  if(metas.length < 2) return;
  var txt = total
    ? (managed + ' / ' + total + ' 台已纳入')
    : '未获取设备';
  var last = metas[metas.length-1];
  var tail = last.innerText.indexOf('·') >= 0 ? last.innerText.slice(last.innerText.indexOf('·')) : '';
  last.innerText = txt + (tail ? ' ' + tail : '');
}

// maskDid 设备序列号遮罩
//
// 用户反馈：手机号做了打码（132****9923），但设备序列号是明文，
// 隐私处理策略不一致。保留首 3 位 + 末 3 位便于用户辨识是哪台设备，
// 完整值通过 title 提供（需要报障时仍可取到）。
function maskDid(did){
  var s = String(did == null ? '' : did);
  if(s.length <= 6) return s;
  return s.slice(0, 3) + '****' + s.slice(-3);
}

// importAccountBackup 导入凭据备份。
//
// 19:05 那次前端源码丢失把这套流程一起丢了，按钮被改成了「跳安装向导」；
// 这里按 v0.38.0 fpk 里取回的旧逻辑补回：选文件 -> 读 JSON -> POST /api/accounts/import
function importAccountBackup(){
  var f = document.getElementById('acctImportFile');
  if(!f){
    f = document.createElement('input');
    f.type = 'file';
    f.id = 'acctImportFile';
    f.accept = '.json,application/json';
    f.style.display = 'none';
    f.onchange = function(){
      var self = this;
      var file = self.files && self.files[0];
      if(!file) return;
      if(!confirm('导入会用文件里的凭据覆盖当前登录。\n\n现有凭据会自动备份。\n\n确定继续？')){ self.value = ''; return; }
      var reader = new FileReader();
      reader.onload = function(){
        secEnsure(function(code){
        secFetch('/api/accounts/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Access-Code': code },
          body: reader.result
        }).then(function(r){
          if(r && r.msg){ toast(r.msg, 'err'); return; }
          toast('已导入 ' + (r.count || 0) + ' 个账号，无需重新扫码', 'ok');
          api('/api/devices/cloud?refresh=1').then(function(){
            page = 'accounts'; renderMenu(); render();
          }).catch(function(){ page = 'accounts'; renderMenu(); render(); });
        }).catch(function(e){ toast('导入失败：' + e.message, 'err'); });
        self.value = '';
        });
      };
      reader.readAsText(file);
    };
    document.body.appendChild(f);
  }
  f.click();
}

// bindDevTable 绑定设备表格里的交互
function bindDevTable(){
  function selDids(){
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('[data-dev-sel]'), function(cb){
      if(cb.checked) out.push(cb.dataset.devSel);
    });
    return out;
  }

  // 全选
  var all = document.getElementById('devSelAll');
  if(all) all.onchange = function(){
    var on = this.checked;
    Array.prototype.forEach.call(document.querySelectorAll('[data-dev-sel]'), function(cb){ cb.checked = on; });
  };

  // 序列号「点击显示 + 30 秒自动收起 + 复制」（UI-SPEC §4.1/§4.2）
  //
  // 与 API Key 同一套模式。不用 title 承载完整值 ——
  // title 是假脱敏：hover 就露，录屏时更容易无意触发。
  var DID_REVEAL_MS = 30000;
  Array.prototype.forEach.call(document.querySelectorAll('.did-reveal'), function(box){
    var full = box.dataset.did || '';
    var txt = box.querySelector('.did-reveal__txt');
    var eye = box.querySelector('[data-did-toggle]');
    var cp  = box.querySelector('[data-did-copy]');
    var timer = null;

    function hide(){
      if(timer){ clearTimeout(timer); timer = null; }
      if(txt) txt.textContent = maskDid(full);
      if(cp) cp.hidden = true;
      if(eye){ eye.title = '显示完整序列号（30 秒后自动隐藏）'; }
    }
    function show(){
      if(txt) txt.textContent = full;
      if(cp) cp.hidden = false;
      if(eye){ eye.title = '隐藏序列号'; }
      if(timer) clearTimeout(timer);
      timer = setTimeout(hide, DID_REVEAL_MS);
    }
    if(eye) eye.onclick = function(ev){
      ev.stopPropagation();
      if(cp && !cp.hidden) hide(); else show();   // 再点一次可提前收起
    };
    if(cp) cp.onclick = function(ev){
      ev.stopPropagation();
      copyText(full, '序列号已复制');
    };
  });

  // 批量纳入 / 移出
  function batch(managed){
    var dids = [];
    Array.prototype.forEach.call(document.querySelectorAll('[data-dev-sel]'), function(cb){
      var want = managed ? cb.checked : !cb.checked;
      if(want) dids.push(cb.dataset.devSel);
    });
    if(!dids.length){ toast('请先勾选设备', 'warn'); return; }
    // 批量移出同样要二次确认（纳入是增量操作，不需要）
    if(!managed && !confirm('将 ' + dids.length + ' 台设备移出管理？\n\n'
      + '· 它们不会再出现在监控列表里\n'
      + '· 米家 App 里的设备不受影响\n'
      + '· 之后可以随时重新「纳入管理」')) return;
    api('/api/devices/manage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ dids: dids, managed: managed })
    }).then(function(r){
      toast((managed ? '已纳入 ' : '已移出 ') + (r.count || dids.length) + ' 台设备', 'ok');
      render();
    }).catch(function(e){ toast('操作失败：' + e.message, 'err'); });
  }
  var on2 = document.getElementById('devManageOn');
  if(on2) on2.onclick = function(){ batch(true); };
  var off2 = document.getElementById('devManageOff');
  if(off2) off2.onclick = function(){ batch(false); };

  // 单行：纳入
  Array.prototype.forEach.call(document.querySelectorAll('[data-dev-on]'), function(b){
    b.onclick = function(){
      api('/api/devices/manage', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ dids:[this.dataset.devOn], managed:true })
      }).then(function(){ toast('已纳入管理', 'ok'); render(); })
        .catch(function(e){ toast('操作失败：' + e.message, 'err'); });
    };
  });

  // 单行：移出
  Array.prototype.forEach.call(document.querySelectorAll('[data-dev-off]'), function(b){
    b.onclick = function(){
      var did = this.dataset.devOff;
      // 二次确认（用户反馈：移出是有破坏性的操作）
      if(!confirm('将这台设备移出管理？\n\n'
        + '· 它不会再出现在监控列表里\n'
        + '· 米家 App 里的设备不受影响\n'
        + '· 之后可以随时重新「纳入管理」')) return;
      api('/api/devices/manage', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ dids:[did], managed:false })
      }).then(function(){ toast('已移出管理（米家里的设备不受影响）', 'ok'); render(); })
        .catch(function(e){ toast('操作失败：' + e.message, 'err'); });
    };
  });

  // 预览
  Array.prototype.forEach.call(document.querySelectorAll('[data-dev-open]'), function(b){
    b.onclick = function(){
      var did = this.dataset.devOpen;
      if(currentDid !== did){ currentDid = did; try{ localStorage.setItem('micam.lastDid', did); }catch(e){} }
      page = 'live'; renderMenu(); render();
    };
  });

  // 改名
  Array.prototype.forEach.call(document.querySelectorAll('[data-dev-rename]'), function(b){
    b.onclick = function(){
      var did = this.dataset.devRename;
      var x = null;
      for(var i=0;i<acctCloudDevs.length;i++){ if(String(acctCloudDevs[i].did)===String(did)) x = acctCloudDevs[i]; }
      var cur = (x && x.alias) || (x && x.name) || '';
      var v = prompt('设备名称（留空恢复原名）：', cur);
      if(v === null) return;
      api('/api/devices/meta', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ did: did, alias: v.trim(), devName: (x && x.name) || '' })
      }).then(function(){ toast(v.trim() ? '已改名' : '已恢复原名', 'ok'); render(); })
        .catch(function(e){ toast('改名失败：' + e.message, 'err'); });
    };
  });
}

// showImportBackup 导入凭据备份
function showImportBackup(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      api('/api/accounts/import', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: reader.result
      }).then(function(r){ if(r && r.msg){ toast(r.msg, 'ok'); render(); } })
        .catch(function(e){ toast('导入失败：' + e.message, 'err'); });
    };
    reader.readAsText(f);
  };
  inp.click();
}

// confirmDialog 二次确认
function confirmDialog(title, html, okText, onOk){
  openModal(title, '<div style="line-height:1.9">' + html + '</div>', function(root){
    var body = root.querySelector('.dialog__body');
    body.insertAdjacentHTML('beforeend',
      '<div style="display:flex;gap:10px;margin-top:18px">'
      + '<button class="btn" id="cdCancel" style="flex:1;justify-content:center">取消</button>'
      + '<button class="btn btn--primary" id="cdOk" style="flex:1;justify-content:center">' + esc(okText || '确定') + '</button>'
      + '</div>');
    root.querySelector('#cdCancel').onclick = closeModal;
    root.querySelector('#cdOk').onclick = function(){ closeModal(); onOk(); };
  });
}


// ===== 页面：安装向导 =====
function renderWizard(c){
  c.innerHTML = loading("正在检查环境…");
  api("/api/setup/check").then(function(st){
    var icons = { ok: "✓", warn: "!", error: "✕" };
    var items = (st.checks || []).map(function(x){
      return "<div class=\"check-item\">"
        + "<div class=\"check-item__icon " + x.level + "\">" + (icons[x.level] || "?") + "</div>"
        + "<div class=\"check-item__body\">"
        +   "<div class=\"check-item__name\">" + esc(x.name) + "</div>"
        +   "<div class=\"check-item__detail\">" + esc(x.detail) + "</div>"
        +   (x.hint ? "<div class=\"check-item__hint\">提示：" + esc(x.hint) + "</div>" : "")
        + "</div></div>";
    }).join("");

    // 步骤条
    //
    // ⚠️ 用户反馈（2026-09-18）：登录成功后背景还显示欢迎向导，很乱。
    //
    // 原因：向导文案一直是「欢迎使用 MiCam」，
    //       即使已经有账号了也还是这段欢迎词 + 环境检查列表。
    //
    // 修法：向导阶段化 —— 头部文案和内容跟着阶段走：
    //       阶段 1（无账号）  -> 欢迎 + 扫码
    //       阶段 2（有账号无设备）-> 获取设备
    //       阶段 3（有设备）  -> 开始使用
    var hasAcc = !!st.hasAccounts;
    var hasDev = (st.deviceCount || 0) > 0;
    var wizTitle, wizSub;
    if (!hasAcc){
      wizTitle = "欢迎使用 MiCam";
      wizSub = "在飞牛 NAS 上接入智能摄像头";
    } else if (!hasDev){
      wizTitle = "账号已登录";
      wizSub = "接下来获取该账号下的摄像头";
    } else {
      wizTitle = "一切就绪";
      wizSub = "已发现 " + st.deviceCount + " 台摄像头";
    }

    var step1 = hasAcc ? "done" : "active";
    var step2 = hasAcc && hasDev ? "done" : (hasAcc ? "active" : "");
    var step3 = hasDev ? "active" : "";

    var actions = "";
    if (!hasAcc){
      actions = "<button class=\"btn btn--primary\" id=\"wzQR\">" + icon("qr",14) + "扫码添加账号</button>";
    } else if (st.deviceCount === 0){
      actions = "<button class=\"btn btn--primary\" id=\"wzRefresh\">" + icon("refresh",14) + "获取设备</button>";
    } else {
      actions = "<button class=\"btn btn--primary\" id=\"wzGo\">" + icon("play",14) + "开始使用</button>";
    }
    actions += "<button class=\"btn\" id=\"wzRepair\">" + icon("set",14) + "一键修复</button>";
    actions += "<button class=\"btn\" id=\"wzRecheck\">" + icon("refresh",14) + "重新检查</button>";

    c.innerHTML = "<div class=\"wizard\">"
      + "<div class=\"card\">"
      +   "<div class=\"wizard__hero\">"
      +     "<div class=\"wizard__logo\">" + icon("camera", 32) + "</div>"
      +     "<h2>" + wizTitle + "</h2>"
      +     "<p>" + wizSub + "</p>"
      +   "</div>"
      +   "<div class=\"wizard__steps\">"
      +     "<div class=\"wizard-step " + step1 + "\"><div class=\"wizard-step__num\">1</div><div class=\"wizard-step__label\">登录账号</div></div>"
      +     "<div class=\"wizard-step " + step2 + "\"><div class=\"wizard-step__num\">2</div><div class=\"wizard-step__label\">发现设备</div></div>"
      +     "<div class=\"wizard-step " + step3 + "\"><div class=\"wizard-step__num\">3</div><div class=\"wizard-step__label\">开始使用</div></div>"
      +   "</div>"
      +   "<div class=\"check-list\">" + items + "</div>"
      +   "<div class=\"wizard__actions\">" + actions + "</div>"
      + "</div></div>";

    var go = document.getElementById("wzGo");
    if (go) go.onclick = function(){ page = "devices"; setPageTitle("设备列表"); renderMenu(); render(); };
    var qr = document.getElementById("wzQR");
    if (qr) qr.onclick = showQR;
    var rf = document.getElementById("wzRefresh");
    if (rf) rf.onclick = function(){
      toast("正在获取设备…");
      api('/api/devices/cloud?refresh=1').then(function(d){
        var n = ((d && d.devices) || []).length;
        toast(n > 0 ? ("找到 " + n + " 台设备") : "该账号下没有摄像头", n > 0 ? "ok" : "warn");
        renderWizard(c);
      });
    };
    document.getElementById("wzRecheck").onclick = function(){ renderWizard(c); };
    document.getElementById("wzRepair").onclick = function(){
      toast("正在修复…");
      api("/api/setup/repair", { method: "POST" }).then(function(r){
        var msg = (r.fixed || []).join("；") || "无需修复";
        if (r.failed && r.failed.length) msg += " | 失败：" + r.failed.join("；");
        toast(msg, r.ok ? "ok" : "err");
        setTimeout(function(){ renderWizard(c); }, 1500);
      });
    };
  }).catch(function(e){
    c.innerHTML = "<div class=\"card\">" + empty("close", "检查失败", e.message, "") + "</div>";
  });
}

var devDetailOpen = false;

var DEV_TABS = [

  { k:'verboseLog', t:'详细日志',        d:'记录凭据申请、连接生命周期等细节' },

];

function stopDevTimers(){
  if(devLogTimer){ clearInterval(devLogTimer); devLogTimer = null; }
}

function renderDev(c){
  if(!DEV_UNLOCKED){
    c.innerHTML = '<div class="page__inner"><div class="card">'
      + empty('close','开发者模式未开启','连续点击左下角版本号 7 次解锁','')
      + '</div></div>';
    return;
  }
  stopDevTimers();
  c.innerHTML = '<div class="page__inner">' + loading('加载开发者信息…') + '</div>';
  Promise.all([
    api('/api/dev/status'),
    api('/api/dev/tokens').catch(function(){ return { items: [] }; }),
    api('/api/dev/logs?limit=50').catch(function(){ return { items: [] }; }),
    api('/api/dev/stats?days=' + devStatDays).catch(function(){ return null; })
  ]).then(function(res){
    devSt = res[0] || {};
    devTokens = (res[1] && res[1].items) || [];
    devLogs = (res[2] && res[2].items) || [];
    devStats = res[3];
    paintDev(c);
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderDev(c); }) + '</div>';
  });
}

function devSubtitle(){
  var hit = DEV_TABS.filter(function(x){ return x[0] === devTab; })[0];
  return hit ? hit[2] : '';
}

function paintDev(c){
  c.innerHTML = '<div class="page__inner">'

    + '<div class="list-head">'
    +   '<div class="list-head__main">'
    +     '<h1 class="list-head__title">开发者</h1>'
    +     '<div class="list-head__en" id="devSub">开放能力，让更多应用与 MiCam 连接。</div>'
    +   '</div>'
    +   '<div class="list-head__acts">'
    +     '<span class="chip is-active"><span class="status-dot is-online"></span>开发者模式已开启</span>'
    +     '<span class="chip">v' + esc(devVersion()) + '</span>'
    +   '</div>'
    + '</div>'

    + '<div class="tabs-line" id="devTabs">'
    + DEV_TABS.map(function(x){
        return '<button class="tabline' + (devTab === x[0] ? ' is-active' : '') + '" data-dtab="' + x[0] + '">' + esc(x[1]) + '</button>';
      }).join('')
    + '</div>'

    + '<div id="devBody"></div>'
    + '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('#devTabs .tabline'), function(b){
    b.onclick = function(){
      devTab = this.dataset.dtab;
      syncRouteToUrl();
      stopDevTimers();
      devLogAutoOn = false;
      paintDev(c);
    };
  });
  paintDevBody();
}

function paintDevBody(){
  var box = document.getElementById('devBody');
  if(!box) return;
  if(devTab === 'overview'){ box.innerHTML = devOverviewHTML(); bindDevOverview(); }
  else if(devTab === 'docs'){ box.innerHTML = devDocsTab(); bindDevDocs(); }
  else if(devTab === 'tokens'){ box.innerHTML = devTokensTab(); bindDevTokens(); }
  else if(devTab === 'logs'){ box.innerHTML = devLogsTab(); bindDevLogs(); }
  else if(devTab === 'stats'){ box.innerHTML = devStatsTab(); bindDevStats(); }
  else if(devTab === 'webhook'){ box.innerHTML = devWebhookTab(); bindDevWebhook(); }
  else { box.innerHTML = devDiagTab(); bindDevDiag(); }
}

function devTokenTable(list){

    return '<div class="dev-empty">' + icon('lock',20)
      + '<div>还没有 API Token</div>'

function devKpis(t, d){
  var items = [
    { k:'total', l:'总请求',   v:devNum(t.total),    dv:d && d.total, bad:false },
    { k:'ok',    l:'成功',     v:devNum(t.ok),       dv:d && d.ok,    bad:false },
    { k:'fail',  l:'失败',     v:devNum(t.fail),     dv:d && d.fail,  bad:true  },
    { k:'avgMs', l:'平均耗时', v:(t.avgMs || 0) + ' ms', dv:d && d.avgMs, bad:true }
  ];
  return '<div class="dev-kpis">'
    + items.map(function(x){
        var cls = 'dev-kpi__delta';
        if(x.dv === null || x.dv === undefined) cls += ' is-flat';
        else if(x.dv > 0) cls += x.bad ? ' is-down' : ' is-up';
        else if(x.dv < 0) cls += x.bad ? ' is-up' : ' is-down';
        else cls += ' is-flat';
        return '<div class="dev-kpi">'
          + '<div class="dev-kpi__label">' + esc(x.l) + '</div>'
          + '<div class="dev-kpi__value">' + x.v + '</div>'
          + '<div class="' + cls + '">' + devDeltaText(x.dv) + '</div>'
          + '</div>';
      }).join('')
    + '</div>';
}

function devDeltaText(v){
  if(v === null || v === undefined) return '较上期 —';
  if(Math.abs(v) < 0.05) return '较上期 持平';
  return '较上期 ' + (v > 0 ? '↑' : '↓') + Math.abs(v).toFixed(1) + '%';
}

function devStatRange(series){
  if(!series || !series.length) return '暂无数据';
  var a = series[0].date.slice(5).replace('-', '/');
  var b = series[series.length - 1].date.slice(5).replace('-', '/');
  return a + ' — ' + b;
}

function devChart(series){
  if(!series || !series.length){
    return '<div class="dev-chart__empty">' + icon('chart',24) + '<div>还没有统计数据</div>'
      + '<div class="dev-chart__empty-sub">请求发生后会自动按天累计</div></div>';
  }
  var W = 600, H = 180, PL = 46, PR = 14, PT = 14, PB = 26;
  var max = 1;
  series.forEach(function(d){ if((d.total || 0) > max) max = d.total; });
  var step = (W - PL - PR) / Math.max(1, series.length - 1);
  var pts = series.map(function(d, i){
    var x = PL + i * step;
    var y = PT + (H - PT - PB) * (1 - (d.total || 0) / max);
    return { x: x, y: y, d: d };
  });

  // 生成平滑贝塞尔曲线 (Cubic Bezier Spline)
  var pathD = '';
  var areaD = '';
  if(pts.length === 1){
    pathD = 'M ' + PL + ',' + pts[0].y.toFixed(1) + ' L ' + (W - PR) + ',' + pts[0].y.toFixed(1);
    areaD = 'M ' + PL + ',' + (H - PB) + ' L ' + PL + ',' + pts[0].y.toFixed(1) + ' L ' + (W - PR) + ',' + pts[0].y.toFixed(1) + ' L ' + (W - PR) + ',' + (H - PB) + ' Z';
  } else {
    pathD = 'M ' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
    for(var i = 0; i < pts.length - 1; i++){
      var p0 = i > 0 ? pts[i - 1] : pts[i];
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var p3 = (i + 2 < pts.length) ? pts[i + 2] : p2;
      var cp1x = p1.x + (p2.x - p0.x) / 6;
      var cp1y = p1.y + (p2.y - p0.y) / 6;
      var cp2x = p2.x - (p3.x - p1.x) / 6;
      var cp2y = p2.y - (p3.y - p1.y) / 6;
      pathD += ' C ' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) + ' ' + cp2x.toFixed(1) + ',' + cp2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1);
    }
    areaD = 'M ' + pts[0].x.toFixed(1) + ',' + (H - PB) + ' L ' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1)
      + pathD.slice(pathD.indexOf(' C '))
      + ' L ' + pts[pts.length - 1].x.toFixed(1) + ',' + (H - PB) + ' Z';
  }

  var grid = '';
  for(var g = 0; g <= 3; g++){
    var gy = PT + (H - PT - PB) * g / 3;
    grid += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + gy.toFixed(1) + '" class="dev-chart__grid"/>'
      + '<text x="' + (PL - 8) + '" y="' + (gy + 3).toFixed(1) + '" class="dev-chart__ylab" text-anchor="end">'
      + Math.round(max * (1 - g / 3)) + '</text>';
  }
  var xlab = series.map(function(d, i){
    var x = PL + i * step;
    return '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" class="dev-chart__xlab" text-anchor="middle">'
      + esc(d.date.slice(5).replace('-', '/')) + '</text>';
  }).join('');

  var dots = pts.map(function(p){
    var tip = p.d.date + '：' + (p.d.total || 0) + ' 次请求（成功 ' + (p.d.ok || 0) + '，失败 ' + (p.d.fail || 0) + '）';
    return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5" class="dev-chart__dot"><title>' + esc(tip) + '</title></circle>';
  }).join('');

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="dev-chart__svg">'
    + '<defs>'
    +   '<linearGradient id="devChartGrad" x1="0" y1="0" x2="0" y2="1">'
    +     '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>'
    +     '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>'
    +   '</linearGradient>'
    + '</defs>'
    + grid
    + '<path d="' + areaD + '" fill="url(#devChartGrad)"/>'
    + '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots
    + xlab
    + '</svg>';
}

function devDownload(path, filename){
  var a = document.createElement('a');

// devRenderMarkdown 极简 Markdown 渲染（零依赖、无构建步骤）
//
// 只覆盖 /api/dev/docs 实际用到的语法：标题(#~####)、4 空格缩进代码块、
// 无序列表、分隔线、段落，以及行内 **粗体** / 反引号 code / 链接。
// 返回 { html, toc }，toc 供左侧目录使用。
// devMdCells 把一行表格拆成单元格
function devMdCells(line){
  var s = String(line).trim();
  if(s.charAt(0) === '|') s = s.slice(1);
  if(s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
  return s.split('|').map(function(x){ return x.trim(); });
}

function devRenderMarkdown(md){
  var lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
  var out = [], toc = [], i = 0, slug = 0;
  var BT = String.fromCharCode(96);

  function inline(s){
    return esc(s)
      // 文档里偶发字面 \n（生成脚本拼接产物）：当换行处理，别原样显示
      .replace(/\\n/g, '<br>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(new RegExp(BT + '([^' + BT + ']+)' + BT, 'g'), '<code class="dev-md-code">$1</code>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  while (i < lines.length){
    var ln = lines[i];

    // 围栏代码块（新版文档用）
    if (/^\s*```/.test(ln)){
      var fbuf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])){ fbuf.push(lines[i]); i++; }
      i++;
      out.push('<pre class="dev-md-pre">' + esc(fbuf.join('\n')) + '</pre>');
      continue;
    }

    // 表格：连续以 | 开头的行（下一行是分隔行才算）
    if (/^\s*\|/.test(ln) && /^\s*\|?[\s:|-]+\|\s*$/.test(lines[i + 1] || '')){
      var head = devMdCells(ln);
      var trows = [];
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])){ trows.push(devMdCells(lines[i])); i++; }
      out.push('<div class="dev-md-tablewrap"><table class="table dev-md-table"><thead><tr>'
        + head.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + trows.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('')
        + '</tbody></table></div>');
      continue;
    }

    // 引用块
    if (/^\s*>/.test(ln)){
      var qbuf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){ qbuf.push(lines[i].replace(/^\s*> ?/, '')); i++; }
      out.push('<blockquote class="dev-md-quote">' + qbuf.map(function(x){ return '<div>' + inline(x) + '</div>'; }).join('') + '</blockquote>');
      continue;
    }

    // 有序列表
    if (/^\d+[.)]\s/.test(ln)){
      var oitems = [];
      while (i < lines.length && /^\d+[.)]\s/.test(lines[i])){ oitems.push('<li>' + inline(lines[i].replace(/^\d+[.)]\s/, '')) + '</li>'); i++; }
      out.push('<ol class="dev-md-ol">' + oitems.join('') + '</ol>');
      continue;
    }

    // 4 空格缩进代码块（旧版文档用）
    if (/^ {4}\S/.test(ln)){
      var code = [];
      while (i < lines.length && (/^ {4}/.test(lines[i]) || lines[i].trim() === '')){
        if (lines[i].trim() === '' && !/^ {4}\S/.test(lines[i + 1] || '')) break;
        code.push(lines[i].replace(/^ {4}/, ''));
        i++;
      }
      out.push('<pre class="dev-md-pre">' + esc(code.join('\n')) + '</pre>');
      continue;
    }

    var h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h){
      var lv = h[1].length, txt = h[2].trim(), id = 'devmd' + (++slug);
      if (lv === 2 || lv === 3) toc.push({ level: lv, text: txt, id: id });
      out.push('<h' + (lv + 1) + ' class="dev-md-h dev-md-h' + lv + '" id="' + id + '">' + inline(txt) + '</h' + (lv + 1) + '>');
      i++;
      continue;
    }

    if (/^- /.test(ln)){
      var items = [];
      while (i < lines.length && /^- /.test(lines[i])){
        items.push('<li>' + inline(lines[i].slice(2)) + '</li>');
        i++;
      }
      out.push('<ul class="dev-md-ul">' + items.join('') + '</ul>');
      continue;
    }

    if (/^---+\s*$/.test(ln)){ out.push('<hr class="dev-md-hr">'); i++; continue; }
    if (ln.trim() === ''){ i++; continue; }

    var para = [ln];
    i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,4}\s| {4}\S|- |---+\s*$)/.test(lines[i])){
      para.push(lines[i]);
      i++;
    }
    out.push('<p class="dev-md-p">' + inline(para.join(' ')) + '</p>');
  }
  return { html: out.join('\n'), toc: toc };
}

// devRenderRefInto 把 OpenAPI 规格渲染成「可展开的接口参考」
function devRenderRefInto(spec){
  var box = document.getElementById('devApiList');
  if(!box) return;
  var ps = spec.paths || {}, groups = {}, order = [];
  devRefFlat = [];
  Object.keys(ps).forEach(function(p){
    Object.keys(ps[p]).forEach(function(m){
      var op = ps[p][m] || {};
      var tag = (op.tags && op.tags[0]) || '其它';
      if(!groups[tag]){ groups[tag] = []; order.push(tag); }
      var idx = devRefFlat.length;
      op.__path = '/api' + p;
      devRefFlat.push(op);
      groups[tag].push({ m: m.toUpperCase(), p: '/api' + p, t: op.summary || '', idx: idx });
    });
  });

  box.innerHTML = order.map(function(tag){
    return '<div class="dev-api-group">'
      + '<div class="dev-api-group__head">' + esc(tag) + '<em>' + groups[tag].length + '</em></div>'
      + groups[tag].map(function(e){
          var q = (e.m + ' ' + e.p + ' ' + e.t).toLowerCase();
          return '<div class="dev-ref-item" data-gsearch="' + esc(q) + '">'
            + '<button class="dev-ref-item__head" data-refopen="' + e.idx + '">'
            +   '<span class="api-method ' + (e.m === 'GET' ? 'is-get' : 'is-post') + '">' + esc(e.m) + '</span>'
            +   '<span class="api-path">' + esc(e.p) + '</span>'
            +   '<span class="dev-ref-item__summary">' + esc(e.t) + '</span>'
            +   icon('chevron-down',14)
            + '</button>'
            + '<div class="dev-ref-item__body hidden" id="devref-' + e.idx + '"></div>'
            + '</div>';
        }).join('')
      + '</div>';
  }).join('');

  var cnt = document.getElementById('devRefCount');
  if(cnt) cnt.textContent = devRefFlat.length + ' 个接口';

  Array.prototype.forEach.call(box.querySelectorAll('[data-refopen]'), function(b){
    b.onclick = function(){ devToggleRef(this.dataset.refopen); };
  });
  var s = document.getElementById('devApiSearch');
  if(s) s.oninput = function(){ devFilterRef(this.value); };
}

// devToggleRef 展开某个接口：说明 + 参数表 + 响应示例 + 调用
function devToggleRef(idx){
  var body = document.getElementById('devref-' + idx);
  if(!body) return;
  var item = body.parentNode;
  if(!body.classList.contains('hidden')){
    body.classList.add('hidden');
    if(item) item.classList.remove('is-open');
    return;
  }
  if(item) item.classList.add('is-open');
  var op = devRefFlat[Number(idx)] || {};
  var params = op.parameters || [];
  var html = '';
  if(op.description) html += '<p class="dev-md-p">' + esc(op.description) + '</p>';
  if(params.length){
    html += '<div class="dev-ref-params"><div class="dev-ref-params__title">参数</div>'
      + '<table class="table"><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody>'
      + params.map(function(pa){
          return '<tr><td class="dev-md-code">' + esc(pa.name || '') + '</td>'
            + '<td>' + esc(pa.in || '') + '</td>'
            + '<td>' + esc((pa.schema && pa.schema.type) || 'string') + '</td>'
            + '<td>' + (pa.required ? '是' : '否') + '</td>'
            + '<td>' + esc(pa.description || '') + '</td></tr>';
        }).join('')
      + '</tbody></table></div>';
  } else {
    html += '<div class="dev-hint">该接口没有查询参数。</div>';
  }
  var resp = (op.responses && op.responses['200'] && op.responses['200'].description) || '';
  html += '<div class="dev-ref-resp__title">响应</div>' + devDocPath(resp);
  html += '<div class="dev-ref-item__acts">'
    + '<button class="btn btn--sm btn--primary" data-refcall="' + idx + '">' + icon('play',13) + '调用这个接口</button>'
    + '</div><div id="devrefres-' + idx + '"></div>';
  body.innerHTML = html;
  body.classList.remove('hidden');
  var cb = body.querySelector('[data-refcall]');
  if(cb) cb.onclick = function(){ callEndpoint({ m: 'GET', p: devRefPath(Number(this.dataset.refcall)), t: '' }, 'devrefres-' + this.dataset.refcall); };
}

// callEndpoint 请求一个接口并把结果显示出来。
//
// 不能直接用 api()（它只做 r.json()）：参考手册里有图片接口（thumb/frame）、
// 文本接口（HLS 的 m3u8）、文件接口（download），一律按 content-type 分开处理，
// 否则点「调用」会报 "Unexpected non-whitespace character after JSON"。
function callEndpoint(e, outId){
  var out = document.getElementById(outId || 'devResult');
  if(out) out.innerHTML = loading('请求 ' + e.p + ' …');
  var t0 = Date.now();
  fetch(apiUrl(e.p)).then(function(r){
    var ct = r.headers.get('content-type') || '';
    return r.text().then(function(txt){ return { status: r.status, ct: ct, txt: txt, ms: Date.now() - t0 }; });
  }).then(function(res){
    if(!out) return;
    var ct = res.ct.split(';')[0] || '';
    var body;
    if(ct.indexOf('image/') === 0){
      body = '<div class="dev-note dev-note--tight">图片响应（约 ' + Math.round((res.txt || '').length / 1024) + ' KB），这里不渲染图片</div>';
    } else if(ct.indexOf('json') >= 0){
      var pretty;
      try { pretty = JSON.stringify(JSON.parse(res.txt), null, 2); } catch(err2){ pretty = res.txt; }
      if(pretty.length > 3000) pretty = pretty.slice(0, 3000) + '\n… （已截断）';
      body = '<div class="diag-result">' + esc(pretty) + '</div>';
    } else {
      var t = res.txt || '（空响应）';
      if(t.length > 1200) t = t.slice(0, 1200) + '\n… （已截断）';
      body = '<div class="diag-result">' + esc(t) + '</div>';
    }
    out.innerHTML = '<div class="dev-wh__head">'
      + '<span class="badge ' + (res.status < 400 ? 'badge--ok' : 'badge--danger') + '">HTTP ' + res.status + '</span>'
      + '<span class="dev-hint">' + res.ms + ' ms · ' + esc(ct || '未知类型') + '</span></div>'
      + body;
  }).catch(function(err){
    if(out) out.innerHTML = '<div class="dev-err">请求失败：' + esc(err.message) + '</div>';
  });
}

function devTokenMenu(id){
  var t = devTokens.filter(function(x){ return x.id === id; })[0];
  if(!t) return;
  openModal('Token：' + t.name,
    '<div class="ev-menu">'
    + '<button class="ev-menu__item" data-tokact="toggle">' + icon(t.enabled ? 'close' : 'check',15) + (t.enabled ? '禁用该 Token' : '启用该 Token') + '</button>'
    + '<button class="ev-menu__item" data-tokact="copy">' + icon('copy',15) + '复制前缀 ' + esc(t.prefix) + '…</button>'
    + '<button class="ev-menu__item is-danger" data-tokact="del">' + icon('trash',15) + '删除该 Token</button>'
    + '</div>',
    function(root){
      Array.prototype.forEach.call(root.querySelectorAll('[data-tokact]'), function(x){
        x.onclick = function(){
          var a = this.dataset.tokact;
          if(a === 'toggle'){
            api('/api/dev/tokens', {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: id, enabled: !t.enabled })
            }).then(function(r){
              if(r && r.msg){ toast(r.msg, 'err'); return; }
              closeModal(); toast(t.enabled ? '已禁用' : '已启用', 'ok'); devReloadTokens();

          } else if(a === 'copy'){
            copyText(t.prefix, '前缀已复制');
          } else {
            closeModal();
            if(!confirm('删除 Token「' + t.name + '」？使用它的第三方会立即失效。')) return;
            api('/api/dev/tokens?id=' + encodeURIComponent(id), { method: 'DELETE' }).then(function(r){
              if(r && r.msg){ toast(r.msg, 'err'); return; }
              toast('已删除', 'ok'); devReloadTokens();

          }
        };

// copyText 复制文本。
//
// 注意：局域网是 http 访问，**不是安全上下文**，
// navigator.clipboard 在 http://192.168.x.x 下是 undefined，
// 所以必须保留 execCommand 回退，否则复制按钮在真实环境里全废。
function copyText(txt, okMsg){
  var ok = function(){ toast(okMsg || '已复制', 'ok'); };
  var bad = function(){ toast('复制失败，请手动选择文本', 'err'); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){
      if(devCopyFallback(txt)) ok(); else bad();
    });
    return;
  }
  if(devCopyFallback(txt)) ok(); else bad();
}

function devCopyFallback(txt){
  try{
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){
    return false;
  }
}

function p2(n){ return (n < 10 ? '0' : '') + n; }

function devDate(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
}

function devClock(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
}

function devAgo(iso){
  if(!iso) return '从未';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '从未';
  var s = (Date.now() - d.getTime()) / 1000;
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if(s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

function devNum(n){
  n = n || 0;
  return n.toLocaleString('zh-CN');
}

// bindMiotPanel 官方通道面板（设置 → 官方通道）。
//
// 流程：点「扫码授权」→ POST /api/miot/qr → 显示二维码
//      → 轮询 /api/miot/qr/status → 成功即完成（后端自动换 token）
function bindMiotPanel(){
  var bind = document.getElementById('miotBind');
  var box  = document.getElementById('miotQrBox');
  var img  = document.getElementById('miotQrImg');
  var st   = document.getElementById('miotQrState');
  var lib  = document.getElementById('miotLib');
  var badge= document.getElementById('miotState');
  var timer = null;

  function stopPoll(){ if(timer){ clearInterval(timer); timer = null; } }

  function refreshState(){
    api('/api/miot/status').then(function(d){
      if(!d) return;
      var cardBadge = document.getElementById('miotCardBadge');
      var expVal = document.getElementById('miotExpireVal');
      var libVal = document.getElementById('miotLibVal');

      if(libVal){
        libVal.innerHTML = d.libAvailable
          ? '<span style="color:#22c55e">✓ 已就绪</span>'
          : '<span style="color:var(--destructive)">✗ 未找到</span>';
      }
      if(expVal){
        expVal.textContent = d.expiresAt ? (d.expiresAt + ' (' + Math.round(d.expiresInMin/60) + ' 小时后)') : (d.bound ? '长期有效' : '未授权');
      }

      if(badge){
        if(d.bound){
          badge.textContent = '已授权' + (d.expiresInMin > 0 ? ' (' + Math.round(d.expiresInMin/60) + 'h)' : '');
          if(cardBadge) cardBadge.className = 'miot-card__badge is-ok';
        } else {
          badge.textContent = '未授权';
          if(cardBadge) cardBadge.className = 'miot-card__badge';
        }
      }
      if(d.bound && bind){ bind.textContent = '重新授权'; }
    }).catch(function(){});
  }

  var refBtn = document.getElementById('miotRefreshBtn');
  if(refBtn){
    refBtn.onclick = function(){
      refBtn.disabled = true;
      api('/api/miot/refresh', { method:'POST' }).then(function(r){
        refBtn.disabled = false;
        toast(r.ok ? '官方通道凭据已成功续期！' : (r.msg || '续期失败'), r.ok ? 'ok' : 'err');
        refreshState();
      }).catch(function(e){
        refBtn.disabled = false;
        toast('续期失败：' + e.message, 'err');
      });
    };
  }

  function poll(){
    api('/api/miot/qr/status').then(function(d){
      if(!d) return;
      if(d.state === 'success' && d.bound){
        stopPoll();
        if(st) st.innerHTML = '<span style="color:#4ade80">✅ 授权成功！</span>';
        toast('官方通道授权成功，实时画面将走此通道', 'ok');
        setTimeout(function(){ if(box) box.style.display = 'none'; refreshState(); }, 1500);
      } else if(d.state === 'failed'){
        stopPoll();
        if(st) st.innerHTML = '<span style="color:var(--destructive)">✗ ' + esc(d.err || '扫码失败') + '</span>';
      } else if(d.state === 'success'){
        if(st) st.textContent = '登录成功，正在换取授权…';
      }
    }).catch(function(){});
  }

  if(bind) bind.onclick = function(){
    bind.disabled = true;
    api('/api/miot/qr', { method:'POST' }).then(function(r){
      bind.disabled = false;
      if(!r || !r.qrBase64){ toast((r && r.msg) || '发起扫码失败', 'err'); return; }
      if(img) img.src = r.qrBase64;
      if(box) box.style.display = 'block';
      if(st) st.textContent = '等待扫码…';
      stopPoll();
      timer = setInterval(poll, 2000);
      poll();
    }).catch(function(e){ bind.disabled = false; toast('发起扫码失败：' + e.message, 'err'); });
  };

  var cancel = document.getElementById('miotQrCancel');
  if(cancel) cancel.onclick = function(){
    stopPoll();
    api('/api/miot/qr/cancel', { method:'POST' }).catch(function(){});
    if(box) box.style.display = 'none';
  };

  var autoBtn = document.getElementById('miotAutoAuth');
  if(autoBtn){
    autoBtn.onclick = function(){
      autoBtn.disabled = true;
      toast('正在同步已登录小米账号进行官方授权…', 'ok');
      api('/api/miot/auto-auth', { method:'POST' }).then(function(r){
        autoBtn.disabled = false;
        if(r && r.ok){
          toast(r.msg || '一键同步授权成功！官方通道已激活', 'ok');
          refreshState();
        } else {
          toast('一键授权未成功: ' + ((r && r.error) || '请尝试扫码或网页授权'), 'warn');
        }
      }).catch(function(e){
        autoBtn.disabled = false;
        toast('一键授权失败: ' + e.message, 'err');
      });
    };
  }

  var webBtn = document.getElementById('miotWebAuth');
  var webBox = document.getElementById('miotWebBox');
  var webOpen = document.getElementById('miotWebOpenBtn');
  var webSubmit = document.getElementById('miotWebSubmit');
  var webCancel = document.getElementById('miotWebCancel');
  var webInput = document.getElementById('miotWebPayload');
  if(webBtn){
    webBtn.onclick = function(){
      api('/api/miot/bind').then(function(r){
        if(!r || !r.authUrl){ toast('获取授权 URL 失败', 'err'); return; }
        if(webOpen) webOpen.href = r.authUrl;
        if(box) box.style.display = 'none';
        if(webBox) webBox.style.display = 'block';
      }).catch(function(e){ toast('获取授权链接失败: ' + e.message, 'err'); });
    };
  }
  if(webCancel) webCancel.onclick = function(){ if(webBox) webBox.style.display = 'none'; };
  if(webSubmit) webSubmit.onclick = function(){
    var val = webInput ? webInput.value.trim() : '';
    if(!val){ toast('请粘贴授权信息或回调 URL', 'warn'); return; }
    var payload = val;
    var code = '', state = '';
    if(val.indexOf('code=') >= 0){
      try {
        var u = new URL(val);
        code = u.searchParams.get('code') || '';
        state = u.searchParams.get('state') || '';
      } catch(e){
        var m = val.match(/code=([^&]+)/);
        if(m) code = m[1];
        var ms = val.match(/state=([^&]+)/);
        if(ms) state = ms[1];
      }
    }
    webSubmit.disabled = true;
    api('/api/miot/authorize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ payload: payload, code: code, state: state })
    }).then(function(r){
      webSubmit.disabled = false;
      if(r && r.ok){
        toast(r.msg || '授权成功！官方通道已激活', 'ok');
        if(webBox) webBox.style.display = 'none';
        refreshState();
      } else {
        toast('提交失败: ' + ((r && r.error) || '未知错误'), 'err');
      }
    }).catch(function(e){
      webSubmit.disabled = false;
      toast('提交失败: ' + e.message, 'err');
    });
  };

  var un = document.getElementById('miotUnbind');
  if(un) un.onclick = function(){
    if(!confirm('解除官方通道授权？\n\n解除后实时画面会退回旧通道（可能被限流）。')) return;
    api('/api/miot/unbind', { method:'POST' }).then(function(){
      toast('已解除授权', 'ok'); refreshState();
    }).catch(function(e){ toast('解除失败：' + e.message, 'err'); });
  };

  refreshState();
}

// bindSetMain 绑定中间内容里的控件
function bindSetMain(){
  var box = document.getElementById('setMain');
  if(!box) return;

  // 单选 + 开关 + 下拉：改动即保存
  Array.prototype.forEach.call(box.querySelectorAll('input[type=radio]'), function(r){
    r.onchange = function(){
      var body = {};
      if(this.name === 'uiTheme') {
        body.theme = this.value;
        if(window.__micamApplyTheme) window.__micamApplyTheme(this.value, true);
      }
      else if(this.name === 'uiTime') body.timeFormat = this.value;
      if(Object.keys(body).length) saveUI(body);
    };
  });

  var lang = document.getElementById('uiLang');
  if(lang) lang.onchange = function(){ saveUI({ language: this.value }); };
  var q = document.getElementById('uiQuality');
  if(q) q.onchange = function(){ saveUI({ defaultQuality: this.value }); };
  var pr = document.getElementById('uiProto');
  if(pr) pr.onchange = function(){ saveUI({ defaultProtocol: this.value }); };
  var ev = document.getElementById('uiEvView');
  if(ev) ev.onchange = function(){ saveUI({ eventsDefaultView: this.value }); };
  var sc = document.getElementById('uiSched');
  if(sc) sc.onchange = function(){ saveUI({ recordSchedule: this.value }); };

  var swMap = {
    uiAutoplay:'autoplayLive', uiMute:'autoplayMute',
    uiHomeCam:'homeShowCameras', uiHomeEv:'homeShowEvents', uiHomeSt:'homeShowStorage',
    uiEnAlias:'showEnglishAlias', uiCompact:'compactMode',
    uiLoop:'loopOverwrite', uiPush:'pushEnabled', uiEmail:'emailEnabled',
    uiAutoUpd:'autoUpdate',
  };
  Object.keys(swMap).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){
      var b = {}; b[swMap[id]] = this.checked; saveUI(b);
    };
  });

  // 数字输入：失焦保存
  [['uiKeep','keepDays'],['uiSeg','segmentSec'],['uiThresh','thresholdPct']].forEach(function(x){
    var el = document.getElementById(x[0]);
    if(el) el.onchange = function(){
      var v = parseInt(this.value, 10);
      if(!v) return;
      if(x[1] === 'keepDays'){ saveUI({ keepDays: v }); return; }
      // 分片/阈值走录像配置
      api('/api/recordings/config', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(x[1] === 'segmentSec' ? { segmentSec: v } : {}) })
        .then(function(){ toast('已保存', 'ok'); }).catch(function(e){ toast(e.message, 'err'); });
    };
  });

  // 免打扰
  ['uiQuietFrom','uiQuietTo'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){
      saveUI({ quietFrom: (document.getElementById('uiQuietFrom')||{}).value,
               quietTo:   (document.getElementById('uiQuietTo')||{}).value });
    };
  });

  // 通知相关
  var ne = document.getElementById('ntEnabled');
  if(ne) ne.onchange = function(){ saveNotify({ enabled: this.checked }); };
  var nw = document.getElementById('ntWebhook');
  if(nw) nw.onchange = function(){ saveNotify({ webhook: this.value }); };
  Array.prototype.forEach.call(box.querySelectorAll('[data-ev]'), function(cb){
    cb.onchange = function(){
      var evs = [];
      Array.prototype.forEach.call(box.querySelectorAll('[data-ev]'), function(x){
        if(x.checked) evs.push(x.dataset.ev);
      });
      saveNotify({ events: evs });
    };
  });
  // 录像模式卡片切换
  Array.prototype.forEach.call(box.querySelectorAll('[data-mode]'), function(card){
    card.onclick = function(){
      var m = this.dataset.mode;
      if(setRecCfg) setRecCfg.mode = m;
      Array.prototype.forEach.call(box.querySelectorAll('[data-mode]'), function(c){ c.classList.remove('is-active'); });
      this.classList.add('is-active');
    };
  });

  // 存储上限快捷胶囊
  Array.prototype.forEach.call(box.querySelectorAll('#recMaxPills [data-val]'), function(btn){
    btn.onclick = function(){
      var inp = document.getElementById('recMaxGB');
      if(inp) inp.value = this.dataset.val;
      Array.prototype.forEach.call(box.querySelectorAll('#recMaxPills [data-val]'), function(b){ b.classList.remove('is-active'); });
      this.classList.add('is-active');
    };
  });

  // 保留天数快捷胶囊
  Array.prototype.forEach.call(box.querySelectorAll('#recKeepPills [data-val]'), function(btn){
    btn.onclick = function(){
      var inp = document.getElementById('recKeep');
      if(inp) inp.value = this.dataset.val;
      Array.prototype.forEach.call(box.querySelectorAll('#recKeepPills [data-val]'), function(b){ b.classList.remove('is-active'); });
      this.classList.add('is-active');
    };
  });

  // 保存录像配置按钮
  var btnRecSave = document.getElementById('btnRecSave');
  if(btnRecSave) btnRecSave.onclick = function(){
    var b = this;
    b.disabled = true;
    b.textContent = '正在保存…';

    var activeCard = box.querySelector('[data-mode].is-active');
    var mode = (activeCard && activeCard.dataset.mode) || (setRecCfg && setRecCfg.mode) || 'always';
    var maxGB = parseInt((document.getElementById('recMaxGB')||{}).value, 10);
    if(isNaN(maxGB) || maxGB < 0) maxGB = 0;
    var keep = parseInt((document.getElementById('recKeep')||{}).value, 10);
    if(isNaN(keep) || keep < 0) keep = 0;
    var minFree = parseInt((document.getElementById('recMinFree')||{}).value, 10);
    if(isNaN(minFree) || minFree < 0) minFree = 10;
    var postRoll = parseInt((document.getElementById('recPostRoll')||{}).value, 10) || 30;
    var seg = parseInt((document.getElementById('recSeg')||{}).value, 10) || 300;
    var sens = (document.getElementById('recSens')||{}).value || 'medium';
    var lowSpace = (document.getElementById('recLowSpace')||{}).value || 'deleteOldest';
    var autoClean = !!(document.getElementById('recAutoClean')||{}).checked;

    api('/api/recordings/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        enabled: mode !== 'off',
        mode: mode,
        segmentSec: seg,
        keepDays: keep,
        maxStorageGB: maxGB,
        minFreeGB: minFree,
        postRollSec: postRoll,
        motionSensitivity: sens,
        lowSpaceMode: lowSpace,
        autoClean: autoClean
      })
    }).then(function(r){
      b.disabled = false;
      b.innerHTML = icon('check', 15) + '保存录像与存储配置';
      if(r && r.ok){
        toast('录像策略与存储配额已成功保存并生效', 'ok');
        if(setRecCfg){
          setRecCfg.mode = mode;
          setRecCfg.keepDays = keep;
          setRecCfg.maxStorageGB = maxGB;
          setRecCfg.minFreeGB = minFree;
          setRecCfg.autoClean = autoClean;
          setRecCfg.lowSpaceMode = lowSpace;
        }
      } else {
        toast('保存失败：' + ((r && r.error) || '未知错误'), 'err');
      }
    }).catch(function(e){
      b.disabled = false;
      b.innerHTML = icon('check', 15) + '保存录像与存储配置';
      toast('保存失败：' + e.message, 'err');
    });
  };

  // 通道切换
  Array.prototype.forEach.call(box.querySelectorAll('[data-chan]'), function(card){
    card.onclick = function(){
      var chan = this.dataset.chan;
      if(setNotify) setNotify.channel = chan;
      paintSettings(document.getElementById('content'));
    };
  });

  // 测试推送
  var nt = document.getElementById('btnNotifyTest');
  if(nt) nt.onclick = function(){
    var b = this;
    b.disabled = true;
    b.textContent = '正在发送测试…';
    var stEl = document.getElementById('ntTestStatus');
    var txtEl = document.getElementById('ntTestText');
    if(stEl) stEl.className = 'notify-test-status is-testing';
    if(txtEl) txtEl.textContent = '正在发起请求并测量延迟…';

    var ch = (setNotify && setNotify.channel) || 'bark';
    var p = {};
    Array.prototype.forEach.call(box.querySelectorAll('[id^="ntParam-"]'), function(inp){
      var k = inp.id.replace('ntParam-', '');
      p[k] = inp.value.trim();
    });

    api('/api/notify/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        channel: ch,
        webhook: p.webhook || '',
        params: p
      })
    }).then(function(r){
      b.disabled = false;
      b.innerHTML = icon('bell', 15) + '发送测试通知';
      if(r && r.ok){
        if(stEl) stEl.className = 'notify-test-status is-ok';
        if(txtEl) txtEl.textContent = '推送成功送达！响应延迟 ' + (r.ms||0) + ' ms';
        toast('测试通知已发送并成功送达', 'ok');
      } else {
        if(stEl) stEl.className = 'notify-test-status is-bad';
        var errStr = (r && (r.error || r.msg)) || '未知错误';
        if(txtEl) txtEl.textContent = '推送失败：' + errStr;
        toast('测试失败：' + errStr, 'err');
      }
    }).catch(function(e){
      b.disabled = false;
      b.innerHTML = icon('bell', 15) + '发送测试通知';
      if(stEl) stEl.className = 'notify-test-status is-bad';
      if(txtEl) txtEl.textContent = '请求异常：' + e.message;
      toast('测试失败：' + e.message, 'err');
    });
  };

  // 保存推送设置按钮
  var nSave = document.getElementById('btnNotifySave');
  if(nSave) nSave.onclick = function(){
    var ch = (setNotify && setNotify.channel) || 'bark';
    var p = (setNotify && setNotify.params) || {};
    Array.prototype.forEach.call(box.querySelectorAll('[id^="ntParam-"]'), function(inp){
      var k = inp.id.replace('ntParam-', '');
      p[k] = inp.value.trim();
    });
    var evs = [];
    Array.prototype.forEach.call(box.querySelectorAll('[data-ev]'), function(x){
      if(x.checked) evs.push(x.dataset.ev);
    });
    var qFrom = (document.getElementById('uiQuietFrom') || {}).value;
    var qTo = (document.getElementById('uiQuietTo') || {}).value;
    var en = (document.getElementById('ntEnabled') || {}).checked;

    saveNotify({
      enabled: !!en,
      channel: ch,
      webhook: p.webhook || '',
      params: p,
      events: evs,
      quietFrom: qFrom,
      quietTo: qTo
    });
  };

  // 跳转按钮
  var go = function(id, target){
    var el = document.getElementById(id);
    if(el) el.onclick = function(){ page = target; renderMenu(); render(); };
  };
  go('setGoRec','recordings'); go('setGoStorage','storage'); go('setGoAI','ai'); go('setGoDev','devices'); go('setGoWizard','setup');
  // 检查更新函数
  function doCheckUpdate(btn, isAuto){

// ===== 凭据状态提示 =====
//
// 为什么要显示：cs2 凭据有有效期（实测 8 小时），
// 过期后需要向小米云申请，而小米云有限流。
// 限流期间用户什么都不做就一直是黑屏 —— 必须让他知道原因。
function loadCredBar(){
  var bar = $("#credBar");
  if(!bar) return;
  api("/api/live/cred-status").then(function(d){
    var devs = d.devices || [];
    var dev = null;
    for(var i=0;i<devs.length;i++){ if(devs[i].did === currentDid){ dev = devs[i]; break; } }
    if(!dev || !dev.hasCred){ bar.style.display = "none"; return; }

    var msg = "", bg = "", color = "";
    if(dev.cooldownMinutes > 0){
      bg = "rgba(255,77,79,.12)"; color = "var(--danger)";
      msg = "⚠️ 摄像头凭据需要刷新，但小米云正在限流。约 " + dev.cooldownMinutes + " 分钟后自动重试。"
          + "<br>期间可能无法播放。可稍后再试，或重启路由器换个出口 IP。";
    } else if(dev.expiresInMinutes < 60){
      bg = "rgba(250,173,20,.12)"; color = "var(--warning)";
      msg = "⚠️ 摄像头凭据约 " + dev.expiresInMinutes + " 分钟后过期，到期会自动续期。";
    } else {
      return;   // 正常状态不打扰
    }

    bar.style.display = "block";
    bar.style.background = bg;
    bar.style.color = color;
    bar.innerHTML = msg
      + "<div style=\"margin-top:8px\">"
      +   "<button class=\"btn btn--sm\" id=\"btnRenew\">立即重试刷新</button>"
      + "</div>";

    var btn = $("#btnRenew");
    if(btn) btn.onclick = function(){
      btn.disabled = true;
      btn.textContent = "刷新中…";
      api("/api/live/renew?did=" + encodeURIComponent(currentDid), { method: "POST" })
        .then(function(r){
          if(expBlocked(r)){ btn.disabled = false; btn.textContent = '刷新凭据'; return; }
              var res = (r.results || [])[0] || {};
          if(res.ok){
            toast("凭据已刷新", "ok");
            loadCredBar();
          } else {
            toast("刷新失败：" + (res.error || "未知错误"), "err");
          }
        })
        .catch(function(e){ toast("刷新失败：" + e.message, "err"); })
        .then(function(){ btn.disabled = false; btn.textContent = "立即重试刷新"; });
    };
  }).catch(function(){});
}

// ===== 云台方向翻转（按设备记住）=====
//
// 为什么需要：不同摄像头安装方向不同（正装/倒装/侧装），
// 实测 CW300 的云台方向与标称不一致。
// 让用户在界面上自己校正，比在代码里写死更灵活。
function ptzFlipKey(axis){
  return "micam.flip." + axis + "." + (currentDid || "default");
}
function ptzFlip(){
  var panStored = localStorage.getItem(ptzFlipKey("pan"));
  // CW500双摄版默认左右反向（自适应检测型号或双摄，亦支持用户手动翻转校准）
  var panDef = false;
  if(typeof devices !== "undefined" && Array.isArray(devices)){
    var dev = devices.find(function(d){ return d.did === currentDid; });
    if(dev && (dev.model === "isa.camera.hlmax" || dev.lenses >= 2 || (dev.name && dev.name.indexOf("CW500") >= 0))){
      panDef = true;
    }
  }
  return {
    pan:  panStored === null ? panDef : (panStored === "1"),
    tilt: localStorage.getItem(ptzFlipKey("tilt")) === "1"
  };
}
function setPtzFlip(axis, on){
  localStorage.setItem(ptzFlipKey(axis), on ? "1" : "0");
  toast(axis === "pan" ? "左右方向已保存" : "上下方向已保存", "ok");
}

// ===== 添加小米账号（扫码 / 账号密码）=====
//
// 两点修正：
//   1. 不只是「米家 App」—— 米家 / 小米商城 / 小米运动等任一小米 App 都能扫，
//      登录的都是同一个**小米账号**；
//   2. 账号密码登录的底层（xiaomi.Login + VerifyError.StartVerify/Submit）
//      早就实现了，只是从没接出 HTTP 接口（/api/accounts POST 一直回「未实现」）。
//      本轮补上 POST /api/accounts/login 与 /api/accounts/verify。
function showQR(){
  var mask = document.createElement("div");
  mask.className = "mask is-open";
  mask.innerHTML = '<div class="dialog">'
    + '<div class="dialog__head">添加小米账号</div>'
    + '<div class="dialog__body">'
    +   '<div class="segmented dev-seg acct-login__seg" id="acctLoginSeg">'
    +     '<button class="segmented__btn is-active" data-lt="qr">扫码登录</button>'
    +     '<button class="segmented__btn" data-lt="pwd">账号密码</button>'
    +   '</div>'
    +   '<div id="acctLoginBody"></div>'
    + '</div>'
    + '<div class="dialog__foot"><button class="btn" id="qrClose">关闭</button></div></div>';
  document.body.appendChild(mask);

  var timer = null, closed = false;
  function close(){
    closed = true;
    if(timer) clearInterval(timer);
    mask.remove();
  }
  mask.querySelector("#qrClose").onclick = close;
  mask.onclick = function(e){ if(e.target === mask) close(); };

  function done(){
    close();

    // ⚠️ 这里【绝不能调 render()】！
    //
    // 2026-09-18 用户反馈：「点稍后之后还给我自动获取了，我都没同意」。
    //
    // 根因：render() 会重渲染当前页，而 renderLive / renderDevices / renderGrid
    //       这些页面函数内部都会调 loadDevices()。
    //       于是「登录成功 -> render() -> 重渲染 -> 自动拉设备」，
    //       用户根本没同意。
    //
    // 但【登录成功是一个合理的自动拉取时机】——
    // 用户刚登录，下一步必然是看有哪些设备，
    // 让他再手点一次「获取设备」是多余的。
    //
    // ⚠️ 这里区别于「页面渲染时自动拉」：
    //   后者是用户没做任何操作就被拉取（错）
    //   这里是用户刚完成登录这个明确动作（对）
    toast('登录成功，正在获取设备…', 'ok');
    page = 'accounts';
    renderMenu();
    render();
    autoFetchAfterLogin();
  }

  // autoFetchAfterLogin 登录成功后自动拉一次设备清单。
  //
  // 为什么这个「自动」是对的：
  //   「获取设备」作为一个独立按钮存在，是为了「重新获取」
  //   （用户在米家加了新摄像头后手动刷新）。
  //   但刚登录时，拉清单是登录流程的必然下一步，
  //   不需要用户再点一次。
  function autoFetchAfterLogin(){
    api('/api/devices/cloud?refresh=1').then(function(d){
      var n = ((d && d.devices) || []).length;
      if(n > 0){
        toast('发现 ' + n + ' 台设备', 'ok');
        render();   // 重渲染账号页，右栏会显示清单
      } else {
        // 真的一台都没有 -> 这时候才提示原因
        showNoDeviceDialog();
        render();
      }
    }).catch(function(e){
      toast('获取设备失败：' + (e.message || e), 'err');
      render();
    });
  }

  // showLoginOkDialog 登录成功后的引导（不自动拉设备）
  function showLoginOkDialog(){
    openModal('账号已添加', ''
      + '<div style="text-align:center;padding:6px 0 2px">'
      +   '<div style="font-size:30px;margin-bottom:8px;color:#4ade80">✓</div>'
      +   '<div style="font-size:15px;color:var(--text-secondary)">小米账号登录成功</div>'
      + '</div>'
      + '<div style="font-size:13px;color:var(--text-muted);line-height:1.9;margin-top:14px">'
      +   '下一步：点下方的<b>「获取设备」</b>，把该账号下的摄像头加入列表。<br>'
      +   '如果该账号没有摄像头，可以再添加其它账号。'

        root.querySelector('#loLater').onclick = closeModal;

  // doFetchDevices 用户主动触发的「获取设备」——带结果反馈
  function doFetchDevices(){
    toast('正在获取设备…');
    api('/api/devices/cloud?refresh=1').then(function(d){
      var n = ((d && d.devices) || []).length;

  function showNoDeviceDialog(){
    openModal('没有找到摄像头', ''

          '<div style="display:flex;gap:10px;margin-top:18px">'
          + '<button class="btn btn--primary" id="ndRetry" style="flex:1;justify-content:center">重新获取设备</button>'
          + '<button class="btn" id="ndAgain" style="flex:1;justify-content:center">换个账号登录</button>'
          + '</div>');
        root.querySelector('#ndRetry').onclick = function(){
          closeModal();
          toast('正在重新获取设备…');
          // 必须带 refresh=1 —— 否则只是读缓存，永远拿不到新数据
          api('/api/devices/cloud?refresh=1').then(function(d){
            var n = ((d && d.devices) || []).length;
            toast(n > 0 ? ('发现 ' + n + ' 台设备') : '仍然没有设备', n > 0 ? 'ok' : 'warn');
            render();
          }).catch(function(e){ toast('获取失败：' + (e.message||e), 'err'); });
        };
        root.querySelector('#ndAgain').onclick = function(){ closeModal(); };
      });

  // ---- 扫码 ----
  function paintQR(){
    var box = mask.querySelector("#acctLoginBody");
    box.innerHTML = '<div class="qr-wrap" id="qrWrap">' + loading("正在获取二维码…") + '</div>';
    api("/api/accounts/qr", {method:"POST"}).then(function(r){
      if(closed) return;
      if(!r.id){ box.querySelector("#qrWrap").innerHTML = empty("close","获取失败", r.msg||"",""); return; }
      box.querySelector("#qrWrap").innerHTML =
        '<img src="' + r.qrBase64 + '" alt="二维码">'
        + '<div class="qr-tip">用<b>任意小米 App</b>（米家 / 小米商城 / 小米运动…）扫码<br>登录的是你的 <b>小米账号</b></div>';
      timer = setInterval(function(){
        api("/api/accounts/qr/status?id=" + encodeURIComponent(r.id)).then(function(s){
          if(closed) return;
          if(s.state === "success"){ done(); }
          else if(s.state === "scanned"){
            var tip = box.querySelector(".qr-tip");
            // 注：服务端已不再返回 scanned（qr.Wait() 没有中间态），
            // 这里保底也改成准确文案
            if(tip) tip.innerHTML = "正在等待手机确认…";
          } else if(s.state === "failed"){
            clearInterval(timer);
            box.querySelector("#qrWrap").innerHTML = empty("close","登录失败", s.error||"","");
          }
        }).catch(function(){});
      }, 2000);
    }).catch(function(e){
      if(!closed) box.querySelector("#qrWrap").innerHTML = empty("close","错误", e.message,"");
    });
  }

  // ---- 账号密码 ----
  function paintPwd(){
    var box = mask.querySelector("#acctLoginBody");
    box.innerHTML = '<div class="acct-login">'
      + '<div class="field"><label class="field__label">小米账号</label>'
      +   '<input class="input" id="acctUser" placeholder="手机号 / 邮箱 / 小米 ID" autocomplete="username"></div>'
      + '<div class="field"><label class="field__label">密码</label>'
      +   '<input class="input" id="acctPass" type="password" placeholder="账号密码" autocomplete="current-password"></div>'
      + '<div class="dev-sub__tip">' + icon('info',12) + ' 陌生设备通常会要求短信/邮箱验证码，下一步会让你填。</div>'
      + '<div id="acctLoginMsg"></div>'
      + '<button class="btn btn--primary btn--block" id="acctLoginGo">登录</button>'
      + '</div>';
    var go = box.querySelector("#acctLoginGo");
    var msg = box.querySelector("#acctLoginMsg");
    go.onclick = function(){
      var u = box.querySelector("#acctUser").value.trim();
      var pw = box.querySelector("#acctPass").value;
      if(!u || !pw){ msg.innerHTML = '<div class="dev-err">账号和密码都要填</div>'; return; }
      go.disabled = true; go.textContent = "登录中…";
      api("/api/accounts/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username:u, password:pw}) })
        .then(function(r){
          go.disabled = false; go.textContent = "登录";
          if(r && r.msg){ msg.innerHTML = '<div class="dev-err">' + esc(r.msg) + '</div>'; return; }
          if(r && r.ok){ done(); return; }
          if(r && r.needVerify){ paintVerify(r); return; }
          if(r && r.needCaptcha){ msg.innerHTML = '<div class="dev-err">' + esc(r.msg || "需要图形验证码，请改用扫码登录") + '</div>'; }
        })
        .catch(function(e){ go.disabled = false; go.textContent = "登录"; msg.innerHTML = '<div class="dev-err">' + esc(e.message) + '</div>'; });
    };
  }

  function paintVerify(r){
    var box = mask.querySelector("#acctLoginBody");
    var to = r.method === "邮箱" ? (r.maskedEmail || "邮箱") : (r.maskedPhone || "手机");
    box.innerHTML = '<div class="acct-login">'
      + '<div class="dev-note dev-note--tight">验证码已发送到 <b>' + esc(to) + '</b>，请在 5 分钟内填写。</div>'
      + '<div class="field"><label class="field__label">验证码</label>'
      +   '<input class="input" id="acctCode" placeholder="短信/邮箱里的验证码" inputmode="numeric"></div>'
      + '<div id="acctLoginMsg"></div>'
      + '<button class="btn btn--primary btn--block" id="acctVerifyGo">提交验证码</button>'
      + '</div>';
    var go = box.querySelector("#acctVerifyGo");
    var msg = box.querySelector("#acctLoginMsg");
    go.onclick = function(){
      var code = box.querySelector("#acctCode").value.trim();
      if(!code){ msg.innerHTML = '<div class="dev-err">请填验证码</div>'; return; }
      go.disabled = true; go.textContent = "提交中…";
      api("/api/accounts/verify", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id:r.id, code:code}) })
        .then(function(res){
          go.disabled = false; go.textContent = "提交验证码";
          if(res && res.msg){ msg.innerHTML = '<div class="dev-err">' + esc(res.msg) + '</div>'; return; }
          if(res && res.ok) done();
        })
        .catch(function(e){ go.disabled = false; go.textContent = "提交验证码"; msg.innerHTML = '<div class="dev-err">' + esc(e.message) + '</div>'; });
    };
  }

  Array.prototype.forEach.call(mask.querySelectorAll('[data-lt]'), function(b){
    b.onclick = function(){
      Array.prototype.forEach.call(mask.querySelectorAll('[data-lt]'), function(x){ x.classList.toggle('is-active', x === b); });
      if(timer){ clearInterval(timer); timer = null; }
      if(this.dataset.lt === 'pwd') paintPwd(); else paintQR();
    };
  });
  paintQR();
}

// ===== 宿主 SDK 集成 =====
//
// 【2026-09-23 移除 CDN 依赖】
//
// 原实现：
//   import("https://unpkg.com/@trimjs/web-app/dist/index.js")
//
// 问题：
//   1. 违反本项目硬约束「全内联、不要 CDN」
//      （飞牛网关会重写相对路径，所以 CSS/JS 必须内联）
//   2. 实测每次打开页面都发两个外部请求（含 302 跳转），
//      离线环境直接失败
//   3. 隐私：向 unpkg.com 暴露"用户装了 MiCam"
//   4. 供应链：执行未做完整性校验的第三方远程 JS
//
// 实测本机 window 上【没有任何】宿主注入的全局
//（trim / fnos 相关均为空），也就是说这段 CDN 加载
// 在直连 :8900 的场景下不产生任何价值，只走 catch 分支。
//
// 新实现：优先用宿主注入的全局（若将来飞牛通过
// window.TrimApp 之类提供），没有就独立模式 —— 不再联网。
function initSDK(){
  var Host = null;
  try {
    // 宿主可能以 window.TrimApp 构造器形式注入
    if (typeof window.TrimApp === "function") Host = window.TrimApp;
    else if (window.TrimApp && typeof window.TrimApp === "object") Host = window.TrimApp;
  } catch (e) { /* 忽略 */ }

  var el = document.getElementById("sysInfo");

  // 按照偏好设置（深色/浅色/跟随系统）应用主题
  if (window.__micamApplyTheme) {
    window.__micamApplyTheme(window.__micamGetTheme ? window.__micamGetTheme() : 'dark', false);
  }

  if (!Host) {
    if (el) el.textContent = "独立模式";
    return;
  }

  try {
    var app = (typeof Host === "function") ? new Host() : Host;
    if (app && typeof app.getPlatformConfig === "function") {
      Promise.resolve(app.getPlatformConfig()).then(function(cfg){
        cfg = cfg || {};
        if (el) el.textContent = "系统 " + (cfg.systemVersion || "") + " · " + (cfg.language || "");
        if (typeof app.setTitle === "function") { try { app.setTitle("MiCam (非官方社区版)"); } catch (e) {} }
      }).catch(function(){
        if (el) el.textContent = "独立模式";
      });
    } else {
      if (el) el.textContent = "独立模式";
    }
  } catch (e) {
    if (el) el.textContent = "独立模式";
  }
}

// ===== 事件通知配置 =====
// ===== AI 设置 =====
//
// 设计原则：**默认关闭**。
// 开源后用户环境各异，环境不具备时给清晰提示，不报错。

function loadAICfg(){
  var box = document.getElementById('aiCfg');
  if(!box) return;

  api('/api/ai/status').then(function(st){
    var s = st.status || {};
    var env = st.env || {};
    var models = st.models || [];
    var cfg = {};

    api('/api/ai/config').then(function(cr){
      cfg = cr.config || {};
      paintAI(box, cfg, s, env, models);
    }).catch(function(){ paintAI(box, cfg, s, env, models); });
  }).catch(function(e){
    box.innerHTML = '<div class="text-sm text-muted">读取失败：' + esc(e.message) + '</div>';
  });
}

function paintAI(box, cfg, status, env, models){
  var on = !!cfg.enabled;
  var ready = status.status === 'ready';
  var envOk = !!env.available;

  // 状态徽章
  var badge = '';
  if(!on)        badge = '<span class="chip"><span class="status-dot"></span>未启用</span>';
  else if(ready) badge = '<span class="chip is-active"><span class="status-dot is-online"></span>运行中</span>';
  else           badge = '<span class="chip" style="color:var(--warning)"><span class="status-dot" style="background:var(--warning)"></span>' + esc(status.status || '异常') + '</span>';

  // 模型选项
  var modelOpts = models.map(function(m){
    return '<option value="' + esc(m.name) + '"' + (cfg.model === m.name ? ' selected' : '')
      + (m.downloaded ? '' : ' disabled') + '>'
      + esc(m.name) + (m.downloaded ? '（已下载 ' + (m.sizeMB||0).toFixed(1) + ' MB）' : '（未下载）')
      + '</option>';
  }).join('');

  box.innerHTML = ''

    + '<div class="switch-row">'
    +   '<div class="switch-row__main">'
    +     '<div class="switch-row__title">启用 AI 识别 ' + badge + '</div>'
    +     '<div class="switch-row__hint">'
    +       '把「有变化」升级为「有人 / 有车辆 / 有包裹」。'
    +       '关闭时只用画面变化侦测，<b>不影响其它功能</b>。'
    +     '</div>'
    +   '</div>'
    +   '<label class="switch"><input type="checkbox" id="aiOn"' + (on ? ' checked' : '')
    +     (envOk ? '' : ' disabled') + '><span class="switch__track"></span></label>'
    + '</div>'

    // 环境不可用提示
    + (!envOk
        ? '<div class="ai-warn">' + icon('alert',15)
          + '<div><b>当前环境不支持 AI</b><div class="ai-warn__sub">'
          + esc(env.error || '未找到 onnxruntime')
          + '<br>提示：在飞牛应用中心安装「AI」应用后重试。</div></div></div>'
        : '')

    // 详细设置（只在启用时展开）
    + (on && envOk ? ''
      + '<div class="ai-grid">'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">识别模型</label>'
      +     '<div class="cfg-row__control"><select class="input" id="aiModel">' + modelOpts + '</select></div>'
      +     '<div class="cfg-row__hint">yolov8n/yolov11n 轻量快速 · yolov8s/yolov11s 平衡 · yolov8m 精准（需更多CPU）。YOLO11 系列比 YOLOv8 更准更快</div>'
      +   '</div>'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">置信度阈值</label>'
      +     '<div class="cfg-row__control">'
      +       '<input class="input cfg-row__num" type="number" id="aiConf" min="0.1" max="0.95" step="0.05" value="' + (cfg.confThreshold || 0.45) + '">'
      +     '</div>'
      +     '<div class="cfg-row__hint">越高越严格（漏报多），越低越灵敏（误报多）。建议 0.4 ~ 0.5</div>'
      +   '</div>'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">识别频率上限</label>'
      +     '<div class="cfg-row__control">'
      +       '<input class="input cfg-row__num" type="number" id="aiRate" min="1" max="120" value="' + (cfg.maxPerMinute || 12) + '">'
      +       '<span class="cfg-row__unit">次 / 分钟</span>'
      +     '</div>'
      +     '<div class="cfg-row__hint">防止 CPU 被占满。画面一直有变化时按此限流</div>'
      +   '</div>'

      +   '<div class="cfg-row">'
      +     '<label class="cfg-row__label">CPU 线程</label>'
      +     '<div class="cfg-row__control">'
      +       '<input class="input cfg-row__num" type="number" id="aiThreads" min="1" max="8" value="' + (cfg.threads || 4) + '">'
      +     '</div>'
      +     '<div class="cfg-row__hint">推理线程数。设太高会影响视频流</div>'
      +   '</div>'

      + '</div>'

      + '<div class="ai-actions">'
      +   '<button class="btn" id="aiTest">' + icon('cpu',14) + '测试识别</button>'
      +   '<button class="btn" id="aiSave">' + icon('check',14) + '保存设置</button>'
      +   '<span class="ai-result" id="aiResult"></span>'
      + '</div>'

      // 模型管理
      + '<div class="ai-models">'
      +   '<div class="ai-models__title">模型文件</div>'
      +   models.map(function(m){
            return '<div class="ai-model">'
              + '<span class="ai-model__name">' + esc(m.name) + '</span>'
              + '<span class="ai-model__meta">' + (m.downloaded ? (m.sizeMB||0).toFixed(1) + ' MB' : '未下载') + '</span>'
              + (m.downloaded
                  ? '<button class="btn btn--sm" data-ai-del="' + esc(m.name) + '">删除</button>'
                  : '<button class="btn btn--sm btn--primary" data-ai-dl="' + esc(m.name) + '">下载</button>')
              + '</div>';
          }).join('')
      +   '<div class="ai-models__hint">存放位置：' + esc('/vol1/@appdata/micam/models') + '</div>'
      + '</div>'
      : '')

    + '<div class="ai-foot">'
    +   'AI 在本机运行，<b>不上传任何画面</b>。'
    +   '识别结果为「有人 / 车辆 / 包裹」，写入事件记录。'
    + '</div>';

  // ---- 绑定 ----
  var sw = document.getElementById('aiOn');
  if(sw) sw.onchange = function(){
    aiSaveCfg({ enabled: this.checked }, function(){
      if(!this.checked) return;
      loadAICfg();
    }.bind(this));
  };

  var sv = document.getElementById('aiSave');
  if(sv) sv.onclick = function(){
    aiSaveCfg({
      enabled: true,
      model: (document.getElementById('aiModel')||{}).value,
      confThreshold: parseFloat((document.getElementById('aiConf')||{}).value) || 0.45,
      maxPerMinute: parseInt((document.getElementById('aiRate')||{}).value, 10) || 12,
      threads: parseInt((document.getElementById('aiThreads')||{}).value, 10) || 4,
    });
  };

  var ts = document.getElementById('aiTest');
  if(ts) ts.onclick = function(){
    var r = document.getElementById('aiResult');
    if(r) r.textContent = '识别中…';
    api('/api/ai/test').then(function(d){
      var objs = d.objects || [];
      if(!objs.length){
        if(r) r.textContent = '✅ 未检出目标（' + d.ms + 'ms）';
      } else {
        if(r) r.textContent = '✅ ' + objs.map(function(o){ return o.cls + ' ' + Math.round(o.conf*100) + '%'; }).join('、')
          + '（' + d.ms + 'ms）';
      }
    }).catch(function(e){
      if(r) r.textContent = '❌ ' + e.message;
    });
  };

  Array.prototype.forEach.call(box.querySelectorAll('[data-ai-dl]'), function(b){
    b.onclick = function(){
      b.disabled = true; b.textContent = '下载中…';
      api('/api/ai/model', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'download', name: b.dataset.aiDl }) })
        .then(function(){
          toast('开始下载，稍后刷新查看', 'ok');
          var t = setInterval(function(){
            api('/api/ai/status').then(function(st){
              var m = (st.models||[]).filter(function(x){ return x.name === b.dataset.aiDl; })[0];
              if(m && m.downloaded){ clearInterval(t); loadAICfg(); }
            }).catch(function(){});
          }, 3000);
          setTimeout(function(){ clearInterval(t); loadAICfg(); }, 180000);
        }).catch(function(e){ toast('下载失败：' + e.message, 'err'); b.disabled = false; b.textContent = '下载'; });
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-ai-del]'), function(b){
    b.onclick = function(){
      if(!confirm('删除模型 ' + b.dataset.aiDel + '？')) return;
      api('/api/ai/model', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'delete', name: b.dataset.aiDel }) })
        .then(function(){ toast('已删除', 'ok'); loadAICfg(); })
        .catch(function(e){ toast('删除失败：' + e.message, 'err'); });
    };
  });
}

function aiSaveCfg(patch, done){
  api('/api/ai/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) })
    .then(function(r){
      if(r.warn){ toast(r.warn, 'warn'); } else { toast('已保存', 'ok'); }
      var hs = document.getElementById('aiHeadStatus');
      loadAICfg();
      if(done) done();
    })
    .catch(function(e){ toast('保存失败：' + e.message, 'err'); });
}

function loadNotifyCfg(){
  var box = $("#notifyCfg");
  if(!box) return;
  api("/api/notify/config").then(function(c){
    var types = c.types || [];
    var sel = {};
    (c.events || []).forEach(function(e){ sel[e] = true; });
    var allOn = (c.events || []).length === 0;

    var rows = types.map(function(t){
      var checked = allOn || sel[t.key];
      return "<label style='display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px'>"
        + "<input type='checkbox' data-ev='" + esc(t.key) + "'" + (checked ? ' checked' : '') + "> "
        + esc(t.label) + "</label>";
    }).join("");

    box.innerHTML = ""
      + "<div class='cfg-row'>"
      +   "<div class='cfg-row__label'>启用通知</div>"
      +   "<label class='switch'><input type='checkbox' id='ntEnabled'" + (c.enabled ? ' checked' : '') + "><span class='switch__track'></span></label>"
      + "</div>"
      + "<div class='cfg-row' style='align-items:flex-start'>"
      +   "<div class='cfg-row__label' style='padding-top:8px'>Webhook 地址</div>"
      +   "<input class='input' id='ntWebhook' style='flex:1;min-width:200px;text-align:left;font-size:12px' placeholder='https://...' value='" + esc(c.webhook||'') + "'>"
      + "</div>"
      + "<div style='font-size:12px;color:var(--text-3);margin:8px 0 12px'>"
      +   "POST JSON 到该地址。可对接钉钉/企业微信/Bark/自建服务。"
      + "</div>"
      + "<div style='font-size:13px;font-weight:500;margin-bottom:6px'>订阅事件</div>"
      + rows
      + "<div class='row gap-2' style='margin-top:14px'>"
      +   "<button class='btn btn--primary' id='btnNotifySave'>保存</button>"
      + "</div>"
      + "<div style='font-size:12px;color:var(--text-3);margin-top:8px'>不勾选任何项 = 全部订阅。</div>";

    var sb = $("#btnNotifySave");
    if(sb) sb.onclick = saveNotifyCfg;

    var tb = $("#btnNotifyTest");
    if(tb) tb.onclick = function(){
      var url = ($("#ntWebhook")||{}).value || '';
      if(!url){ toast('请先填写 Webhook 地址', 'err'); return; }
      toast('正在发送测试…');
      api('/api/notify/test', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({webhook: url})
      }).then(function(r){ toast(r.msg || '已发送', 'ok'); })
        .catch(function(e){ toast('失败：' + e.message, 'err'); });
    };
  }).catch(function(e){
    box.innerHTML = "<div style='color:var(--danger);font-size:13px'>" + esc(e.message) + "</div>";
  });
}

function saveNotifyCfg(){
  var evs = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-ev]'), function(inp){
    if(inp.checked) evs.push(inp.dataset.ev);
  });
  // 全选 = 空数组（表示全部）
  var allBoxes = document.querySelectorAll('[data-ev]').length;
  if(evs.length === allBoxes) evs = [];

  var body = {
    enabled: !!($("#ntEnabled")||{}).checked,
    webhook: ($("#ntWebhook")||{}).value || '',
    events: evs
  };
  api('/api/notify/config', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(){ toast('通知配置已保存', 'ok'); })
    .catch(function(e){ toast('保存失败：' + e.message, 'err'); });
}

// ===== 加载 hls.js（HLS 播放库）=====
//
// ===== 为什么不用相对路径 =====
//
// 飞牛网关转发时会改变路径形态，实测日志：
//
//   GET /app/micam/       <- 页面
//   GET /hls.min.js       <- 相对路径被解析到根！应该是 /app/micam/hls.min.js
//
// 所以按顺序尝试多个候选路径，哪个通用哪个。
// 全部失败 -> 降级 MJPEG 模式（功能不受影响，只是 CPU 高些）。
(function(){
  var candidates = [
    "assets/vendor/hls.min.js",             // 标准相对路径（直连 8900 时）
    "/app/micam/assets/vendor/hls.min.js",  // 飞牛网关绝对路径
    "/assets/vendor/hls.min.js"             // 直连绝对路径
  ];
  var idx = 0;

  function tryNext(){
    if(idx >= candidates.length){
      console.warn("[micam] hls.js 全部路径加载失败，降级 MJPEG 模式");
      window.__hlsFailed = true;
      return;
    }
    var url = candidates[idx++];
    var sc = document.createElement("script");
    sc.src = url;
    sc.onload = function(){
      window.__hlsReady = true;
      console.log("[micam] hls.js 已加载: " + url);
    };
    sc.onerror = function(){
      console.warn("[micam] hls.js 加载失败: " + url);
      tryNext();
    };
    document.head.appendChild(sc);
  }

  tryNext();
})();

// startVersionGuard 部署守卫。
//
// 背景：部署只换掉服务器上的 index.html，**已经打开的页面不会重新加载**，
// 用户会一直对着旧 JS，然后来问「明明修好了怎么还报错」（今天就踩了两次）。

function startVersionGuard(){
  if(versionGuardTimer) return;
  versionGuardTimer = setInterval(function(){
    api("/api/health").then(function(h){
      if(!h || !h.startedAt || !DEV_GUARD_STAMP) return;

        + '<button class="btn btn--sm btn--primary" id="verReload">立即刷新</button>';
      document.body.appendChild(bar);

      if(rb) rb.onclick = function(){ location.reload(); };
    }).catch(function(){});
  }, 90000);
}
