        api("/api/devices/meta", {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify(body)
        }).then(function(){
          closeModal();
          toast('已保存', 'ok');
          render();
        }).catch(function(e){ toast('保存失败：' + e.message, 'err'); });
      };
    });
  }).catch(function(e){ toast('读取失败：' + e.message, 'err'); });
}

// 收藏（本地，存在浏览器）
function favKey(did){ return 'micam.fav.' + did; }
function getFav(did){ try { return localStorage.getItem(favKey(did)) === '1'; } catch(e){ return false; } }
function setFav(did, on){ try { on ? localStorage.setItem(favKey(did),'1') : localStorage.removeItem(favKey(did)); } catch(e){} }

// isShared 是否来自共享家庭
function isShared(d){ return d.shared || d.shareFlag === 1; }

// camCardHTML 生成一张摄像头卡片
function camCardHTML(d){
  var on = d.isOnline;
  var shared = isShared(d);
  var dual = (d.lenses || 1) >= 2;
  var fav = isFav(d.did);
  var cname = d.alias || d.name;
  var cen = d.aliasEn || '';

  // 角标系统：左上=时间戳，右上=在线状态（固定分工，互不挤动）
  var statusBadge = '<div class="cam-card__status' + (on ? '' : ' is-offline') + '">'
    + '<span class="status-dot ' + (on ? 'is-online' : 'is-offline') + '"></span>'
    + (on ? '在线' : '离线') + '</div>';

  var preview, offBlock = '';
  if (on) {
    preview = '<img data-snap="' + esc(d.did) + '" alt="">'
      + '<button class="cam-card__refresh" data-refresh-thumb="' + esc(d.did) + '" title="刷新封面画面">' + icon('refresh-cw', 13) + '</button>'
      + '<div class="cam-card__time"><span class="rec-dot"></span>'
      + '<span data-clock="' + esc(d.did) + '">' + clockNow() + '</span></div>'
      + statusBadge;
  } else {
    offBlock = '<div class="cam-card__off">'
      +   icon('video-off', 40)
      +   '<div class="cam-card__off-title">摄像头离线</div>'
      // UI-SPEC §2 variant="offline"：最后在线时间。
      // 无上线记录时给一句明确说明，而不是留空。
      +   (d.lastActivity
            ? '<div class="cam-card__off-sub">最后在线 <b>' + esc(fmtAgo(d.lastActivity)) + '</b></div>'
            : '<div class="cam-card__off-sub">暂无上线记录</div>')
      + '</div>';
    preview = '<img data-snap="' + esc(d.did) + '" alt="" style="filter:grayscale(1) brightness(.35)">'
      + offBlock
      + '<div class="cam-card__time">'
      + (d.lastActivity ? esc(d.lastActivity.slice(11,19)) : '--:--') + '</div>'
      + statusBadge;
  }

  // 信息角标系统（用户反馈：左上角堆了时间戳 + 双摄/共享标签，右上角还有状态，
  // 三个信息点挤在一起，且标签多寡会互相挤动，各卡片对齐线不一致）。
  //
  // 现在固定分工，**每个角只放一类信息**：
  //   左上 = 时间戳（唯一，永远不会被挤走）
  //   右上 = 在线状态
  //   底部 = 双摄 / 共享等属性标签（与标题同行，用小 pill）
  // 这样无论标签多少，左上/右上永远对齐。
  var tags = []
    .concat(dual ? [{ t:'双摄', ic:'grid', accent:true }] : [])
    .concat(shared ? [{ t:'共享', ic:null, accent:false }] : []);

  var metaLine = on
    ? ('最后活动 ' + (d.lastActivity ? fmtAgo(d.lastActivity) : '刚刚'))
    : ('最后在线 ' + (d.lastActivity ? fmtAgo(d.lastActivity) : '未知'));

  var starPath = 'M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z';

  return '<article class="cam-card' + (on ? '' : ' is-offline') + '" data-did="' + esc(d.did) + '">'
    + '<div class="cam-card__preview">' + preview + '</div>'
    + '<footer class="cam-card__foot">'
    +   '<div class="cam-card__info">'
    +     '<div class="cam-card__row">'
    +       '<span class="status-dot ' + (on ? 'is-online' : 'is-offline') + '"></span>'
    +       '<span class="cam-card__name" title="' + esc(cname) + '">' + esc(formatDevName(cname)) + '</span>'
    +       (cen ? '<span class="cam-card__en">' + esc(cen) + '</span>' : '')
    // 属性标签挪到底部与标题同行（用户反馈建议）
    +       tags.map(function(g){
              return '<span class="badge badge--sm' + (g.accent ? ' badge--accent' : '') + '">'
                + (g.ic ? icon(g.ic, 11) : '') + g.t + '</span>';
            }).join('')
    +     '</div>'
    +     '<div class="cam-card__meta">' + metaLine + '</div>'
    +   '</div>'
    +   '<button class="icon-btn cam-card__info" data-info="' + esc(d.did) + '" title="设备详情">'
    +     '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
    +   '</button>'
    +   '<button class="icon-btn cam-card__fav' + (fav ? ' is-active' : '') + '" data-fav="' + esc(d.did) + '" title="收藏">'
    +     '<svg class="icon" viewBox="0 0 24 24" fill="' + (fav ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + starPath + '"/></svg>'
    +   '</button>'
    // 用户反馈第 4 条：原来只有**离线**卡片多出一个垃圾桶，在线卡片没有，
    // 同一排操作入口因状态而不同，很不一致。
    // 现在统一收进「更多」菜单：所有卡片操作入口完全一致，
    // 删除作为破坏性操作藏在二级，也降低误触。
    +   '<button class="icon-btn cam-card__more" data-more="' + esc(d.did) + '" title="更多操作" aria-haspopup="menu">'
    +     '<svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>'
    +   '</button>'
    + '</footer>'
    + '</article>';
}

// showCamMenu 摄像头卡片的「更多操作」弹出菜单
//
// 为什么要有（用户反馈第 4 条）：原来只有离线卡片多一个垃圾桶图标，
// 在线卡片没有 —— 同一排操作入口随状态变化，很混乱。
// 现在所有卡片都有统一的「⋯」，破坏性操作（移除设备）收进二级菜单。
//
// 定位：以触发按钮为锚点，右对齐；靠近视口底部时向上弹出。
function showCamMenu(anchor, d, cb, online){
  // 同时只允许一个菜单
  var old = document.querySelector('.cam-menu');
  if(old) old.remove();

  var name = d.alias || d.name || d.did;
  var menu = document.createElement('div');
  menu.className = 'cam-menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = ''
    + '<div class="cam-menu__head">' + esc(name) + '</div>'
    + '<button class="cam-menu__item" data-cm="info" role="menuitem">'
    +   icon('info', 15) + '设备详情</button>'
    + '<button class="cam-menu__item" data-cm="fav" role="menuitem">'
    +   icon('star', 15) + (isFav(d.did) ? '取消收藏' : '收藏') + '</button>'
    + (online
        ? '<button class="cam-menu__item" data-cm="refresh-snap" role="menuitem">'
          + icon('refresh-cw', 15) + '刷新封面画面</button>'
          + '<button class="cam-menu__item" data-cm="live" role="menuitem">'
          + icon('play', 15) + '查看实时画面</button>'
        : '<button class="cam-menu__item is-danger" data-cm="del" role="menuitem">'
          + icon('trash', 15) + '从列表移除</button>');

  document.body.appendChild(menu);

  // 定位：右边缘对齐按钮右边缘
  var r = anchor.getBoundingClientRect();
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  var left = Math.min(r.right - mw, window.innerWidth - mw - 8);
  left = Math.max(8, left);
  var top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  function close(){ menu.remove(); document.removeEventListener('click', onDoc, true); }
  function onDoc(ev){ if(!menu.contains(ev.target)) close(); }
  setTimeout(function(){ document.addEventListener('click', onDoc, true); }, 0);

  Array.prototype.forEach.call(menu.querySelectorAll('[data-cm]'), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var a = this.dataset.cm;
      close();
      if(a === 'info') cb.onInfo();
      else if(a === 'fav') cb.onFav();
      else if(a === 'refresh-snap'){
        if(cb.onRefreshSnap) cb.onRefreshSnap();
        else {
          var card = document.querySelector('.cam-card[data-did="' + d.did + '"]');
          if(card) loadCameraSnapsFor(card, d.did, true);
        }
      }
      else if(a === 'live') gotoLive(d.did);
      else if(a === 'del') cb.onDel();
    };
  });
}

// deleteOfflineCam 从本机列表移除一台设备（不影响小米账号）
function deleteOfflineCam(did, dev, c){
  if(!confirm('移除「' + (dev.alias || dev.name || did) + '」？\n\n'
    + '只从本机列表移除，不影响小米账号。\n'
    + '下次同步设备时会重新出现 —— 如需永久隐藏请加入忽略名单。')) return;
  api('/api/devices/hide', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ did: did, hidden: true })
  }).then(function(){
    toast('已移除', 'ok');
    devices = (devices || []).filter(function(x){ return x.did !== did; });
    renderDevices(c);
  }).catch(function(e){ toast('移除失败：' + e.message, 'err'); });
}

function renderDevices(c){
  c.innerHTML = '<div class="page__inner">' + loading() + '</div>';

  loadDevices().then(function(st){
    var all = devices || [];
    // 顺带查凭据状态：受限时在顶部显示明确提示
    // （否则用户看到灰掉的缩略图，会以为摄像头坏了）
    checkCredBanner();

    var now = new Date();
    var week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 '
      + week[now.getDay()] + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());

    function nOnline(){ return all.filter(function(d){ return d.isOnline; }).length; }
    function nShared(){ return all.filter(isShared).length; }
    function nFav(){ return all.filter(function(d){ return isFav(d.did); }).length; }

    function filtered(){
      var l = all.slice();
      if(devFilter === 'online')  l = all.filter(function(d){ return d.isOnline; });
      if(devFilter === 'offline') l = all.filter(function(d){ return !d.isOnline; });
      if(devFilter === 'shared')  l = all.filter(isShared);
      if(devFilter === 'fav')     l = all.filter(function(d){ return isFav(d.did); });
      var q = (devSearch || '').trim().toLowerCase();
      if(q){
        l = l.filter(function(d){
          return ((d.alias||'')+' '+(d.aliasEn||'')+' '+d.name).toLowerCase().indexOf(q) >= 0;
        });
      }
      return l;
    }

    function chip(k, label, count, dot, ic){
      var on = devFilter === k;
      // 「离线」在数量 >0 时整枚 chip 用警示色（用户反馈：原来和「共享/收藏」
      // 完全同色，看不出这是个需要关注的状态 —— 圆点虽是橙的，但太小）。
      var warn = (dot === 'is-offline' && count > 0);
      return '<button class="chip' + (on ? ' is-active' : '') + (warn ? ' is-warn' : '')
        + '" data-f="' + k + '" type="button">'
        + (dot ? '<span class="status-dot ' + dot + '"></span>' : (ic ? icon(ic,14) : ''))
        + '<span>' + label + '</span>'
        + '<span class="chip__n">' + count + '</span>'
        + '</button>';
    }

    c.innerHTML = '<div class="page__inner">'

      + '<div class="list-head">'
      +   '<div class="list-head__main">'
      +     '<h1 class="list-head__title">摄像头列表</h1>'
      +     '<div class="list-head__en">管理设备、查看状态与画面</div>'
      +   '</div>'
      +   '<div class="list-head__acts">'
      +     '<button class="btn" id="btnToGrid">' + icon('grid',15) + '多路预览</button>'
      +     '<span class="list-head__date">' + esc(dateStr) + '</span>'
      +   '</div>'
      + '</div>'

      + '<div class="list-stat">'
      +   '<span class="status-dot ' + (nOnline() ? 'is-online' : 'is-offline') + '"></span>'
      +   '<span>' + all.length + ' 台设备，' + nOnline() + ' 台在线</span>'
      + '</div>'

      + '<div class="filters filters--rich">'
      +   chip('all',     '全部', all.length, '', '')
      +   chip('online',  '在线', nOnline(), 'is-online', '')
      +   chip('offline', '离线', all.length - nOnline(), 'is-offline', '')
      +   chip('shared',  '共享', nShared(), '', 'users')
      +   chip('fav',     '收藏', nFav(), '', 'star')
      +   '<span class="filters__spacer"></span>'
      +   '<div class="segmented">'
      +     '<button class="segmented__btn' + (devView==='grid'?' is-active':'') + '" data-view="grid" title="网格">' + icon('grid',15) + '</button>'
      +     '<button class="segmented__btn' + (devView==='list'?' is-active':'') + '" data-view="list" title="列表">' + icon('list',15) + '</button>'
      +   '</div>'
      +   '<div class="search filters__search">'
      +     icon('search',15)
      +     '<input class="input" id="devSearchBox" type="search" placeholder="搜索摄像头…" value="' + esc(devSearch || '') + '">'
      +   '</div>'
      + '</div>'

      + '<div class="cam-grid' + (devView==='list' ? ' cam-grid--list' : '') + '"></div>'
      + '</div>';

    // ---- 只重建网格（无痕切换）----
    // applyList 原地更新网格。
    //
    // 关键：**复用已有的卡片节点**，只增删差异部分。
    // 直接 grid.innerHTML = ... 会让 <img> 重新加载，
    // 表现为切换筛选时画面闪一下（无痕加载的反面）。
    function applyList(){
      var grid = c.querySelector('.cam-grid');
      if(!grid) return;
      var list = filtered();
      grid.className = 'cam-grid' + (devView==='list' ? ' cam-grid--list' : '');

      if(!list.length){
        grid.innerHTML = empty('cam','没有匹配的摄像头','换个筛选条件或清空搜索试试','');
        return;
      }

      // 空状态占位要清掉
      var ph = grid.querySelector('.empty');
      if(ph) ph.remove();

      var existing = {};
      Array.prototype.forEach.call(grid.querySelectorAll('.cam-card'), function(el){
        existing[el.dataset.did] = el;
      });

      var wanted = {};
      list.forEach(function(d){
        wanted[d.did] = true;
        var el = existing[d.did];
        if(!el){
          // 新出现的：插入
          var tmp = document.createElement('div');
          tmp.innerHTML = camCardHTML(d);
          el = tmp.firstElementChild;
          grid.appendChild(el);
          loadCameraSnapsFor(el, d.did);
        }
        // 保证顺序正确（已存在且位置对时不移动 DOM，避免图片重载）
        if(grid.children[list.indexOf(d)] !== el && el.parentNode === grid){
          grid.insertBefore(el, grid.children[list.indexOf(d)] || null);
        }
      });

      // 移除不再需要的
      Array.prototype.forEach.call(grid.querySelectorAll('.cam-card'), function(el){
        if(!wanted[el.dataset.did]) el.remove();
      });

      bindCards();
    }

    function bindCards(){
      Array.prototype.forEach.call(c.querySelectorAll('.cam-card'), function(el){
        // 卡片主体点击：在线 -> 看实时；离线 -> 设备信息弹窗。
        // 不再区分「离线卡片另绑一套 onclick」—— 入口统一（用户反馈第 4 条）。
        el.onclick = function(ev){
          if(ev.target.closest('[data-fav]') || ev.target.closest('[data-more]')
             || ev.target.closest('[data-info]') || ev.target.closest('[data-refresh-thumb]')) return;
          var d = all.filter(function(x){ return x.did === el.dataset.did; })[0];
          if(!d) return;
          if(d.isOnline) gotoLive(d.did);
          else showRenameDialog(d.did, d);
        };
        el.oncontextmenu = function(ev){
          ev.preventDefault();
          var d = all.filter(function(x){ return x.did === el.dataset.did; })[0];
          if(d) showRenameDialog(d.did, d);
        };
      });

      // 「更多」菜单（用户反馈第 4 条）：
      // 所有卡片统一入口，删除等破坏性操作收进二级。
      Array.prototype.forEach.call(c.querySelectorAll('[data-more]'), function(b){
        b.onclick = function(ev){
          ev.stopPropagation();
          var did = this.dataset.more;
          var d = all.filter(function(x){ return x.did === did; })[0] || {};
          var on = !!d.isOnline;
          showCamMenu(this, d, {
            onInfo: function(){ devDetailDid = did; page='device'; renderMenu(); render(); },
            onFav:  function(){ setFav(did, !isFav(did)); renderDevices(c); },
            onRefreshSnap: function(){
              var card = c.querySelector('.cam-card[data-did="' + did + '"]');
              if(card) {
                var btn = card.querySelector('[data-refresh-thumb]');
                if(btn) btn.classList.add('is-spinning');
                toast('正在刷新抓取最新画面…', 'info');
                loadCameraSnapsFor(card, did, true);
              }
            },
            onDel:  function(){ deleteOfflineCam(did, d, all, c); }
          }, on);
        };
      });

      // 「详情」按钮 -> 设备详情页
  Array.prototype.forEach.call(c.querySelectorAll('[data-info]'), function(b){
    b.onclick = function(e){
      e.stopPropagation();
      devDetailDid = this.dataset.info;
      page = 'device';
      window.scrollTo(0, 0);
      renderMenu();
      render();
    };
  });

  Array.prototype.forEach.call(c.querySelectorAll('[data-fav]'), function(b){
        b.onclick = function(ev){
          ev.stopPropagation();
          var did = b.dataset.fav;
          var nv = !isFav(did);
          setFav(did, nv);
          var dev = all.filter(function(x){ return x.did === did; })[0];
          if(dev) dev.favorite = nv;
          api('/api/devices/meta', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ did: did, favorite: nv })
          }).catch(function(){});
          // 原地更新这一张卡片的状态，不重建列表
          b.classList.toggle('is-active', nv);
          b.querySelector('svg').setAttribute('fill', nv ? 'currentColor' : 'none');
          var fn = c.querySelector('[data-f="fav"] .chip__n');
          if(fn) fn.textContent = nFav();
        };
      });

      // 封面刷新按钮点击
      Array.prototype.forEach.call(c.querySelectorAll('[data-refresh-thumb]'), function(btn){
        btn.onclick = function(ev){
          ev.stopPropagation();
          var did = this.dataset.refreshThumb;
          var card = this.closest('.cam-card');
          if(!card || !did) return;
          this.classList.add('is-spinning');
          toast('正在刷新抓取最新画面…', 'info');
          loadCameraSnapsFor(card, did, true);
        };
      });
    }

    // ---- 筛选 / 视图（无痕）----
    var bg2 = document.getElementById('btnToGrid');
    if(bg2) bg2.onclick = function(){ page = 'grid'; renderMenu(); render(); };

    Array.prototype.forEach.call(c.querySelectorAll('[data-f]'), function(b){
      b.onclick = function(){
        devFilter = this.dataset.f;
        Array.prototype.forEach.call(c.querySelectorAll('[data-f]'), function(x){
          x.classList.toggle('is-active', x.dataset.f === devFilter);
        });
        applyList();
      };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-view]'), function(b){
      b.onclick = function(){
        devView = this.dataset.view;
        Array.prototype.forEach.call(c.querySelectorAll('[data-view]'), function(x){
          x.classList.toggle('is-active', x.dataset.view === devView);
        });
        applyList();
      };
    });

    var sb = document.getElementById('devSearchBox');
    if(sb){
      var deb = null;
      sb.oninput = function(){
        devSearch = this.value;
        if(deb) clearTimeout(deb);
        deb = setTimeout(applyList, 180);
      };
    }

    applyList();
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner"><div class="card">'
      + empty('close','加载失败', err.message, '') + '</div></div>';
  });
}

function clockNow(){
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

function isFav(did){
  // 服务端收藏优先，其次本地
  var d = (devices || []).filter(function(x){ return x.did === did; })[0];
  if(d && d.favorite) return true;
  return getFav(did);
}

// loadCameraSnaps 加载摄像头缩略图
//
// ===== 为什么不用实时快照 =====
//
// 抓一张快照要 3-9 秒（新建 ffmpeg + 等关键帧）。
// 设备列表如果有 N 台，首屏要等 10-30 秒，而且 CPU 峰值很高。
//
// 服务端提供了 /api/live/thumb：
//   - 有缓存 -> 立刻返回（后台自动刷新）
//   - 无缓存 -> 202，我们稍后重试
//
// 所以这里：先并发请求，202 的排队重试。
function loadCameraSnaps(root){
  var imgs = Array.prototype.slice.call(root.querySelectorAll('img[data-snap]'));

  var load = function(img, attempt){
    if(!document.body.contains(img)) return;

    // 用 fetch 而不是 img.src，这样能拿到状态码（区分 202 和 200）
    fetch(apiUrl('/api/live/thumb?did=' + encodeURIComponent(img.dataset.snap) + '&w=640'), { cache: 'no-store' })
      .then(function(r){
        // 服务端在静默期会回退到【磁盘历史画面】并用响应头标明：
        //   X-Thumb-Disk: 1        -> 这不是实时画面
        //   X-Thumb-Time: 2026-09-18 08:51
        // 必须把这个时间显示出来 —— 否则角标用当前时间，
        // 会让人以为画面是实时的（用户实测被误导过）。
        var ft = r.headers.get('X-Thumb-Time');
        if(ft) img.dataset.frameTime = ft;
        if(r.headers.get('X-Thumb-Disk')) img.dataset.historic = '1';

        if(r.status === 202){
          // 服务端还在生成，稍后重试。
          //
          // 原来 10 次 × 3 秒 = 30 秒 —— 太久，用户盯着破图干等。
          // 改成 6 次 × 2 秒 = 12 秒：正常缩略图 1~3 秒就好，
          // 12 秒还拿不到基本就是凭据问题，早点告诉用户。
          if(attempt < 6) setTimeout(function(){ load(img, attempt + 1); }, 2000);
          return null;
        }
        if(!r.ok) throw new Error('http ' + r.status);
        return r.blob();
      })
      .then(function(b){
        if(!b) return;
        if(!document.body.contains(img)) return;
        img.src = URL.createObjectURL(b);
        img.classList.add('is-loaded');

        // 角标：历史画面显示【真实拍摄时间】+ 历史标记，
        // 实时画面才显示当前时间。
        applyThumbClock(img.parentNode, img);
      })
      .catch(function(){
        var box = img.parentNode;
        if(box && document.body.contains(box)){
          // 重试了 10 次还拿不到 —— 大概率是设备凭据问题
          // （小米限流时无法申请 P2P 凭据，缩略图就永远生成不出来）
          // 明确写出来，避免用户以为「摄像头坏了」
          box.innerHTML = '<div class="camera-card__placeholder">'
            + icon('cam-off',28)
            + '<span>暂无画面</span>'
            + '<span class="camera-card__hint">设备凭据不可用（可能被小米限流）</span>'
            + '</div>';
        }
      });
  };

  // 并发请求（服务端有缓存，不会压满）
  imgs.forEach(function(img, i){
    setTimeout(function(){ load(img, 0); }, i * 150);

    // 时间角标
    var clk = root.querySelector('[data-clock="' + img.dataset.snap + '"]');
    if(clk) clk.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  });
}

function bindDeviceActions(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var did = b.dataset.did, act = b.dataset.act;
      if(act==="live") gotoLive(did);
      else if(act==="snap") snap(did);
      else if(act==="rec") startRec(did);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".dev-preview"), function(el){
    el.onclick = function(){ gotoLive(el.dataset.did); };
  });
}

function secToHms(s){
  s = Math.max(0, Math.min(86399, Math.round(s || 0)));
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(sec);
}

function timeToSec(tStr){
  if(!tStr) return 0;
  var s = String(tStr).trim();
  if(s.indexOf(' ') >= 0) s = s.split(' ')[1] || '';
  if(s.indexOf('T') >= 0) s = s.split('T')[1] || '';
  var parts = s.split(':');
  if(parts.length >= 3){
    return parseInt(parts[0], 10)*3600 + parseInt(parts[1], 10)*60 + parseInt(parts[2], 10);
  }
  if(parts.length === 2){
    return parseInt(parts[0], 10)*3600 + parseInt(parts[1], 10)*60;
  }
  return 0;
}

// gotoReplay 跳到回放页并定位到指定设备/时刻
function gotoReplay(did, time){
  page = 'recordings';
  if(did){
    currentDid = did;
    recState.targetDid = did;
    var d = (devices || []).filter(function(x){ return x.did === did; })[0];
    if(d && d.name) recState.dev = d.name;
  }
  if(time){
    replaySeekTime = time;
    recState.targetTime = time;
    var day = String(time).slice(0, 10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(day)){
      recState.date = day;
    }
  }
  setPageTitle('回放');
  renderMenu();
  render();
}
var replaySeekTime = '';

// setPageTitle 兼容旧代码。
//
// 顶栏导航改版后 #pageTitle 元素已移除（标题现在在页面内容里），
// 但多处旧代码还在写它 —— 未加保护会抛
// "Cannot set properties of null"，导致整个导航静默失败。
function setPageTitle(t){
  var el = document.getElementById('pageTitle');
  if(el) el.textContent = t;
  // 顺便同步文档标题，浏览器标签页也好看
  if(t) document.title = t + ' · MiCam';
}

function gotoLive(did){
  page = "live";
  currentDid = did;
  setPageTitle("实时预览");
  renderMenu();
  render();
}

// ===== 页面：首页 / 家庭概览 =====
//
// 一次请求 /api/home 拿齐所有数据，减少往返。
function renderHome(c){
  c.innerHTML = '<div class="page__inner">' + loading('加载中…') + '</div>';

  api("/api/home").then(function(h){
    TODAY_EVENTS = h.todayEvents || 0;
    renderMenu();

    var now = new Date(h.now ? h.now.replace(' ', 'T') : Date.now());
    var week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 '
      + week[now.getDay()] + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());

    var online = h.online || 0;
    var total  = h.total || 0;
    var offlineN = (typeof h.offline === 'number') ? h.offline : Math.max(0, total - online);
    var hasOffline = offlineN > 0;

    // 首页摄像头：**全部展示**（含离线），离线卡片本身就是最强的警示
    // （原来 filter(online) 只显示在线设备，3 台里少一台，网格右侧留空）
    //
    // 在线优先排序：这是监控面板，先看「现在能看到什么」；
    // 离线设备仍然展示（灰色占位 + 琥珀徽章），但不占第一个位置。
    var cams = (h.cameras || []).slice().sort(function(a, b){
      return (b.online ? 1 : 0) - (a.online ? 1 : 0);
    });

    // 存储：整套取自 /api/home 的同一份数据，不再另取 /api/storage
    // —— 修掉「首页 68.9% vs 存储面板 67.5%」的数据分叉
    var pct = Number(h.storagePct) || 0;
    var usedGB  = Number(h.storageUsed)  || 0;
    var totalGB = Number(h.storageTotal) || 0;
    var freeGB  = Number(h.storageFree)  || 0;

    // 页头状态：正常/异常用语义色区分，离线时不再是一行灰字
    var headTone = (!total || online === 0) ? ' is-danger' : (hasOffline ? ' is-warn' : ' is-ok');

    var html = '<div class="page__inner">'

      // ---- 页头 ----
      + '<div class="home-head">'
      +   '<div class="home-head__main">'
      +     '<div class="home-head__title">家庭概览</div>'
      +     '<div class="home-head__sub' + headTone + '">'
      +       (hasOffline || !total || online === 0 ? icon('alert', 14) : icon('check', 14))
      +       '<span>' + esc(h.statusText || '') + '</span>'
      +     '</div>'
      +   '</div>'
      +   '<div class="home-head__date">' + esc(dateStr) + '</div>'
      + '</div>'

      // ---- 三张概览卡 ----
      //
      // ⚠️ 三张卡必须**结构完全一致**：图标 + 标签 + 数值 + 副行 + 右侧。
      //    曾经「今日事件」没有副行，而另外两张有 —— 于是它的文字块
      //    整体下移约 9px，三张卡的基线对不齐（实测 bodyCY 208.8 vs 217.5）。
      //    现在每张卡都给 note（没有信息时给一句中性的说明），结构统一。
      // ---- 限流静默警告横幅 ----
      + (h.silenced
          ? '<div style="background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.4);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">'
          + icon('alert-triangle',18)
          + '<div><b style="color:#f59e0b">移动侦测暂停中</b>'
          + '<div style="font-size:13px;color:var(--text-2);margin-top:2px">'
          + '小米云 API 触发限流保护，约 ' + (h.silenceMin || 0) + ' 分钟后自动恢复。恢复前不会产生新事件，录像不受影响。'
          + '</div></div></div>'
          : '')

      + '<div class="stat-cards">'
      +   statCard('camera', '在线摄像头',
                online + ' <small>/ ' + total + '</small>', 'devices',
                { tone: hasOffline ? 'warn' : 'ok',
                  note: hasOffline ? offlineN + ' 台离线' : '全部在线' })
      +   statCard('calendar', '今日事件', String(h.todayEvents || 0), 'events',
                // 中性信息色（蓝）——事件数本身无好坏，不该用警示色
                { tone: 'info',
                  note: (h.todayEvents ? '过去 24 小时' : '过去 24 小时无事件') })
      +   statCard('hard-drive', '存储', pct.toFixed(1) + '<small>%</small>', 'storage',
                // 左色条按阈值变色：<80% 绿 / 80-95% 橙 / >95% 红。
                // 数字**不跟随**（ok 态保持中性）—— 绿色数字会被读成"很好/很空"，
                // 而 67% 已用并不值得表扬；只有越过阈值才染数字。
                { tone: pct > 95 ? 'danger' : pct > 80 ? 'warn' : 'ok',
                  note: totalGB ? usedGB.toFixed(0) + ' / ' + totalGB.toFixed(0) + ' GB' : '',
                  ring: { pct: pct } })
      + '</div>';

    var ui = h.ui || window.__MICAM_UI__ || {};
    window.__MICAM_UI__ = ui;
    var showCams = ui.homeShowCameras !== false;
    var showEvents = ui.homeShowEvents !== false;
    var showStorage = ui.homeShowStorage !== false;
    var showEn = ui.showEnglishAlias !== false;

    // ---- 摄像头（受界面偏好控制）----
    if(showCams){
      html += '<section class="card" style="margin-bottom:var(--space-5)">'
        +   '<div class="sec-head">'
        +     '<span class="sec-head__title">摄像头' + (showEn ? ' <span class="sec-head__en">实时监控全部设备</span>' : '') + '</span>'
        +     (hasOffline
                ? '<span class="sec-head__warn">' + icon('alert',13) + offlineN + ' 台离线</span>'
                : '')
        +     '<a class="sec-head__more" href="javascript:;" data-go="devices">查看全部 ' + icon('chevron-right',14) + '</a>'
        +   '</div>'
        +   '<div class="cam-row">' + (cams.length
                ? cams.map(camTile).join('')
                : empty('camera','还没有摄像头','到「账号」页扫码登录后获取设备','')) + '</div>'
        + '</section>';
    }

    // ---- 底部两栏（受界面偏好控制）----
    if(showEvents || showStorage){
      html += '<div class="home-cols"' + (!showEvents || !showStorage ? ' style="grid-template-columns:1fr"' : '') + '>';
      if(showEvents){
        html += '<section class="card">'
          +     '<div class="sec-head">'
          +       '<span class="sec-head__title">最近事件' + (showEn ? ' <span class="sec-head__en">检测到画面变化时自动记录</span>' : '') + '</span>'
          +       '<a class="sec-head__more" href="javascript:;" data-go="events">查看全部 ' + icon('chevron-right',14) + '</a>'
          +     '</div>'
          +     '<div class="event-list">' + ((h.events||[]).length
                  ? h.events.map(eventItem).join('')
                  : eventEmpty()) + '</div>'
          +   '</section>';
      }
      if(showStorage){
        html += '<section class="card">'
          +     '<div class="sec-head">'
          +       '<span class="sec-head__title">' + icon('hard-drive',15) + ' 存储' + (showEn ? ' <span class="sec-head__en">录像占用与可录时长</span>' : '') + '</span>'
          +       '<a class="sec-head__more" href="javascript:;" data-go="storage">详情 ' + icon('chevron-right',14) + '</a>'
          +     '</div>'
          +     '<div class="storage-body" id="homeStorage">' + loading('读取中…') + '</div>'
          +   '</section>';
      }
      html += '</div>';
    }

    html += '</div>';
    c.innerHTML = html;

    // 存储面板
    if(showStorage){
      renderHomeStorage({
        pct: pct, usedGB: usedGB, freeGB: freeGB, totalGB: totalGB,
        estHours: Number(h.storageEstHours) || 0,
        cams: h.recCams || [],
        rec: { fileCount: h.recFiles || 0, totalMB: h.recMB || 0 }
      });
    }

    // 摄像头缩略图
    if(showCams){
      loadHomeThumbs(c);
    }

    // 首页摄像头 -> 实时预览
    Array.prototype.forEach.call(c.querySelectorAll('.cam-tile[data-did]'), function(el){
      if(el.classList.contains('is-offline')) return;
      el.onclick = function(){ gotoLive(el.dataset.did); };
    });

    // 离线摄像头 -> 诊断弹窗
    Array.prototype.forEach.call(c.querySelectorAll('[data-diag-did]'), function(b){
      b.onclick = function(e){
        e.stopPropagation();
        showOfflineDiag(this.dataset.diagDid, this.dataset.diagName);
      };
    });

    // 最近事件 -> 回放（跳到该设备该时刻）
    Array.prototype.forEach.call(c.querySelectorAll('.event-item'), function(el){
      el.onclick = function(){ gotoReplay(el.dataset.ev, el.dataset.evt); };
    });

    // 「查看全部」跳转
    Array.prototype.forEach.call(c.querySelectorAll('[data-go]'), function(a){
      a.onclick = function(){
        page = a.dataset.go;
        renderMenu(); render();
        var ct = document.getElementById('content');
        if(ct) ct.scrollTop = 0;
      };
    });
  }).catch(function(e){
    c.innerHTML = '<div class="page__inner">' + errorCard(e, function(){ renderHome(c); }) + '</div>';
  });
}

// errorCard 统一的错误卡片（带重试）
//
// 「Failed to fetch」在部署重启期间必然出现一次，
// 用户点一下重试就行，不该是死路。
function errorCard(e, retry){
  var msg = (e && e.message) || String(e);
  if(msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('fetch') >= 0){
    msg = '无法连接插件服务（可能正在重启）';
  }
  var id = 'retry_' + Math.random().toString(36).slice(2, 8);
  setTimeout(function(){
    var b = document.getElementById(id);
    if(b) b.onclick = function(){ retry(); };
  }, 0);
  return '<div class="card">'
    + empty('close', '加载失败', msg,
        '<div class="empty__action"><button class="btn btn--primary" id="' + id + '">'
        + icon('refresh',14) + '重试</button></div>')
    + '</div>';
}

// localDate 本地日期 YYYY-MM-DD
//
// **不要用 toISOString()** —— 那是 UTC，北京时间早上 8 点前会算成前一天，
// 导致「今天」筛选查不到任何事件（踩过的坑）。
function localDate(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function pad2(n){ return n < 10 ? '0'+n : ''+n; }

// statCard 概览卡
// statCard 首页概览卡
//
// opt（可选）：
//   tone   'ok' | 'warn' | 'danger' —— 给数字上语义色（在线=绿 / 离线=橙 / 存储告急=红）
//   note   数字下方的一行小字
//   ring   {pct} 时用环形进度替代纯文字百分比
//
// 注：曾有 opt.alert 在图标右上角挂橙色小圆点，已移除（2026-10-12）——
// 它挂在相机图标上会被读成「这台摄像头有警告」，与卡片语义打架，
// 且与「N 台离线」文字重复。状态只用 颜色 + 文字 表达。
function statCard(ic, label, value, go, opt){
  opt = opt || {};
  var tone = opt.tone ? ' is-' + opt.tone : '';
  return '<button class="stat-card' + tone + '" data-go="' + go + '" type="button">'
    + '<span class="stat-card__icon">' + icon(ic, 20) + '</span>'
    + '<span class="stat-card__body">'
    +   '<span class="stat-card__label">' + esc(label) + '</span>'
    +   '<span class="stat-card__value">' + value + '</span>'
    // 副行**始终渲染**（内容可为空）：
    // 靠 CSS 的 min-height 占位，这样任何一张卡缺副行也不会
    // 导致文字块高度变化、三张卡基线错位。
    +   '<span class="stat-card__note">' + esc(opt.note || '') + '</span>'
    + '</span>'
    + (opt.ring ? ringSmall(opt.ring.pct) : '<span class="stat-card__chev">' + icon('chevron-right', 16) + '</span>')
    + '</button>';
}

// ringSmall 概览卡右侧的小环形进度（存储用）
//
// ⚠️ 必须一眼看出是「静态进度」而不是 loading spinner（用户反馈第 1 条）。
//    实测这个环本来是静止的（animation:none），但视觉上像 spinner：
//    底轨太暗几乎看不见 + 细弧 + 圆头端点 —— 正好是加载图标的典型长相，
//    只剩下一条孤零零的弧在转。
//
//    改成「仪表盘」的四个特征：
//      ① 底轨加粗并用可见的实色，形成清晰的「轨道 + 填充」两层
//      ② 用 butt 端点（不用圆头）—— 圆头弧正是 spinner 的特征
//      ③ 环加粗（4px），像仪表盘而不是细线
//      ④ 弧色与下方存储面板的进度条同色系，形成呼应
//
//    刻意**不在环内写数字**：同一张卡已经有「67.5%」大字，
//    再放一个百分比就是同一个数出现两次（之前刚修过同类问题）。
function ringSmall(pct){
  pct = Math.max(0, Math.min(100, Number(pct) || 0));
  var R = 15, C = 2 * Math.PI * R;
  var dash = (pct / 100) * C;
  // 阈值与左色条一致（<80 绿 / 80-95 橙 / >95 红）
  var cls = pct > 95 ? ' is-danger' : pct > 80 ? ' is-warn' : ' is-ok';
  // 中心数字：用户反馈「一眼要能看出这是静态数据不是在转圈」——
  // 环里有数字是**最强**的"非 spinner"信号（spinner 不可能带数字）。
  // 代价：与卡片大号 67.5% 有轻微重复，是刻意的取舍（可读性 > 零冗余）。
  var label = pct >= 100 ? '99+' : Math.round(pct) + '%';
  return '<svg class="stat-ring' + cls + '" viewBox="0 0 36 36" role="img"'
    + ' style="--ring-dash:' + dash.toFixed(2) + ';--ring-circ:' + C.toFixed(2) + '"'
    + ' aria-label="存储已用 ' + pct.toFixed(1) + '%">'
    + '<circle class="stat-ring__track" cx="18" cy="18" r="' + R + '" fill="none" stroke-width="5"/>'
    + '<circle class="stat-ring__fill" cx="18" cy="18" r="' + R + '" fill="none" stroke-width="5"'
    +   ' transform="rotate(-90 18 18)"/>'
    + '<text class="stat-ring__txt" x="18" y="18" text-anchor="middle"'
    +   ' dominant-baseline="central" font-size="' + (label.length > 3 ? 7.5 : 9) + '">'
    +   label + '</text>'
    + '</svg>';
}

// camTile 首页的摄像头图块（名称+英文名+时间叠加在底部）
//
// ⚠️ 状态徽章必须放【右上角】，不能放左上角（2026-10-12 修复）。
//
// 原因：小米摄像头**自己在画面左上角烧录了 OSD**
//（Mi logo + "2026/10/11 23:37:43"），这是视频流里的像素，前端无法去掉。
// 我们原来的「● 在线」徽章也定位在左上角 -> 必然和它叠在一起，
// 实测截图里两者互相压字，都看不清。
//
// 现在：状态徽章右上角，摄像头自带时间戳留在左上角，各占一角互不干扰。
// 同时给顶部加一层很淡的黑色渐变（.cam-tile__scrim），
// 保证浅色画面（白天/雪地）下徽章依然清晰可读。
function camTile(d){
  var on = d.online;
  var name = d.alias || d.name;
  var en = d.aliasEn || '';
  var showEn = !window.__MICAM_UI__ || window.__MICAM_UI__.showEnglishAlias !== false;
  var badge = '<span class="cam-tile__badge' + (on ? '' : ' is-offline') + '">'
    + '<span class="status-dot ' + (on ? 'is-online' : 'is-offline') + '"></span>'
    + (on ? '在线' : '离线') + '</span>';

  if (!on) {
    return '<div class="cam-tile is-offline" data-did="' + esc(d.did) + '">'
      + badge
      + '<div class="cam-tile__off">'
      +   icon('cam-off', 30)
      +   '<div class="cam-tile__off-title">摄像头离线</div>'
      // 文案与摄像头列表页统一成「最后在线 <时间>」（原来写"上次在线："）
      +   (d.lastSeen
            ? '<div class="cam-tile__off-sub">最后在线 <b>' + esc(fmtAgo(d.lastSeen)) + '</b></div>'
            : '<div class="cam-tile__off-sub">暂无上线记录</div>')
      +   '<button class="cam-tile__diag-btn" data-diag-did="' + esc(d.did) + '" data-diag-name="' + esc(name) + '">'
      +     icon('activity', 12) + '检查与诊断</button>'
      + '</div>'
      + '<div class="cam-tile__foot">'
      +   '<span class="cam-tile__name">' + esc(name) + '</span>'
      +   (en && showEn ? '<span class="cam-tile__en">' + esc(en) + '</span>' : '')
      + '</div>'
      + '</div>';
  }

  return '<div class="cam-tile" data-did="' + esc(d.did) + '">'
    + '<img data-home-thumb="' + esc(d.did) + '" alt="">'
    + '<span class="cam-tile__scrim" aria-hidden="true"></span>'
    + badge
    + '<div class="cam-tile__foot">'
    +   '<span class="cam-tile__name">' + esc(name) + '</span>'
    +   (en && showEn ? '<span class="cam-tile__en">' + esc(en) + '</span>' : '')
    +   '<span class="cam-tile__time" data-home-time="' + esc(d.did) + '">'
    +     (d.thumbAt ? fmtClock(d.thumbAt) : '刚刚') + '</span>'
    + '</div>'
    + '</div>';
}

function fmtClock(ts){
  var d = new Date(ts * 1000);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

// fmtAgo 相对时间
//
// 对齐效果图的表达：
//   < 1 分钟   -> 刚刚
//   < 1 小时   -> X 分钟前
//   今天       -> 今天 HH:MM
//   昨天       -> 昨天 HH:MM
//   更早       -> X 天前
function fmtAgo(s){
  if (!s) return '未知';
  var t = new Date(s.replace(' ', 'T'));
  if (isNaN(t)) return s;

  var now = new Date();
  var diff = now - t;
  if (diff < 0) return '刚刚';
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';

  var hm = pad2(t.getHours()) + ':' + pad2(t.getMinutes());
  if (t.toDateString() === now.toDateString()) return '今天 ' + hm;

  var y = new Date(now.getTime() - 86400000);
  if (t.toDateString() === y.toDateString()) return '昨天 ' + hm;

  var days = Math.floor(diff / 86400000);
  if (days < 30) return days + ' 天前';
  return (t.getMonth()+1) + '月' + t.getDate() + '日';
}

// applyThumbClock 根据图片是【实时】还是【磁盘历史画面】设置角标。
//
// 背景（2026-09-24）：静默期缩略图回退到磁盘历史帧后，
// 角标仍用 clockNow()（当前时间），用户看到 "23:42:52" 以为画面是实时的
// —— 实测被误导过（"好像恢复了"）。
// 现在：历史画面显示真实拍摄时间 + is-historic 样式（琥珀色 + 历史标签）。
function applyThumbClock(el, img){
  if(!el || !img) return;
  var clk = el.querySelector('[data-clock], [data-gclock]');
  var wrap = el.querySelector('.cam-card__time, .gtile__time');
  if(!clk) return;

  if(img.dataset.historic){
    var ft = img.dataset.frameTime || '';
    // "2026-09-18 08:51" -> "09-18 08:51"
    clk.textContent = ft.length >= 16 ? ft.slice(5) : (ft || '历史');
    if(wrap){
      wrap.classList.add('is-historic');
      var dot = wrap.querySelector('.rec-dot');
      if(dot) dot.classList.add('is-historic');
    }
  } else {
    clk.textContent = clockNow();
  }
}


// ===== 全局角标修正（2026-09-24）=====
//
// 教训：摄像头页有【多条】缩略图加载路径
//（loadCameraSnaps / loadCameraSnapsFor / loadSideThumbs / 网格视图 …），
// 逐条改很容易漏（实测漏了一条，改完角标还是显示当前时间）。
//
// 这里用一个【捕获阶段】的 load 监听做兜底：
// 任何 data-snap 图片加载完 -> 按 dataset.historic 决定角标。
// load 事件不冒泡，所以必须用 capture。
var thumbMetaCache = {};   // did -> {t: 查询时刻, historic, time}

document.addEventListener('load', function(e){
  var img = e.target;
  if(!img || img.tagName !== 'IMG') return;
  if(!img.dataset || !img.dataset.snap) return;
  var card = img.closest ? img.closest('.cam-card, .gtile') : null;
  if(!card) return;

  var did = img.dataset.snap;

  // 已经查过（60 秒内）直接用缓存
  var mc = thumbMetaCache[did];
  if(mc && Date.now() - mc.t < 60000){
    applyThumbClockFromMeta(card, mc);
    return;
  }

  // 问服务端这张图是实时还是历史 —— 与加载路径无关，所以不会漏
  fetch(apiUrl('/api/live/thumb/meta?did=' + encodeURIComponent(did)), { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(m){
      if(!m) return;
      m.t = Date.now();
      thumbMetaCache[did] = m;
      if(document.body.contains(card)) applyThumbClockFromMeta(card, m);
    })
    .catch(function(){});
}, true);

// ===== 角标定时扫描（兜底，2026-09-24）=====
//
// 为什么不用 load 事件：摄像头页有多条加载路径，实测事件钩子没抓到
//（图片可能是 blob URL、或在钩子注册前就已 complete）。
// 定时扫描不依赖任何事件，一定能覆盖到。
//
// 成本：每个 did 60 秒才查一次 meta（有缓存），扫描本身只是遍历 DOM。
setInterval(function(){
  var cards = document.querySelectorAll('.cam-card, .gtile');
  Array.prototype.forEach.call(cards, function(card){
    var img = card.querySelector('img[data-snap]');
    if(!img || !img.dataset || !img.dataset.snap) return;
    if(!img.complete || !img.naturalWidth) return;   // 还没加载完
    var did = img.dataset.snap;

    var mc = thumbMetaCache[did];
    // 只有【真实响应】才能用缓存 —— pending 标记不能当结果用。
    //
    // 早期写法把 pending 也存成 {t: Date.now()}，于是 2 秒后的扫描
    // 判定"缓存新鲜"直接 applyThumbClockFromMeta(pending)，
    // 而 pending.historic 是 undefined -> 走 else 分支设成当前时间。
    // 结果：拿到 meta 之前就已经把角标写错了，且之后不再更新。
    if(mc && mc.historic !== undefined && Date.now() - mc.t < 60000){
      applyThumbClockFromMeta(card, mc);
      return;
    }
    if(mc && mc.historic === undefined) return;   // 请求进行中
    thumbMetaCache[did] = { pending: true };
    fetch(apiUrl('/api/live/thumb/meta?did=' + encodeURIComponent(did)), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(m){
        if(!m) return;
        m.t = Date.now();
        thumbMetaCache[did] = m;
      })
      .catch(function(){ thumbMetaCache[did] = null; });
  });
}, 2000);

// applyThumbClockFromMeta 按服务端给的元数据设置角标。
function applyThumbClockFromMeta(card, m){
  if(!card || !m) return;
  var clk  = card.querySelector('[data-clock], [data-gclock]');
  var wrap = card.querySelector('.cam-card__time, .gtile__time');
  if(!clk) return;

  if(m.historic){
    var ft = m.time || '';
    clk.textContent = ft.length >= 16 ? ft.slice(5) : (ft || '历史');
    if(wrap){
      wrap.classList.add('is-historic');
      var dot = wrap.querySelector('.rec-dot');
      if(dot) dot.classList.add('is-historic');
    }
  } else {
    clk.textContent = clockNow();
    if(wrap) wrap.classList.remove('is-historic');
  }
}

// loadCameraSnapsFor 给单张卡片加载缩略图
function loadCameraSnapsFor(el, did, forceRefresh){
  var img = el.querySelector('img[data-snap]');
  if(!img) return;
  var spinBtn = el.querySelector('[data-refresh-thumb]');
  var stopSpin = function(){
    if(spinBtn) spinBtn.classList.remove('is-spinning');
  };
  var load = function(attempt){
    if(!document.body.contains(img)) { stopSpin(); return; }
    var url = apiUrl('/api/live/thumb?did=' + encodeURIComponent(did) + '&w=640');
    if(forceRefresh) url += '&refresh=1&t=' + Date.now();
    fetch(url, { cache:'no-store' })
      .then(function(r){
        var ft = r.headers.get('X-Thumb-Time');
        if(ft) img.dataset.frameTime = ft;
        if(r.headers.get('X-Thumb-Disk')) img.dataset.historic = '1';

        if(r.status === 202){
          if(attempt < 8) setTimeout(function(){ load(attempt+1); }, 1500);
          else stopSpin();
          return null;
        }
        if(!r.ok) { stopSpin(); throw new Error('http ' + r.status); }

        var age = r.headers.get('X-Thumb-Age');
        if(!forceRefresh && attempt === 0 && age){
          var isOld = age.indexOf('m') !== -1 || age.indexOf('h') !== -1;
          if(isOld){
            setTimeout(function(){
              if(document.body.contains(img)) {
                loadCameraSnapsFor(el, did, false);
              }
            }, 3500);
          }
        }
        stopSpin();
        return r.blob();
      })
      .then(function(b){
        if(!b || !document.body.contains(img)) return;
        if(img.src && img.src.indexOf('blob:') === 0) URL.revokeObjectURL(img.src);
        img.src = URL.createObjectURL(b);
        applyThumbClock(el, img);
      })
      .catch(function(){ stopSpin(); });
  };
  load(0);
}

// loadHomeThumbs 首页摄像头缩略图（走缓存接口，秒开）
//
// ===== 2026-10-11 改进：加载要有反馈 =====
//
// 用户反馈：「图片没加载起来的时候，应该有个缓冲的效果」。
//
// 原来 fetch 完成前 img 是空的（黑框），失败时 catch 静默吞掉，
// 用户完全不知道是在加载、还是坏了。现在：
//   · 加载中   -> 骨架屏 + 转圈动画
//   · 加载失败 -> 明确的「点击重试」提示
//   · 抓帧中   -> 「正在通过官方通道抓取」文案
function loadHomeThumbs(root){
  Array.prototype.forEach.call(root.querySelectorAll('img[data-home-thumb]'), function(img, i){
    var did = img.dataset.homeThumb;
    var wrap = img.parentElement;

    // 骨架屏（首次加载就显示，避免黑框）
    function showSkeleton(text){
      if(!wrap) return;
      if(wrap.querySelector('.thumb-skel')) {
        var s = wrap.querySelector('.thumb-skel__text');
        if(s && text) s.textContent = text;
        return;
      }
      var sk = document.createElement('div');
      sk.className = 'thumb-skel';
      sk.innerHTML = '<div class="thumb-skel__spin"></div>'
        + '<div class="thumb-skel__text">' + esc(text || '加载中…') + '</div>';
      wrap.appendChild(sk);
    }
    function hideSkeleton(){
      if(!wrap) return;
      var sk = wrap.querySelector('.thumb-skel');
      if(sk) sk.remove();
    }
    function showRetry(){
      if(!wrap) return;
      hideSkeleton();
      var el = document.createElement('div');
      el.className = 'thumb-retry';
      el.innerHTML = icon('refresh', 18) + '<span>加载失败</span><em>点击重试</em>';
      el.onclick = function(ev){ ev.stopPropagation(); el.remove(); load(0); };
      wrap.appendChild(el);
    }

    var load = function(attempt){
      if(!document.body.contains(img)) return;
      showSkeleton(attempt === 0 ? '加载中…' : '抓取画面…');
      fetch(apiUrl('/api/live/thumb?did=' + encodeURIComponent(did) + '&w=640'), { cache:'no-store' })
        .then(function(r){
          if(r.status === 202){
            // 后端正在抓帧：给明确的等待提示，最多重试 10 次
            if(attempt < 10){
              showSkeleton('正在抓取画面…');
              setTimeout(function(){ load(attempt+1); }, 3000);
            } else {
              showRetry();
            }
            return null;
          }
          if(!r.ok) throw new Error('http ' + r.status);
          // 缩略图一次加载成功即可，不后台死循环轮询
          return r.blob();
        })
        .then(function(b){
          if(!b || !document.body.contains(img)) return;
          hideSkeleton();
          img.style.opacity = '0';
          img.style.transition = 'opacity .25s';
          img.onload = function(){ img.style.opacity = '1'; };
          img.src = URL.createObjectURL(b);
          // 用后端给的真实时间（不是当前时间）
          var t = document.querySelector('[data-home-time="' + did + '"]');
          if(t) t.textContent = fmtClock(Date.now()/1000);
        })
        .catch(function(){
          showRetry();
        });
    };
    setTimeout(function(){ load(0); }, i * 150);
  });
}

// renderHomeStorage 首页存储卡片
//
// ⚠️ 数据由 renderHome 传入（与顶部「存储」概览卡**同源**），
//    这里不再自己请求 /api/storage。
//
// 历史 bug：概览卡取 /api/home 的 storagePct，本函数取 /api/storage 的
// disk.usedPercent，后端两处公式不同 -> 同一页面 68.9% 与 67.5% 并存。
// 现在只有一个数据来源，结构上不可能再分叉。
//
// ⚠️ 内容**不得与顶部概览卡重复**（用户反馈：两处都显示存储百分比，
//    一个环形一个条形，堆两份一样的数据还割裂）。
//    分工：
//      顶部卡 = 用量概览（百分比 + 环形 + 已用/总量）
//      本卡   = **录像明细**（每台设备录了多少、共多少段、能录多久）
//    百分比与进度条已从本卡移除，只保留顶部没有的信息。
function renderHomeStorage(d){
  var box = document.getElementById('homeStorage');
  if(!box) return;

  var pct     = Number(d.pct)     || 0;
  var freeGB  = Number(d.freeGB)  || 0;
  var hoursLeft = Number(d.estHours) || 0;
  var daysLeft  = hoursLeft / 24;
  var cams    = d.cams || [];
  var rec     = d.rec || {};

  var tone = pct > 90 ? ' is-danger' : pct > 75 ? ' is-warn' : '';
  var fileCount = Number(rec.fileCount) || 0;
  var totalMB   = Number(rec.totalMB)   || 0;

  // 每台设备的录像占用。
  //
  // 只列**有录像**的设备（避免一排 0 占地方），但必须补一句「另有 N 台暂无录像」——
  // 用户反馈：只看到 CW500 一条，以为"只有这一台摄像头在录像"，
  // 实际是另外两台确实没录到（不是数据缺失，后端 3 台都返回了）。
  // 不写这句的话，"只显示一台"会被读成信息不完整。
  var rows = cams.filter(function(c){ return (c.files || 0) > 0; });
  var noRecN = cams.length - rows.length;
  var maxMB = rows.reduce(function(m, c){ return Math.max(m, c.sizeMB || 0); }, 0);

  box.innerHTML = ''
    // 可录时长：这是顶部卡没有的信息，且与存储页同源
    + '<div class="storage-est">'
    +   '<span class="storage-est__num">' + (daysLeft >= 1 ? Math.floor(daysLeft) : Math.round(hoursLeft)) + '</span>'
    +   '<span class="storage-est__unit">' + (daysLeft >= 1 ? '天' : '小时') + '</span>'
    +   '<span class="storage-est__label">按当前码率还可录</span>'
    + '</div>'
    + '<div class="storage-meta">'
    +   '<span>录像 ' + fileCount + ' 段 · ' + fmtSizeMB(totalMB) + '</span>'
    +   '<span class="storage-hint">剩余 ' + freeGB.toFixed(0) + ' GB</span>'
    + '</div>'
    + (rows.length
        ? '<div class="storage-cams">'
          + rows.map(function(c){
              var w = maxMB > 0 ? Math.max(4, Math.round((c.sizeMB || 0) / maxMB * 100)) : 0;
              return '<div class="storage-cam">'
                + '<span class="storage-cam__name" title="' + esc(c.name || '') + '">'
                +   esc((c.name || '').replace('小米室外摄像机','')) + '</span>'
                + '<span class="storage-cam__bar"><span class="storage-cam__fill" style="width:' + w + '%"></span></span>'
                + '<span class="storage-cam__val">' + fmtSizeMB(c.sizeMB || 0) + '</span>'
                + '</div>';
            }).join('')
          // 补齐「另外几台」——避免"只显示一台"被读成数据不完整
          + (noRecN > 0
              ? '<div class="storage-cam storage-cam--none">'
                + '<span class="storage-cam__name" title="' + esc(cams.filter(function(c){return (c.files||0)===0;}).map(function(c){return c.name;}).join('、')) + '">'
                +   '另有 ' + noRecN + ' 台暂无录像</span>'
                + '</div>'
              : '')
          + '</div>'
        : emptyState('quiet', { title: cams.length + ' 台摄像头都没有录像文件', desc:'开启录像后这里会显示各设备的占用', compact:true }))
    + '<div class="storage-actions">'
    // 「清理」看起来更暗、像被禁用（用户反馈）。
    // 实测两个按钮的 bg/border/color/opacity **完全一致**（都是默认 .btn），
    // 视觉差异来自垃圾桶图标本身线条更细、笔画更少，在深色底上显得更"轻"。
    // 修法不是把两者刷成一样（那样反而丢掉了语义），而是明确区分：
    //   · 「存储设置」= 中性次要操作 -> 保持默认
    //   · 「清理」    = 破坏性操作   -> 用 btn--danger（红色描边文字）
    // 红色让它是"有意的强调"，而不是"灰掉的禁用"。
    +   '<button class="btn" id="homeSetBtn">' + icon('settings',14) + '存储设置</button>'
    +   '<button class="btn btn--danger" id="homeCleanBtn">' + icon('trash',14) + '清理</button>'
    + '</div>';

  var cb = document.getElementById('homeCleanBtn');
  if(cb) cb.onclick = function(){ page='storage'; renderMenu(); render(); };
  var sb = document.getElementById('homeSetBtn');
  if(sb) sb.onclick = function(){ page='storage'; renderMenu(); render(); };
}

// ===== 页面：事件中心（增强版，对齐效果图 P0-3）=====
//
// 布局：
//   筛选栏（日期范围 / 设备 / 类型 / 搜索 / 排序 / 批量选择 / 标记 / 导出）
//   类型胶囊（全部/有人/车辆/包裹/宠物/需关注/已标记）
//   按天分组 + **3 列网格卡片**
//   卡片：缩略图(时间+时长) / 摄像头+英文名 / AI标题 / 标签行+置信度
//         / 描述 / 播放 / 书签 / 更多
//   批量模式：工具栏 + 复选框 + 选中蓝框

// 当前查看的设备详情（did）
var devDetailDid = devDetailDid || '';

var evState = {
  range: 'today',       // today / yesterday / week / month / custom
  from: '',
  to: '',
  did: '',
  type: 'all',
  q: '',
  sort: 'newest',       // newest / oldest / confidence
  page: 1,
};
var evMarks = {};       // id -> {bookmark, watch, tags}
var evBulk = false;     // 批量选择模式
var evSel = {};         // 选中的事件 id
var evData = [];        // 当前数据

function evMark(id){ return evMarks[id] || {}; }
function evIsFav(id){ return !!evMark(id).bookmark; }
function evIsWatch(id){ return !!evMark(id).watch; }

function renderEvents(c){
  c.innerHTML = '<div class="page__inner">' + loading('加载事件…') + '</div>';

  var days = evState.range === 'today' ? 1
           : evState.range === 'yesterday' ? 2
           : evState.range === 'week' ? 7 : 30;

  // 至少取 7 天：近 7 天趋势图需要 7 天数据（用户反馈第 5 条）。
  // 页面内的日期筛选本来就是客户端过滤（见 paintEvents 的 list0），
  // 所以多取几天不影响筛选结果，只是让趋势图有数据可画。
  var fetchDays = Math.max(days, 7);

  api('/api/events?days=' + fetchDays + '&limit=800').then(function(r){
    evData = r.events || [];
    evMarks = r.marks || {};
    TODAY_EVENTS = r.today || 0;
    renderMenu();

    // 智能自适应范围：用户未主动选过且今天无事件时，自动选最近 7 天，避免用户进入事件中心看到空页面
    if(!evState._userChanged && evState.range === 'today' && TODAY_EVENTS === 0 && evData.length > 0){
      evState.range = 'week';
    }

    paintEvents(c);
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderEvents(c); }) + '</div>';
  });
}

// evTrend 近 7 天事件趋势（用户反馈第 5 条）
//
// 为什么值得加：事件中心在冷启动时只有「筛选栏 + 一句空文案」，
// 大片留白让人不确定系统是不是在工作。一条基线 + 7 个柱子能同时说明
// 「范围是什么」和「系统确实在统计」。
//
// 全 0 时不画柱子，只画基线并附一句说明 —— 不能让人误以为图坏了。
function evTrend(all){
  var days = 7;
  var today = new Date();
  today.setHours(0,0,0,0);

  var buckets = [];
  for(var i = days - 1; i >= 0; i--){
    var d = new Date(today.getTime() - i * 86400000);
    buckets.push({
      key: d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()),
      label: (d.getMonth()+1) + '/' + d.getDate(),
      wd: ['日','一','二','三','四','五','六'][d.getDay()],
      n: 0
    });
  }
  var idx = {};
  buckets.forEach(function(b, i){ idx[b.key] = i; });
  (all || []).forEach(function(x){
    var k = (x.time || '').slice(0, 10);
    if(idx[k] != null) buckets[idx[k]].n++;
  });

  var max = buckets.reduce(function(m, b){ return Math.max(m, b.n); }, 0);
  var total = buckets.reduce(function(s, b){ return s + b.n; }, 0);
  var H = 46;

  var bars = buckets.map(function(b){
    var h = max > 0 ? Math.round(b.n / max * H) : 0;
    var isToday = b.key === buckets[buckets.length-1].key;
    return '<div class="ev-trend__col" title="' + esc(b.label) + ' 周' + b.wd + '：' + b.n + ' 个事件">'
      + '<span class="ev-trend__n">' + (b.n > 0 ? b.n : '') + '</span>'
      + '<span class="ev-trend__barwrap">'
      +   '<span class="ev-trend__bar' + (b.n > 0 ? ' is-on' : '') + (isToday ? ' is-today' : '') + '"'
      +     ' style="height:' + Math.max(h, b.n > 0 ? 4 : 2) + 'px"></span>'
      + '</span>'
      + '<span class="ev-trend__x' + (isToday ? ' is-today' : '') + '">' + (isToday ? '今天' : b.label) + '</span>'
      + '</div>';
  }).join('');

  // 全 0 时**不画图**（用户反馈：只剩坐标轴，占一大块又显得冷清，
  // 而且和下面的空状态叠加成"两个空状态"）。
  // 返回空字符串，把这段空间让给下面那个带引导按钮的空状态。
  if(total === 0) return '';

  return '<div class="ev-trend">'
    + '<div class="ev-trend__head">'
    +   '<span class="ev-trend__title">' + icon('chart',14) + '近 7 天事件</span>'
    +   '<span class="ev-trend__sum">共 <b>' + total + '</b> 个事件</span>'
    + '</div>'
    + '<div class="ev-trend__chart">' + bars + '</div>'
    + '</div>';
}

function paintEvents(c){
  var all = evData;

  // ---- 统计 ----
  var todayStr = localDate();
  var yestStr = localDate(new Date(Date.now() - 86400000));

  // 过滤（日期）
  var list0 = all;
  if(evState.range === 'today') {
    list0 = all.filter(function(x){ return (x.time||'').slice(0,10) === todayStr; });
  } else if(evState.range === 'yesterday') {
    list0 = all.filter(function(x){ return (x.time||'').slice(0,10) === yestStr; });
  } else if(evState.range === 'week') {
    var d7 = localDate(new Date(Date.now() - 7 * 86400000));
    list0 = all.filter(function(x){ return (x.time||'').slice(0,10) >= d7; });
  } else if(evState.range === 'month') {
    var d30 = localDate(new Date(Date.now() - 30 * 86400000));
    list0 = all.filter(function(x){ return (x.time||'').slice(0,10) >= d30; });
  } else if(evState.from && evState.to){
    list0 = all.filter(function(x){
      var d = (x.time||'').slice(0,10);
      return d >= evState.from && d <= evState.to;
    });
  }

  // 类型计数
  var typeCount = {};
  list0.forEach(function(x){ typeCount[x.type] = (typeCount[x.type]||0)+1; });
  var watchCount = list0.filter(function(x){ return evIsWatch(x.id); }).length;
  var markCount  = list0.filter(function(x){ return evIsFav(x.id) || (evMark(x.id).tags||[]).length; }).length;

  // ---- 过滤（类型/设备/搜索）----
  function filtered(){
    var l = list0.slice();
    if(evState.type === 'watch')      l = l.filter(function(x){ return evIsWatch(x.id); });
    else if(evState.type === 'marked') l = l.filter(function(x){ return evIsFav(x.id) || (evMark(x.id).tags||[]).length; });
    else if(evState.type === 'bookmark') l = l.filter(function(x){ return evIsFav(x.id); });
    else if(evState.type !== 'all')   l = l.filter(function(x){ return x.type === evState.type; });

    if(evState.did) l = l.filter(function(x){ return x.did === evState.did; });

    // 车牌格式识别（省简称+A-Z+5位）-> 自动走车牌精确检索
  var q0 = (evState.q||'').trim().toUpperCase();
  var plateLike = /^[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z][A-Z0-9]{5}$/.test(q0);
  if(plateLike){
    l = l.filter(function(x){ return (x.aiPlate||'').toUpperCase() === q0; });
  }

  var q = (evState.q||'').trim().toLowerCase();
    if(q && !plateLike){
      l = l.filter(function(x){
        var t = (x.aiTitle||'') + ' ' + (x.aiSummary||'') + ' ' + (x.desc||'') + ' ' + (x.device||'') + ' ' + (x.aiCls||'');
        return t.toLowerCase().indexOf(q) >= 0;
      });
    }

    if(evState.sort === 'oldest') l.sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
    else if(evState.sort === 'confidence') l.sort(function(a,b){ return (b.conf||0) - (a.conf||0); });
    else l.sort(function(a,b){ return (b.time||'').localeCompare(a.time||''); });

    return l;
  }

  var list = filtered();

  // 分组用（今天/昨天）
  var dates = {};
  list0.forEach(function(x){ dates[(x.time||'').slice(0,10)] = 1; });
  var devSet = {};
  list0.forEach(function(x){ if(x.did) devSet[x.did] = x.device || x.did; });

  var selCount = Object.keys(evSel).filter(function(k){ return evSel[k]; }).length;
  var emptyAll = (all.length === 0);

  // ---- 类型胶囊 ----
  //
  // 用户反馈第 2 条：值为 0 时徽章没有信息量，8 个「0」纯属噪音。
  // 现在 0 一律不渲染徽章 —— **包括当前选中的那个**。
  //
  // 曾经为了让「点进去后能看到自己筛出几条」而给选中项保留徽章，
  // 结果「全部」永远是选中态，于是只有它还挂着「0」，
  // 与其他项不一致（用户反馈第 3 条指出的正是这个）。
  // 结论：一致性优先；当前范围的事件数在下方列表/趋势图里已经能看到。
  function chip(k, label, ic, n){
    return '<button class="chip' + (evState.type === k ? ' is-active' : '') + '" data-et="' + k + '">'
      + (ic ? icon(ic,14) : '')
      + '<span>' + label + '</span>'
      + (n > 0 ? '<span class="chip__n">' + n + '</span>' : '')
      + '</button>';
  }

  var EV_ICON = { person:'user', vehicle:'car', package:'inbox', motion:'activity', online:'power', offline:'wifi-off' };

  c.innerHTML = '<div class="page__inner">'

    // 页头
    + '<div class="list-head">'
    +   '<div class="list-head__main">'
    +     '<h1 class="list-head__title">事件中心</h1>'
    +     '<div class="list-head__en">按时间、设备、类型检索事件</div>'
    +   '</div>'
    +   '<div class="list-head__acts">'
    // 无数据时禁用（用户反馈第 4 条）：点了没有任何意义，
    // 还会让人以为「点了没反应 = 坏了」。加 disabled + title 说明原因。
    +     '<button class="btn' + (evBulk ? ' btn--primary' : '') + '" id="evBulkBtn"'
    +       (emptyAll ? ' disabled title="当前范围内没有事件"' : '') + '>'
    +       icon('check-square',15) + '批量选择</button>'
    +     '<button class="btn" id="evMarkBtn"' + (emptyAll ? ' disabled title="当前范围内没有事件"' : '') + '>'
    +       icon('bookmark',15) + '标记</button>'
    +     '<button class="btn btn--primary" id="evExportBtn"' + (emptyAll ? ' disabled title="当前范围内没有事件"' : '') + '>'
    +       icon('download',15) + '导出</button>'
    +   '</div>'
    + '</div>'

    // 筛选栏
    + '<div class="ev-filters">'
    +   '<label class="ev-range">' + icon('calendar',15)
    +     '<select class="input" id="evRange">'
    +       [['today','今天'],['yesterday','昨天'],['week','最近 7 天'],['month','最近 30 天'],['custom','自定义']].map(function(x){
              return '<option value="' + x[0] + '"' + (evState.range === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
            }).join('')
    +     '</select></label>'
    +   (evState.range === 'custom'
          ? '<input class="input ev-date" type="date" id="evFrom" value="' + esc(evState.from) + '">'
            + '<span class="ev-sep">→</span>'
            + '<input class="input ev-date" type="date" id="evTo" value="' + esc(evState.to) + '">'
          : '')
    +   '<select class="input ev-sel" id="evDev">'
    +     '<option value="">所有设备</option>'
    +     Object.keys(devSet).map(function(d){
            return '<option value="' + esc(d) + '"' + (evState.did === d ? ' selected' : '') + '>' + esc(devSet[d]) + '</option>';
          }).join('')
    +   '</select>'
    +   '<select class="input ev-sel" id="evTypeSel">'
    +     '<option value="">所有类型</option>'
    +     [['person','有人'],['vehicle','车辆'],['package','包裹'],['motion','移动'],['offline','离线']].map(function(x){
            return '<option value="' + x[0] + '"' + (evState.type === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
          }).join('')
    +   '</select>'
    +   '<div class="search ev-search">' + icon('search',15)
    +     '<input class="input" id="evSearch" type="search" placeholder="搜索事件描述…" value="' + esc(evState.q) + '">'
    +   '</div>'
    +   '<select class="input ev-sel" id="evSort">'
    +     [['newest','最新优先'],['oldest','最早优先'],['confidence','置信度优先']].map(function(x){
            return '<option value="' + x[0] + '"' + (evState.sort === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
          }).join('')
    +   '</select>'
    + '</div>'

    // 近 7 天趋势（用户反馈第 5 条）
    // 即使全为 0 也画出来：坐标轴 + 基线让页面不空，
    // 并且明确传达「系统在工作，只是这 7 天没有事件」。
    + evTrend(all)

    // 类型胶囊
    + '<div class="filters filters--rich">'
    +   chip('all',      '全部',   null, list0.length)
    +   chip('person',   '有人',   EV_ICON.person, typeCount.person || 0)
    +   chip('vehicle',  '车辆',   EV_ICON.vehicle, typeCount.vehicle || 0)
    +   chip('package',  '包裹',   EV_ICON.package, typeCount.package || 0)
    +   chip('motion',   '移动',   EV_ICON.motion, typeCount.motion || 0)
    +   (typeCount.pet ? chip('pet', '宠物', 'activity', typeCount.pet) : '')
    +   chip('watch',    '需关注', 'alert', watchCount)
    +   chip('marked',   '已标记', 'bookmark', markCount)
    + '</div>'

    // 批量工具栏
    + (evBulk
        ? '<div class="ev-bulkbar">'
          + '<span class="ev-bulkbar__count">' + icon('check-square',15)
          +   '<b>已选择 ' + selCount + ' 个事件</b></span>'
          + '<button class="ev-bulklink" id="evSelToday">选择今天</button>'
          + '<button class="ev-bulklink" id="evSelAll">选择全部筛选结果（' + list.length + '）</button>'
          + '<span class="ev-bulkbar__spacer"></span>'
          + '<button class="btn btn--sm" id="evMarkWatch">' + icon('eye',14) + '标记为需关注</button>'
          + '<button class="btn btn--sm" id="evAddTag">' + icon('bookmark',14) + '添加标签</button>'
          + '<button class="btn btn--sm" id="evBulkExport">' + icon('download',14) + '导出</button>'
          + '<button class="btn btn--sm" id="evBulkArchive">' + icon('inbox',14) + '归档</button>'
          + '<button class="btn btn--sm btn--danger" id="evBulkDel">' + icon('trash',14) + '删除</button>'
          + '<button class="btn btn--sm" id="evBulkCancel">' + icon('close',14) + '取消选择</button>'
          + '</div>'
        : '')

    // 列表
    + '<div class="ev-list" id="evList"></div>'
    + '</div>';

  // ---- 渲染列表 ----
  function paintList(){
    var box = document.getElementById('evList');
    if(!box) return;
    var l = filtered();

    if(!l.length){
      // 空状态（用户反馈第 1 条）：
      //   · 原来是纯文字 + 上下大片留白，视觉重心散、且无事可做
      //   · 现在：垂直占用收窄 + 给可操作的引导按钮
      //   · 文案区分「本来就没有事件」和「筛选后没结果」——
      //     前者要引导去调检测设置/看实时画面，后者要引导放宽筛选条件
      var noData = (all.length === 0);
      var hasFilter = !!(evState.q || evState.did || evState.type !== 'all' || evState.from || evState.range !== 'week');
      if(!noData && evState.range === 'today' && !l.length){
        box.innerHTML = '<div class="empty empty--compact">'
          + '<div class="empty__icon">' + icon('calendar', 22) + '</div>'
          + '<div class="empty__title">今天暂无新事件</div>'
          + '<div class="empty__desc">今天目前还没有侦测到异常事件动态（历史记录共 ' + all.length + ' 条）。</div>'
          + '<div class="empty__actions">'
          +   '<button class="btn btn--primary btn--sm" id="evQuickWeek">' + icon('clock', 13) + '查看最近 7 天事件</button>'
          +   '<button class="btn btn--sm" data-evgo="home">' + icon('home', 13) + '查看实时监控</button>'
          + '</div>'
          + '</div>';
        var qw = document.getElementById('evQuickWeek');
        if(qw) qw.onclick = function(){ evState._userChanged = true; evState.range = 'week'; paintEvents(c); };
        Array.prototype.forEach.call(box.querySelectorAll('[data-evgo]'), function(b){
          b.onclick = function(){ page = this.dataset.evgo; renderMenu(); render(); };
        });
        return;
      }
      if(noData){
        box.innerHTML = '<div class="empty empty--compact">'
          + '<div class="empty__icon">' + icon('bell',22) + '</div>'
          + '<div class="empty__title">这个范围内没有事件</div>'
          + '<div class="empty__desc">事件由画面变化触发。可以到首页看实时画面，'
          +   '或在「设置」里确认移动侦测与录像已开启。</div>'
          + '<div class="empty__actions">'
          +   '<button class="btn btn--primary btn--sm" data-evgo="home">' + icon('home',13) + '看实时画面</button>'
          +   '<button class="btn btn--sm" data-evgo="settings">' + icon('settings',13) + '检测设置</button>'
          + '</div>'
          + '</div>';
      } else {
        box.innerHTML = '<div class="empty empty--compact">'
          + '<div class="empty__icon">' + icon('search',22) + '</div>'
          + '<div class="empty__title">没有匹配的事件</div>'
          + '<div class="empty__desc">当前筛选条件下没有结果。'
          +   (hasFilter ? '试试放宽时间范围，或清空搜索关键字。' : '') + '</div>'
          + (hasFilter
              ? '<div class="empty__actions">'
                + '<button class="btn btn--sm" id="evResetFilter">' + icon('rotate',13) + '清空筛选条件</button>'
                + '</div>'
              : '')
          + '</div>';
      }
      // 绑定引导按钮
      Array.prototype.forEach.call(box.querySelectorAll('[data-evgo]'), function(b){
        b.onclick = function(){
          page = this.dataset.evgo; renderMenu(); render();
          var ct = document.getElementById('content');
          if(ct) ct.scrollTop = 0;
        };
      });
      var rf = document.getElementById('evResetFilter');
      if(rf) rf.onclick = function(){
        evState.q = ''; evState.did = ''; evState.type = 'all';
        evState.from = ''; evState.to = ''; evState.range = 'week';
        evSel = {};
        paintEvents(c);
      };
      return;
    }

    var groups = {};
    l.forEach(function(x){
      var d = (x.time||'').slice(0,10);
      (groups[d] = groups[d] || []).push(x);
    });

    var week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    box.innerHTML = Object.keys(groups).sort().reverse().map(function(day){
      var dt = new Date(day + 'T00:00:00');
      var label = (day === todayStr) ? '今天' : (day === yestStr) ? '昨天' : day;
      var sub = (isNaN(dt) ? '' : (dt.getMonth()+1) + '月' + dt.getDate() + '日 · ' + week[dt.getDay()]);
      return '<section class="ev-group">'
        + '<div class="ev-group__head">'
        +   '<span class="ev-group__label">' + label + '</span>'
        +   '<span class="ev-group__sub">' + sub + '</span>'
        + '</div>'
        + '<div class="ev-grid">' + groups[day].map(evCard).join('') + '</div>'
        + '</section>';
    }).join('');

    bindCards();
  }

  // 事件卡片（3 列网格）
  function evCard(x){
    var t = EV_TYPES[x.type] || EV_TYPES.motion;
    var on = evSel[x.id];
    var fav = evIsFav(x.id);
    var watch = evIsWatch(x.id);
    var tags = (evMark(x.id).tags || []);
    var title = x.aiTitle || aiLocalTitle(x);
    var hm = (x.time||'').slice(11,16);
    var hms = (x.time||'').slice(11,19);
    var dur = x.duration ? fmtDur(x.duration) : '';
    var conf = x.conf ? Math.round(x.conf) : null;

    // 标签行：类型 + AI 类名 + 自定义标签
    var tagRow = '<span class="ev-tag">' + icon(t.ic,12) + t.name + '</span>';
    if(x.aiCls && x.aiCls !== x.type){
      tagRow += '<span class="ev-tag">' + esc(x.aiCls) + '</span>';
    }
    tags.slice(0, 2).forEach(function(g){
      tagRow += '<span class="ev-tag is-custom">' + esc(g) + '</span>';
    });

    return '<article class="ev-card2' + (on ? ' is-sel' : '') + '" data-id="' + esc(x.id) + '">'
      + '<div class="ev-card2__img">'
      +   (evBulk ? '<span class="ev-card2__check">' + (on ? icon('check',13) : '') + '</span>' : '')
      +   (x.thumb ? '<img loading="lazy" src="' + apiUrl('/api/events/thumb?f=' + encodeURIComponent(x.thumb)) + '" alt="">'
                  : '<div class="ev-card2__ph">' + icon(t.ic,28) + '</div>')

  // ---- 绑定 ----
  function bindCards(){
    var box = document.getElementById('evList');
    if(!box) return;

    Array.prototype.forEach.call(box.querySelectorAll('.ev-card2'), function(el){
      var id = el.dataset.id;
      var ev = evData.filter(function(x){ return x.id === id; })[0];
      if(!ev) return;

      el.onclick = function(e){
        if(e.target.closest('[data-rec]')){
          e.stopPropagation();
          gotoReplay(ev.did, ev.time);
          return;
        }
        if(e.target.closest('[data-more]')){ showEventMenu(el, ev); return; }
        if(e.target.closest('[data-book]')){
          e.stopPropagation();
          setEvMark(id, { bookmark: !evIsFav(id) });
          return;
        }
        if(e.target.closest('[data-play]')){ e.stopPropagation(); openEventDetail(ev); return; }
        if(evBulk){
          evSel[id] = !evSel[id];
          el.classList.toggle('is-sel', !!evSel[id]);
          var ck = el.querySelector('.ev-card2__check');
          if(ck) ck.innerHTML = evSel[id] ? icon('check',13) : '';
          updateBulkCount();
          return;
        }
        openEventDetail(ev);
      };
    });
  }

  function updateBulkCount(){
    var el = document.querySelector('.ev-bulkbar__count b');
    if(el) el.textContent = '已选择 ' + Object.keys(evSel).filter(function(k){ return evSel[k]; }).length + ' 个事件';
  }

  // ---- 筛选交互 ----
  Array.prototype.forEach.call(c.querySelectorAll('[data-et]'), function(b){
    b.onclick = function(){
      evState.type = this.dataset.et;
      evSel = {};
      paintEvents(c);
    };
  });
  var rg = document.getElementById('evRange');
  if(rg) rg.onchange = function(){ evState.range = this.value; paintEvents(c); };
  var f1 = document.getElementById('evFrom');
  if(f1) f1.onchange = function(){ evState.from = this.value; paintList(); };
  var f2 = document.getElementById('evTo');
  if(f2) f2.onchange = function(){ evState.to = this.value; paintList(); };
  var dv = document.getElementById('evDev');
  if(dv) dv.onchange = function(){ evState.did = this.value; paintList(); };
  var ts = document.getElementById('evTypeSel');
  if(ts) ts.onchange = function(){ evState.type = this.value || 'all'; paintEvents(c); };
  var so = document.getElementById('evSort');
  if(so) so.onchange = function(){ evState.sort = this.value; paintList(); };
  var sq = document.getElementById('evSearch');
  if(sq){
    var deb = null;
    sq.oninput = function(){
      evState.q = this.value;
      if(deb) clearTimeout(deb);
      deb = setTimeout(paintList, 200);
    };
  }

  // ---- 批量模式 ----
  var bb = document.getElementById('evBulkBtn');
  if(bb) bb.onclick = function(){ evBulk = !evBulk; evSel = {}; paintEvents(c); };

  var bc = document.getElementById('evBulkCancel');
  if(bc) bc.onclick = function(){ evBulk = false; evSel = {}; paintEvents(c); };

  var st = document.getElementById('evSelToday');
  if(st) st.onclick = function(){
    list.forEach(function(x){ evSel[x.id] = true; });
    paintEvents(c);
  };
  var sa = document.getElementById('evSelAll');
  if(sa) sa.onclick = function(){
    list.forEach(function(x){ evSel[x.id] = true; });
    paintEvents(c);
  };

  var bw = document.getElementById('evMarkWatch');
  if(bw) bw.onclick = function(){ bulkMark({ watch: true }); };
  var bt = document.getElementById('evAddTag');
  if(bt) bt.onclick = function(){
    var g = prompt('添加标签（多个用逗号分隔）：', '');
    if(!g) return;
    var arr = g.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(arr.length) bulkMark({ addTags: arr });
  };
  var bd = document.getElementById('evBulkDel');
  if(bd) bd.onclick = function(){
    var ids = Object.keys(evSel).filter(function(k){ return evSel[k]; });
    if(!ids.length){ toast('请先选择事件', 'warn'); return; }
    if(!confirm('删除 ' + ids.length + ' 个事件？\n\n会同时删除缩略图和标记，不可恢复。')) return;
    api('/api/events/bulk', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ids: ids, action:'delete' }) })
      .then(function(r){
        toast('已删除 ' + (r.deleted||0) + ' 个', 'ok');
        evBulk = false; evSel = {};
        renderEvents(c);
      }).catch(function(e){ toast('删除失败：' + e.message, 'err'); });
  };
  var bx = document.getElementById('evBulkExport');
  if(bx) bx.onclick = function(){ toast('导出功能在「回放 → 导出管理」里', 'warn'); };
  var ba = document.getElementById('evBulkArchive');
  if(ba) ba.onclick = function(){ toast('归档功能开发中', 'warn'); };

  paintList();

  function bulkMark(patch){
    var ids = Object.keys(evSel).filter(function(k){ return evSel[k]; });
    if(!ids.length){ toast('请先选择事件', 'warn'); return; }
    api('/api/events/marks', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({ ids: ids }, patch)) })
      .then(function(){
        toast('已更新 ' + ids.length + ' 个', 'ok');
        evBulk = false; evSel = {};
        renderEvents(c);
      }).catch(function(e){ toast('失败：' + e.message, 'err'); });
  }
}

// curDevEn 取设备英文名
function curDevEn(did){
  var d = (devices||[]).filter(function(x){ return x.did === did; })[0];
  return d ? (d.aliasEn || '') : '';
}

// setEvMark 更新单条标记（乐观更新）
function setEvMark(id, patch){
  var cur = evMarks[id] || {};
  var neu = Object.assign({}, cur, patch);
  evMarks[id] = neu;

  // 立即重绘那一个卡片的状态
  var el = document.querySelector('.ev-card2[data-id="' + id + '"]');
  if(el){
    var b = el.querySelector('[data-book]');
    if(b) b.classList.toggle('is-on', !!neu.bookmark);
  }

  api('/api/events/marks', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ id: id }, patch)) })
    .catch(function(e){ toast('保存标记失败：' + e.message, 'err'); });
}

  openModal('', html, function(root){
    var dlg = root.querySelector('.dialog');
    if(dlg){
      dlg.classList.add('dialog--wide');
      dlg.id = 'evdDialog';
      root.id = 'evdMask';
    }

    // 查看回放
    root.querySelector('#evdPlay').onclick = function(){ closeModal(); gotoReplay(ev.did, ev.time); };

    // 标记需关注
    root.querySelector('#evdWatch').onclick = function(){
      var nv = !evIsWatch(ev.id);
      setEvMark(ev.id, { watch: nv });
      toast(nv ? '已标记为需关注' : '已取消', 'ok');
      closeModal();
    };

    // 添加标签
    root.querySelector('#evdTag').onclick = function(){
      var g = prompt('添加标签（多个用逗号分隔）：', tags.join(', '));
      if(g === null) return;
      var arr = g.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean);

      toast('已更新标签', 'ok');
      closeModal();

    // 一键截取视频片段（MP4）
    (function(){
      var expBtn = root.querySelector('#evdExport');
      // Disable if no recording file available
      if(!ev.recFile){
        expBtn.disabled = true;
        expBtn.title = '该事件无关联录像，无法截取';
        return;
      }
      expBtn.onclick = function(){
        var btn = this;
        btn.disabled = true;
        btn.innerHTML = icon('loader',15) + '截取中…';
        api('/api/events/clip', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id: ev.id, preSec: 5, postSec: 15 })
        }).then(function(r){
          if(!r.ok){ toast('截取失败：' + (r.error || '未知错误'), 'err'); btn.disabled=false; btn.innerHTML=icon('download',15)+'一键截取(MP4)'; return; }
          var exportId = r.id;
          var checkCount = 0;
          var timer = setInterval(function(){
            checkCount++;
            api('/api/recordings/export/status?id=' + encodeURIComponent(exportId))
              .then(function(s){
                if(s.status === 'done'){
                  clearInterval(timer);
                  var sizeMB = s.size ? (s.size / 1048576).toFixed(1) + ' MB' : '';
                  var dlUrl = s.downloadUrl || ('/api/recordings/export/download?id=' + encodeURIComponent(exportId));
                  toast('截取完成' + (sizeMB ? '（' + sizeMB + '）' : '') + ' — <a href="' + dlUrl + '" download style="color:#4fc3f7;text-decoration:underline">点击下载</a>', 'ok', 8000);
                  btn.disabled = false;
                  btn.innerHTML = icon('download',15) + '再次截取';
                } else if(s.status === 'error'){
                  clearInterval(timer);
                  toast('截取出错：' + (s.error || '未知'), 'err');
                  btn.disabled = false;
                  btn.innerHTML = icon('download',15) + '一键截取(MP4)';
                } else {
                  var pct = s.progress ? Math.round(s.progress * 100) + '%' : (checkCount * 10 > 90 ? '90%' : checkCount * 10 + '%');
                  btn.innerHTML = icon('loader',15) + '截取中 ' + pct;
                  if(checkCount > 60){
                    clearInterval(timer);
                    toast('截取超时，请稍后在「回放 → 导出管理」查看', 'warn');
                    btn.disabled = false;
                    btn.innerHTML = icon('download',15) + '一键截取(MP4)';
                  }
                }
              })
              .catch(function(){ /* ignore polling errors */ });
          }, 1000);
        }).catch(function(e){
          toast('截取失败：' + e.message, 'err');
          btn.disabled = false;
          btn.innerHTML = icon('download',15) + '一键截取(MP4)';
        });
      };
    })();

    // 读车牌（本地 LPR，免费）
    var pb = root.querySelector('#evdPlate');
    if(pb) pb.onclick = function(){
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = icon('refresh',15) + '识别中…';

        body: JSON.stringify({ id: ev.id }) })
        .then(function(r){
          if(!r.ok){ toast('识别失败：' + (r.error||'未知错误'), 'err'); btn.disabled=false; btn.innerHTML=icon('car',15)+'读车牌'; return; }
          var res = r.result || {};
          if(!res.plate){

          render();
        })
        .catch(function(e){ toast('识别失败：' + e.message, 'err'); btn.disabled=false; btn.innerHTML=icon('car',15)+'读车牌'; });
    };

    // AI 深度分析
    root.querySelector('#evdAI').onclick = function(){
      var btn = this;
