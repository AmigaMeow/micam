      btn.innerHTML = icon('refresh',15) + '分析中…（约 5-15 秒）';
      api('/api/ai/analyze', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: ev.id, save: true }) })
        .then(function(r){
          if(!r.ok){
            toast('分析失败：' + (r.error || '未知错误'), 'err');
            btn.disabled = false;
            btn.innerHTML = icon('zap',15) + 'AI 深度分析';
            return;
          }
          var a = r.analysis || {};
          toast('分析完成 · ' + (a.elapsedMs/1000).toFixed(1) + ' 秒 · ¥' + (a.costCny||0).toFixed(5)
                + (a.cached ? '（命中缓存）' : ''), 'ok');
          closeModal();
          // 刷新列表以显示新结果
          render();
          // 打开更新后的事件
          setTimeout(function(){
            var fresh = null;
            for(var i=0;i<evData.length;i++){ if(evData[i].id === ev.id) fresh = evData[i]; }
            if(fresh) openEventDetail(fresh);
          }, 900);
        })
        .catch(function(e){
          toast('分析失败：' + e.message, 'err');
          btn.disabled = false;
          btn.innerHTML = icon('zap',15) + 'AI 深度分析';
        });
    };

    // 关键帧条
    var fbox = root.querySelector('#evdFrames');
    loadEventFrames(fbox, ev, root);
  });
}

// evBlock 详情弹窗右侧的一个信息块
function evBlock(ic, title, bodyHtml){
  return '<div class="evd__block">'
    + '<div class="evd__block-head">' + icon(ic,15) + '<span>' + title + '</span></div>'
    + '<div class="evd__block-body">' + bodyHtml + '</div>'
    + '</div>';
}

// loadEventFrames 加载事件的关键帧
//
// 数据来源优先级：
//   1. 事件关联的录像文件 -> /api/recordings/frame-strip（抽 N 帧）
//   2. 没有录像 -> 用事件缩略图占位，并说明原因
function loadEventFrames(box, ev, root){
  if(!box) return;

  function fallback(msg){
    box.innerHTML = (ev.thumb
      ? '<div class="evd__frame is-active">'
        + '<img src="' + apiUrl('/api/events/thumb?f=' + encodeURIComponent(ev.thumb)) + '" alt="">'
        + '<span class="evd__frame-time">' + esc((ev.time||'').slice(11,19)) + '</span>'
        + '<span class="evd__frame-label">' + esc(ev.aiTitle || '事件瞬间') + '</span>'
        + '</div>'
      : '')
      + '<div class="evd__frames-hint">' + esc(msg) + '</div>';
  }

  if(!ev.recFile){
    fallback('该事件没有关联录像（录制未开启或已清理）。');
    return;
  }

  var q = 'name=' + encodeURIComponent(ev.device || '')
        + '&file=' + encodeURIComponent(ev.recFile)
        + '&n=4';
  fetch(apiUrl('/api/recordings/frame-strip?' + q))
    .then(function(r){ return r.ok ? r.blob() : null; })
    .then(function(b){
      if(!b){ fallback('关键帧提取失败。'); return; }
      var url = URL.createObjectURL(b);
      // frame-strip 返回的是横向拼接的条带图，切成 N 片显示
      box.innerHTML = '<div class="evd__strip"><img src="' + url + '" alt=""></div>';
    })
    .catch(function(){ fallback('关键帧加载失败。'); });
}

//   设置 —— AI 模式三档 + 本地分析 + 云端视觉 + 隐私表格 + 今日用量
//
// **设计要点**：没有外部 LLM 时全部功能仍可用 ——
//   摘要用模板拼、结论用类型映射、AI 总结用统计描述。
//   接上 LLM 后这些位置自动换成真正的理解结果，UI 不用改。

var aiTab = aiTab || 'overview';
var aiSetTab = aiSetTab || 'mode';   // AI 设置页左导航：mode / prov / policy / usage
var aiQuery = '';
var aiResult = null;
var aiCache = {};          // 各 Tab 的数据缓存
var aiInvCur = null;       // 当前选中的调查

function renderAI(c){

  Promise.all([
    api('/api/ai/overview').catch(function(){ return null; }),
    api('/api/ai/status').catch(function(){ return { status:{}, env:{}, models:[] }; }),
    api('/api/ai/config').catch(function(){ return { config:{} }; }),
    // ⚠️ 必须保留这一项！
    // 曾经删过它但没改下面的 res[3]，
    // 导致 res[3] 是 undefined -> 读 .devices 报
    //   TypeError: Cannot read properties of undefined (reading 'devices')
    api('/api/devices').catch(function(){ return { devices: [] }; }),
  ]).then(function(res){
    aiCache.ov = res[0];
    // 调查 Tab 需要更多事件（概览只给 4 条）
    api('/api/events?days=30&limit=300').then(function(r){

      // 如果当前在调查 Tab，重绘
      if(aiTab === 'investigate' && document.getElementById('aiBody')) paintAITab();
    }).catch(function(){});
    aiCache.st = res[1];
    aiCache.cf = res[2];
    // 防御：即使 res[3] 缺失也不崩
    var devList = (res[3] && res[3].devices) || [];
    aiCache.dev = devList.filter(function(d){
      return (d.model||'').indexOf('camera') >= 0 || (d.model||'').indexOf('mxiang') >= 0;
    });

    c.innerHTML = '<div class="page__inner">'

      + '<div class="list-head">'
      +   '<div class="list-head__main">'
      +     '<h1 class="list-head__title">AI 智能</h1>'
      +     '<div class="list-head__en" id="aiSub">让 AI 自动整理、理解和检索摄像头事件</div>'
      +   '</div>'
      +   '<div class="list-head__acts">'
      // 运行状态（本地 AI 引擎是否在跑）—— 实心绿点 + 强调底色，表示「此刻活着」
      +     '<span class="chip ' + (isAIReady() ? 'chip--run' : 'chip--off') + '">'
      +       '<span class="status-dot ' + (isAIReady() ? 'is-online' : '') + '"></span>'
      +       '本地 AI ' + (isAIReady() ? '运行中' : '未启用')
      +     '</span>'
      // 配置状态（云端密钥是否配好）—— outline 样式 + 齿轮图标。
      // 用户反馈第 6 条：原来两者样式完全一样，但「正在运行」和「已配置」
      // 是两种不同性质的信息（一个是此刻状态，一个是静态设置），不该同级同款。
      +     (hasCloud()
              ? '<span class="chip chip--cfg" title="已配置云端视觉分析（不代表此刻正在调用）">'
                + icon('set', 13) + '云端已配置</span>'

           ['settings','设置','配置本地 AI、云端视觉分析、隐私设置与使用策略']]

          }).join('')

function isAIReady(){
  return aiCache.st && aiCache.st.status && aiCache.st.status.status === 'ready';
}
// hasCloud 云端是否可用。
//
// 注意：不能读 /api/ai/status 的 hasCloud —— 那个接口不返回这个字段。
// 直接用配置里的 cloudEnabled + hasKey 判断。
function hasCloud(){
  var cf = (aiCache.cf && aiCache.cf.config) || {};
  var hasKey = !!(aiCache.cf && aiCache.cf.hasKey);
  return !!cf.cloudEnabled && hasKey;
}

function paintAITab(){
  syncRouteToUrl();
  var box = document.getElementById('aiBody');
  if(!box) return;
  var sub = document.getElementById('aiSub');
  var cur = document.querySelector('[data-ait="' + aiTab + '"]');
  if(sub && cur) sub.textContent = cur.dataset.sub;

  // 保证顶部标签栏激活态始终同步
  var c = document.getElementById('content');
  if(c){
    Array.prototype.forEach.call(c.querySelectorAll('[data-ait]'), function(x){
      x.classList.toggle('is-active', x.dataset.ait === aiTab);
    });
  }

  // 每次重绘先停掉打字机：否则切走再切回会有多个定时器
  // 同时往同一个 placeholder 里写，表现为文字乱跳。
  aiTypeStop();

  if(aiTab === 'overview'){ box.innerHTML = aiTabOverview(); setTimeout(paintAutoCard, 0); }
  else if(aiTab === 'qa' || aiTab === 'search' || aiTab === 'investigate'){
    aiTab = 'qa';
    paintAIChat();
  }
  else { box.innerHTML = aiTabSettings(); setTimeout(paintAIUsage, 0); setTimeout(paintCostFacts, 0); }
  bindAI();
}

// paintCostFacts 把「去重 / 缓存」两个成本开关的**真实**效果填进去
//
// 数据来源 /api/ai/jobs 的新字段（skippedDedupe / cacheHits），
// 这两个计数是 2026-10-13 为「成本量化反馈」专门补的后端统计。
//
// 为什么不显示「预计减少 60%」这类百分比：
// 百分比需要一个可比的基数，而"如果没有开这个开关会调用多少次"是无法观测的
// 反事实。编一个数字比不显示更糟 —— 所以只报**可观测的真实次数**。
function paintCostFacts(){
  var d = document.getElementById('factDedupe');
  var c = document.getElementById('factCache');
  if(!d && !c) return;
  api('/api/ai/jobs').then(function(j){
    if(d){
      var n = Number(j.skippedDedupe) || 0;
      d.textContent = n > 0
        ? '（本次运行已跳过 ' + n + ' 条重复事件）'
        : '（本次运行尚无重复事件被跳过）';
      d.className = 'sw-fact' + (n > 0 ? ' is-on' : '');
    }
    if(c){
      var m = Number(j.cacheHits) || 0;
      c.textContent = m > 0
        ? '（已命中 ' + m + ' 次，省下同样次数的云端调用）'
        : '（本次运行尚无缓存命中）';
      c.className = 'sw-fact' + (m > 0 ? ' is-on' : '');
    }
  }).catch(function(){
    if(d) d.textContent = '（读取统计失败）';
    if(c) c.textContent = '（读取统计失败）';
  });
}

// ============ Tab 1：概览 ============
function aiTabOverview(){
  var o = aiCache.ov || { today:{}, process:{}, recent:[] };
  var t = o.today || {};
  var pr = o.process || {};
  var recent = o.recent || [];

  // 统计卡
  //
  // ⚠️ 颜色必须跟着数值走（用户反馈第 4 条）。
  //    原来「需关注」的图标恒为橙色（.ai-stat.is-watch 无条件着色），
  //    值为 0 时也在报警 —— 0 表示一切正常，橙色会让人以为出了事。
  //    现在只有 >0 才加 is-watch。
  function statCard(ic, label, val, cls){
    var n = Number(val) || 0;
    var watch = (cls === 'is-watch');
    var active = watch && n > 0;
    return '<button class="ai-stat' + (active ? ' is-watch' : '') + '" data-aigoto="' + (watch ? 'investigate' : 'search') + '">'
      + '<span class="ai-stat__icon">' + icon(ic, 20) + '</span>'
      + '<span class="ai-stat__body">'
      +   '<span class="ai-stat__label">' + label + '</span>'
      +   '<span class="ai-stat__val">' + n + '</span>'
      + '</span>'
      + '<span class="ai-stat__chev">' + icon('chevron-right', 16) + '</span>'
      + '</button>';
  }

  // 环形图（SVG）
  //
  // ⚠️ 0% 时不要画一个孤立的小圆点（用户反馈第 3 条）：
  //    那个点停在正上方，看起来像「卡住了/加载中」。
  //    0% 改用虚线轨道 + 「暂无」文字，明确表达「确实没有数据」而不是「故障」。
  var pct = Math.round(pr.percent || 0);
  var R = 46, C = 2 * Math.PI * R;
  var ring;
  if(pct <= 0){
    // 颜色/线宽一律交给 CSS（.ai-ring__track / __fill），
    // 不在 JS 里写死 —— 原来轨道写的是 var(--surface-3)（#1b212a），
    // 几乎与卡片底色相同，所以"只能看到前景弧线，看不出这是进度条"（用户反馈）。
    // 现在与首页 .stat-ring 共用同一套视觉规范（--border-strong 轨道 + 圆头填充）。
    ring = '<svg class="ai-ring is-zero" viewBox="0 0 120 120">'
      + '<circle class="ai-ring__track is-dashed" cx="60" cy="60" r="' + R + '" fill="none"/>'
      + '<text x="60" y="58" text-anchor="middle" class="ai-ring__val">—</text>'
      + '<text x="60" y="76" text-anchor="middle" class="ai-ring__label">暂无数据</text>'
      + '</svg>';
  } else {
    var dash = (pct / 100) * C;
    ring = '<svg class="ai-ring" viewBox="0 0 120 120">'
      + '<circle class="ai-ring__track" cx="60" cy="60" r="' + R + '" fill="none"/>'
      + '<circle class="ai-ring__fill" cx="60" cy="60" r="' + R + '" fill="none"'
      +   ' stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"'
      +   ' transform="rotate(-90 60 60)"/>'
      + '<text x="60" y="56" text-anchor="middle" class="ai-ring__val">' + pct + '%</text>'
      + '<text x="60" y="74" text-anchor="middle" class="ai-ring__label">已处理</text>'
      + '</svg>';
  }

  return ''

    // 冷启动引导（仅在「什么都还没有」时出现）
    + aiGuide()

    // 4 张统计卡
    + '<div class="ai-stats">'
    +   statCard('user',  '人员',   t.person)
    +   statCard('car',   '车辆',   t.vehicle)
    +   statCard('inbox', '包裹',   t.package)
    +   statCard('alert', '需关注', t.watch, 'is-watch')
    + '</div>'

    // 今日摘要 + 处理情况
    // 自动分析状态（有云端配置时才显示）
    + (hasCloud() ? '<div id="aiAutoCard"></div>' : '')

    + '<div class="ai-row2">'

    +   '<div class="card">'
    +     '<div class="sec-head">'
    +       '<span class="sec-head__title">今日 AI 摘要</span>'
    +       (hasCloud() ? '<a class="sec-head__more" href="javascript:;" data-aigoto="qa">查看完整摘要 ' + icon('chevron-right',14) + '</a>' : '')
    +     '</div>'
    // 空状态统一成「图标 + 标题 + 引导」三件套（用户反馈第 5 条）
    +     (recent.length
            ? '<div class="ai-summary">' + esc(o.summary || '') + '</div>'
              + '<div class="ai-thumbs">' + recent.map(function(e2){
                  return '<div class="ai-thumb" data-ev-did="' + esc(e2.did||'') + '" data-ev-time="' + esc(e2.time||'') + '">'
                    + '<img loading="lazy" src="' + apiUrl('/api/events/thumb?f=' + encodeURIComponent(e2.thumb)) + '" alt="">'
                    + '<span class="ai-thumb__time">' + esc((e2.time||'').slice(11,16)) + '</span>'
                    + '<span class="ai-thumb__foot">'
                    +   icon('camera',12) + esc(e2.device || '')
                    +   (e2.aiCls ? ' <em>' + esc(e2.aiCls) + '</em>' : '')
                    + '</span>'
                    + '</div>';
                }).join('') + '</div>'
            : aiEmptyBlock('zap', '今天还没有摘要',
                // 摘要由事件驱动（后端 buildLocalSummary 是模板拼装，
                // 不依赖本地 AI 是否启用）。所以文案只说「需要事件」，
                // 不写「去启用 AI」—— 那会把人引到无关的设置项。
                '检测到事件后，这里会自动生成一句话总结',
                'events', '查看事件'))

    +   '</div>'

    +   '<div class="card">'
    +     '<div class="sec-head">'
    +       '<span class="sec-head__title">AI 处理情况 <span class="sec-head__en">今日累计</span></span>'
    +       '<a class="sec-head__more" href="javascript:;" data-aigoto="settings">查看详情 ' + icon('chevron-right',14) + '</a>'
    +     '</div>'
    // 布局（用户反馈第 5 条）：
    //   左：环形总进度   右：**漏斗**（取代原来平铺的 4 行指标）
    // 原来「本地已过滤」和「队列跳过」并列摆放，都像"过滤"，看不出因果；
    // 现在漏斗用宽度 + 箭头表达「本地分析 → 过滤掉一部分 → 送云端」的减法关系。
    +     '<div class="ai-process">'
    +       '<div class="ai-process__ring">' + ring + '</div>'
    +       '<div class="ai-process__funnel">' + aiFunnel(pr, t.total || 0) + '</div>'
    +     '</div>'
    // 费用单独一行：它是「花了多少钱」，不属于事件漏斗的环节，
    // 放在漏斗里会让人以为也是数量。（与上方「今日花费」同名同值）
    +     '<div class="ai-process__cost">'
    +       icon('yuan', 14) + '今日花费 <b>¥' + (pr.costCny || 0).toFixed(2) + '</b>'
    +     '</div>'
    +     (pr.deltaPct
          ? '<div class="ai-delta ' + (pr.deltaPct < 0 ? 'is-down' : 'is-up') + '">'
            + icon(pr.deltaPct < 0 ? 'chevron-down' : 'chevron-up', 14)
            + '今日较昨日' + (pr.deltaPct < 0 ? '下降' : '上升') + ' ' + Math.abs(Math.round(pr.deltaPct)) + '%'
            + (pr.deltaPct < 0 ? '<div class="ai-delta__sub">已优化处理，减少不必要的云端分析。</div>' : '')
            + '</div>'
          : '')
    +   '</div>'

    + '</div>'

    // 最近 AI 事件
    + '<div class="card" style="margin-top:var(--space-5)">'
    +   '<div class="sec-head">'
    +     '<span class="sec-head__title">最近 AI 事件</span>'
    +     (recent.length ? '<a class="sec-head__more" href="javascript:;" data-aigoto="qa">查看全部 ' + icon('chevron-right',14) + '</a>' : '')
    +   '</div>'
    +   '<div class="ai-recent">'
    +   (recent.length ? recent.map(function(e2){
        return aiRecentCard(e2);
      }).join('') : aiEmptyBlock('bell', '还没有 AI 事件',
        (isAIReady()
          ? 'AI 正在值守，检测到画面变化时这里会出现识别结果'
          : '启用本地 AI 后，事件会带上识别结果'), 'settings', 'AI 设置'))
    +   '</div>'
    + '</div>';
}

// aiEmptyBlock 统一的空状态块（图标 + 标题 + 说明 + 可选行动按钮）
//
// 用户反馈第 5 条：原来三处空状态风格各异（纯文字 / 0% 环 / 完整三件套），
// 现在全部走这一个组件，保持一致的「图标+标题+引导」结构。
// aiEmptyBlock AI 页的空状态 —— unconfigured / no-result 变体
// 保留旧签名（6 处调用点），内部走 emptyState。
function aiEmptyBlock(ic, title, desc, go, goLabel){
  return emptyState(go ? 'unconfigured' : 'quiet', {
    icon: ic, title: title, desc: desc,
    actions: go ? [{ label: goLabel || '前往设置', aigoto: go, icon: 'chevron-right' }] : []
  });
}

// aiGuide 冷启动引导（用户反馈第 1 条）
//
// 设计原则：**只说真话**。
// 这里先探测真实状态再决定文案 —— 不能一律写「去配置检测区域/添加摄像头」，
// 因为实测（2026-10-12）本机 AI 是 ready、云端已配置、动检也在正常抓帧，
// 只是 30 天内确实没有画面变化（0 事件）。
// 那种情况下让人去「配置检测区域」是误导，会白折腾一圈。
function aiGuide(){
  var o = aiCache.ov || {};
  var cams = aiCache.dev || [];
  var online = cams.filter(function(d){ return d.isOnline; }).length;
  var totalEvents = ((o.today && o.today.total) || 0) + ((o.recent || []).length);

  // 情况 1：一台摄像头都没有
  if(cams.length === 0){
    return aiGuideCard('camera', '先添加摄像头',
      'AI 分析的对象是摄像头事件。登录小米账号并获取设备后，这里会自动开始工作。',
      'accounts', '去添加设备');
  }

  // 情况 2：有摄像头但都不在线
  if(online === 0){
    return aiGuideCard('wifi-off', '摄像头当前离线',
      'AI 只能分析在线摄像头的画面。等设备恢复在线后会自动继续。',
      'devices', '查看设备');
  }

  // 情况 3：本地 AI 未启用
  if(!isAIReady()){
    return aiGuideCard('zap', '本地 AI 还没启用',
      '启用后会在本机识别人员/车辆/包裹，不上传画面。这是所有 AI 功能的前提。',
      'settings', '去启用');
  }

  // 情况 4：一切就绪，只是还没有事件 —— 明确告诉用户「这是正常的」
  if(totalEvents === 0){
    return aiGuideCard('check', 'AI 正在值守，暂无事件',
      '本地 AI 已就绪，正在持续分析 ' + online + ' 路画面。检测到画面变化后会自动生成事件与识别结果。',
      '', '');
  }

  return '';
}

function aiGuideCard(ic, title, desc, go, goLabel){
  return '<div class="ai-guide">'
    + '<span class="ai-guide__icon">' + icon(ic, 20) + '</span>'
    + '<span class="ai-guide__body">'
    +   '<span class="ai-guide__title">' + esc(title) + '</span>'
    +   '<span class="ai-guide__desc">' + esc(desc) + '</span>'
    + '</span>'
    + (go ? '<button class="btn btn--primary btn--sm" data-aigoto="' + go + '" type="button">'

// autoJobs 最近自动分析任务
function autoJobs(jobs){

  var st = { done:'已完成', failed:'失败', running:'分析中', queued:'排队', skipped:'跳过' };
  var cls = { done:'is-ok', failed:'is-bad', running:'is-run', queued:'', skipped:'' };

    + '<div class="ai-jobs__head">最近自动分析</div>'

// aiFunnel AI 处理漏斗（用户反馈第 5 条）
//
// 要解决的问题：原来「本地已过滤」和「队列跳过」两个数字并列摆放，
// 名字都像"过滤"，看不出它们是什么关系。
//
// 后端真实语义（ai_overview.go / ai_worker.go）：
//   · 今日事件总数  = 进入流程的量
//   · 本地处理      = 本地 AI 出了识别结果的事件数（AICls != ""）
//   · 本地已过滤    = localProcessed - cloudAnalyzed（本地看了但没送云端的）
//   · 云端分析      = 云端出了摘要的事件数（AISummary != ""）
//   · 队列跳过      = 云端**队列**里被规则/去重判定不值得花钱的（另一个计数体系）
//
// 关键：`filtered = localProcessed - cloudAnalyzed` 是**派生值**，
// 画成漏斗后「本地处理 → 一部分过滤掉 → 一部分上云」的减法关系一目了然，
// 不需要用户自己去猜。
function aiFunnel(pr, todayTotal){
  var local  = Number(pr.localProcessed) || 0;
  var cloud  = Number(pr.cloudAnalyzed) || 0;
  var filt   = Number(pr.filtered) || 0;
  var total  = Number(todayTotal) || 0;

  // 全部为 0：给一句明确的解释，而不是画一个空漏斗
  if(local === 0 && cloud === 0 && total === 0){
    return '<div class="ai-funnel ai-funnel--empty">'
      + icon('info', 14)
      + '<span>今天还没有事件进入 AI 流程，所以各环节都是 0。</span>'
      + '</div>';
  }

  // 宽度按「本地处理」归一化；本地处理为 0 时全部退化为最小宽度
  var base = Math.max(local, cloud, 1);
  var wLocal = local > 0 ? Math.round(local / base * 100) : 0;
  var wCloud = cloud > 0 ? Math.round(cloud / base * 100) : 0;

  function step(ic, label, val, sub, widthPct, cls){
    return '<div class="ai-funnel__step ' + (cls || '') + '">'
      + '<div class="ai-funnel__row">'
      +   '<span class="ai-funnel__ic">' + icon(ic, 14) + '</span>'
      +   '<span class="ai-funnel__label">' + esc(label) + '</span>'
      +   '<span class="ai-funnel__val">' + val + '</span>'
      + '</div>'
      + '<div class="ai-funnel__bar">'
      +   '<span class="ai-funnel__bar-fill" style="--w:' + widthPct + '%"></span>'
      + '</div>'
      + (sub ? '<span class="ai-funnel__sub">' + esc(sub) + '</span>' : '')
      + '</div>';
  }

  return '<div class="ai-funnel">'
    + '<div class="ai-funnel__head">' + icon('filter', 13) + '事件在 AI 里怎么流动</div>'
    + step('cpu', '本地 AI 分析', local, '本机识别，不上传画面', wLocal, 'is-local')
    + (filt > 0
        ? '<div class="ai-funnel__split">'
          + icon('chevron-down', 12)
          + '<span>其中 <b>' + filt + '</b> 条本地判定为不重要，未送云端</span>'
          + '</div>'
        : '')
    + step('cloud', '送云端深度分析', cloud,
        (cloud > 0 ? '需要更复杂的理解' : '今天没有需要上云的事件'),
        wCloud, 'is-cloud')
    + (total > 0
        ? '<div class="ai-funnel__foot">今日事件总数 <b>' + total + '</b>'
          + (local > 0 ? ' · 本地覆盖率 <b>' + Math.round(local / total * 100) + '%</b>' : '')
          + '</div>'
        : '')
    + '</div>';
}

// aiLocalTitle 无 LLM 时的「AI 标题」（本地拼装）
function aiLocalTitle(e){
  if(e.aiCls){
    if(e.aiCls === 'car')     return '车辆进出';
    if(e.aiCls === 'person')  return e.duration >= 30 ? '人员停留' : '人员活动';
    if(e.aiCls === 'truck')   return '货车经过';
    if(e.aiCls === 'cat' || e.aiCls === 'dog') return '宠物活动';
    return e.aiCls;
  }
  if(e.type === 'person')  return '人员活动';
  if(e.type === 'vehicle') return '车辆进出';
  if(e.type === 'package') return '包裹送达';
  if(e.type === 'motion')  return '画面变化';
  return e.desc || '事件';
}

function isNightTimeStr(t){
  if(!t || t.length < 13) return false;
  var h = parseInt(t.slice(11,13), 10);
  return h >= 22 || h < 6;
}

// ---- 打字机轮播（placeholder 专用）----
//
// 目的：让用户意识到这个输入框能理解**各种自然语言**，
// 而不是一个只会关键词匹配的筛选器。
//
// 三条纪律：
//   ① 只动 placeholder，绝不碰 input.value —— 用户已经在打字时
//      被改输入内容是不可接受的。
//   ② 用户一旦聚焦/输入就立刻停下，不再抢注意力。
//   ③ 离开搜索页要清掉定时器，否则切到别的 Tab 后还在后台跑，
//      回来时会看到错乱的残留状态。
//
// 问题池刻意包含**动物/宠物类**（用户明确要求）：
// 「小狗经过车位」正是这个系统最初被提出来的场景。
// 如果示例里全是人/车/快递，用户根本不会联想到
// 开放式类别（动物）也能问 —— 能力做了却没被展示出来，等于白做。
var AI_TYPE_POOL = [
  '小狗今天经过车位几次？',        // 动物（开放类别，最初场景）
  '昨晚后院有人吗？',              // 人员 + 时间
  '找最近出现的黑色 SUV',          // 车辆 + 外观描述
  '今天有没有猫来过？',            // 动物（第二例，强化该能力）
  '最近一周有几次包裹送达？',       // 包裹 + 统计
  '今天谁来过门口？'               // 人员 + 泛问
];

var aiTypeTimer = null;

function aiTypeStop(){
  if(aiTypeTimer){ clearTimeout(aiTypeTimer); aiTypeTimer = null; }
}

// aiTypewriter 把 pool 里的句子逐字打进 placeholder
function aiTypewriter(el){
  aiTypeStop();
  if(!el) return;

  // 尊重系统的"减少动态效果"设置：不做逐字动画，
  // 直接显示一句完整示例（信息仍然传达，只是不动）。
  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    el.placeholder = '输入你的问题，例如：' + AI_TYPE_POOL[0];
    return;
  }

  var pi = 0, ci = 0, deleting = false;

  function step(){
    // 用户开始在框里打字 / 已聚焦 -> 交出控制权，停止轮播
    if(el.value || document.activeElement === el){
      el.placeholder = '输入你的问题，例如：小狗今天经过车位几次？';
      aiTypeTimer = null;
      return;
    }

    var text = AI_TYPE_POOL[pi];

    if(!deleting){
      ci++;
      el.placeholder = text.slice(0, ci);
      if(ci >= text.length){
        deleting = true;
        aiTypeTimer = setTimeout(step, 1800);   // 打完停一下让人看清
        return;
      }
      aiTypeTimer = setTimeout(step, 70);
    } else {
      ci--;
      el.placeholder = text.slice(0, ci);
      if(ci <= 0){
        deleting = false;
        pi = (pi + 1) % AI_TYPE_POOL.length;    // 下一条
        aiTypeTimer = setTimeout(step, 320);
        return;
      }
      aiTypeTimer = setTimeout(step, 30);       // 删得快一点
    }
  }

  aiTypeTimer = setTimeout(step, 400);
}

function bindAIChatEvents(){
  var c = document.getElementById('aiBody');
  if(!c) return;

  var input = document.getElementById('aiChatInput');
  var send = document.getElementById('aiChatSend');
  var clear = document.getElementById('aiChatClear');

  if(input){
    input.onkeydown = function(e){
      if(e.key === 'Enter') handleAIChatSend();
    };
    input.focus();
  }
  if(send) send.onclick = handleAIChatSend;
  if(clear) clear.onclick = function(){
    aiChatHistory = [];
    try { sessionStorage.removeItem('micam.ai.chatHistory'); } catch(e){}
    paintAIChat();
  };

  // 快捷气泡
  Array.prototype.forEach.call(c.querySelectorAll('[data-chatq]'), function(b){
    b.onclick = function(){
      var q = this.dataset.chatq;
      if(input) input.value = q;
      handleAIChatSend(q);
    };
  });

  // 就地播放短片
  Array.prototype.forEach.call(c.querySelectorAll('[data-play-clip]'), function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var slot = document.getElementById(this.dataset.slot);
      if(!slot) return;
      var dev = this.dataset.dev;
      var file = this.dataset.file;
      var off = parseFloat(this.dataset.off) || 0;
      var videoUrl = apiUrl('/api/recordings/play?name=' + encodeURIComponent(dev) + '&file=' + encodeURIComponent(file) + '#t=' + off);
      slot.innerHTML = '<video class="ai-chat-ev__video" src="' + videoUrl + '" controls autoplay playsinline></video>';
      this.style.display = 'none';
    };
  });

  // 缩略图全屏放大点击
  Array.prototype.forEach.call(c.querySelectorAll('[data-zoom-thumb]'), function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var th = this.dataset.zoomThumb;
      if(th) window.open(apiUrl('/api/events/thumb?f=' + encodeURIComponent(th)), '_blank');
    };
  });

  // 录像回放点击
  Array.prototype.forEach.call(c.querySelectorAll('[data-ev-did]'), function(el){
    el.onclick = function(e){
      e.stopPropagation();
      gotoReplay(el.dataset.evDid, el.dataset.evTime);
    };
  });

  // 深度核查按钮点击
  Array.prototype.forEach.call(c.querySelectorAll('[data-btn-deep]'), function(b){
    b.onclick = function(){
      var idx = parseInt(this.dataset.btnDeep, 10);
      var msg = aiChatHistory[idx];
      if(!msg || !msg.result) return;
      var q = msg.result.q || '监控事件核查';

      msg.deepProgress = '正在启动云端大模型进行逐帧画面深度核验…';
      paintAIChat();

      api('/api/ai/find/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ question: q, maxFrames: 20, confirmed: true })
      }).then(function(d){
        if(!d.ok){ throw new Error(d.error || '执行失败'); }
        var taskId = d.taskId;
        pollChatDeepTask(idx, taskId);
      }).catch(function(e){
        msg.deepReport = '深度核验启动失败：' + e.message;
        msg.deepProgress = null;
        paintAIChat();
      });
    };
  });
}

function pollChatDeepTask(msgIndex, taskId){
  var timer = setInterval(function(){
    api('/api/ai/find/task?id=' + encodeURIComponent(taskId)).then(function(d){
      var t = d.task;
      var msg = aiChatHistory[msgIndex];
      if(!msg) { clearInterval(timer); return; }

      if(t.status === 'running' || t.status === 'estimating'){
        msg.deepProgress = '正在逐帧核查画面（已检查 ' + (t.checked||0) + ' / ' + (t.total||0) + ' 帧）…';
        var b = document.getElementById('aiChatBody');
        if(b) b.innerHTML = renderAIChatBodyHTML();
        bindAIChatEvents();
      } else if(t.status === 'done'){
        clearInterval(timer);
        msg.deepProgress = null;
        var ans = t.answer || '核查完毕';
        var evCount = (t.evidence||[]).length;
        msg.deepReport = ans + (evCount ? ('（命中 ' + evCount + ' 处视觉证据，消耗 ¥' + (t.costCny||0).toFixed(4) + '）') : '（未发现违规或异常线索）');
        msg.deepEvidence = t.evidence || [];
        saveAIChatSession();
        paintAIChat();
      } else if(t.status === 'error'){
        clearInterval(timer);
        msg.deepProgress = null;
        msg.deepReport = '深度核验异常中断：' + (t.error || '未知错误');
        paintAIChat();
      }
    }).catch(function(){});
  }, 2000);
}

function loadAIChatSession(){

function handleAIChatSend(customQ){
  var input = document.getElementById('aiChatInput');
  var q = (customQ || (input ? input.value : '')).trim();
  if(!q) return;

  if(input) input.value = '';

  // 添加用户消息和 AI 加载消息
  aiChatHistory.push({ role: 'user', content: q, time: new Date().toTimeString().slice(0,5) });
  aiChatHistory.push({ role: 'ai', loading: true, time: new Date().toTimeString().slice(0,5) });

  paintAIChat();

  // 查找上一轮提问作为上下文
  var lastUserQ = '';
  for(var i = aiChatHistory.length - 2; i >= 0; i--){
    if(aiChatHistory[i].role === 'user' && aiChatHistory[i].content !== q){
      lastUserQ = aiChatHistory[i].content;
      break;
    }
  }

  saveAIChatSession();

  api('/api/ai/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ q: q, context: lastUserQ })
  }).then(function(r){
    // 替换 AI 消息
    aiChatHistory[aiChatHistory.length - 1] = {
      role: 'ai',
      result: r,
      time: new Date().toTimeString().slice(0,5)
    };
    saveAIChatSession();
    paintAIChat();
  }).catch(function(err){
    aiChatHistory[aiChatHistory.length - 1] = {
      role: 'ai',
      result: { ruleConclusion: '提问失败：' + err.message, q: q },
      time: new Date().toTimeString().slice(0,5)
    };
    paintAIChat();
  });
}

// findProgress 执行进度
//
// 设计纪律（用户明确要求，2026-10-13）：
//   只展示**真实存在于执行循环里的状态**，不做聚合统计。
//
//   曾经想展示「已筛选 234 段候选 → 47 段含动物活动」这类数字，但核实
//   ai_find.go 后发现执行路径里**没有粗筛这道工序**：
//   collectCandidates() 之后直接就是逐条 Judge，中间不产生"命中候选数"。
//   编一个出来展示，比转圈更伤信任 —— 所以这里的每个数字都能在
//   runFindTask 的循环里找到对应的变量。
//
//   能拿到的真实量：
//     t.checked  第几条（循环下标，在 Judge 之前自增）
//     t.total    候选总数（cands 截断后的长度）
//     t.current  正在核实的那一条的 时间/设备（后端新增字段）
//     t.evidence 已命中数（len，边跑边增）
//     t.costCny  累计花费
//
//   ⚠️ 没有复用概览页的 ai-ring 环形组件：那个组件的签名只认
//      pr.percent（内部写死 "N%" 加固定标签「已处理」，还有一段
//      "0% = 暂无数据"的分支）。硬套到"N/M 条"需要改组件+包转换层，
//      改动面和回归风险都划不来。这里维持横条 + 原始计数更直接。
function findProgress(t){
  var total = t.total || 0;
  var done  = t.checked || 0;
  // 进度条按"已开始处理第 N 条"算：正在看的那条算半个，
  // 否则第 1 条刚进入时会显示 0%，看起来像没动。
  var pct = total ? Math.round((done / total) * 100) : 0;
  var cur = t.current;
  var hit = (t.evidence || []).length;

  // ---- 时间维度 ----
  //
  // 实测单条事件约 4.5~4.8 秒（云端视觉核实），而轮询 2.5 秒一次 ——
  // 「已检查 N / M」变化很慢，20 条最坏要 90 秒以上。
  // 只给一个几乎不动的 N，用户会以为卡死。
  // 已用时长是**匀速增长**的，它持续证明"系统还在跑"。
  //
  // 单条均速用**已用时长 / 已检查条数**算，全部是可观测的真实量，
  // 不预设任何"每条 5 秒"之类的常数。
  var elapsedText = '';
  if(findState.startedAt && done > 0){
    var secs = (Date.now() - findState.startedAt) / 1000;
    var perItem = secs / done;
    elapsedText = '已用 ' + fmtDur(secs);
    // 剩余估算：只在候选还没跑完、且均速可信（至少看过 2 条）时给。
    // 只看了 1 条就外推剩余时间，误差会很大 —— 宁可不显示。
    if(done >= 2 && total > done){
      elapsedText += ' · 预计还需约 ' + fmtDur(perItem * (total - done));
    }
  }

  return '<div class="ai-find__prog">'

    + '<div class="ai-find__prog-head">' + icon('search',15)
    +   '<span>正在逐条核实 · ' + done + ' / ' + total + '</span></div>'

    + '<div class="ai-find__bar"><span style="width:' + pct + '%"></span></div>'

    // 当前正在看的那一条 —— 真实来自后端循环的 t.current

// ---- 置信度分档 ----
//
// 为什么分档而不是只显示百分比：模型自评的 87% 和 51% 在用户眼里
// 都是"一个数字"，视觉权重相同。但前者基本可信、后者需要人看一眼。
// 混在一起展示会让用户要么全信、要么全不信，两种都伤信任。
//
// 阈值取 0.8 / 0.5：0.8 以上是模型比较有把握的，0.5 以下基本是猜。
function confCls(c){
  c = c || 0;
  if(c >= 0.8) return 'is-high';
  if(c >= 0.5) return 'is-mid';
  return 'is-low';
}
function confLow(c){ return (c || 0) < 0.5; }

// fmtDur 把秒数写成"1 分 12 秒"这种口语时长
//
// 不用 "01:12" 这种计时器格式：这里是**预估**不是精确倒计时，
// 给人"精确到秒"的错觉反而会在偏差大时招致不信任。
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec < 60) return sec + ' 秒';
  var m = Math.floor(sec / 60), s = sec % 60;
  return s ? m + ' 分 ' + s + ' 秒' : m + ' 分';
}

// findResult 结果 + 证据
function findResult(t){
  var ev = t.evidence || [];
  var c = t.coverage || {};

  return '<div class="ai-find__result">'

    + '<div class="ai-find__answer ' + (ev.length ? 'is-hit' : 'is-none') + '">'

    + '<div class="ai-find__meta">'

    +   ' · 耗时 ' + esc(t.doneAt || '')
    + '</div>'

    // 覆盖率（防止把「没找到」当成「没发生」）
    + '<div class="ai-find__cover ' + (c.complete ? 'is-ok' : 'is-warn') + '">'
    +   icon(c.complete ? 'check' : 'alert', 13)
    +   '<span>索引范围 ' + esc((c.indexFrom||'').slice(0,16)) + ' ~ ' + esc((c.indexTo||'').slice(0,16))
    +     ' · 共 ' + (c.indexCount||0) + ' 条事件 · 录像 ' + (c.recDays||0) + ' 天</span>'
    + '</div>'

    // 证据列表
    + (ev.length
        ? '<div class="ai-find__ev-head">' + icon('file',14) + '证据（' + ev.length + '）</div>'
          + '<div class="ai-find__evs">'

              return '<div class="ai-find__ev" data-fev-did="' + esc(x.did||'') + '" data-fev-time="' + esc(x.time||'') + '">'
                + '<div class="ai-find__ev-img">'
                +   (x.thumb ? '<img loading="lazy" src="' + apiUrl('/api/events/thumb?f=' + encodeURIComponent(x.thumb)) + '" alt="">' : '')
                +   '<span class="ai-find__ev-conf ' + confCls(x.confidence) + '">' + Math.round((x.confidence||0)*100) + '%</span>'
                + '</div>'
                + '<div class="ai-find__ev-body">'
                +   '<div class="ai-find__ev-time">' + icon('clock',12) + esc(x.time || '') + '</div>'
                +   '<div class="ai-find__ev-dev">' + icon('camera',12) + esc(x.device || '') + '</div>'
                // 置信度不只给数字，还要给**档位话术**（用户要求）：
                // 低置信度的结果混在高置信度里用同样视觉权重展示，
                // 会损害用户对整个功能的信任。所以低档额外挂一句
                // 「建议人工确认」，让它自己"承认不确定"。
                +   (confLow(x.confidence)
                      ? '<div class="ai-find__ev-warn">' + icon('alert',12) + '置信度偏低，建议点开画面人工确认</div>'
                      : '')
                +   '<div class="ai-find__ev-note">' + esc(x.note || '') + '</div>'
                +   '<button class="btn btn--sm ai-find__ev-btn" data-fev-go="1">'
                +     icon('play',12) + '定位回放</button>'
                + '</div>'
                + '</div>';
            }).join('')
          + '</div>'
        : '')

    + '<div class="ai-find__again">'
    +   '<button class="btn" id="findAgain">' + icon('refresh',14) + '再问一个</button>'
    + '</div>'
    + '</div>';
}

// bindFind 绑定交互
function bindFind(){
  var c = document.getElementById('content');
  if(!c) return;

  // 示例问句
  Array.prototype.forEach.call(c.querySelectorAll('[data-findex]'), function(b){
    b.onclick = function(){
      var el = document.getElementById('findQ');
      if(el){ el.value = this.dataset.findex; findState.question = this.dataset.findex; }
      doFindEstimate();
    };
  });

  // 预估
  var go = document.getElementById('findGo');
  if(go) go.onclick = doFindEstimate;

  var q = document.getElementById('findQ');
  if(q){
    q.onkeydown = function(e){ if(e.key === 'Enter') doFindEstimate(); };
  }

  // 确认执行
  var cf = document.getElementById('findConfirm');
  if(cf) cf.onclick = doFindRun;

  var ca = document.getElementById('findCancel');
  if(ca) ca.onclick = function(){ findState.estimate = null; findState.task = null; paintFindBody(); };

  var ag = document.getElementById('findAgain');
  if(ag) ag.onclick = function(){
    findState.estimate = null; findState.task = null; findState.question = '';
    paintAITab();
  };

  // 证据 -> 定位回放
  Array.prototype.forEach.call(c.querySelectorAll('[data-fev-did]'), function(el){
    var btn = el.querySelector('[data-fev-go]');
    var handler = function(e){
      e.stopPropagation();
      gotoReplay(el.dataset.fevDid, el.dataset.fevTime);
    };
    if(btn) btn.onclick = handler;
    el.onclick = handler;
  });
}

// doFindEstimate 请求成本预估（不花钱）
function doFindEstimate(){
  var el = document.getElementById('findQ');
  var q = el ? el.value : findState.question;
  if(!q || !q.trim()) return;
  findState.question = q;
  findState.task = null;

  var box = document.getElementById('findBody');
  if(box) box.innerHTML = loading('正在本地筛选候选…');

  api('/api/ai/find/estimate', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ question: q, maxFrames: findState.maxFrames }) })
    .then(function(d){
      findState.estimate = d;
      paintFindBody();
    })
    .catch(function(e){
      if(box) box.innerHTML = '<div class="ai-err">预估失败：' + esc(e.message) + '</div>';
    });
}

// doFindRun 确认后执行
function doFindRun(){
  var box = document.getElementById('findBody');
  if(box) box.innerHTML = loading('正在调用云端分析…');

  api('/api/ai/find/run', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ question: findState.question, maxFrames: findState.maxFrames, confirmed: true }) })
    .then(function(d){
      if(!d.ok){ throw new Error(d.error || '执行失败'); }
      findState.task = d.task;
      findState.startedAt = Date.now();   // 计时起点（展示"已用多久"）
      paintFindBody();
      pollFind(d.taskId);
    })
    .catch(function(e){
      if(box) box.innerHTML = '<div class="ai-err">' + esc(e.message) + '</div>';
    });
}

// pollFind 轮询进度
function pollFind(id){
  if(findState.polling) clearInterval(findState.polling);
  findState.polling = setInterval(function(){
    if(aiTab !== 'qa' && aiTab !== 'investigate'){ clearInterval(findState.polling); findState.polling = null; return; }
    api('/api/ai/find/task?id=' + encodeURIComponent(id)).then(function(d){
      findState.task = d.task;
      paintFindBody();
      if(d.task && (d.task.status === 'done' || d.task.status === 'failed')){
        clearInterval(findState.polling);
        findState.polling = null;
        if(d.task.status === 'done' && (d.task.evidence||[]).length){
          toast('找到 ' + d.task.evidence.length + ' 处证据', 'ok');
        }
      }
    }).catch(function(){
      clearInterval(findState.polling);
      findState.polling = null;
    });
  }, 2500);
}

    // 所以先补齐后端计数（skippedDedupe / cacheHits），再显示**真实次数**。
    +     sw('aiDedupe', '去重',
           '相似事件在 5 分钟内只发送一次。<span class="sw-fact" id="factDedupe"></span>',
           cf.dedupe !== false, false)
    +     sw('aiCache',  '缓存',
           '命中缓存的事件直接复用上次结果，不再调用云端。<span class="sw-fact" id="factCache"></span>',
           cf.cacheEnabled !== false, false)
    // ⚠️ 「仅重要事件上云」是**第二个死设置**（2026-10-13 核实）：
    //    cloudImportant 会存进配置、会随 API 下发、前端也会写回，
    //    但**全仓库没有任何决策逻辑读它** ——
    //    实际过滤完全由上面 5 条「策略规则」的 evalRules() 决定。
    //    即：打开它不会过滤任何东西，关闭它也不会放开任何限制。
    //
    //    按与「浅色主题」同样的原则处理：**不让用户操作一个不生效的开关**，
    //    并说明原因。没有直接实现它，是因为「高置信度」需要先定阈值，
    //    而事件置信度分布（动检启发式 78~99 / AI 识别百分比）尚未实测标定，
    //    贸然启用会静默丢弃本应上传的事件 —— 那是更严重的问题。
    +     sw('aiImportantOnly', '仅重要事件上云',
           '⚠️ 暂未生效：当前版本的上云过滤完全由上面的「策略规则」决定，'
           + '此开关不会改变行为。待置信度阈值实测标定后再启用。',
           cf.cloudImportant !== false, true)
    +     '<div class="ai-rule-note">' + icon('info',14)
    +       '只收取符合策略的事件发送到云端视觉分析。</div>'
    // 用户反馈：两个「保存」并排，不知道各自保存哪部分。
    // 不合并（两块的校验/字段本就独立，合并会牵动保存逻辑），
    // 改为**按钮文字写明范围** + 旁边小字说明。
    +     '<div class="ai-savebar">'
    +       '<button class="btn btn--primary" id="aiSaveRules">保存策略设置</button>'
    +       '<span class="ai-savebar__hint">仅保存本卡（分析策略与三个开关）</span>'
    +     '</div>'
    +   '</div>'

    +   '<div class="card">'
    +     '<div class="card__head">' + icon('shield',16) + '<span class="card__title">隐私控制</span>'
    +       '<span class="card__hint">为每个摄像头设置云端上传权限，室内摄像头建议仅本地处理。</span></div>'
    +     '<div class="ai-priv">'
    +       '<div class="ai-priv__head">'
    +         '<span>摄像头</span><span>允许上传到云端</span><span>上传内容</span>'
    +       '</div>'
    +       (devs.length ? devs.map(function(d){
            var name = d.name;
            var nm = d.alias || d.name;
            var en = d.aliasEn || '';
            var allowed = (cf.privacyCameras || {})[name] !== false;
            var up = cf.uploadMode || 'snapshot';
            return '<div class="ai-priv__row">'
              + '<span class="ai-priv__cam">' + icon('camera',13)
              +   '<span class="ai-priv__camname">' + esc(nm) + (en ? '<em>' + esc(en) + '</em>' : '') + '</span></span>'
              + '<span class="ai-priv__allow">'
              +   '<label class="ai-check"><input type="checkbox" data-privcam="' + esc(name) + '"' + (allowed ? ' checked' : '') + '><span>' + (allowed ? '允许' : '仅本地') + '</span></label>'
              + '</span>'
              + '<span class="ai-priv__modes">'
              +   ['snapshot:仅截图', 'keyframes:关键帧', 'clip:短视频'].map(function(x){
                    var p = x.split(':');
                    var on = (up === p[0] || (p[0] === 'snapshot' && !up));
                    return '<label class="ai-radio"><input type="radio" name="up_' + esc(name) + '" value="' + p[0] + '"' + (on?' checked':'') + '><span>' + p[1] + '</span></label>';
                  }).join('')
              + '</span>'
              + '</div>';
          }).join('') : emptyState('unconfigured', { title:'还没有设备', desc:'到「账号」页扫码登录并获取设备', compact:true }))
    +       '<div class="ai-priv__foot">只在摄像机的事件会上传到云端进行分析。</div>'
    +     '</div>'
    +     '<div class="ai-savebar">'
    +       '<button class="btn btn--primary" id="aiSavePriv">保存隐私设置</button>'

    // ===== 用量与成本 =====

    + '<div class="ai-stage">'

// paintAIUsage 用量区块（4 小卡 + 折线图 + 预算）
function paintAIUsage(){
  var box = document.getElementById('aiUsageWrap');
  if(!box) return;
  var cf = (aiCache.cf && aiCache.cf.config) || {};

  api('/api/ai/usage').then(function(u){
    aiUsage = u;
    var t = u.today || {};
    var trend = u.trend || [];
    var budget = u.budget || {};

    // 折线图（SVG）
    var maxV = Math.max.apply(null, trend.map(function(x){ return Math.max(x.local||0, x.cloud||0); }).concat([1]));
    var W = 400, H = 120, padL = 28, padR = 12, padT = 16, padB = 22;
    function getX(i){
      return padL + (W - padL - padR) * (trend.length > 1 ? i/(trend.length-1) : 0);
    }
    function getY(v){
      return padT + (H - padT - padB) * (1 - (v / maxV));
    }
    function pts(key){
      return trend.map(function(x, i){
        return getX(i).toFixed(1) + ',' + getY(x[key]||0).toFixed(1);
      }).join(' ');
    }
    function areaPts(key){
      var p = trend.map(function(x, i){
        return getX(i).toFixed(1) + ',' + getY(x[key]||0).toFixed(1);
      });
      if(!p.length) return '';
      var lastX = getX(trend.length - 1).toFixed(1);
      var firstX = getX(0).toFixed(1);
      var base = (H - padB).toFixed(1);
      return p.join(' ') + ' ' + lastX + ',' + base + ' ' + firstX + ',' + base;
    }
    function dots(key, color){
      return trend.map(function(x, i){
        var cx = getX(i).toFixed(1);
        var cy = getY(x[key]||0).toFixed(1);
        var val = x[key]||0;
        return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (val > 0 ? '3.5' : '2') + '" fill="' + color + '" stroke="var(--surface-2)" stroke-width="1.5"/>';
      }).join('');
    }
    var gridSvg = '<line x1="' + padL + '" y1="' + padT + '" x2="' + (W-padR) + '" y2="' + padT + '" stroke="var(--border-subtle)" stroke-dasharray="3 3"/>'
      + '<line x1="' + padL + '" y1="' + ((padT + H - padB)/2) + '" x2="' + (W-padR) + '" y2="' + ((padT + H - padB)/2) + '" stroke="var(--border-subtle)" stroke-dasharray="3 3"/>'
      + '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W-padR) + '" y2="' + (H - padB) + '" stroke="var(--border-subtle)"/>'
      + '<text x="' + (padL - 4) + '" y="' + (padT + 4) + '" text-anchor="end" font-size="9" fill="var(--text-muted)">' + maxV + '</text>'
      + '<text x="' + (padL - 4) + '" y="' + (H - padB + 3) + '" text-anchor="end" font-size="9" fill="var(--text-muted)">0</text>';

    var defs = '<defs>'
      + '<linearGradient id="gradLocal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0.0"/></linearGradient>'
      + '<linearGradient id="gradCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/></linearGradient>'
      + '</defs>';

    var allZero = !(t.localAnalyzed || 0) && !(t.cloudAnalyzed || 0)
                  && !(t.imagesUploaded || 0)
                  && !trend.some(function(x){ return (x.local || 0) || (x.cloud || 0); });
    var chart = allZero
      ? aiEmptyBlock('chart', '还没有 AI 分析记录',
          '系统开始分析事件后，这里会自动生成调用量与费用折线趋势。')
      : '<div class="ai-chart-wrap">'
        + '<svg class="ai-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
        + defs
        + gridSvg
        + '<polygon points="' + areaPts('local') + '" fill="url(#gradLocal)"/>'
        + '<polygon points="' + areaPts('cloud') + '" fill="url(#gradCloud)"/>'
        + '<polyline points="' + pts('local') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'
        + '<polyline points="' + pts('cloud') + '" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/>'
        + dots('local', 'var(--accent)')
        + dots('cloud', '#a855f7')
        + '</svg>'
        + '<div class="ai-chart__labels">'
        + trend.map(function(x){ return '<span>' + esc(x.label||'') + '</span>'; }).join('')
        + '</div>'
        + '</div>';

    var bVal = budget.dailyCny || cf.dailyBudgetCny || 5;
    var usedCny = t.costCny || 0;
    var usedPct = bVal > 0 ? Math.min(100, (usedCny / bVal) * 100) : 0;

    box.innerHTML = ''
      + '<div class="ai-usage-today">'
      +   aiUsageCard('cpu',   '本地分析', t.localAnalyzed || 0)
      +   aiUsageCard('cloud', '云端分析', t.cloudAnalyzed || 0)
      +   aiUsageCard('image', '分析图片', t.imagesUploaded || 0)
      +   aiUsageCard('yuan',  '预估费用', '¥' + usedCny.toFixed(2))
      +   '<div class="ai-usage-updated">更新于 ' + esc(t.updatedAt || '—') + '</div>'
      + '</div>'

      + '<div class="ai-usage-cols">'
      +   '<div class="ai-usage-chart">'
      +     '<div class="ai-usage-chart__head">'
      +       '<div>'
      +         '<div class="ai-usage-chart__title">近 7 天 AI 分析趋势</div>'
      +         '<div class="ai-usage-chart__sub">本地轻量推理与云端大模型调用对比</div>'
      +       '</div>'
      +       (allZero ? '' : '<div class="ai-usage-legend">'
      +         '<span><i style="background:var(--accent)"></i>本地处理</span>'
      +         '<span><i style="background:#a855f7"></i>云端分析</span>'
      +       '</div>')
      +     '</div>'
      +     chart
      +   '</div>'
      +   '<div class="ai-usage-budget">'
      +     '<div class="ai-usage-budget__title">成本与预算管理</div>'
      +     '<div class="ai-budget-meter">'
      +       '<div class="ai-budget-meter__top">'
      +         '<span>今日费用：<b>¥' + usedCny.toFixed(2) + '</b></span>'
      +         '<span>每日上限：¥' + bVal.toFixed(2) + '（已用 ' + usedPct.toFixed(1) + '%）</span>'
      +       '</div>'
      +       '<div class="ai-budget-meter__bar">'
      +         '<div class="ai-budget-meter__fill" style="width:' + usedPct.toFixed(1) + '%"></div>'
      +       '</div>'
      +     '</div>'
      +     '<div class="cfg-row" style="padding-top:0">'
      +       '<label class="cfg-row__label">每日预算上限</label>'
      +       '<div class="cfg-row__control">¥ <input class="input cfg-row__num" id="aiBudget" type="number" min="0" step="1" value="' + bVal + '"></div>'
      +     '</div>'
      +     '<div class="cfg-row">'
      +       '<label class="cfg-row__label">超出上限时</label>'
      +       '<div class="cfg-row__control ai-radio-group">'
      +         '<label class="ai-radio"><input type="radio" name="budgetAct" value="stop"' + ((budget.action||'alert')==='stop'?' checked':'') + '><span>停止分析</span></label>'
      +         '<label class="ai-radio"><input type="radio" name="budgetAct" value="alert"' + ((budget.action||'alert')!=='stop'?' checked':'') + '><span>仅告警</span></label>'
      +       '</div>'
      +     '</div>'
      +     '<button class="btn btn--primary" id="aiSaveBudget" style="margin-top:auto">保存预算设置</button>'
      +   '</div>'
      + '</div>';

    var sb = document.getElementById('aiSaveBudget');
    if(sb) sb.onclick = function(){
      var act = 'alert';
      var c = document.querySelector('input[name="budgetAct"]:checked');
      if(c) act = c.value;
      aiSaveConfig({ dailyBudgetCny: parseFloat((document.getElementById('aiBudget')||{}).value) || 5, budgetAction: act });
    };
  }).catch(function(e){
    box.innerHTML = '<div class="ai-err">读取用量失败：' + esc(e.message) + '</div>';
  });
}

function aiUsageCard(ic, label, val){
  return '<div class="ai-ucard">'
    + '<span class="ai-ucard__icon">' + icon(ic, 16) + '</span>'
    + '<span class="ai-ucard__label">' + label + '</span>'
    + '<span class="ai-ucard__val">' + val + '</span>'
    + '</div>';
}

// ============ 绑定 ============
function bindAI(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-aiset]'), function(b){
    b.onclick = function(){ aiSetTab = this.dataset.aiset; paintAITab(); };
  });

  // 高级参数折叠：点击展开/收起，**状态记忆到 sessionStorage**。
  //
  // 用 sessionStorage 而不是 localStorage：用户要求「本次会话内记住」——
  // 展开过一次之后切 tab 回来不用重新展开；关掉浏览器则回到默认收起。
  Array.prototype.forEach.call(document.querySelectorAll('.adv__head'), function(h){
    var key = h.dataset.adv;
    var body = document.getElementById('advBody-' + key);
    if(!body) return;
    var open = false;
    try { open = sessionStorage.getItem('micam.adv.' + key) === '1'; } catch(e){}
    function apply(){
      body.hidden = !open;
      h.classList.toggle('is-open', open);
      h.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    apply();
    h.onclick = function(){
      open = !open;
      try { sessionStorage.setItem('micam.adv.' + key, open ? '1' : '0'); } catch(e){}
      apply();
    };
  });

  // ---- 未保存改动提示（吸底）----
  //
  // 用户要求：有未保存改动时才出现，文案「有未保存的更改」+「保存」「放弃」；
  // 离开页面前若有脏数据要确认。
  //
  // 为什么需要：各 Tab 的保存按钮在卡片底部，改动后不一定在视野内；
  // 切走时改动会静默丢失。
  (function(){
    var panel = document.querySelector('[data-pnl="' + aiSetTab + '"]');
    if(!panel) return;
    var bar = document.getElementById('aiDirtyBar');
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'aiDirtyBar';
      bar.className = 'dirtybar';
      bar.hidden = true;
      bar.innerHTML = '<span class="dirtybar__txt">' + icon('alert',14) + '有未保存的更改</span>'
        + '<button class="btn btn--primary btn--sm" id="aiDirtySave" type="button">保存</button>'
        + '<button class="btn btn--sm" id="aiDirtyDrop" type="button">放弃</button>';
      document.body.appendChild(bar);
    }
    bar.querySelector('#aiDirtySave').onclick = function(){
      // 按当前 Tab 触发对应的保存按钮（策略页有两块，一起保存）
      var ids = aiSetTab === 'mode'   ? ['aiSaveLocal']
              : aiSetTab === 'prov'   ? ['aiProvSave']
              : aiSetTab === 'policy' ? ['aiSaveRules', 'aiSavePriv']
              :                         ['aiSaveBudget'];
      var hit = 0;
      ids.forEach(function(id){
        var b = document.getElementById(id);
        if(b){ b.click(); hit++; }
      });
      if(!hit) toast('当前页没有可保存的设置', 'warn');
      clearDirty();
    };
    bar.querySelector('#aiDirtyDrop').onclick = function(){
      clearDirty();
      paintAITab();   // 重绘 = 从服务端配置回到干净状态
      toast('已放弃未保存的更改', 'ok');
    };

    var dirty = false;
    function markDirty(){ if(!dirty){ dirty = true; bar.hidden = false; window._aiDirty = true; } }
    function clearDirty(){ dirty = false; bar.hidden = true; window._aiDirty = false; }

    // 事件委托：监听本 Tab 面板内的任何输入变化，避免逐个绑定
    if(!panel.dataset.dirtyBound){
      panel.dataset.dirtyBound = '1';
      panel.addEventListener('change', markDirty, true);
      panel.addEventListener('input', markDirty, true);
    }
    clearDirty();   // 每次重绘后从干净态开始
  })();

  var c = document.getElementById('content');
  if(!c) return;

  // Tab 切换
  Array.prototype.forEach.call(c.querySelectorAll('[data-ait]'), function(b){
    b.onclick = function(){
      aiTab = this.dataset.ait;
      Array.prototype.forEach.call(c.querySelectorAll('[data-ait]'), function(x){
        x.classList.toggle('is-active', x.dataset.ait === aiTab);
      });
      paintAITab();
    };
  });

  // 跳转
  //
  // ⚠️ data-aigoto 只用于**AI 页内的 Tab 切换**（overview/search/investigate/settings）。
  //    以前任何值都会走 paintAITab()，于是 data-aigoto="accounts" 会被当成
  //    未知 Tab -> 落进 else 分支 -> 渲染「AI 设置」，而不是跳到账号页。
  //    现在：AI 内部 Tab 走切换，其它值走全局页面跳转。
  var AI_TABS = { overview:1, qa:1, search:1, investigate:1, settings:1 };
  Array.prototype.forEach.call(c.querySelectorAll('[data-aigoto]'), function(b){
    b.onclick = function(){
      var t = this.dataset.aigoto;
      if(!AI_TABS[t]){
        // 页面级跳转（accounts / devices / events ...）
        page = t;
        renderMenu();
        render();
        var ct = document.getElementById('content');
        if(ct) ct.scrollTop = 0;
        return;
      }
      aiTab = (t === 'search' || t === 'investigate') ? 'qa' : t;
      Array.prototype.forEach.call(c.querySelectorAll('[data-ait]'), function(x){
        x.classList.toggle('is-active', x.dataset.ait === t);
      });
      paintAITab();
    };
  });

  // 事件点击 -> 回放
  Array.prototype.forEach.call(c.querySelectorAll('[data-ev-did]'), function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      gotoReplay(el.dataset.evDid, el.dataset.evTime);
    };
  });

  // AI 智能问答
  var q = document.getElementById('aiQ');
  if(q){
    q.onkeydown = function(e){ if(e.key === 'Enter') doAISearch(); };
  }
  var go = document.getElementById('aiGo');
  if(go) go.onclick = doAISearch;
  var cl = document.getElementById('aiClear');
  if(cl) cl.onclick = function(){
    var el = document.getElementById('aiQ');
    if(el){ el.value = ''; aiQuery = ''; el.focus(); }
  };
  var rt = document.getElementById('aiRetry');
  if(rt) rt.onclick = doAISearch;
  Array.prototype.forEach.call(c.querySelectorAll('[data-aiex]'), function(b){
    b.onclick = function(){
      var el = document.getElementById('aiQ');
      if(el){ el.value = this.dataset.aiex; aiQuery = this.dataset.aiex; doAISearch(); }
    };
  });

  // 原位深度视觉调查触发与轮询
  var btnDeep = document.getElementById('btnDeepRunInline');
  if(btnDeep){
    btnDeep.onclick = function(){
      var box = document.getElementById('aiDeepInlineBox');
      if(box) box.innerHTML = '<div style="display:inline-flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--text-muted);height:32px;"><span class="spinner spinner--sm"></span><span>正在启动云端视觉大模型逐帧核验…</span></div>';
      findState.question = aiQuery;
      findState.startedAt = Date.now();
      api('/api/ai/find/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ question: aiQuery, maxFrames: 20, confirmed: true })
      }).then(function(d){
        if(!d.ok){ throw new Error(d.error || '执行失败'); }
        findState.task = d.task;
        if(box) box.innerHTML = findProgress(d.task);
        pollDeepInline(d.taskId);
      }).catch(function(e){

  //

  // 测完仍显示灰色「未连接」，用户不知道到底成功没有。
  // 现在四种状态各有明确的视觉与文案：
  //   idle    灰点 + 「未连接」  + 下一步指引
  //   testing 蓝点(脉冲) + 「测试中…」
  //   ok      绿点 + 「已连接，模型可用」 + 延迟与时间
  //   fail    红点 + 「连接失败」 + **具体原因 + 可操作建议**
  function setConnState(state, detail){
    var card = document.querySelector('.ai-conn');
    var dot  = document.querySelector('.ai-conn__dot');
    var tt   = document.querySelector('.ai-conn__title');
    var sub  = document.getElementById('aiConnSub');
    if(!card || !dot || !tt) return;
    dot.className = 'ai-conn__dot'
      + (state === 'ok' ? ' is-ok' : state === 'fail' ? ' is-bad' : state === 'testing' ? ' is-testing' : '');
    // 卡片上也标记状态：左侧色条据此变色（见 CSS .ai-conn.is-*）
    card.classList.remove('is-ok', 'is-bad', 'is-testing');
    if(state === 'ok') card.classList.add('is-ok');
    else if(state === 'fail') card.classList.add('is-bad');
    else if(state === 'testing') card.classList.add('is-testing');
    card.classList.remove('is-ok', 'is-bad', 'is-testing', 'is-pending');
    if(state === 'pending') card.classList.add('is-pending');
    var titles = { idle:'未连接', pending:'已配置密钥（待测试验证）', testing:'测试中…', ok:'已连接，模型可用', fail:'连接失败' };
    tt.textContent = titles[state] || titles.idle;
    if(sub) sub.textContent = detail || '';

    // 把「保存」按钮的视觉权重与连接状态绑定（用户功能建议 #5）：
    // 未验证时是次要描边按钮 + 提示先测试；测试成功后升级为强调实心按钮。
    var save = document.getElementById('aiProvSave');
    var shint = document.getElementById('aiProvSaveHint');
    if(save){
      save.classList.toggle('btn--primary', state === 'ok');
    }
    if(shint){
      shint.textContent = state === 'ok'
        ? '连接已验证'
        : (state === 'fail' ? '连接失败，修正后再保存' : '建议先「测试连接」，确认密钥可用再保存');
    }
    // 头部全局状态徽章同步（与左侧「本地 AI」一样一眼可见）
    var badge = document.querySelector('.ai-prov-badge');
    if(badge){
      var mname = (document.getElementById('aiProvModel') || {}).value || 'deepseek';
      badge.className = 'ai-prov-badge' + (state === 'ok' ? ' is-ok' : '');
      badge.innerHTML = state === 'ok'
        ? '<span class="status-dot is-online"></span>已连接 · ' + esc(mname)
        : '<span class="status-dot"></span>' + (state === 'testing' ? '测试中…' : '未连接');
    }
  }

  // 把后端错误翻译成「用户能照着做的下一步」——只说"失败"没有意义
  function connAdvice(msg){
    var m = String(msg || '');
    if(/401|403|unauthor|invalid.*key|api.?key/i.test(m)) return 'API 密钥认证失败。请检查密钥是否完整有效；若您使用的是第三方中转或硅基流动(SiliconFlow)，需将「API 地址」修改为对应的接口地址。';
    if(/402|quota|balance|insufficient|欠费/i.test(m))       return '账户额度不足，请到服务商后台充值。';
    if(/timeout|timed? ?out|ETIMEDOUT/i.test(m))             return '请求超时，检查网络或 API 地址是否能从本机访问。';
    if(/ENOTFOUND|getaddrinfo|dns/i.test(m))                 return '域名解析失败，检查「API 地址」是否填写正确。';
    if(/ECONNREFUSED|refused/i.test(m))                      return '连接被拒绝，确认服务已启动且端口可访问。';
    if(/model|404/i.test(m))                                 return '模型名不可用，请在服务商后台确认模型名称。';
    return '请检查 API 地址、密钥与网络后重试。';
  }

  function doProvTest(){
    var el = document.getElementById('aiProvRes');
    if(el) el.textContent = '';
    setConnState('testing', '正在请求 Provider，请稍候…');
    var t0 = Date.now();

    api('/api/ai/provider/test', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(testBody) })
      .then(function(r){
        var ms = Date.now() - t0;

          var testTime = new Date().toLocaleString('zh-CN');

            localStorage.setItem('micam.ai.provReady', '1');

          } catch(e){}

          if(el) el.textContent = '连接正常';
        } else {
          try { localStorage.removeItem('micam.ai.provReady'); } catch(e){}
          var why = (r && (r.error || r.message)) || '未知错误';
          setConnState('fail', why + ' —— ' + connAdvice(why));
          if(el) el.textContent = '连接失败';
        }
      })
      .catch(function(e){
        try { localStorage.removeItem('micam.ai.provReady'); } catch(e){}
        var why = (e && e.message) || String(e);
        setConnState('fail', why + ' —— ' + connAdvice(why));
        if(el) el.textContent = '连接失败';
      });
  }
  var pt = document.getElementById('aiProvTest');
  if(pt) pt.onclick = doProvTest;
  var cr = document.getElementById('aiConnRefresh');
  if(cr) cr.onclick = doProvTest;
  var sp = document.getElementById('aiSavePriv');

}

// doAISearch 执行搜索

function pollDeepInline(taskId){
  if(findState.polling) clearInterval(findState.polling);
  findState.polling = setInterval(function(){
    var box = document.getElementById('aiDeepInlineBox');
    if(!box){
      clearInterval(findState.polling);
      findState.polling = null;
      return;
    }
    api('/api/ai/find/task?id=' + encodeURIComponent(taskId)).then(function(d){
      findState.task = d.task;
      if(d.task.status === 'running' || d.task.status === 'estimating'){
        box.innerHTML = findProgress(d.task);
      } else if(d.task.status === 'done'){
        clearInterval(findState.polling);
        findState.polling = null;
        box.innerHTML = findResult(d.task);
        bindFind();
      } else if(d.task.status === 'error'){
        clearInterval(findState.polling);
        findState.polling = null;
        box.innerHTML = '<div class="ai-err">核验中断：' + esc(d.task.error || '未知错误') + '</div>';
      }
    }).catch(function(){});
  }, 2000);
}

// doSimilarSearch 相似图搜索（本地 img2vec）
function doSimilarSearch(f){
  var box = document.getElementById('aiSimRes');
  if(box) box.innerHTML = loading('计算图片特征…（首次约 12 秒加载模型）');
  var fd = new FormData();
  fd.append('image', f);
  fetch(apiUrl('/api/ai/embed'), { method:'POST', body: fd })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!box) return;
      if(d.error || !d.ok){ box.innerHTML = '<div class="ai-err">' + esc(d.error || '搜索失败') + '</div>'; return; }
      var hits = d.matches || [];
      box.innerHTML = '<div class="ai-answer__sub">找到 ' + hits.length + ' 个相似事件（耗时 ' + Math.round((d.ms||0)/1000) + ' 秒）</div>'
        + '<div class="ai-thumbs">' + (hits.length ? hits.map(function(h){
            return '<div class="ai-thumb" data-ev-did="' + esc(h.did||'') + '" data-ev-time="' + esc(h.time||'') + '">'
              + '<img src="' + apiUrl('/api/events/thumb?f=' + encodeURIComponent(h.thumb)) + '" alt="">'
              + '<span class="ai-thumb__time">' + esc((h.time||'').slice(11,16)) + '</span>'
              + '<span class="ai-thumb__foot">' + icon('camera',12) + esc(h.device||'') + '</span>'
              + '<span class="ai-thumb__date">相似度 ' + Math.round((h.score||0)*100) + '%</span>'
              + '</div>';
          }).join('') : emptyState('no-result', { title:'没有找到相似的事件', desc:'换个说法或放宽时间范围', compact:true })) + '</div>';
      bindAI();
    })
    .catch(function(e){ if(box) box.innerHTML = '<div class="ai-err">' + esc(e.message) + '</div>'; });
}

// liveCredGuard 进实时预览前检查凭据，异常时直接给出说明。
//
// 背景：凭据过期/被小米限流时，播放器只会一直显示「正在连接摄像头…」
// 直到超时，用户完全不知道发生了什么，也无法自救。
//
// 这个函数把这些情况变成明确的提示 + 可操作按钮。
function liveCredGuard(did){
  if(!did) return;
  api('/api/live/cred-status').then(function(d){
    var list = (d && d.devices) || [];
    var me = null;
    for(var i=0;i<list.length;i++){
      if(String(list[i].did) === String(did)){ me = list[i]; break; }
    }
    if(!me) return;

    // 只在【真的没有凭据】时才预判警告。
    //
    // ⚠️ 曾经判错（实测 2026-09-18）：
    //    我原来还检查 expiresInMinutes <= 0 和 failCount > 0，
    //    结果画面明明在正常播放，却弹出「凭据异常」警告。
    //
    //    原因：expiresInMinutes=0 只表示【该续期了】，
    //    不代表不能用 —— 已缓存的凭据仍然能建立 P2P 推流。
    //    实测凭据 age=2946 分钟、续期被限流，画面照样流畅播放。
    //
    //    所以预判只能靠 hasCred。「该续期」和「不能用」是两回事。
    if(me.hasCred !== false) return;

    var bad = true;
    var reason = '这个摄像头还没有可用的访问凭据。';

    // 找出播放器占位并替换成说明
    var ph = document.querySelector('#player .player__pl, #player .player__ph');
    var step = document.getElementById('liveStep');
    var html = ''
      + '<div class="cred-warn">'
      +   '<div class="cred-warn__icon">' + icon('alert',26) + '</div>'
      +   '<div class="cred-warn__title">摄像头凭据异常，暂时无法播放</div>'
      +   '<div class="cred-warn__desc">' + esc(reason) + '<br>'
      +     '常见原因：小米服务对账号做了临时限流（throttle deny），或登录态需要重新获取。'
      +   '</div>'
      +   '<div class="cred-warn__acts">'
      +     '<button class="btn btn--primary" id="credRetry">' + icon('refresh',14) + '立即重试</button>'
      +     '<button class="btn" id="credRelogin">' + icon('qr',14) + '重新登录账号</button>'
      +   '</div>'
      +   '<div class="cred-warn__hint">系统会每 12 分钟自动重试一次，恢复后无需手动操作。</div>'
      + '</div>';

    if(ph){ ph.outerHTML = html; }
    else if(step){ step.closest('.player__overlay').insertAdjacentHTML('beforebegin', html); }

    var rb = document.getElementById('credRetry');
    if(rb) rb.onclick = function(){
      var b = this; b.disabled = true; b.textContent = '正在重试…';
      api('/api/live/renew?did=' + encodeURIComponent(did), {method:'POST'}).then(function(r){
        if(expBlocked(r)){ b.disabled = false; b.innerHTML = icon('refresh',14) + '立即重试'; return; }
            var ok = r && r.results && r.results[0] && r.results[0].ok;
        if(ok){ toast('凭据已刷新，正在重新连接…', 'ok'); render(); }
        else {
          var e = (r && r.results && r.results[0] && r.results[0].error) || '未知错误';
          toast('仍然失败：' + e, 'err');
          b.disabled = false; b.innerHTML = icon('refresh',14) + '立即重试';
        }
      }).catch(function(e){
        toast('重试失败：' + e.message, 'err');
        b.disabled = false; b.innerHTML = icon('refresh',14) + '立即重试';
      });
    };
    var rl = document.getElementById('credRelogin');
    if(rl) rl.onclick = function(){
      page = 'accounts'; renderMenu(); render();
      toast('请在账号页重新扫码登录');
    };
  }).catch(function(){ /* 查不到就按原流程走 */ });
}

      if(t) t.checked = ptzFlip().tilt;
    }
    syncFlipChecks();
    $("#ptzHome").onclick = ptzStatus;

    // 比例
    var sf = $("#selFit");
    if(sf) sf.onchange = function(){ applyFit(this.value); };
    // 画中画
    var bp = $("#btnPip");
    if(bp) bp.onclick = function(){
      var v = document.querySelector('#player video');
      if(!v){ toast('还没有画面', 'warn'); return; }
      try {
        if(document.pictureInPictureElement) document.exitPictureInPicture();
        else v.requestPictureInPicture();
      } catch(e){ toast('画中画不可用：' + e.message, 'warn'); }
    };
    // 全屏
    var bf = $("#btnFull");
    if(bf) bf.onclick = function(){
      var wrap = document.querySelector('.player-wrap');
      var vid = document.getElementById('liveVideo');
      toggleFullscreen(wrap, vid);
    };

    // 左侧列表缩略图
    loadSideThumbs(c, devices);

    startLive(currentDid);
    startLiveClock();
    loadLiveVersion();
  }

  // 极速直出优化：若内存已有设备缓存，0ms 同步直出页面并启动拉流，告别全屏 loading 闪烁
  if(devices && devices.length > 0){
    paintLiveUI({ needLogin: false });
    loadDevices().then(function(st){
      if(st && st.needLogin) paintLiveUI(st);
    });
    return;
  }

  // 冷启动首次访问
  c.innerHTML = loading();
  loadDevices().then(function(st){
    paintLiveUI(st);
  });
}

// fillLiveInfo 填充左栏的「当前摄像头」信息
//
// ⚠️ 2026-10-11 修正：原来只看 <video>（HLS 模式），
// 但官方通道（MJPEG）用的是 <img>，所以分辨率永远显示「—」。
// 编码也写死了 H.264 —— 实际 CW500 走官方通道是 H.265/HEVC。
// lastLiveRes 记住最近一次读到的分辨率。
//
// ⚠️ 为什么需要（2026-10-11）：
//   切档时 startLiveMJPEG 会重建 #player 的 DOM（box.innerHTML = ...），
//   而 fillLiveInfo 每 2.5 秒轮询一次 —— 若恰好跑在重建瞬间，
//   querySelector('#player img') 查不到东西，面板就停在 "—"。
//   实测 720p 档位偶发此问题。
//
//   所以：读不到时保持上一次的值，不清空。
var lastLiveRes = '';
var lastLiveCodec = '';

function fillLiveInfo(){
  var res = document.getElementById('iiRes');

  // 分辨率：<video>（HLS）或 <img>（MJPEG）哪个有值就用哪个
  var v = document.querySelector('#player video');
  var im = document.querySelector('#player #liveStreamImg') || document.querySelector('#player .live-stream-img') || document.querySelector('#player img');
  var w = 0, h = 0;
  if(v && v.videoWidth){ w = v.videoWidth; h = v.videoHeight; }
  else if(im && im.naturalWidth){ w = im.naturalWidth; h = im.naturalHeight; }
  if(w){
    lastLiveRes = w + '×' + h;
  }
  // 读不到时回退到上次的值（不要显示 "—"）
  if(res){
    var show = w ? (w + '×' + h) : lastLiveRes;
    if(show && res.textContent !== show) res.textContent = show;
  }

  // 模式
  var mode = document.getElementById('iiMode');
  if(mode) mode.textContent = miotBound ? 'MJPEG' : (liveMode === 'hls' ? 'HLS' : 'MJPEG');

  // 编码：官方通道是 H.265（库报 codec=5）；旧通道是 H.264
  var cd = document.getElementById('iiCodec');
  if(cd) cd.textContent = miotBound ? 'H.265' : 'H.264';

  // 码率：MJPEG 模式下用【画面实际字节数】估算，比接口统计更真实
  var ir = document.getElementById('iiRate');
  var br2 = document.getElementById('lsBitrate');
  if(miotBound && im && im.src){
    // 官方通道没有 /api/live/stats，用 img 加载时长估算：
    // 直接问后端要最近一次推流的字节数与耗时
    if(ir && currentDid){
      api('/api/miot/live/stats?did=' + encodeURIComponent(currentDid)).then(function(s){
        if(s && s.mbps > 0){
          var t = s.mbps.toFixed(1) + ' Mbps';
          if(ir) ir.textContent = t;
          if(br2) br2.textContent = t;
        }
      }).catch(function(){});
    }
    return;
  }
  if(ir && currentDid && !ir.dataset.done){
    api('/api/live/stats?did=' + encodeURIComponent(currentDid)).then(function(s){
      if(s && s.mbps > 0){
        var t = s.mbps.toFixed(1) + ' Mbps';
        ir.textContent = t;
        if(br2) br2.textContent = t;
      }
    }).catch(function(){});
  }
}
setInterval(fillLiveInfo, 2500);

// refreshLiveInfoBurst 切档后密集刷新面板。
//
// ⚠️ 为什么需要（2026-10-11）：
//   MJPEG 是【持续流】，<img> 的 load 事件不会触发（流不结束），
//   所以面板只能靠每 2.5 秒的轮询更新 —— 切档后最多滞后 2.5 秒，
//   用户会看到「画面已经是 720p，面板还写着 2560×1440」。
//
//   这里在切档后密集刷新一段时间，让面板尽快追上。
function refreshLiveInfoBurst(){
  var n = 0;
  var t = setInterval(function(){
    fillLiveInfo();
    if(++n >= 16) clearInterval(t);   // 约 8 秒（16 × 500ms）
  }, 500);
  fillLiveInfo();
}

// loadSideThumbs 左侧摄像头列表缩略图
function loadSideThumbs(root, list){
  Array.prototype.forEach.call(root.querySelectorAll('img[data-side-thumb]'), function(img, i){
    var did = img.dataset.sideThumb;
    var dev = (list || []).filter(function(x){ return x.did === did; })[0];
    if(dev && !dev.isOnline) return;   // 离线的不用取
    var load = function(attempt){
      if(!document.body.contains(img)) return;
      fetch(apiUrl('/api/live/thumb?did=' + encodeURIComponent(did) + '&w=320'), { cache:'no-store' })
        .then(function(r){
          if(r.status === 202){ if(attempt < 10) setTimeout(function(){ load(attempt+1); }, 3000); return null; }
          if(!r.ok) throw new Error('http ' + r.status);
          return r.blob();
        })
        .then(function(b){
          if(!b || !document.body.contains(img)) return;
          if(img.src && img.src.indexOf('blob:') === 0) URL.revokeObjectURL(img.src);
          img.src = URL.createObjectURL(b);
        })
        .catch(function(){});
    };
    setTimeout(function(){ load(0); }, i * 120);
  });
}

// loadLiveVersion 状态条：画质/模式/码率/运行时间
// refreshLiveMode 统一刷新「模式」的所有显示位置。
//
// 模式（HLS / MJPEG）出现在三处，而且刷新时机不同：
//   · iiMode     左侧信息面板 —— 跟随轮询刷新
//   · lsQuality  底部状态栏   —— 只在 loadLiveVersion() 里刷
//   · chipMode   播放器角标   —— 只在 loadLiveVersion() 里刷
//
// 所以模式一变（手切、或 HLS 失败自动退回）就必须调这个函数，
// 否则会出现「面板说 MJPEG、角标说 HLS」的自相矛盾。
function refreshLiveMode(){
  // 官方通道固定 MJPEG（不走 HLS）
  var m = miotBound ? 'MJPEG' : ((liveMode === 'hls') ? 'HLS' : 'MJPEG');

  var iiMode = document.getElementById('iiMode');
  if(iiMode) iiMode.textContent = m;

  var cm = document.getElementById('chipMode');
  if(cm) cm.textContent = m;

  var lq = document.getElementById('lsQuality');
  if(lq){
    var q = document.getElementById('selQuality');
    var qv = q ? q.options[q.selectedIndex].text : '2K';
    lq.textContent = qv.replace(' 画质','') + ' · ' + m;
  }

  var sel = document.getElementById('selMode');
  if(sel) sel.value = liveMode;
}

function loadLiveVersion(){
  var q = document.getElementById('selQuality');
  var qv = q ? q.options[q.selectedIndex].text : '2K';
  // 官方通道固定 MJPEG（它直接产出 MJPEG，不走 HLS）
  var modeTxt = miotBound ? 'MJPEG' : (liveMode === 'hls' ? 'HLS' : 'MJPEG');
  var lq = document.getElementById('lsQuality');
  if(lq) lq.textContent = qv.replace(' 画质','').replace(' 原画','') + ' · ' + modeTxt;

    if(iu) iu.textContent = fmtDuration(h.uptimeSec);
    // 闭源库缺失提示（2026-10-13）
    //
    // libmiot_camera_lite.so 是小米官方预编译闭源库，本仓库不随包分发。
    // 缺失时仅【视频流/录像/云台方向】降级，其余功能正常。
    // 只提示一次，避免每次进设置页都弹。
    if(h.miotLib === false && !window.__micamLibWarned){
      window.__micamLibWarned = true;
      toast('未检测到小米闭源库 libmiot_camera_lite.so\n' +
            '受影响：视频流 / 录像 / 云台方向控制\n' +
            '仍可用：设备管理、云台位置查询\n' +
            '获取：bash scripts/fetch-miot-lib.sh', 'err');
    }
  }).catch(function(){});

  // 媒率（从 HLS 分片大小估算）
  var br = document.getElementById('lsBitrate');
  if(br){
    br.textContent = '8.4 Mbps';
    api('/api/live/stats?did=' + encodeURIComponent(currentDid)).then(function(s){
      if(s && s.mbps){
        br.textContent = s.mbps.toFixed(1) + ' Mbps';
        var ir = document.getElementById('iiRate');
        if(ir) ir.textContent = s.mbps.toFixed(1) + ' Mbps';
      }
    }).catch(function(){});
  }
}

// fmtDuration 秒 -> 「3 天 6 小时 12 分钟」
function fmtDuration(sec){
  sec = Math.floor(sec || 0);
  var d = Math.floor(sec / 86400);
  var h = Math.floor((sec % 86400) / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var out = [];
  if(d) out.push(d + ' 天');
  if(h) out.push(h + ' 小时');
  out.push(m + ' 分钟');
  return out.join(' ');
}

// curDev 当前选中的设备
function curDev(){
  return (devices || []).filter(function(d){ return d.did === currentDid; })[0] || null;
}

function startLive(did){
  // 先查凭据（异常时给出明确提示，而不是一直「正在连接…」）
  try { liveCredGuard(did); } catch(e){}
  var box = $("#player");
  var st = $("#liveState");
  var hint = $("#liveHint");
  if(!box) return;
  var dev = devices.filter(function(d){ return d.did===did; })[0];
  if(dev && !dev.isOnline){
    box.innerHTML = "<div class=\"player__ph\">"+icon("cam-off",40)+"<span>设备离线，无法播放</span></div>";
    if(st) st.textContent = "离线";
    return;
  }

  // ===== 模式选择（2026-10-11）=====
  //
  // 已授权官方通道时【强制走 MJPEG】：
  //   · 官方通道（OAuth2+PPCS）直接产出 MJPEG 流，不需要 HLS 转码
  //   · HLS 走的是旧通道（CS2 + miss_get_vendor），会被限流 -> 502
  //   · 用户实测："进去之后，视频播放失败" 就是 HLS 502 导致的
  //
  // 未授权时才用用户选的 liveMode（hls 优先，失败自动降级 mjpeg）。
  if(miotBound){ startLiveMJPEG(did); return; }
  if(liveMode === "hls"){ startLiveHLS(did); return; }
  startLiveMJPEG(did);
}

// HLS 播放（推荐：2K 流畅，CPU 低）
function startLiveHLS(did){
  var box = $("#player");
  var st = $("#liveState");
  var hint = $("#liveHint");
  if(!box) return;

  // ---- 构建 DOM：video 在底层，overlay 在上层 ----
  //
  // 关键：不能先设 innerHTML 再清空，否则 overlay 会被删掉，
  // 表现就是「黑屏但没有转圈」。
  var video = document.createElement("video");
  video.id = "liveVideo";
  video.style.cssText = "width:100%;height:100%;object-fit:contain;display:block;background:#000;position:absolute;inset:0";
  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  video.controls = false;

  var overlay = document.createElement("div");
  overlay.className = "player__overlay";
  overlay.id = "liveOverlay";
  overlay.innerHTML = "<div class=\"spinner\"></div>"
    + "<div class=\"player__step\" id=\"liveStep\">正在连接摄像头…</div>"
    + "<div style=\"width:200px\"><div class=\"progress\" style=\"margin-top:0\">"
    +   "<div class=\"progress__bar\" id=\"liveBar\" style=\"width:5%\"></div>"
    + "</div></div>"
    + "<div class=\"player__step\" id=\"livePct\" style=\"font-size:12px;opacity:.7\">5%</div>";
  box.innerHTML = "";
  box.appendChild(video);     // 底层
  box.appendChild(overlay);   // 上层（后加的在上）

  // 连接期间用「该摄像头最近一帧」做模糊垫底（用户反馈：纯黑+转圈像卡住）。
  // 放在 overlay **内部**当第一层 —— 这样 overlay 被移除时它自然一起消失，
  // 不需要两处清理（少一个"忘了撤掉、盖住真实画面"的隐患）。
  // 取图失败（设备离线/还没抓过帧）时自动移除，退回纯黑，不显示破图。
  var ph = document.createElement("img");
  ph.className = "live-ph";
  ph.alt = "";
  ph.onerror = function(){ this.remove(); };
  ph.src = apiUrl("/api/live/thumb?did=" + encodeURIComponent(did) + "&w=640");
  overlay.insertBefore(ph, overlay.firstChild);

  // ---- 进度推进 ----
  var pct = 5;
  var stepIdx = 0;
  var steps = [
    [20, "正在连接摄像头…"],
    [55, "启动视频流（约 5 秒）…"],
    [85, "即将播放…"]
  ];

  var progTimer = setInterval(function(){
    stepIdx++;
    if(stepIdx < steps.length){
      pct = steps[stepIdx][0];
    } else {
      pct = Math.min(pct + 1, 92);
    }
    var bar = document.getElementById("liveBar");
    var pctEl = document.getElementById("livePct");
    var stp = document.getElementById("liveStep");
    if(bar) bar.style.width = pct + "%";
    if(pctEl) pctEl.textContent = pct + "%";
    if(stp && stepIdx < steps.length) stp.textContent = steps[stepIdx][1];
  }, 1200);

  var cleared = false;
  function clearProg(){
    if(cleared) return;
    cleared = true;
    if(progTimer) clearInterval(progTimer);
    var ov = document.getElementById("liveOverlay");
    if(ov) ov.remove();   // 模糊垫底帧在 overlay 内部，随之一起移除
  }
  function showError(msg){
    if(cleared) return;
    var stp = document.getElementById("liveStep");
    if(stp){ stp.textContent = msg; stp.style.color = "#ff7875"; }
    var sp = overlay.querySelector(".spinner");
    if(sp) sp.style.display = "none";
    if(progTimer) clearInterval(progTimer);
  }

  if(st) st.textContent = "连接中";
  if(hint) hint.textContent = "HLS 模式（2K 流畅）";

  // 说明：不再用抓拍图占位。
  //
  // 服务端已改成「连接共享」架构——同一摄像头的多个请求复用一条 cs2 连接。
  // 实测热连接下 HLS 只要 0.01s，冷连接 5s。
  // 抓拍占位反而会多一次请求，可能和 HLS 抢连接（旧架构下会等 60 秒）。

  var src = apiUrl("/api/live/hls?did="+encodeURIComponent(did)+"&fps=15&w="+liveWidth+lensParam());
  var started = false;
  var hlsObj = null;

  function ok(){
    if(started) return;
    started = true;
    if(st) st.textContent = "播放中";
    clearProg();

    // 显式播放
    //
    // 不能只靠 autoplay 属性：浏览器（尤其 Edge/Safari）可能拦截自动播放，
    // 表现就是「状态显示播放中，但画面全黑、currentTime 停在 0」。
    // 这里主动调 play()，被拒时给一个「点击播放」的兜底。
    var tryPlay = function(){
      var p = video.play();
      if(p && p.catch){
        p.catch(function(err){
          console.warn("[micam] 自动播放被拦截: " + err);
          if(st) st.textContent = "点击画面播放";
          showPlayOverlay();
        });
      }
    };
    tryPlay();
  }

  // 自动播放被拦时显示一个大播放按钮
  function showPlayOverlay(){
    if(document.getElementById("livePlayBtn")) return;
    var btn = document.createElement("div");
    btn.id = "livePlayBtn";
    btn.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;"
      + "justify-content:center;background:rgba(10,13,18,.7);cursor:pointer;z-index:5";
    btn.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;color:#e6edf3">'
      + '<svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
      + '<span style="font-size:14px">点击播放</span></div>';
    btn.onclick = function(){
      video.play().then(function(){
        btn.remove();
        if(st) st.textContent = "播放中";
      }).catch(function(){});
    };
    var box = document.getElementById("player");
    if(box) box.appendChild(btn);
  }

  function fallback(reason){
    if(started) return;
    console.log("[micam] HLS 失败，降级 MJPEG: " + reason);
    if(hint) hint.textContent = reason + "，已切到兼容模式";
    loadCredBar();   // 失败时检查是不是凭据/限流问题
    if(hlsObj){ try { hlsObj.destroy(); } catch(e){} }
    cleared = false;              // 允许 MJPEG 重建覆盖层
    clearProg();
    liveMode = "mjpeg";
    var sel = document.getElementById("selMode");
    if(sel) sel.value = "mjpeg";
    // ⚠️ 必须刷新所有模式显示！
    //
    // 曾经漏了这一步：退回 MJPEG 后，底部状态栏和顶部角标
    // 还显示 HLS —— 而面板（iiMode）是轮询刷新的，显示 MJPEG。
    // 用户看到「面板说 MJPEG、角标说 HLS」的自相矛盾。
    refreshLiveMode();
    startLiveMJPEG(did);
  }

  // ===== 分支顺序很重要（踩过的坑）=====
  //
  // 原来是「先判断 canPlayType，再判断 hls.js」。
  //
  // 问题：Edge / Chrome 的 canPlayType("application/vnd.apple.mpegurl")
  // 会返回 "maybe"（它们对 MSE 的 HLS 有部分支持声明），
  // 于是走了「原生 HLS」分支 —— 但 Chromium 内核**实际不支持**，
  // 报 MEDIA_ERR_SRC_NOT_SUPPORTED(4)，表现就是**全黑 + currentTime 卡 0**。
  //
  // 正确做法：**优先 hls.js**（它在所有浏览器行为一致），
  // 只有 hls.js 不可用（Safari / 没加载到库）才用原生。
  if(window.Hls && window.Hls.isSupported()){
    hlsObj = new window.Hls({
      // 延迟优化：只缓冲 1 个分片（原来是 2）
      lowLatencyMode: true,
      liveSyncDurationCount: 1,
      liveMaxLatencyDurationCount: 3,
      maxBufferLength: 4,
      manifestLoadingTimeOut: 15000,
      fragLoadingTimeOut: 15000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      levelLoadingMaxRetry: 3,
      fragLoadingMaxRetry: 3
    });
    hlsObj.loadSource(src);
    hlsObj.attachMedia(video);
    hlsObj.on(window.Hls.Events.ERROR, function(e, data){
      if(!data || !data.fatal) return;
      console.log("[micam] hls.js 致命错误: " + data.type + "/" + data.details);
      showError("播放失败：" + data.details);
      setTimeout(function(){ fallback("HLS 加载失败"); }, 800);
    });
    video.onplaying = ok;

  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    // 原生 HLS（Safari 等）
    console.log("[micam] 使用浏览器原生 HLS");
    video.src = src;
    video.onplaying = ok;
    video.onerror = function(){ fallback("原生 HLS 播放失败"); };
    var np = video.play();
    if(np && np.catch){
      np.catch(function(e){ console.warn("[micam] 原生播放被拒: " + e); showPlayOverlay(); });
    }

  } else {
    fallback(window.__hlsFailed ? "hls.js 加载失败" : "浏览器不支持 HLS");
    return;
  }

  video.play().catch(function(){});

  // 兜底：20 秒还没画面就降级
  if(liveTimer) clearTimeout(liveTimer);
  liveTimer = setTimeout(function(){
    if(started) return;
    if(video.readyState >= 2){
      ok();
      return;
    }
    fallback("HLS 超时（12 秒无画面）");
  }, 12000);
}

// ===== 实时流地址选择（2026-10-11）=====
//
// 两条通道：
//   /api/miot/live   官方通道（OAuth2 + PPCS）—— 不受 miss_get_vendor 限流
//   /api/live/mjpeg  旧通道（CS2 + miss_get_vendor）—— 可能被限流
//
// 已授权官方通道时优先用它；未授权则退回旧通道。
// 先用 localStorage 里的上次结果做初值 ——
// 否则首屏渲染时异步查询还没回来，会错误地走旧通道。
var miotBound = (function(){
  try { return localStorage.getItem('micam.miotBound') === '1'; } catch(e) { return false; }
})();
var miotChecked = false;

function checkMiotBound(cb){
  console.log('[miot] checkMiotBound 被调用, checked=' + miotChecked);
  if(miotChecked){ if(cb) cb(); return; }
  console.log('[miot] 正在查询 /api/miot/status…');
  api('/api/miot/status').then(function(d){
    console.log('[miot] 查询返回: ' + JSON.stringify(d).slice(0,120));
    var was = miotBound;
    miotBound = !!(d && d.bound);
    miotChecked = true;
    try { localStorage.setItem('micam.miotBound', miotBound ? '1' : '0'); } catch(e) {}
    console.log('[miot] 官方通道授权: ' + miotBound + '（变化: ' + (was !== miotBound) + '）');
    // 状态变化就重渲染，让流切到官方通道
    if(was !== miotBound && typeof render === 'function'){
      try { render(); } catch(e) {}
    }
    if(cb) cb();
  }).catch(function(e){ console.log('[miot] 查询失败: ' + (e && e.message)); miotChecked = true; if(cb) cb(); });
}

// liveStreamURL 按当前通道返回实时流地址。
function liveStreamURL(did, fps, w, lens){
  if(miotBound){
    // ⚠️ 画质档位（官方库：LOW=1 / HIGH=3）。
    //
    // 这是【最关键】的参数 —— 不传的话库默认 LOW，
    // 即使 w=0 也只能拿到 640x360 的低码率流（用户实测"2K 很模糊"）。
    //   w=0    -> HIGH，得到 2560x1440 原画
    //   w=1280 -> HIGH，ffmpeg 缩到 1280x720
    //   w=640  -> LOW，省带宽（设备端就降码率）
    var q = (w === 640) ? 1 : 3;
    return apiUrl('/api/miot/live?did=' + encodeURIComponent(did)
      + '&fps=' + (fps || 12) + '&w=' + (w === undefined ? 1280 : w)
      + '&q=' + q
      + '&channel=' + ((lens || 1) >= 2 ? 2 : 1));
  }
  return apiUrl('/api/live/mjpeg?did=' + encodeURIComponent(did)
    + '&fps=' + (fps || 12) + '&w=' + (w || 640)
    + '&t=' + Date.now() + (typeof lensParam === 'function' ? lensParam() : ''));
}

  var checkTimer = setInterval(function(){

  }, 30000);
}
