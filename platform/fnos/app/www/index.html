  font-size: var(--text-base); color: var(--text-muted);
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
}

/* 离线卡片的删除按钮 */
.cam-card__del { color: var(--text-muted); }
.cam-card__del:hover { color: var(--danger); background: var(--surface-2); }
.cam-card__foot .icon-btn { flex: 0 0 auto; }


/* ==========================================================================
   EVENTS — 事件中心（对齐效果图）
   ========================================================================== */

.list-head__stat {
  font-size: var(--text-base); color: var(--text-muted);
  padding-top: 10px; white-space: nowrap;
}
.list-head__stat b { color: var(--text); font-size: var(--text-lg); font-weight: var(--weight-semibold); }

/* 筛选行 */
.ev-filters {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-4); flex-wrap: wrap;
}
.ev-sel { width: auto; min-width: 130px; }
.ev-search { width: 260px; }
@media (max-width: 800px) { .ev-search { width: 100%; } }

/* 按天分组 */
.ev-group { margin-bottom: var(--space-6); }
.ev-group__head {
  display: flex; align-items: baseline; gap: var(--space-3);
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border-subtle);
}
.ev-group__label { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.ev-group__n { font-size: var(--text-base); color: var(--text-muted); }

.ev-group__items { display: flex; flex-direction: column; gap: var(--space-3); }

/* 事件卡片 */
.ev-card {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.ev-card:hover { border-color: var(--border-strong); background: var(--surface-2); }

.ev-card__thumb {
  position: relative; flex: 0 0 152px;
  width: 152px; aspect-ratio: 16/9;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12;
}
.ev-card__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ev-card__ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.ev-card__dur {
  position: absolute; right: 6px; bottom: 6px;
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff;
  font-size: var(--text-xs); font-variant-numeric: tabular-nums;
}
@media (max-width: 700px) { .ev-card__thumb { flex-basis: 110px; width: 110px; } }

.ev-card__body { flex: 1; min-width: 0; }
.ev-card__row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.ev-card__time {
  font-size: var(--text-lg); font-weight: var(--weight-medium);
  font-variant-numeric: tabular-nums;
}
.ev-card__conf { font-size: var(--text-sm); color: var(--text-muted); }
.ev-card__dev {
  font-size: var(--text-base); color: var(--text-secondary); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-card__desc {
  font-size: var(--text-sm); color: var(--text-muted); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ev-card__acts { display: flex; align-items: center; gap: var(--space-2); flex: 0 0 auto; }
@media (max-width: 700px) { .ev-card__acts { display: none; } }

/* 类型徽章 */
.ev-badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 10px;
  border-radius: 999px;
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  white-space: nowrap;
}
.ev-badge .icon { flex: 0 0 auto; }
.ev-badge.is-person  { background: rgba(59,130,246,.16);  color: #60a5fa; }
.ev-badge.is-vehicle { background: rgba(245,158,11,.16);  color: #fbbf24; }
.ev-badge.is-package { background: rgba(168,85,247,.16);  color: #c084fc; }
.ev-badge.is-motion  { background: rgba(148,163,184,.16); color: #94a3b8; }
.ev-badge.is-online  { background: rgba(34,197,94,.16);   color: #4ade80; }
.ev-badge.is-offline { background: rgba(239,68,68,.16);   color: #f87171; }

/* 更多菜单 */
.ev-menu { display: flex; flex-direction: column; gap: 2px; }
.ev-menu__item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: var(--text-base);
  text-align: left;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ev-menu__item:hover { background: var(--surface-2); color: var(--text); }
.ev-menu__item.is-danger { color: var(--danger); }
.ev-menu__item.is-danger:hover { background: rgba(239,68,68,.12); }


/* 摄像头列表页头右侧（按钮 + 日期） */
.list-head__acts {
  display: flex; align-items: center; gap: var(--space-4);
  flex: 0 0 auto;
}
@media (max-width: 700px) { .list-head__acts .list-head__date { display: none; } }


/* ==========================================================================
   GRID — 多路预览（对齐效果图）
   ========================================================================== */

/* 布局：左宫格 + 右设备面板 */
.grid-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1100px) { .grid-wrap { grid-template-columns: 1fr; } }

.ggrid {
  display: grid; gap: var(--space-3);
  grid-auto-rows: 1fr;
  min-height: calc(100vh - 372px);
}
.ggrid--1 { grid-template-columns: 1fr; }
.ggrid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ggrid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ggrid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1400px) { .ggrid--4 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 1000px) { .ggrid--3, .ggrid--4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 700px)  { .ggrid { grid-template-columns: 1fr !important; } }

.gtile {
  position: relative;
  min-height: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: #0a0d12;
  cursor: pointer;
  border: 1px solid var(--border-subtle);
  transition: border-color var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-out);
}
.gtile:hover { border-color: var(--border-strong); }
.gtile.is-focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.gtile.is-dragging { opacity: .45; }
.gtile.is-over { border-color: var(--accent); border-style: dashed; }

.gtile img { width: 100%; height: 100%; object-fit: cover; display: block; }

.gtile__time {
  position: absolute; top: var(--space-3); right: var(--space-3);
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  color: #fff; font-size: var(--text-sm); font-variant-numeric: tabular-nums;
}

.gtile__foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-6) var(--space-4) var(--space-3);
  background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0));
  color: #fff;
}
.gtile__info { flex: 1; min-width: 0; }
.gtile__name {
  font-size: var(--text-base); font-weight: var(--weight-medium);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gtile__name em { font-style: normal; color: rgba(255,255,255,.6); font-size: var(--text-sm); }
.gtile__meta { font-size: var(--text-sm); color: rgba(255,255,255,.65); margin-top: 1px; }

.gtile__acts { display: flex; gap: 4px; flex: 0 0 auto; opacity: 0; transition: opacity var(--duration-fast); }
.gtile:hover .gtile__acts { opacity: 1; }
.gtile__btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.14); color: #fff;
  transition: background var(--duration-fast) var(--ease-out);
}
.gtile__btn:hover { background: rgba(255,255,255,.28); }

.gtile__focusbar {
  position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: var(--accent);
}

/* 工具栏 */
.gbar {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-4);
  padding: var(--space-2) var(--space-3);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  flex-wrap: wrap;
}
.gbar__btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: var(--text-base);
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.gbar__btn:hover { background: var(--surface-2); color: var(--text); }
.gbar__btn.is-active { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--accent); }

.gbar__sel {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  transition: background var(--duration-fast) var(--ease-out);
}
.gbar__sel:hover { background: var(--surface-2); }
.gbar__sel select {
  background: transparent; border: 0; outline: none;
  color: inherit; font-size: var(--text-base); font-family: inherit;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.gbar__sel select option { background: var(--surface-2); color: var(--text); }
.gbar__right { margin-left: auto; font-size: var(--text-base); color: var(--text-muted); }

/* 右侧「可选设备」面板 */
.gd-panel {
  display: flex; flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  max-height: calc(100vh - 300px);
}
@media (max-width: 1100px) { .gd-panel { max-height: none; } }

.gd-panel__head {
  display: flex; align-items: baseline; gap: var(--space-2);
  padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
}
.gd-panel__title { font-size: var(--text-base); font-weight: var(--weight-medium); }
.gd-panel__title em { font-style: normal; color: var(--text-muted); font-weight: var(--weight-normal); }
.gd-panel__count { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); }

.gd-panel__search { margin: var(--space-3) var(--space-3) 0; }

.gd-panel__list { flex: 1; overflow-y: auto; padding: var(--space-2); }

.gd-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2);
  border-radius: var(--radius-md);
  transition: background var(--duration-fast) var(--ease-out);
}
.gd-item:hover { background: var(--surface-2); }
.gd-item.is-added { background: color-mix(in oklab, var(--accent) 8%, transparent); }

.gd-item__thumb {
  flex: 0 0 56px; width: 56px; aspect-ratio: 16/9;
  border-radius: var(--radius-sm); overflow: hidden;
  background: #0a0d12; display: block;
}
.gd-item__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gd-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.gd-item__name {
  font-size: var(--text-base); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gd-item__en { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gd-item__status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--text-muted); }

.gd-item__btn {
  flex: 0 0 auto;
  height: 26px; padding: 0 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  background: var(--accent); color: #fff;
  transition: opacity var(--duration-fast) var(--ease-out);
}
.gd-item__btn:hover { opacity: .88; }
.gd-item__btn.is-del { background: var(--surface-3); color: var(--text-secondary); }
.gd-item__btn.is-del:hover { background: var(--surface-hover); color: var(--text); }

.gd-panel__hint {
  display: flex; align-items: center; gap: 6px;
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--border-subtle);
  font-size: var(--text-xs); color: var(--text-muted);
}

/* 宫格里的离线占位 */
.gtile__off {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-2); color: var(--text-muted);
}

/* 分段按钮里带文字时不换行 */
.segmented__btn { white-space: nowrap; }
.segmented__btn .icon { flex: 0 0 auto; }


/* 只有一台时铺满整块 */
.ggrid--1 { grid-template-columns: 1fr; }


/* ==========================================================================
   AI 设置区（设置页）
   ========================================================================== */

.ai-warn {
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-4);
  background: rgba(245,158,11,.10);
  border: 1px solid rgba(245,158,11,.3);
  border-radius: var(--radius-lg);
  color: var(--warning);
  font-size: var(--text-base);
}
.ai-warn .icon { flex: 0 0 auto; margin-top: 1px; }
.ai-warn__sub { color: var(--text-muted); margin-top: 4px; font-size: var(--text-sm); line-height: 1.6; }

.ai-grid {
  margin-top: var(--space-5);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}

.ai-actions {
  display: flex; align-items: center; gap: var(--space-3);
  margin-top: var(--space-5);

}

  font-size: var(--text-base); color: var(--text-secondary);
  min-width: 0;
}

.ai-models {
  margin-top: var(--space-5);
  padding: var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-lg);
}
.ai-models__title {
  font-size: var(--text-base); color: var(--text-secondary);

}
.ai-model {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) 0;
}
.ai-model + .ai-model { border-top: 1px solid var(--border-subtle); }
.ai-model__name { font-size: var(--text-base); min-width: 90px; }
.ai-model__meta { font-size: var(--text-sm); color: var(--text-muted); flex: 1; }
.ai-models__hint {
  margin-top: var(--space-3); font-size: var(--text-xs); color: var(--text-muted);

}

.ai-foot {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
  font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6;
}
.ai-foot b { color: var(--online); }

/* AI 类名标签（事件卡片） */
.ev-card__ai {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--text-xs); color: var(--text-muted);
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: var(--surface-3);
}


/* ==========================================================================
   PLAYBACK — 回放（左日历 + 右播放器 + 时间轴 + 文件列表）
   ========================================================================== */

.pb-wrap {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: var(--space-5);
  align-items: start;
}
@media (max-width: 1000px) { .pb-wrap { grid-template-columns: 1fr; } }

/* 左侧日历 */
.pb-side {
  display: flex; flex-direction: column; gap: var(--space-2);
  max-height: calc(100vh - 240px); overflow-y: auto;
}
.pb-side__title {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-base); color: var(--text-secondary);
  padding: 0 var(--space-1) var(--space-2);
}

.pb-cal { display: flex; flex-direction: column; gap: var(--space-2); }
.pb-cal__empty {
  padding: var(--space-5); text-align: center;

  border: 1px dashed var(--border); border-radius: var(--radius-lg);
}

.pb-day {
  display: flex; flex-direction: column; gap: 3px;

  background: var(--surface-1);

  border-radius: var(--radius-lg);

  transition: border-color var(--duration-fast) var(--ease-out),

.pb-day:hover { border-color: var(--border-strong); background: var(--surface-2); }

}
.pb-day__date { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text); }
.pb-day__meta { font-size: var(--text-sm); color: var(--text-muted); }

.pb-rec-on, .pb-rec-off {

}
.pb-rec-on  { color: var(--danger); background: rgba(239,68,68,.10); }
.pb-rec-off { color: var(--text-muted); background: var(--surface-2); }

/* 右侧主区 */
.pb-main { min-width: 0; }
.pb-main .player-wrap { max-height: calc(100vh - 380px); }

/* 时间轴 */
.pb-timeline {
  margin-top: var(--space-3);
  min-height: 0;
}
.pb-timeline:empty { display: none; }

/* 文件列表（横向卡片） */
.pb-files {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  margin-top: var(--space-4);
}

.pb-file {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  text-align: left;
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.pb-file:hover { border-color: var(--border-strong); background: var(--surface-2); }
.pb-file.is-active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--surface-1)); }
.pb-file > .icon { color: var(--text-muted); flex: 0 0 auto; }
.pb-file.is-active > .icon { color: var(--accent); }

.pb-file__thumb {
  flex: 0 0 76px; width: 76px; aspect-ratio: 16/9;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12; display: block;
}
.pb-file__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pb-file__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pb-file__name {
  font-size: var(--text-base); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pb-file__meta { font-size: var(--text-sm); color: var(--text-muted); }


/* ==========================================================================
   AI INTELLIGENCE — AI 智能页（4 个 Tab）
   ========================================================================== */

/* 横向 Tab 线 */
.tabs-line {
  display: flex; align-items: center; gap: var(--space-1);
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: var(--space-5);
}
.tabline {
  position: relative;
  padding: 10px var(--space-4);
  color: var(--text-secondary);
  font-size: var(--text-base); font-weight: var(--weight-medium);
  transition: color var(--duration-fast) var(--ease-out);
}
.tabline:hover { color: var(--text); }
.tabline.is-active { color: var(--accent); }
.tabline::after {
  content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: -1px;
  height: 2px; background: transparent; border-radius: 2px;
  transition: background var(--duration-fast) var(--ease-out);
}
.tabline.is-active::after { background: var(--accent); }

/* 概览统计 */
.ai-stats {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(4, 1fr);
}
@media (max-width: 900px) { .ai-stats { grid-template-columns: repeat(2, 1fr); } }

.ai-stat {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.ai-stat__icon {
  width: 38px; height: 38px; flex: 0 0 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-stat__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ai-stat__label { font-size: var(--text-sm); color: var(--text-muted); }
.ai-stat__val { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.1; }

/* 说明块 */
.ai-note { padding: 0 var(--space-5) var(--space-5); }
.ai-note__sub { margin-top: 6px; font-size: var(--text-base); color: var(--text-muted); line-height: 1.7; }
.ai-note b { color: var(--accent); }

/* 搜索框 */
.ai-search-box { display: flex; gap: var(--space-3); padding: 0 var(--space-5); }
.ai-search-box__input { flex: 1; }
@media (max-width: 700px) { .ai-search-box { flex-direction: column; } }

.ai-examples {
  display: flex; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-4) var(--space-5) 0;
}
.ai-examples .chip { cursor: pointer; }

.ai-hint {
  padding: var(--space-4) var(--space-5);
  font-size: var(--text-sm); color: var(--text-muted); line-height: 1.7;
}
.ai-hint b { color: var(--text-secondary); }

/* 回答块 */
.ai-answer {
  margin: var(--space-4) var(--space-5) 0;
  padding: var(--space-4);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface-2));
  border: 1px solid color-mix(in oklab, var(--accent) 24%, transparent);
  border-radius: var(--radius-lg);
}
.ai-answer__head { display: flex; align-items: center; gap: 6px; font-size: var(--text-base); color: var(--text); }
.ai-answer__head b { color: var(--accent); }
.ai-answer__q { margin-top: 6px; font-size: var(--text-sm); color: var(--text-muted); }

.ai-empty {
  padding: var(--space-8) var(--space-5);
  text-align: center; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
}
.ai-empty__sub { font-size: var(--text-sm); }

.ai-err {
  margin: var(--space-4) var(--space-5);
  padding: var(--space-3) var(--space-4);
  background: rgba(239,68,68,.10); border-radius: var(--radius-md);
  color: var(--danger); font-size: var(--text-base);
}

/* 调查页占位 */
.ai-soon {
  padding: var(--space-6) var(--space-5);
  display: flex; flex-direction: column; align-items: center;
  gap: var(--space-3); text-align: center;
  color: var(--text-muted);
}
.ai-soon__title { font-size: var(--text-lg); color: var(--text); }
.ai-soon__desc { font-size: var(--text-base); max-width: 460px; line-height: 1.7; }
.ai-soon__desc b { color: var(--text-secondary); }
.ai-soon__facts { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-2); }
.ai-fact { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-base); }
.ai-fact.is-ok { color: var(--online); }
.ai-fact.is-warn { color: var(--warning); }
.ai-fact.is-bad { color: var(--danger); }
.ai-soon__note { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }
.ai-soon__note b { color: var(--text-secondary); }

/* 能力状态表 */
.ai-rows { padding: 0 var(--space-5) var(--space-4); }
.ai-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-base);
}
.ai-row:last-child { border-bottom: 0; }
.ai-row__label { color: var(--text-muted); }
.ai-row__val {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text-secondary);
}
.ai-row__val.is-ok { color: var(--online); }
.ai-row__val.is-warn { color: var(--warning); }
.ai-row__val.is-bad { color: var(--danger); }


/* ==========================================================================
   AI INTELLIGENCE — AI 智能页（4 Tab，对齐效果图）
   ========================================================================== */

/* ---- 通用：两栏布局 ---- */
.ai-row2 {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  align-items: start;
  margin-top: var(--space-5);
}
@media (max-width: 1100px) { .ai-row2 { grid-template-columns: 1fr; } }

/* ---- 4 张统计卡 ---- */
.ai-stats {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(4, 1fr);
}
@media (max-width: 1000px) { .ai-stats { grid-template-columns: repeat(2, 1fr); } }

.ai-stat {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  text-align: left; width: 100%;
  transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
}
.ai-stat:hover { border-color: var(--border-strong); background: var(--surface-2); }
.ai-stat.is-watch .ai-stat__icon { color: var(--warning); }

.ai-stat__icon {
  width: 42px; height: 42px; flex: 0 0 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-stat__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-stat__label { font-size: var(--text-base); color: var(--text-secondary); }
.ai-stat__val { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.1; }
.ai-stat__chev { color: var(--text-muted); flex: 0 0 auto; }

/* ---- 今日摘要 ---- */
.ai-summary {
  padding: 0 var(--space-5) var(--space-4);
  font-size: var(--text-base); color: var(--text-secondary); line-height: 1.7;
}
.ai-thumbs {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(4, 1fr);
  padding: 0 var(--space-5) var(--space-5);
}
@media (max-width: 900px) { .ai-thumbs { grid-template-columns: repeat(2, 1fr); } }

.ai-thumb {
  position: relative; display: block;
  aspect-ratio: 16/9;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12; cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out);
}
.ai-thumb:hover { transform: translateY(-2px); }
.ai-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-thumb__time {
  position: absolute; top: 6px; right: 6px;
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.66); color: #fff;
  font-size: var(--text-xs); font-variant-numeric: tabular-nums;
}
.ai-thumb__foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 5px;
  padding: var(--space-4) 8px 6px;
  background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
  color: #fff; font-size: var(--text-xs);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ai-thumb__foot em { font-style: normal; color: rgba(255,255,255,.6); }
.ai-thumb__date {
  position: absolute; left: 6px; top: 6px;
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: rgba(59,130,246,.85); color: #fff; font-size: var(--text-xs);
}
.ai-thumbs__empty { grid-column: 1 / -1; padding: var(--space-5); text-align: center; color: var(--text-muted); font-size: var(--text-base); }

/* ---- AI 处理情况 ---- */
.ai-process { display: flex; align-items: center; gap: var(--space-5); padding: 0 var(--space-5) var(--space-4); }
.ai-process__ring { flex: 0 0 128px; }
.ai-ring { width: 128px; height: 128px; }
.ai-ring__val { font-size: 24px; font-weight: var(--weight-semibold); fill: var(--text); }
.ai-ring__label { font-size: 11px; fill: var(--text-muted); }

.ai-process__list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ai-prow { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-base); }
.ai-prow__icon { color: var(--text-muted); flex: 0 0 auto; }
.ai-prow__label { color: var(--text-muted); flex: 1; }
.ai-prow__val { color: var(--text); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }

.ai-delta {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: var(--space-3) var(--space-5) var(--space-4);
  font-size: var(--text-base);
}
.ai-delta.is-down { color: var(--online); }
.ai-delta.is-up { color: var(--warning); }
.ai-delta__sub { flex-basis: 100%; font-size: var(--text-sm); color: var(--text-muted); }

/* ---- 最近 AI 事件 ---- */
.ai-recent {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(4, 1fr);
  padding: 0 var(--space-5) var(--space-5);
}
@media (max-width: 1100px) { .ai-recent { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .ai-recent { grid-template-columns: 1fr; } }

.ai-rcard {
  display: flex; flex-direction: column;
  border-radius: var(--radius-lg); overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out);
}
.ai-rcard:hover { border-color: var(--border-strong); }
.ai-rcard.is-watch { border-color: color-mix(in oklab, var(--warning) 40%, transparent); }

.ai-rcard__img { position: relative; aspect-ratio: 16/9; background: #0a0d12; }
.ai-rcard__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-rcard__dur {
  position: absolute; top: 6px; right: 6px;
  padding: 1px 7px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-xs);
}
.ai-rcard__foot {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-3) 4px;
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-rcard__time { color: var(--text); font-variant-numeric: tabular-nums; }
.ai-rcard__dev { display: inline-flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-rcard__chev { margin-left: auto; flex: 0 0 auto; }
.ai-rcard__tag {
  display: flex; align-items: center; gap: 6px;
  padding: 6px var(--space-3) var(--space-3);
  font-size: var(--text-base); color: var(--text-secondary);
}
.ai-rcard__tag.is-watch { color: var(--warning); }

/* ---- 搜索 ---- */
.ai-searchbox {
  display: flex; gap: var(--space-3);
  padding: var(--space-5) var(--space-5) var(--space-3);
}
.ai-searchbox__field {
  flex: 1; display: flex; align-items: center; gap: var(--space-3);
  height: 52px; padding: 0 var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  color: var(--text-muted);
  transition: border-color var(--duration-fast) var(--ease-out);
}
.ai-searchbox__field:focus-within { border-color: var(--accent); }
.ai-searchbox__input {
  flex: 1; min-width: 0; background: none; border: 0; outline: none;
  color: var(--text); font-size: var(--text-lg); font-family: inherit;
}
.ai-searchbox__clear {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.ai-searchbox__clear:hover { background: var(--surface-3); color: var(--text); }
.ai-searchbox__go { height: 52px; padding: 0 var(--space-6); font-size: var(--text-lg); }
@media (max-width: 700px) { .ai-searchbox { flex-direction: column; } }

.ai-examples {
  display: flex; align-items: center; gap: var(--space-2);
  flex-wrap: wrap; padding: 0 var(--space-5) var(--space-5);
  font-size: var(--text-base); color: var(--text-muted);
}
.ai-example {
  padding: 6px var(--space-4);
  border: 1px solid var(--border); border-radius: 999px;
  color: var(--text-secondary); font-size: var(--text-base);
  transition: border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ai-example:hover { border-color: var(--accent); color: var(--accent); }

/* AI 回答 */
.ai-answer { margin: 0 var(--space-5) var(--space-5); }
.ai-answer__head {
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-lg); font-weight: var(--weight-medium);
  margin-bottom: var(--space-3);
}
.ai-answer__head .icon { color: var(--accent); }
.ai-answer__meta { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); font-weight: var(--weight-normal); }
.ai-answer__retry { margin-left: var(--space-3); }

.ai-answer__conclusion {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-lg);
  font-size: var(--text-lg);
}
.ai-answer__conclusion.is-ok { background: rgba(34,197,94,.12); color: #4ade80; }
.ai-answer__conclusion.is-none { background: rgba(245,158,11,.12); color: var(--warning); }
.ai-answer__sub { margin-top: var(--space-2); font-size: var(--text-base); color: var(--text-muted); }

.ai-evidence {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  margin-top: var(--space-5);
}
@media (max-width: 1000px) { .ai-evidence { grid-template-columns: 1fr; } }
.ai-evidence__label { font-size: var(--text-base); color: var(--text-secondary); margin-bottom: var(--space-3); }

.ai-evidence__box {
  display: grid; gap: var(--space-4);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
@media (max-width: 700px) { .ai-evidence__box { grid-template-columns: 1fr; } }

.ai-evidence__img { position: relative; aspect-ratio: 16/9; border-radius: var(--radius-md); overflow: hidden; background: #0a0d12; }
.ai-evidence__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-evidence__ts {
  position: absolute; top: 8px; right: 8px; padding: 2px 8px;
  border-radius: var(--radius-sm); background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-sm);
}
.ai-evidence__play {
  position: absolute; left: 8px; bottom: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-sm);
}
.ai-evidence__info { display: flex; flex-direction: column; gap: 6px; }
.ai-evidence__dev { display: flex; align-items: center; gap: 5px; font-size: var(--text-sm); color: var(--text-muted); }
.ai-evidence__title { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.2; }
.ai-evidence__meta { display: flex; align-items: center; gap: 5px; font-size: var(--text-base); color: var(--text-secondary); }
.ai-evidence__desc { font-size: var(--text-base); color: var(--text-muted); line-height: 1.6; margin-top: 4px; }
.ai-evidence__play-btn { margin-top: auto; width: 100%; }

/* 关键时刻 */
.ai-moments { display: flex; flex-direction: column; gap: var(--space-4); padding-left: 6px; }
.ai-moment { position: relative; padding-left: var(--space-5); }
.ai-moment::before {
  content: ""; position: absolute; left: 3px; top: 14px; bottom: -14px;
  width: 2px; background: var(--border);
}
.ai-moment:last-child::before { display: none; }
.ai-moment__dot {
  position: absolute; left: 0; top: 5px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
}
.ai-moment__body { font-size: var(--text-base); color: var(--text-secondary); line-height: 1.6; }
.ai-moment__body b { color: var(--text); }
.ai-moment__sub { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
.ai-moments__hint { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }

.ai-related { margin-top: var(--space-5); }
.ai-related__grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(4, 1fr); }

.ai-inv-wrap {
  display: grid; gap: var(--space-5);
  grid-template-columns: 300px minmax(0, 1fr);
  align-items: start;
}
@media (max-width: 1000px) { .ai-inv-wrap { grid-template-columns: 1fr; } }

.ai-inv-list {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.ai-inv-list__head {
  display: flex; align-items: center; gap: var(--space-2);

}
.ai-inv-list__head .btn { margin-left: auto; }
.ai-inv-empty { padding: var(--space-6); text-align: center; color: var(--text-muted); font-size: var(--text-base); line-height: 1.8; }
.ai-inv-empty span { font-size: var(--text-sm); }

.ai-inv-item {
  display: flex; align-items: center; gap: var(--space-3);

}

.ai-inv-item__icon {

}

.ai-inv-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-inv-item__name { font-size: var(--text-base); color: var(--text); }
.ai-inv-item__meta { font-size: var(--text-sm); color: var(--text-muted); }
.ai-inv-item > .icon { color: var(--text-muted); flex: 0 0 auto; }

.ai-inv-detail { min-width: 0; }
.ai-inv-detail .card { padding-bottom: var(--space-5); }

.ai-inv-detail__head {
  display: flex; align-items: flex-start; gap: var(--space-4);
  padding: var(--space-5);
}
.ai-inv-detail__icon {
  width: 44px; height: 44px; flex: 0 0 44px;
  border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-inv-detail__title { flex: 1; min-width: 0; }
.ai-inv-detail__title h3 { font-size: var(--text-xl, 20px); font-weight: var(--weight-semibold); }
.ai-inv-detail__title p { font-size: var(--text-base); color: var(--text-muted); margin-top: 4px; line-height: 1.6; }

.ai-inv-stats {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(3, 1fr);
  padding: 0 var(--space-5) var(--space-5);
}
.ai-inv-stat {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.ai-inv-stat__icon { color: var(--text-muted); flex: 0 0 auto; }
.ai-inv-stat__body { display: flex; flex-direction: column; gap: 2px; }
.ai-inv-stat__label { font-size: var(--text-sm); color: var(--text-muted); }

}

}

}

/* ==========================================================================

   ========================================================================== */

.dialog--wide { width: min(1280px, 94vw) !important; max-width: none !important; }

.evd { display: flex; flex-direction: column; gap: var(--space-4); }

}

.ai-find__actions {

}

}

/* 结果 */
.ai-find__result { padding: var(--space-4) 0 var(--space-5); }

}

.ai-find__meta {

}

.ai-find__ev-head {

}

@media (max-width: 700px)  { .ai-find__evs { grid-template-columns: 1fr; } }

.ai-find__ev {

}

.ai-find__ev-conf {

}

}

}

/* ---- 车牌展示 ---- */

}

/* ==========================================================================
   STORAGE — 存储监控（对齐效果图）

/* 4 个统计卡 */
.st-stats { display: grid; gap: var(--space-4); grid-template-columns: repeat(4, minmax(0,1fr)); margin-bottom: var(--space-5); }

.st-stat__head .icon { color: var(--text-muted); }
.st-stat__val { font-size: 22px; font-weight: var(--weight-semibold); line-height:1.25; }
.st-hint { font-size: var(--text-sm); color: var(--text-muted); margin-top: 6px; }

/* 进度条 */
.st-bar { height:6px; border-radius:3px; background: var(--surface-3); overflow:hidden; margin-top: var(--space-3); }
.st-bar > span { display:block; height:100%; background: var(--accent); border-radius:3px; }
.st-bar--sm { height:4px; margin-top:3px; }
.st-bar__sub { font-size: var(--text-sm); color: var(--text-muted); margin-top:6px; }

/* 趋势图 */

.st-chart { padding: var(--space-4) var(--space-5) var(--space-5); }
.st-chart__svg { width:100%; height:200px; display:block; }

.st-chart__xlab { font-size:10px; fill: var(--text-muted); }
.st-chart__empty { height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color: var(--text-muted); font-size: var(--text-base); }

/* 按类型统计 */
.st-types { padding: var(--space-3) var(--space-5) var(--space-3); }

.st-type__row > b { font-weight: var(--weight-medium); }

.st-note { display:flex; align-items:center; gap:6px; padding: 0 var(--space-5) var(--space-5); font-size: var(--text-xs); color: var(--text-muted); }

/* 摄像头表格 */
.st-table { padding: 0 var(--space-5) var(--space-4); }
.st-table__head, .st-table__row {
  display:grid; gap: var(--space-3);

  align-items:center; padding: 10px 0; font-size: var(--text-base);
}
.st-table__head { font-size: var(--text-sm); color: var(--text-muted); border-bottom:1px solid var(--border-subtle); }
.st-table__row { border-bottom:1px solid var(--border-subtle); }
.st-table__row:last-child { border-bottom:0; }
.st-cam { display:flex; align-items:center; gap:8px; min-width:0; }

.st-cell { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

/* 存储策略 */
.st-policy { padding: var(--space-3) var(--space-5) var(--space-5); }

.st-field__label { color: var(--text-muted); font-size: var(--text-sm); }

.st-field__unit { color: var(--text-muted); font-size: var(--text-sm); }
.st-field__hint { color: var(--text-muted); font-size: var(--text-xs); }
.st-field__sep { color: var(--text-muted); }
.st-field > .input:not(.st-field__num) { width:100%; }
.st-switchrow { display:grid; grid-template-columns: 84px auto minmax(0,1fr); gap: var(--space-2); align-items:center; padding: 7px 0; }
.st-switchrow__label { color: var(--text-muted); font-size: var(--text-sm); }
.st-switchrow__hint { color: var(--text-muted); font-size: var(--text-xs); }
.st-save { margin-top: var(--space-4); width:100%; justify-content:center; }

/* 缓存 */
.st-cache { padding: var(--space-2) var(--space-5) var(--space-2); }
.st-kv { display:flex; align-items:baseline; gap: var(--space-3); padding: 6px 0; font-size: var(--text-base); border-bottom:1px solid var(--border-subtle); }

.st-kv > span { flex:0 0 84px; color: var(--text-muted); font-size: var(--text-sm); }

.st-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-sm); }
.st-cache__acts { display:flex; gap: var(--space-2); padding: var(--space-3) var(--space-5) var(--space-5); }

/* 迁移 */
.st-migrate { padding: var(--space-2) var(--space-5) var(--space-5); }
.st-migrate .st-field { grid-template-columns: 84px minmax(0,1fr) auto minmax(0,1fr); }
.st-migrate__foot { display:flex; align-items:center; gap: var(--space-4); margin-top: var(--space-4); }

/* 清理预览 */
.st-clean { padding: var(--space-2) var(--space-5) var(--space-2); }
.st-clean__sum { display:flex; align-items:center; gap:8px; padding: var(--space-3) 0; font-size: var(--text-base); color: #4ade80; }
.st-clean__sum b { color:#4ade80; }
.st-clean__acts { padding: var(--space-3) var(--space-5) var(--space-5); display:flex; flex-direction:column; gap: var(--space-2); }
.st-clean__acts .btn { justify-content:center; }
.st-warn { display:flex; align-items:center; gap:5px; font-size: var(--text-xs); color: var(--warning); }

/* 底部状态栏 */
.st-footbar { display:flex; align-items:center; gap: var(--space-5); flex-wrap:wrap; padding: var(--space-3) var(--space-4); background: var(--surface-1); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); font-size: var(--text-sm); color: var(--text-muted); }

.st-health { display:inline-flex; align-items:center; gap:6px; }

/* ==========================================================================

   ========================================================================== */

.set3 { display:grid; gap: var(--space-5); grid-template-columns: 200px minmax(0,1fr); align-items:start; }
@media (max-width:900px){ .set3{ grid-template-columns:1fr;} }

/* 左：竖排 Tab */
.set3__nav { display:flex; flex-direction:column; gap:2px; position:sticky; top:var(--space-4); }
.set3__tab {
  display:flex; align-items:center; gap:var(--space-3);
  padding:10px var(--space-3); border-radius: var(--radius-md);
  color: var(--text-secondary); text-align:left; width:100%;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.set3__tab:hover { background: var(--surface-2); color: var(--text); }

.set3__tab .icon { flex:0 0 auto; }

.set3__sec-head > span { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.set3__sec-head > em { font-style:normal; font-size: var(--text-sm); color: var(--text-muted); }

.set3__row { display:grid; grid-template-columns: minmax(0,1fr) auto; gap: var(--space-4); align-items:center; padding: var(--space-4) var(--space-5); border-bottom:1px solid var(--border-subtle); }
.set3__row:last-child { border-bottom:0; }
.set3__row.is-wide { grid-template-columns: minmax(0,1fr); }

.set3__row-title { font-size: var(--text-base); color: var(--text); }

.set3__radio input:checked ~ span:last-child { color: var(--text); }

/* 控件尺寸 */
.set3__sel { width: 200px; }

/* 右：摘要卡 */
.set3__side { display:flex; flex-direction:column; gap: var(--space-4); }

.set3__kv > span { flex:1; min-width:0; color: var(--text-muted); }
.set3__kv > b { font-weight: var(--weight-normal); color: var(--text-secondary); }

.acct-bar { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-5); }

.acct-cred { padding:var(--space-3) var(--space-5) var(--space-4); }
.acct-cred__item { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:var(--space-3); padding:var(--space-3) 0; border-bottom:1px solid var(--border-subtle); align-items:start; }

.acct-cred__body { display:flex; flex-direction:column; gap:2px; min-width:0; }
.acct-cred__title { font-size:var(--text-base); }
.acct-cred__desc { font-size:var(--text-sm); color:var(--text-muted); line-height:1.6; }
.acct-cred__st { display:inline-flex; align-items:center; gap:5px; font-size:var(--text-sm); white-space:nowrap; }
.acct-cred__st.is-ok { color:#4ade80; }
.acct-cred__st.is-warn { color:var(--warning); }

.acct-bak__acts { display:flex; gap:var(--space-2); padding:var(--space-3) var(--space-5); flex-wrap:wrap; }
.acct-bak__list { padding:0 var(--space-5) var(--space-4); }
.acct-bak { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 60px 28px; gap:var(--space-2); align-items:center; padding:9px 0; border-bottom:1px solid var(--border-subtle); font-size:var(--text-sm); }
.acct-bak:last-child { border-bottom:0; }
.acct-bak__time { color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.acct-bak__meta { color:var(--text-muted); }
.acct-bak__size { color:var(--text-muted); text-align:right; }
.acct-bak__empty, .acct-act__empty { padding:var(--space-4); text-align:center; color:var(--text-muted); font-size:var(--text-sm); }

.acct-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--space-3); padding:var(--space-3) var(--space-5); }
.acct-stat { display:flex; align-items:flex-start; gap:var(--space-2); }
.acct-stat__icon { color:var(--text-muted); margin-top:2px; }
.acct-stat__body { display:flex; flex-direction:column; gap:1px; min-width:0; }
.acct-stat__val { font-size:var(--text-lg); font-weight:var(--weight-semibold); line-height:1.2; }
.acct-stat__label { font-size:var(--text-xs); color:var(--text-muted); }
.acct-stat__hint { font-size:var(--text-xs); color:var(--text-muted); opacity:.8; }

.acct-act__head { padding:var(--space-3) var(--space-5) 0; font-size:var(--text-sm); color:var(--text-muted); border-top:1px solid var(--border-subtle); margin:0 var(--space-5); padding-left:0; padding-right:0; }
.acct-act { padding:var(--space-2) var(--space-5) var(--space-4); }
.acct-act__item { display:grid; grid-template-columns:8px 44px minmax(0,1fr); gap:var(--space-2); align-items:baseline; padding:5px 0; font-size:var(--text-sm); }
.acct-act__time { color:var(--text-muted); font-variant-numeric:tabular-nums; }
.acct-act__text { color:var(--text-secondary); }



/* ===== 顶栏用户菜单 ===== */
.usermenu {
  position: fixed; z-index: 60;
  min-width: 240px; max-width: 300px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg, 0 8px 28px rgba(0,0,0,.45));
  padding: var(--space-2);
  animation: menu-in .14s var(--ease-out, ease-out);
}
@keyframes menu-in { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

.usermenu__head { display:flex; align-items:center; gap:var(--space-3); padding: var(--space-3); }
.usermenu__avatar {
  width:34px; height:34px; flex:0 0 34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: var(--accent); color:#fff; font-size: var(--text-lg);
}
.usermenu__body { min-width:0; display:flex; flex-direction:column; gap:1px; }
.usermenu__name { font-size: var(--text-base); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.usermenu__sub { font-size: var(--text-xs); color: var(--text-muted); }

.usermenu__label { padding: var(--space-2) var(--space-3) 4px; font-size: var(--text-xs); color: var(--text-muted); }
.usermenu__item {
  display:flex; align-items:center; gap: var(--space-3);
  width:100%; padding: 8px var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: var(--text-base); text-align:left;
  transition: background var(--duration-fast) var(--ease-out);
}
.usermenu__item:hover { background: var(--surface-2); color: var(--text); }
.usermenu__item .icon { flex:0 0 auto; color: var(--text-muted); }
.usermenu__item > span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.usermenu__item > em { font-style:normal; font-size: var(--text-xs); color: var(--text-muted); }
.usermenu__item.is-on { color: var(--accent); }
.usermenu__item.is-on .icon { color: var(--accent); }
.usermenu__sep { height:1px; background: var(--border-subtle); margin: var(--space-2) var(--space-3); }

/* 概览：左宽右窄两列 */
.dev-cols { display: grid; gap: var(--space-5); grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); align-items: start; }

.dev-col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }

.dev-hint { font-size: var(--text-sm); color: var(--text-muted); }
/* 卡片头：标题 + 副标题（参考图每张卡标题下都有一行说明） */
.dev-head__main { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.dev-head__hint { font-size: var(--text-sm); color: var(--text-muted); }

.dev-dim { color: var(--text-muted); font-size: var(--text-sm); }
.dev-err { padding: var(--space-3) 0; color: var(--danger); font-size: var(--text-base); word-break: break-all; }
.dev-code-inline { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--surface-3); padding: 1px 5px; border-radius: var(--radius-sm); }

/* 空状态 */
.dev-empty { display:flex; flex-direction:column; align-items:center; gap:6px; padding: var(--space-6) var(--space-5); color: var(--text-muted); font-size: var(--text-base); }
.dev-empty__sub { font-size: var(--text-sm); opacity:.85; text-align:center; }

/* 开发者页 Tab：选中态用浅色块（参考图），不是下划线 */
#devTabs .tabline { border-radius: var(--radius-md); padding: 8px var(--space-4); }
#devTabs .tabline::after { display: none; }
#devTabs .tabline.is-active { background: var(--surface-2); color: var(--text); font-weight: var(--weight-medium); }

/* 开放能力卡 */
.dev-caps { display:flex; flex-direction:column; gap: var(--space-2); }
.dev-caps--dim { opacity:.55; }
.dev-cap { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-2); }
.dev-cap__icon { width:32px; height:32px; flex:0 0 32px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; background: var(--accent-soft); color: var(--accent); }
.dev-cap.is-off .dev-cap__icon { background: var(--surface-3); color: var(--text-muted); }
.dev-cap--master { background: var(--surface-1); border-color: var(--border); }
.dev-cap__body { flex:1; min-width:0; }
.dev-cap__title { font-size: var(--text-base); font-weight: var(--weight-medium); }
.dev-cap__desc { font-size: var(--text-sm); color: var(--text-muted); margin-top:2px; }
.dev-cap__right { display:flex; align-items:center; gap: var(--space-3); flex:0 0 auto; }
.dev-cap__state { font-size: var(--text-sm); color: var(--text-muted); white-space:nowrap; }
.dev-cap__chev { color: var(--text-muted); }
.dev-cap__chev.is-open { color: var(--accent); }

/* 「本地 API」卡详情：旧调试开关 */
.dev-cap-detail { margin: -4px 0 var(--space-2) 44px; padding: var(--space-2) var(--space-4); border-left: 2px solid var(--border-subtle); }
.dev-sub { display:flex; align-items:center; gap: var(--space-3); padding: 6px 0; }
.dev-sub__body { flex:1; min-width:0; }
.dev-sub__name { font-size: var(--text-sm); }
.dev-sub__desc { font-size: var(--text-xs); color: var(--text-muted); margin-top:1px; }
.dev-sub__tip { display:flex; align-items:center; gap:6px; margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-muted); }

/* Token 表 */
.dev-tokname { font-size: var(--text-base); }
.dev-tokpre { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); margin-top:1px; }

.dev-state.is-on { color: var(--online); }
.dev-state.is-off { color: var(--text-muted); }
.dev-acts { display:flex; gap: var(--space-2); justify-content:flex-end; }

/* 调用统计 */
.dev-sel { width: auto; height: 30px; padding: 0 var(--space-3); font-size: var(--text-sm); }
.dev-kpis { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--space-3); padding: var(--space-4) var(--space-5) 0; }
@media (max-width: 700px) { .dev-kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.dev-kpi { display:flex; flex-direction:column; gap:2px; min-width:0; }
.dev-kpi__label { font-size: var(--text-xs); color: var(--text-muted); }
.dev-kpi__value { font-size: var(--text-title); font-weight: var(--weight-semibold); letter-spacing:-.02em; white-space:nowrap; }
.dev-kpi__delta { font-size: var(--text-xs); color: var(--text-muted); white-space:nowrap; }
.dev-kpi__delta.is-up { color: var(--online); }

.dev-chart { padding: var(--space-4) var(--space-5) 0; }
.dev-chart__svg { width:100%; height:190px; display:block; }
.dev-chart__grid { stroke: var(--border-subtle); stroke-width:1; }
.dev-chart__ylab { font-size:10px; fill: var(--text-muted); }
.dev-chart__xlab { font-size:10px; fill: var(--text-muted); }
.dev-chart__empty { height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color: var(--text-muted); font-size: var(--text-base); }
.dev-chart__empty-sub { font-size: var(--text-sm); opacity:.8; }

.dev-quick { margin-top: var(--space-5); }
.dev-quick__head { display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); margin-bottom: var(--space-2); font-size: var(--text-sm); color: var(--text-secondary); }
/* .segmented__btn 是给「图标切换」用的（固定 30px 宽）；
   快速开始是文字按钮，必须放开宽度，否则 cURL / Python / JS 挤成一团 */
.dev-quick__head .segmented__btn { width: auto; height: 24px; padding: 0 var(--space-3); font-size: var(--text-sm); }

}

.dev-tool__body { min-width:0; display:flex; flex-direction:column; gap:1px; }

.dev-tool__desc { font-size: var(--text-xs); color: var(--text-muted); }

// 计算 API 基础路径。

// 关键：通过飞牛网关访问时，页面 URL 是 /app/micam/，
// 此时必须请求 /app/micam/api/xxx 而不是 /api/xxx
// （后者会打到飞牛根路径，不是我们的应用）。
var API_BASE = (function(){
  var p = location.pathname;
  // 去掉末尾的 index.html 或 /
  p = p.replace(/\/index\.html$/, "").replace(/\/$/, "");
  // 如果路径以 /app/<name> 结尾，就用它作为前缀
  if (/\/app\/[^/]+$/.test(p)) return p;
  return "";
})();

function apiUrl(path){
  // path 形如 "/api/devices"
  return API_BASE + path;
}

function api(path, opt){ return fetch(apiUrl(path), opt).then(function(r){ return r.json(); }); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){

function icon(name, size){
  // 图标来自内联 sprite（构建时注入 assets/img/icons.svg）
  var cls = "icon";
  if(size && size <= 14) cls += " icon-sm";
  else if(size && size >= 22) cls += " icon-lg";
  else if(size && size >= 30) cls += " icon-xl";
  var style = size ? ' style="width:'+size+'px;height:'+size+'px"' : "";
  return '<svg class="'+cls+'"'+style+' aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}
function fmtSize(b){
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(1)+" KB";
  if(b<1073741824) return (b/1048576).toFixed(1)+" MB";
  return (b/1073741824).toFixed(2)+" GB";
}

  var el = document.createElement("div");
  el.className = "toast" + (type==="ok"?" is-ok":type==="err"?" is-err":type==="warn"?" is-warn":"");
  var ic = type==="ok" ? "check" : type==="err" ? "alert" : "info";
  el.innerHTML = icon(ic,16) + '<div class="toast__body">'+esc(msg)+'</div>';
  wrap.appendChild(el);
  setTimeout(function(){
    el.style.transition = "opacity .25s, transform .25s";
    el.style.opacity = "0";
    el.style.transform = "translateX(12px)";
    setTimeout(function(){ el.remove(); }, 250);

}

  document.addEventListener("touchend", function(e){
    if(!isMobile()) return;

var devDetailTimer = null;

function renderDeviceDetail(c){
  if(devDetailTimer){ clearInterval(devDetailTimer); devDetailTimer = null; }
  if(!devDetailDid){
    c.innerHTML = '<div class="page__inner">' + empty('camera','没有指定设备','','') + '</div>';
    return;
  }
  c.innerHTML = '<div class="page__inner">' + loading('加载设备信息…') + '</div>';

  Promise.all([
    api('/api/devices'),
    api('/api/devices/meta?did=' + encodeURIComponent(devDetailDid)).catch(function(){ return {}; }),
    api('/api/recordings/config').catch(function(){ return {}; }),
    api('/api/ptz/preset?did=' + encodeURIComponent(devDetailDid)).catch(function(){ return { presets: [] }; }),
    api('/api/recordings/list?name=' + encodeURIComponent('')).catch(function(){ return { files: [] }; }),
    api('/api/events?days=30&limit=1000').catch(function(){ return { events: [] }; }),
  ]).then(function(res){
    var all = (res[0].devices || []);
    var dev = all.filter(function(d){ return d.did === devDetailDid; })[0];
    if(!dev){
      c.innerHTML = '<div class="page__inner">' + empty('camera','设备不存在','可能已被移除','') + '</div>';
      return;
    }
    paintDeviceDetail(c, dev, res[1] || {}, res[2] || {}, res[3] || {}, res[5] || {});

    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderDeviceDetail(c); }) + '</div>';

function paintDeviceDetail(c, dev, meta, recCfg, presets, evRes){

  var icon0 = dev;
  var ex = dev.extra || {};
  var isOnline = !!dev.isOnline;
  var model = dev.model || '';
  var isCamera = model.indexOf('camera') >= 0 || model.indexOf('mxiang') >= 0;

  // 该设备的事件统计（30 天）

  // 云台
  var pa = document.getElementById('ddPtzAdd');
  if(pa) pa.onclick = function(){
    var n = ptzList(presets).length + 1;
    api('/api/ptz/preset', { method:'POST', headers:{'Content-Type':'application/json'},

        if(r && r.ok){ toast('已保存为预置位 ' + n, 'ok'); render(); }
        else { toast('保存失败：' + ((r && r.error) || '云台无响应，可能被实时预览占用'), 'err'); }
      })
      .catch(function(e){ toast('保存失败：' + e.message, 'err'); });
  };

    b.onclick = function(){
      var slot = this.dataset.ptzgo;
      var btn = this;
      btn.disabled = true;
      btn.textContent = '移动中…';
      api('/api/ptz/goto', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ did: dev.did, slot: parseInt(slot, 10) }) })
        .then(function(r){
          // 后端 ok=false 时不能报成功 —— 云台可能只走了一部分

          if(r && r.ok){
            toast('已转到预置位 ' + slot, 'ok');
          } else if(r && r.partial){
            var cur = r.current || {};
            toast('云台移动了一部分（' + (r.steps||0) + ' 步）就被中断\n'
                  + '当前位置 ' + (cur.angle != null ? cur.angle + '°' : '?') + '，未能到达目标\n'
                  + '可能是摄像头正被实时预览占用', 'warn');
          } else {
            toast('跳转失败：' + ((r && r.error) || '未知错误'), 'err');
          }

        .then(function(){ btn.disabled = false; btn.innerHTML = icon('move',13) + '转到'; });
    };
  });

// ddStat 统计小卡
function ddStat(ic, label, val){
  return '<div class="dd-stat">'
    + '<span class="dd-stat__icon">' + icon(ic, 15) + '</span>'
    + '<span class="dd-stat__body"><span class="dd-stat__label">' + label + '</span>'
    + '<span class="dd-stat__val">' + val + '</span></span>'
    + '</div>';
}

// ptzList 把预置位响应归一化成数组
//
// 后端返回的是 map（按 slot 索引）：{"presets":{"1":{...}}}
// 直接 .map() 会失败，所以统一转成数组并按 slot 排序。
function ptzList(res){
  var p = res && res.presets;
  if(!p) return [];
  var arr = Array.isArray(p) ? p : Object.keys(p).map(function(k){ return p[k]; });
  return arr.filter(Boolean).sort(function(a,b){ return (a.slot||0) - (b.slot||0); });
}

// ddPresets 云台预置位列表
function ddPresets(list){
  if(!list.length){
    return '<div class="dd-empty">还没有预置位<br><span>把摄像头转到想要的位置，点「保存当前位置」</span></div>';
  }
  return list.map(function(p){
    return '<div class="dd-preset">'
      + '<span class="dd-preset__slot">' + p.slot + '</span>'
      + '<span class="dd-preset__body">'
      +   '<span class="dd-preset__name">' + esc(p.name || ('预置位 ' + p.slot)) + '</span>'
      +   '<span class="dd-preset__meta">水平 ' + (p.angle != null ? p.angle + '°' : '—')
      +     ' · 垂直 ' + (p.elevation != null ? p.elevation + '°' : '—')
      +     (p.savedAt ? ' · ' + esc(p.savedAt.slice(0,10)) : '') + '</span>'
      + '</span>'
      + '<button class="btn btn--sm" data-ptzgo="' + p.slot + '">' + icon('move',13) + '转到</button>'
      + '</div>';
  }).join('');
}

// 重命名弹窗（中文别名 + 英文名）
function showRenameDialog(did, dev){
  api("/api/devices/meta?did=" + encodeURIComponent(did)).then(function(m){
    var html = '<div class="field" style="margin-bottom:14px">'
      + '<label class="field__label">中文别名</label>'
      + '<input class="input" id="rnAlias" placeholder="例如：门口" value="' + esc(m.alias || '') + '">'
      + '<div class="field__hint">显示在卡片主标题。留空则用设备原名。</div>'
      + '</div>'
      + '<div class="field">'
      + '<label class="field__label">英文名</label>'
      + '<input class="input" id="rnAliasEn" placeholder="例如：Front Door" value="' + esc(m.aliasEn || '') + '">'
      + '<div class="field__hint">显示在中文名旁边，可留空。</div>'
      + '</div>'
      + '<div style="margin-top:16px;font-size:12px;color:var(--text-muted)">'
      + '设备原名：' + esc(dev.name || '') + '</div>';

    openModal('重命名「' + (dev.alias || dev.name || '') + '」', html, function(root){
      var btn = document.createElement('div');
      btn.className = 'dialog__foot';
      btn.innerHTML = '<button class="btn" id="rnCancel">取消</button>'
        + '<button class="btn btn--primary" id="rnSave">保存</button>';
      root.querySelector('.dialog').appendChild(btn);

      root.querySelector('#rnCancel').onclick = closeModal;
      root.querySelector('#rnSave').onclick = function(){
        var body = {
          did: did,
          alias: root.querySelector('#rnAlias').value.trim(),
          aliasEn: root.querySelector('#rnAliasEn').value.trim()
        };
        api("/api/devices/meta", {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify(body)
        }).then(function(){
          closeModal();
          toast('已保存', 'ok');
          render();
        }).catch(function(e){ toast('保存失败：' + e.message, 'err'); });
      };
    });
  }).catch(function(e){ toast('读取失败：' + e.message, 'err'); });
}

function renderDevices(c){
  c.innerHTML = '<div class="page__inner">' + loading() + '</div>';

  loadDevices().then(function(st){
    var all = devices || [];

    var now = new Date();
    var week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    var dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 '
      + week[now.getDay()] + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());

    function nOnline(){ return all.filter(function(d){ return d.isOnline; }).length; }
    function nShared(){ return all.filter(isShared).length; }
    function nFav(){ return all.filter(function(d){ return isFav(d.did); }).length; }

    function filtered(){
      var l = all.slice();
      if(devFilter === 'online')  l = all.filter(function(d){ return d.isOnline; });
      if(devFilter === 'offline') l = all.filter(function(d){ return !d.isOnline; });
      if(devFilter === 'shared')  l = all.filter(isShared);
      if(devFilter === 'fav')     l = all.filter(function(d){ return isFav(d.did); });
      var q = (devSearch || '').trim().toLowerCase();
      if(q){
        l = l.filter(function(d){
          return ((d.alias||'')+' '+(d.aliasEn||'')+' '+d.name).toLowerCase().indexOf(q) >= 0;
        });
      }
      return l;
    }

    function chip(k, label, count, dot, ic){
      var on = devFilter === k;
      return '<button class="chip' + (on ? ' is-active' : '') + '" data-f="' + k + '" type="button">'
        + (dot ? '<span class="status-dot ' + dot + '"></span>' : (ic ? icon(ic,14) : ''))
        + '<span>' + label + '</span>'
        + '<span class="chip__n">' + count + '</span>'
        + '</button>';
    }

    c.innerHTML = '<div class="page__inner">'

      + '<div class="list-head">'
      +   '<div class="list-head__main">'
      +     '<h1 class="list-head__title">摄像头列表</h1>'
      +     '<div class="list-head__en">Cameras</div>'
      +   '</div>'
      +   '<div class="list-head__acts">'
      +     '<button class="btn" id="btnToGrid">' + icon('grid',15) + '多路预览</button>'
      +     '<span class="list-head__date">' + esc(dateStr) + '</span>'
      +   '</div>'
      + '</div>'

      + '<div class="list-stat">'
      +   '<span class="status-dot ' + (nOnline() ? 'is-online' : 'is-offline') + '"></span>'
      +   '<span>' + all.length + ' 台设备，' + nOnline() + ' 台在线</span>'
      + '</div>'

      + '<div class="filters filters--rich">'
      +   chip('all',     '全部', all.length, '', '')
      +   chip('online',  '在线', nOnline(), 'is-online', '')
      +   chip('offline', '离线', all.length - nOnline(), 'is-offline', '')
      +   chip('shared',  '共享', nShared(), '', 'users')
      +   chip('fav',     '收藏', nFav(), '', 'star')
      +   '<span class="filters__spacer"></span>'
      +   '<div class="segmented">'
      +     '<button class="segmented__btn' + (devView==='grid'?' is-active':'') + '" data-view="grid" title="网格">' + icon('grid',15) + '</button>'
      +     '<button class="segmented__btn' + (devView==='list'?' is-active':'') + '" data-view="list" title="列表">' + icon('list',15) + '</button>'
      +   '</div>'
      +   '<div class="search filters__search">'
      +     icon('search',15)
      +     '<input class="input" id="devSearchBox" type="search" placeholder="搜索摄像头…" value="' + esc(devSearch || '') + '">'
      +   '</div>'
      + '</div>'

      + '<div class="cam-grid' + (devView==='list' ? ' cam-grid--list' : '') + '"></div>'
      + '</div>';

    // ---- 只重建网格（无痕切换）----
    // applyList 原地更新网格。
    //
    // 关键：**复用已有的卡片节点**，只增删差异部分。
    // 直接 grid.innerHTML = ... 会让 <img> 重新加载，
    // 表现为切换筛选时画面闪一下（无痕加载的反面）。
    function applyList(){
      var grid = c.querySelector('.cam-grid');
      if(!grid) return;
      var list = filtered();
      grid.className = 'cam-grid' + (devView==='list' ? ' cam-grid--list' : '');

      if(!list.length){
        grid.innerHTML = empty('cam','没有匹配的摄像头','换个筛选条件或清空搜索试试','');
        return;
      }

      // 空状态占位要清掉
      var ph = grid.querySelector('.empty');
      if(ph) ph.remove();

      var existing = {};
      Array.prototype.forEach.call(grid.querySelectorAll('.cam-card'), function(el){
        existing[el.dataset.did] = el;
      });

      var wanted = {};
      list.forEach(function(d){
        wanted[d.did] = true;
        var el = existing[d.did];
        if(!el){
          // 新出现的：插入
          var tmp = document.createElement('div');
          tmp.innerHTML = camCardHTML(d);
          el = tmp.firstElementChild;
          grid.appendChild(el);
          loadCameraSnapsFor(el, d.did);
        }
        // 保证顺序正确（已存在且位置对时不移动 DOM，避免图片重载）
        if(grid.children[list.indexOf(d)] !== el && el.parentNode === grid){
          grid.insertBefore(el, grid.children[list.indexOf(d)] || null);
        }
      });

      // 移除不再需要的
      Array.prototype.forEach.call(grid.querySelectorAll('.cam-card'), function(el){
        if(!wanted[el.dataset.did]) el.remove();
      });

      bindCards();
    }

    function bindCards(){
      Array.prototype.forEach.call(c.querySelectorAll('.cam-card'), function(el){
        el.onclick = function(ev){
          if(ev.target.closest('[data-fav]')) return;
          var d = all.filter(function(x){ return x.did === el.dataset.did; })[0];
          if(!d) return;
          if(d.isOnline) gotoLive(d.did);
          else showRenameDialog(d.did, d);
        };
        el.oncontextmenu = function(ev){
          ev.preventDefault();
          var d = all.filter(function(x){ return x.did === el.dataset.did; })[0];
          if(d) showRenameDialog(d.did, d);
        };
        // 离线卡片：悬停显示删除按钮
        if(el.classList.contains('is-offline')){
          el.onclick = function(ev){
            if(ev.target.closest('[data-del]') || ev.target.closest('[data-fav]')) return;
            showRenameDialog(el.dataset.did, all.filter(function(x){ return x.did === el.dataset.did; })[0]);
          };
        }
      });
      // 删除离线设备（从本机列表移除，不影响小米账号）
      Array.prototype.forEach.call(c.querySelectorAll('[data-del]'), function(b){
        b.onclick = function(ev){
          ev.stopPropagation();
          var did = b.dataset.del;
          var dev = all.filter(function(x){ return x.did === did; })[0] || {};
          if(!confirm('删除「' + (dev.alias || dev.name || did) + '」？\n\n'
            + '只从本机列表移除，不影响小米账号。\n'
            + '下次同步设备时会重新出现 —— 如需永久隐藏请加入忽略名单。')) return;
          api('/api/devices/hide', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ did: did, hidden: true })
          }).then(function(){
            toast('已移除', 'ok');
            all = all.filter(function(x){ return x.did !== did; });
            devices = devices.filter(function(x){ return x.did !== did; });
            renderDevices(c);
          }).catch(function(e){ toast('移除失败：' + e.message, 'err'); });
        };
      });

      // 「详情」按钮 -> 设备详情页
  Array.prototype.forEach.call(c.querySelectorAll('[data-info]'), function(b){
    b.onclick = function(e){
      e.stopPropagation();
      devDetailDid = this.dataset.info;
      page = 'device';
      window.scrollTo(0, 0);
      renderMenu();
      render();
    };
  });

  Array.prototype.forEach.call(c.querySelectorAll('[data-fav]'), function(b){
        b.onclick = function(ev){
          ev.stopPropagation();
          var did = b.dataset.fav;
          var nv = !isFav(did);
          setFav(did, nv);
          var dev = all.filter(function(x){ return x.did === did; })[0];
          if(dev) dev.favorite = nv;
          api('/api/devices/meta', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ did: did, favorite: nv })
          }).catch(function(){});
          // 原地更新这一张卡片的状态，不重建列表
          b.classList.toggle('is-active', nv);
          b.querySelector('svg').setAttribute('fill', nv ? 'currentColor' : 'none');
          var fn = c.querySelector('[data-f="fav"] .chip__n');
          if(fn) fn.textContent = nFav();
        };
      });
    }

    // ---- 筛选 / 视图（无痕）----
    var bg2 = document.getElementById('btnToGrid');
    if(bg2) bg2.onclick = function(){ page = 'grid'; renderMenu(); render(); };

    Array.prototype.forEach.call(c.querySelectorAll('[data-f]'), function(b){
      b.onclick = function(){
        devFilter = this.dataset.f;
        Array.prototype.forEach.call(c.querySelectorAll('[data-f]'), function(x){
          x.classList.toggle('is-active', x.dataset.f === devFilter);
        });
        applyList();
      };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-view]'), function(b){
      b.onclick = function(){
        devView = this.dataset.view;
        Array.prototype.forEach.call(c.querySelectorAll('[data-view]'), function(x){
          x.classList.toggle('is-active', x.dataset.view === devView);
        });
        applyList();
      };
    });

    var sb = document.getElementById('devSearchBox');
    if(sb){
      var deb = null;
      sb.oninput = function(){
        devSearch = this.value;
        if(deb) clearTimeout(deb);
        deb = setTimeout(applyList, 180);
      };
    }

    applyList();
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner"><div class="card">'
      + empty('close','加载失败', err.message, '') + '</div></div>';
  });
}

function clockNow(){
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

function isFav(did){
  // 服务端收藏优先，其次本地
  var d = (devices || []).filter(function(x){ return x.did === did; })[0];
  if(d && d.favorite) return true;
  return getFav(did);
}

// loadCameraSnaps 加载摄像头缩略图
//
// ===== 为什么不用实时快照 =====
//
// 抓一张快照要 3-9 秒（新建 ffmpeg + 等关键帧）。
// 设备列表如果有 N 台，首屏要等 10-30 秒，而且 CPU 峰值很高。
//
// 服务端提供了 /api/live/thumb：
//   - 有缓存 -> 立刻返回（后台自动刷新）
//   - 无缓存 -> 202，我们稍后重试
//
// 所以这里：先并发请求，202 的排队重试。
function loadCameraSnaps(root){
  var imgs = Array.prototype.slice.call(root.querySelectorAll('img[data-snap]'));

  var load = function(img, attempt){
    if(!document.body.contains(img)) return;

    // 用 fetch 而不是 img.src，这样能拿到状态码（区分 202 和 200）
    fetch(apiUrl('/api/live/thumb?did=' + encodeURIComponent(img.dataset.snap) + '&w=640'), { cache: 'no-store' })
      .then(function(r){
        if(r.status === 202){
          // 服务端还在生成，稍后重试（最多 10 次，约 30 秒）
          if(attempt < 10) setTimeout(function(){ load(img, attempt + 1); }, 3000);
          return null;
        }
        if(!r.ok) throw new Error('http ' + r.status);
        return r.blob();
      })
      .then(function(b){
        if(!b) return;
        if(!document.body.contains(img)) return;
        img.src = URL.createObjectURL(b);
        img.classList.add('is-loaded');
      })
      .catch(function(){
        var box = img.parentNode;
        if(box && document.body.contains(box)){
          box.innerHTML = '<div class="camera-card__placeholder">' + icon('cam-off',28) + '<span>暂无画面</span></div>';
        }
      });
  };

  // 并发请求（服务端有缓存，不会压满）
  imgs.forEach(function(img, i){
    setTimeout(function(){ load(img, 0); }, i * 150);

    // 时间角标
    var clk = root.querySelector('[data-clock="' + img.dataset.snap + '"]');
    if(clk) clk.textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  });
}

function bindDeviceActions(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var did = b.dataset.did, act = b.dataset.act;
      if(act==="live") gotoLive(did);
      else if(act==="snap") snap(did);
      else if(act==="rec") startRec(did);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".dev-preview"), function(el){
    el.onclick = function(){ gotoLive(el.dataset.did); };
  });
}

// gotoReplay 跳到回放页并定位到指定设备/时刻
function gotoReplay(did, time){
  page = 'recordings';
  if(did) currentDid = did;
  if(time) replaySeekTime = time;
  setPageTitle('回放');
  renderMenu();
  render();
}

//
// 顶栏导航改版后 #pageTitle 元素已移除（标题现在在页面内容里），
// 但多处旧代码还在写它 —— 未加保护会抛
// "Cannot set properties of null"，导致整个导航静默失败。
function setPageTitle(t){
  var el = document.getElementById('pageTitle');
  if(el) el.textContent = t;
  // 顺便同步文档标题，浏览器标签页也好看
  if(t) document.title = t + ' · MiCam';
}

function gotoLive(did){
  page = "live";
  currentDid = did;
  setPageTitle("实时预览");
  renderMenu();
  render();
}

      // ---- 页头 ----

      +     '<div class="home-head__title">家庭概览</div>'

      +   '</div>'
      +   '<div class="home-head__date">' + esc(dateStr) + '</div>'

      +   statCard('calendar', '今日事件', String(h.todayEvents || 0), 'events')
      +   statCard('hard-drive', '存储', (h.storagePct || 0).toFixed(1) + '<small>%</small>', 'storage')

      +     '<span class="sec-head__title">摄像头 <span class="sec-head__en">Cameras</span></span>'
      +     '<a class="sec-head__more" href="javascript:;" data-go="devices">查看全部 ' + icon('chevron-right',14) + '</a>'

      +       '<a class="sec-head__more" href="javascript:;" data-go="events">查看全部 ' + icon('chevron-right',14) + '</a>'
      +     '</div>'

      +   '</section>'
      +   '<section class="card">'
      +     '<div class="sec-head">'
      +       '<span class="sec-head__title">' + icon('hard-drive',15) + ' 存储 <span class="sec-head__en">Storage</span></span>'
      +     '</div>'

// errorCard 统一的错误卡片（带重试）
//
// 「Failed to fetch」在部署重启期间必然出现一次，
// 用户点一下重试就行，不该是死路。
function errorCard(e, retry){
  var msg = (e && e.message) || String(e);
  if(msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('fetch') >= 0){
    msg = '无法连接插件服务（可能正在重启）';
  }
  var id = 'retry_' + Math.random().toString(36).slice(2, 8);
  setTimeout(function(){
    var b = document.getElementById(id);
    if(b) b.onclick = function(){ retry(); };
  }, 0);
  return '<div class="card">'
    + empty('close', '加载失败', msg,
        '<div class="empty__action"><button class="btn btn--primary" id="' + id + '">'
        + icon('refresh',14) + '重试</button></div>')
    + '</div>';
}

// localDate 本地日期 YYYY-MM-DD
//
// **不要用 toISOString()** —— 那是 UTC，北京时间早上 8 点前会算成前一天，
// 导致「今天」筛选查不到任何事件（踩过的坑）。
function localDate(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function pad2(n){ return n < 10 ? '0'+n : ''+n; }

// statCard 概览卡
function statCard(ic, label, value, go){
  return '<button class="stat-card" data-go="' + go + '" type="button">'
    + '<span class="stat-card__icon">' + icon(ic, 20) + '</span>'
    + '<span class="stat-card__body">'
    +   '<span class="stat-card__label">' + esc(label) + '</span>'
    +   '<span class="stat-card__value">' + value + '</span>'
    + '</span>'
    + '<span class="stat-card__chev">' + icon('chevron-right', 16) + '</span>'
    + '</button>';
}

// camTile 首页的摄像头图块（名称+英文名+时间叠加在底部）
function camTile(d){
  var on = d.online;
  var name = d.alias || d.name;
  var en = d.aliasEn || '';
  var badge = '<span class="cam-tile__badge">'
    + '<span class="status-dot ' + (on ? 'is-online' : 'is-offline') + '"></span>'
    + (on ? '在线' : '离线') + '</span>';

  if (!on) {
    return '<div class="cam-tile is-offline" data-did="' + esc(d.did) + '">'
      + badge
      + '<div class="cam-tile__off">'
      +   icon('cam-off', 30)
      +   '<div class="cam-tile__off-title">摄像头离线</div>'
      +   (d.lastSeen ? '<div class="cam-tile__off-sub">上次在线：' + esc(fmtAgo(d.lastSeen)) + '</div>' : '')
      + '</div>'
      + '<div class="cam-tile__foot">'
      +   '<span class="cam-tile__name">' + esc(name) + '</span>'
      +   (en ? '<span class="cam-tile__en">' + esc(en) + '</span>' : '')
      +   '<span class="cam-tile__time">--:--</span>'
      + '</div>'
      + '</div>';
  }

  return '<div class="cam-tile" data-did="' + esc(d.did) + '">'
    + badge
    + '<img data-home-thumb="' + esc(d.did) + '" alt="">'
    + '<div class="cam-tile__foot">'
    +   '<span class="cam-tile__name">' + esc(name) + '</span>'
    +   (en ? '<span class="cam-tile__en">' + esc(en) + '</span>' : '')
    +   '<span class="cam-tile__time" data-home-time="' + esc(d.did) + '">'
    +     (d.thumbAt ? fmtClock(d.thumbAt) : '刚刚') + '</span>'
    + '</div>'
    + '</div>';
}

function fmtClock(ts){
  var d = new Date(ts * 1000);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

// fmtAgo 相对时间
//
// 对齐效果图的表达：
//   < 1 分钟   -> 刚刚
//   < 1 小时   -> X 分钟前
//   今天       -> 今天 HH:MM
//   昨天       -> 昨天 HH:MM
//   更早       -> X 天前
function fmtAgo(s){
  if (!s) return '未知';
  var t = new Date(s.replace(' ', 'T'));
  if (isNaN(t)) return s;

  var now = new Date();
  var diff = now - t;
  if (diff < 0) return '刚刚';
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';

  var hm = pad2(t.getHours()) + ':' + pad2(t.getMinutes());
  if (t.toDateString() === now.toDateString()) return '今天 ' + hm;

  var y = new Date(now.getTime() - 86400000);
  if (t.toDateString() === y.toDateString()) return '昨天 ' + hm;

  var days = Math.floor(diff / 86400000);
  if (days < 30) return days + ' 天前';
  return (t.getMonth()+1) + '月' + t.getDate() + '日';
}
