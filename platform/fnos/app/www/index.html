.cam-tile__badge .status-dot { width: 6px; height: 6px; }
/* 离线徽章用琥珀色，和在线一眼区分 */
.cam-tile__badge.is-offline {
  background: color-mix(in srgb, var(--warning) 26%, rgba(0,0,0,.6));
  color: #ffd79a;
}

.cam-tile__foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-5) var(--space-4) var(--space-3);
  background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0));
  color: #fff;
}
.cam-tile__name {
  font-size: var(--text-base); font-weight: var(--weight-medium);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.cam-tile__en {
  font-size: var(--text-sm); color: rgba(255,255,255,.65);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 0 auto;
}
.cam-tile__foot { min-width: 0; }
.cam-tile__time { margin-left: auto; font-size: var(--text-sm); color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; }

.cam-tile__off {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-2); color: var(--text-secondary); text-align: center;
}
/* 首页离线图块：要「跳出来」而不是「隐身」（用户反馈）。
   ⚠️ 上一轮我把橙色描边加到了 .cam-card 上 —— 那是**摄像头列表页**用的类；
   首页用的是 .cam-tile，所以首页这张一直是中性色。
   两个类名不同、都要处理（这是本项目又一次"改了一处、另一处不生效"）。 */
.cam-tile__off .icon { color: var(--warning); }
.cam-tile__off-title { font-size: var(--text-base); color: var(--warning); }
.cam-tile__off-sub { font-size: var(--text-sm); color: var(--text-muted); }
/* 最后在线时间用等宽数字，便于跨设备比较 */
.cam-tile__off-sub b { color: var(--text-secondary); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }

/* 离线图块整体弱化（用户反馈第 2 条）：
   灰色底 + 斜纹 + 虚线边框，和在线画面形成明显区分，
   而不是「和在线一样正常显示」。 */
.cam-tile.is-offline {
  /* 保留斜纹（表示"这里本该有画面"），但整体转橙：
     虚线橙描边 + inset 叠一层橙（等效 2px，不改 border-width 免布局位移）。 */
  background:
    repeating-linear-gradient(45deg,
      rgba(245,158,11,.05) 0 8px,
      rgba(245,158,11,0)   8px 16px),
    #0d1117;
  border: 1px dashed color-mix(in srgb, var(--warning) 60%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 35%, transparent);
}

/* 底部两栏：事件 + 存储 */
.home-cols {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  align-items: start;
}
@media (max-width: 1100px) { .home-cols { grid-template-columns: 1fr; } }

/* 事件列表 */
.event-list { padding: 0 var(--space-3) var(--space-3); }
.event-item {
  display: flex; align-items: center; gap: var(--space-4);
  width: 100%; padding: var(--space-3);
  border-radius: var(--radius-md);
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
  transition: background var(--duration-fast) var(--ease-out);
}
.event-item:last-child { border-bottom: 0; }
.event-item:hover { background: var(--surface-2); }

.event-item__thumb {
  width: 62px; height: 42px; flex: 0 0 62px;
  border-radius: var(--radius-sm); overflow: hidden; background: #0a0d12;
}
.event-item__thumb img { width: 100%; height: 100%; object-fit: cover; }

.event-item__time {
  flex: 0 0 52px; font-size: var(--text-base); color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.event-item__where {
  flex: 0 0 110px; font-size: var(--text-base); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.event-item__type {
  flex: 0 0 34px; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.event-item__body { flex: 1; min-width: 0; }
.event-item__name { font-size: var(--text-base); }
.event-item__body { min-width: 0; }
.event-item__name, .event-item__desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.event-item__desc { font-size: var(--text-sm); color: var(--text-muted); margin-top: 1px; }
.event-item__chev { color: var(--text-muted); flex: 0 0 auto; }

/* 存储卡 */
.storage-body { padding: 0 var(--space-5) var(--space-5); }

/* ⚠️ 本卡**不再显示存储百分比与进度条**（用户反馈：与顶部概览卡重复，
   一个环形一个条形还割裂）。分工改为：
     顶部概览卡 = 用量概览（百分比 + 环形 + 已用/总量）
     本卡       = 录像明细（可录时长 + 段数 + 各设备占用）
   下面这些 .storage-pct / .storage-row 选择器保留是因为存储页仍在用，
   首页不再引用。 */

/* 可录时长：本卡的主数字（顶部卡没有的信息） */
.storage-est {
  display: flex; align-items: baseline; gap: 6px;
  margin-bottom: var(--space-2);
}
.storage-est__num {
  font-size: var(--text-title); font-weight: var(--weight-semibold);
  letter-spacing: -.02em; line-height: 1;
}
.storage-est__unit { font-size: var(--text-lg); color: var(--text-secondary); }
.storage-est__label { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); }

/* 各设备录像占用（横向条形，宽度按最大值归一） */
.storage-cams {
  display: flex; flex-direction: column; gap: var(--space-2);
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
}
.storage-cam {
  display: grid; align-items: center; gap: var(--space-3);
  grid-template-columns: minmax(0, 1fr) 72px auto;
  font-size: var(--text-sm);
}
.storage-cam__name {
  color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.storage-cam__bar {
  display: block; height: 5px; border-radius: 999px;
  background: var(--surface-3); overflow: hidden;
}
.storage-cam__fill {
  display: block; height: 100%; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 70%, transparent);
}
.storage-cam__val {
  color: var(--text-muted); font-variant-numeric: tabular-nums;
  text-align: right; white-space: nowrap;
}
/* 「另有 N 台暂无录像」——补齐信息，避免"只显示一台"被读成数据不完整 */
.storage-cam--none { grid-template-columns: 1fr; }
.storage-cam--none .storage-cam__name { color: var(--text-muted); font-size: var(--text-xs); }
/* 存储页仍在用的旧选择器 */
.storage-row {
  display: flex; align-items: baseline; gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.storage-pct {
  font-size: var(--text-title); font-weight: var(--weight-semibold);
  letter-spacing: -.02em;
}
.storage-used { font-size: var(--text-base); color: var(--text-secondary); }
/* .storage-total 已废弃：GB 数移到 .storage-meta（与「可录约 N 天」同行），
   避免同一张卡里百分比和 GB 数各说各话。 */

/* 百分比按阈值着色，和概览卡的环形进度保持同一套语义色 */
.storage-pct.is-warn   { color: var(--warning); }
.storage-pct.is-danger { color: var(--danger); }

.storage-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-secondary);
}
.storage-hint { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); }

/* .storage-health 已移除（2026-10-12）：
   原文案「存储健康 正常 / 运行正常，正在按计划录制」在录制关闭时也说「正常」，
   属于无信息量的固定绿灯，与磁盘真实阈值无关。
   磁盘状态现在由百分比颜色 + 环形进度表达。 */

.storage-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-4); }


/* ==========================================================================
   CAMERAS LIST — 摄像头列表（对齐效果图）
   ========================================================================== */

.list-head {
  display: flex; align-items: flex-start; gap: var(--space-4);
  margin-bottom: var(--space-2);
}
.list-head__main { flex: 1; min-width: 0; }
.list-head__title {
  font-size: var(--text-title); font-weight: var(--weight-semibold);
  letter-spacing: -.02em; line-height: 1.15;
}
.list-head__en {
  font-size: var(--text-lg); color: var(--text-secondary); margin-top: 2px;
}
.list-head__date {
  font-size: var(--text-base); color: var(--text-secondary);
  white-space: nowrap; padding-top: 8px;
}
@media (max-width: 700px) { .list-head__date { display: none; } }

/* 窄屏：标题与操作区改为上下排列。
   否则操作区（多个按钮 + 下拉）会把标题挤成一列一个汉字
   —— 实测 414px 下「事件中心」竖排成 4 行，非常难看。 */
@media (max-width: 700px) {
  .list-head { flex-direction: column; align-items: stretch; gap: var(--space-3); }
  .list-head__title { white-space: nowrap; }
  .list-head__acts { flex-wrap: wrap; }
}

.list-stat {
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-base); color: var(--text-secondary);
  margin-bottom: var(--space-5);
}

/* 富筛选行：胶囊带数量 + 视图切换 + 搜索 */
.filters--rich { gap: var(--space-3); margin-bottom: var(--space-5); }

.chip__n {
  min-width: 20px; padding: 0 5px; margin-left: 2px;
  border-radius: 999px; font-size: var(--text-xs);
  background: var(--surface-3); color: var(--text-secondary);
  text-align: center;
}
.chip.is-active .chip__n { background: rgba(255,255,255,.22); color: #fff; }

.filters__search { width: 240px; }
@media (max-width: 900px) { .filters__search { width: 100%; } }

/* 摄像头网格 */
.cam-grid {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (max-width: 1200px) { .cam-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px)  { .cam-grid { grid-template-columns: 1fr; } }

.cam-grid--list { grid-template-columns: 1fr; }
.cam-grid--list .cam-card { display: grid; grid-template-columns: 260px minmax(0,1fr); }
.cam-grid--list .cam-card__preview { aspect-ratio: auto; height: 100%; min-height: 120px; }
.cam-grid--list .cam-card__foot { align-items: center; }
@media (max-width: 700px) {
  .cam-grid--list .cam-card { grid-template-columns: 1fr; }
  .cam-grid--list .cam-card__preview { aspect-ratio: 16/9; }
}

/* 摄像头卡片 */
.cam-card {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  overflow: hidden; cursor: pointer;
  transition: border-color var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
}
.cam-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
/* 离线卡片要「跳出来」而不是「隐身」（用户反馈）。
   原来离线卡只有灰度缩略图 + 中性灰边框，视觉权重**低于**在线卡 ——
   但"有摄像头离线"恰恰是最需要用户注意的状态。
   用橙色描边 + 橙色底调，与顶部统计卡的警告色呼应。
   注：用 inset box-shadow 叠加出「2px 描边」的效果，**不改 border-width**，
   避免 1px→2px 引发的布局位移（卡片尺寸不变，只有视觉变重）。 */
.cam-card.is-offline {
  cursor: default;
  border-color: color-mix(in srgb, var(--warning) 60%, var(--border-subtle));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 45%, transparent);
  background: color-mix(in srgb, var(--warning) 6%, var(--surface-1));
}
.cam-card.is-offline:hover {
  transform: none;
  border-color: color-mix(in srgb, var(--warning) 75%, var(--border-subtle));
  background: color-mix(in srgb, var(--warning) 9%, var(--surface-1));
}

.cam-card__preview {
  position: relative; aspect-ratio: 16 / 9;
  background: #0a0d12; overflow: hidden;
}
.cam-card__preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ===== 摄像头卡片：信息角标系统（2026-10-12 重新布局）=====
 *
 * 用户反馈：左上堆了时间戳 + 双摄/共享标签，右上还有状态，三个信息点挤一起，
 * 而且标签多寡会互相挤动，各卡片对齐线不一致。
 *
 * 现在固定分工，**每个角只放一类信息**，无论标签多少都不会错位：
 *   左下 = 时间戳
 *   右上 = 在线状态
 *   底部 = 属性标签（双摄/共享，与标题同行）
 *
 * ⚠️ 时间戳为什么放**右下**而不是左上/左下：
 *    ① 小米摄像头**自己在画面左上角烧录了 OSD**（"2026/10/11 07:15:53"），
 *       那是视频流里的像素，前端无法去掉。用户建议"左上只放时间"，
 *       但左上已经被摄像头自己的时间占了 —— 放过去会两套时间叠在一起
 *       （实测确实重叠，和首页 cam-tile、播放器是同一个坑）。
 *    ② 左下也不行：移动端左下角有固定的汉堡按钮（.fab-menu），
 *       卡片滚动经过时会把时间戳压住（实测 overlap=true）。
 *    右下是唯一既避开 OSD、又避开 FAB 的角落。
 */
.cam-card__refresh {
  position: absolute; bottom: var(--space-3); left: var(--space-3);
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.15);
  cursor: pointer; transition: all .2s; z-index: 2; padding: 0;
}
.cam-card__refresh:hover {
  background: rgba(0,0,0,.85); color: #fff; border-color: rgba(255,255,255,.35);
  transform: scale(1.08);
}
.cam-card__refresh.is-spinning svg,
.cam-card__refresh.is-spinning {
  animation: spin 1s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.cam-card__time {
  position: absolute; bottom: var(--space-3); right: var(--space-3);
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  color: #fff; font-size: var(--text-sm); font-variant-numeric: tabular-nums;
}
.rec-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--danger); flex: 0 0 auto;
  animation: dot-pulse 2s var(--ease-out) infinite;
}

/* 右上：在线状态。用语义色点 + 文字，与首页 cam-tile 的徽章一致。 */
.cam-card__status {
  position: absolute; top: var(--space-3); right: var(--space-3);
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 9px; border-radius: 999px;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  color: #fff; font-size: var(--text-sm); white-space: nowrap;
}
.cam-card__status.is-offline {
  background: color-mix(in srgb, var(--warning) 26%, rgba(0,0,0,.6));
  color: #ffd79a;
}

/* .cam-card__badges 已废弃：属性标签挪到卡片底部与标题同行。
   保留空规则会造成"改了不生效"的误解，故直接删除。 */

/* 离线空状态（UI-SPEC §2 的 variant="offline"）
   规范要求：橙图标 + 最后在线时间。
   ⚠️ **不放「重连」按钮** —— 已核实后端没有唤醒离线设备的能力
   （grep 无 reconnect/wakeup 接口），放一个点了没用的按钮
   就是重犯云台那次"半成品 UI"的错误。
   等真的有能力了再加，并且要加在能生效的地方。 */
.cam-card__off {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-2); text-align: center; color: var(--text-secondary);
  padding: 0 var(--space-4);
}
.cam-card__off .icon { color: var(--warning); }
.cam-card__off-title { font-size: var(--text-lg); color: var(--warning); }
.cam-card__off-sub { font-size: var(--text-base); color: var(--text-muted); }
/* 最后在线时间用等宽数字，扫一眼能比较各台设备 */
.cam-card__off-sub b { color: var(--text-secondary); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }

/* ⚠️ align-items 必须是 center。
   原来用 flex-start：info 块有两行（标题 + 时间），图标按钮只有一行，
   顶部对齐会让图标落在第一行的高度上，而标题文字块的中心偏下 ——
   实测标题中心 524 vs 图标中心 527，差 3px，看起来图标"飘"在上面
   （用户反馈「标题比图标矮一点」）。改为 center 后两者中心对齐。 */
.cam-card__foot {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-4);
}
/* 列表视图下预览图较高，仍用顶部对齐更自然 */
.cam-grid--list .cam-card__foot { align-items: center; }
.cam-card__info { flex: 1; min-width: 0; }
.cam-card__row {
  display: flex; align-items: center; gap: var(--space-2);
  min-width: 0;
}
.cam-card__name {
  font-size: var(--text-lg); font-weight: var(--weight-medium);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cam-card__en {
  font-size: var(--text-base); color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto;
}
.cam-card__meta {
  font-size: var(--text-base); color: var(--text-muted);
  margin-top: 3px; padding-left: 19px;   /* 对齐状态点右侧 */
}
.cam-card__fav { margin-top: -2px; }
.cam-card__fav.is-active { color: var(--accent); }
.cam-card__fav.is-active:hover { color: var(--accent-hover); background: var(--surface-2); }


/* ==========================================================================
   LIVE — 实时预览（对齐效果图）
   ========================================================================== */

.page__inner--wide { max-width: none; }

/* 面包屑 */
.crumbs {
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-base); color: var(--text-muted);
  margin-bottom: var(--space-4);
}
.crumbs a { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.crumbs a:hover { color: var(--accent); }
.crumbs__sep { display: inline-flex; color: var(--text-muted); opacity: .6; }
.crumbs__cur { color: var(--text); }

/* 布局：左侧列表 + 右侧播放器 */
.live-wrap {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: var(--space-5);
  align-items: start;
}
@media (max-width: 1000px) { .live-wrap { grid-template-columns: 1fr; } }

/* ---- 左侧摄像头列表 ---- */
.live-side {
  display: flex; flex-direction: column; gap: var(--space-2);
  max-height: calc(100vh - 276px);
  overflow-y: auto;
  padding-right: 2px;
}

/* 当前摄像头信息面板：填满左栏下方空白，同时有实用价值 */
.live-info {
  margin-top: var(--space-2);
  padding: var(--space-4);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.live-info__title { font-size: var(--text-sm); color: var(--text-muted); }
.live-info__name {
  font-size: var(--text-lg); font-weight: var(--weight-medium);
  margin-top: 4px; line-height: 1.3;
  word-break: break-all;
}
.live-info__name em { font-style: normal; color: var(--text-muted); font-size: var(--text-base); }
.live-info__rows { margin-top: var(--space-4); display: flex; flex-direction: column; gap: 7px; }
.live-info__row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--text-base); color: var(--text-muted);
}
.live-info__row b { color: var(--text-secondary); font-weight: var(--weight-normal); font-variant-numeric: tabular-nums; }
.live-info__row b.is-online { color: var(--online); }
.live-info__acts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-4); }

@media (max-width: 1000px) {
  .live-side { flex-direction: row; max-height: none; overflow-x: auto; }
}

.live-item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-2);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  text-align: left;
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.live-item:hover { border-color: var(--border-strong); background: var(--surface-2); }
/* 选中态加强（用户反馈：蓝色描边 + 12% 蓝底与未选中几乎看不出区别）。
   三处一起改，让"选中"一眼可辨：更亮的底 + 更粗的描边 + 左侧色条。 */
.live-item.is-active {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 22%, var(--surface-1));
  box-shadow: inset 3px 0 0 var(--accent);
}
.live-item.is-active .live-item__name { color: var(--text); font-weight: var(--weight-medium); }
.live-item.is-offline { opacity: .62; }

.live-item__thumb {
  flex: 0 0 68px; width: 68px; height: 48px;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12; display: block;
}
.live-item__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.live-item.is-offline .live-item__thumb img { filter: grayscale(1) brightness(.4); }

.live-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.live-item__row { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.live-item__name {
  font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.live-item__en {
  font-size: var(--text-sm); color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.live-item__off { font-size: var(--text-sm); color: var(--text-muted); }

/* ---- 播放器容器 ---- */
.live-main { min-width: 0; }

.player-wrap {
  position: relative;
  width: 100%;                 /* 占满可用宽度（原来 max-height 把宽度也压窄了） */
  aspect-ratio: 16 / 9;
  max-height: calc(100vh - 276px);
  margin: 0;
  border-radius: var(--radius-xl);
  overflow: hidden;
  background: #000;
  box-shadow: var(--shadow-lg);
}
.player-wrap:fullscreen { border-radius: 0; max-height: none; aspect-ratio: auto; height: 100vh; }
.player-wrap .player { position: absolute; inset: 0; aspect-ratio: auto; max-height: none; border-radius: 0; margin: 0; }

/* ---- 顶部浮层 ---- */
/*
 * ⚠️ 布局要点（2026-10-12）：
 * 小米摄像头**自己在画面左上角烧录了时间水印**（如 "2026/10/11 19:22:19"），
 * 那是视频流里的像素，前端去不掉。原来我们把「片段 …」徽章也放左上角，
 * 于是两套时间直接叠在一起，都看不清。
 *
 * 现在：左侧徽章**下移到水印下方**（padding-top 留出 OSD 高度），
 * 右上角放播放进度。三个信息各占一块，互不遮挡。
 */
.player__top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 4;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--space-3);
  /* 顶部留 44px 给摄像头自带 OSD，避免与它重叠 */
  padding: 44px var(--space-4) var(--space-8);
  background: linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,0));
  pointer-events: none;
}
.player__top > * { pointer-events: auto; }

.player__badges { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.pb {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border-radius: var(--radius-md);
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
  color: #fff; font-size: var(--text-sm); white-space: nowrap;
}
.pb__en { color: rgba(255,255,255,.6); }
.pb--live { background: rgba(59,130,246,.9); font-weight: var(--weight-semibold); letter-spacing: .03em; }

.player__meta { display: flex; align-items: center; gap: var(--space-2); }
.pm__time {
  font-size: var(--text-sm); color: rgba(255,255,255,.85);
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,.6);
}
.pm__chip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
  color: #fff; font-size: var(--text-sm); font-weight: var(--weight-medium);
}

/* ---- 云台浮层 ---- */
.ptz-float {
  position: absolute; right: var(--space-4); top: 50%; transform: translateY(-50%);
  z-index: 5; width: 148px;
  padding: var(--space-4) var(--space-3);
  border-radius: var(--radius-lg);
  background: rgba(16,20,27,.88); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.08);
  text-align: center;
}
@media (max-width: 1100px) { .ptz-float { display: none; } }

.ptz-float__title {
  font-size: var(--text-base); color: var(--text); margin-bottom: var(--space-3);
  display: flex; flex-direction: column; gap: 1px;
}
.ptz-float__title span { font-size: var(--text-xs); color: var(--text-muted); letter-spacing: .06em; }

.ptz-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 4px;
  width: 108px; margin: 0 auto;
  aspect-ratio: 1;
}
.ptz-pad__btn {
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.06);
  color: var(--text-secondary);
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ptz-pad__btn:hover { background: rgba(255,255,255,.14); color: var(--text); }
.ptz-pad__btn:active { background: var(--accent); color: #fff; }
.ptz-pad__btn--up    { grid-area: 1 / 2; }
.ptz-pad__btn--left  { grid-area: 2 / 1; }
.ptz-pad__btn--center{ grid-area: 2 / 2; }
.ptz-pad__btn--right { grid-area: 2 / 3; }
.ptz-pad__btn--down  { grid-area: 3 / 2; }
.ptz-pad__dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-muted);
}
.ptz-pad__btn--center:hover .ptz-pad__dot { background: var(--text); }

.ptz-float__presets { margin-top: var(--space-4); }
.ptz-float__label { font-size: var(--text-sm); color: var(--text-muted); }
.ptz-float__nums { display: flex; gap: 6px; justify-content: center; margin-top: var(--space-2); }
.ptz-num {
  width: 30px; height: 26px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.06); color: var(--text-secondary);
  font-size: var(--text-sm);
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ptz-num:hover { background: rgba(255,255,255,.14); color: var(--text); }
.ptz-num.has-preset { color: var(--accent); background: color-mix(in oklab, var(--accent) 18%, transparent); }

.ptz-float__info { margin-top: var(--space-3); font-size: var(--text-xs); color: var(--text-muted); }

/* ---- 底部工具栏（播放器内）---- */
.player__bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3);
  margin: var(--space-4);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-lg);
  background: rgba(16,20,27,.86); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.07);
  transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity, transform;
}
/* 工具栏自动隐藏：鼠标静止 2.5 秒后平滑下滑淡出，彻底消灭遮挡画面痛点 */
.player-wrap.is-idle .player__bar {
  opacity: 0;
  transform: translateY(14px);
  pointer-events: none;
}
/* 鼠标正悬停在工具栏上或正在选择画质/比例/镜头时，保持常驻 */
.player-wrap.is-idle .player__bar:hover,
.player-wrap.is-idle .player__bar:focus-within {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
/* 全屏模式下静止时隐藏鼠标光标 */
.player-wrap.is-idle:fullscreen {
  cursor: none;
}
.player-wrap.is-idle:fullscreen .player__bar {
  cursor: default;
}
.player__bar-l, .player__bar-r { display: flex; align-items: center; gap: var(--space-1); }
@media (max-width: 900px) { .player__bar-r { display: none; } }

.pbar-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: var(--text-base);
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.pbar-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
@media (max-width: 640px) { .pbar-btn span { display: none; } }

/* 纯图标按钮（静音等，没有文字标签） */
.pbar-btn--icon { padding: 0 var(--space-2); }
.pbar-btn.is-off { color: var(--text-muted); opacity: .6; }

/* 工具栏内部分组竖线：把「设置类下拉」与「显示类按钮」分开。
   工具栏控件较多（画质/镜头/比例/画中画/全屏），没有分隔时是一整排，
   看不出分组（用户反馈 #4）。 */
.pbar-sep {
  width: 1px; height: 18px; flex: 0 0 auto;
  margin: 0 var(--space-2);
  background: rgba(255,255,255,.14);
}
@media (max-width: 640px) { .pbar-sep { display: none; } }

.pbar-sel {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  transition: background var(--duration-fast) var(--ease-out);
}
.pbar-sel:hover { background: rgba(255,255,255,.1); }
.pbar-sel .icon { flex: 0 0 auto; }
.pbar-sel select {
  background: transparent; border: 0; outline: none;
  color: inherit; font-size: var(--text-base); font-family: inherit;
  cursor: pointer; padding-right: 2px;
  -webkit-appearance: none; appearance: none;
}
.pbar-sel select option { background: var(--surface-2); color: var(--text); }

/* ---- 状态条 ---- */
.live-status {
  display: flex; align-items: center; gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  font-size: var(--text-base); color: var(--text-secondary);
  flex-wrap: wrap;
}
.ls__name { color: var(--text); font-weight: var(--weight-medium); }
.ls__name em { font-style: normal; font-weight: var(--weight-normal); color: var(--text-muted); }
.ls__sep { width: 1px; height: 14px; background: var(--border); flex: 0 0 auto; }
.ls__item { display: inline-flex; align-items: center; gap: 6px; }
.ls__right { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); }
@media (max-width: 700px) { .ls__sep, .ls__right { display: none; } }


/* 实时预览：收紧间距，减少空白 */
.page__inner--wide .crumbs { margin-bottom: var(--space-3); }
.page__inner--wide .list-head { margin-bottom: var(--space-3); }
.page__inner--wide .live-status { margin-top: var(--space-3); }

/* .cam-card__del 已废弃（2026-10-12）：删除入口统一收进「⋯」更多菜单，
   不再只在离线卡片上单独露出。保留选择器无意义，直接删除。 */
.cam-card__foot .icon-btn { flex: 0 0 auto; }
.cam-card__more { color: var(--text-muted); }
.cam-card__more:hover { color: var(--text); background: var(--surface-2); }

/* ===== 摄像头卡片「更多操作」菜单 ===== */
.cam-menu {
  position: fixed; z-index: 70;
  min-width: 176px;
  padding: var(--space-2);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  animation: menu-in .14s var(--ease-out);
}
.cam-menu__head {
  padding: var(--space-2) var(--space-3) var(--space-3);
  font-size: var(--text-sm); color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: var(--space-1);
}
.cam-menu__item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text); font-size: var(--text-base);
  text-align: left;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.cam-menu__item .icon { color: var(--text-muted); flex: 0 0 auto; }
.cam-menu__item:hover { background: var(--surface-2); }
.cam-menu__item.is-danger { color: var(--danger); }
.cam-menu__item.is-danger .icon { color: var(--danger); }
.cam-menu__item.is-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }


/* ==========================================================================
   EVENTS — 事件中心（对齐效果图）
   ========================================================================== */

.list-head__stat {
  font-size: var(--text-base); color: var(--text-muted);
  padding-top: 10px; white-space: nowrap;
}
.list-head__stat b { color: var(--text); font-size: var(--text-lg); font-weight: var(--weight-semibold); }

/* 筛选行（用户反馈第 3 条：做出层次，不要 5 个控件一样重）
   · 日期选择器是最常用的调整项 -> 强调色描边
   · 搜索是核心功能 -> 更宽
   · 下拉选择器收窄，让视觉重心落在日期与搜索上 */
.ev-filters {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-4); flex-wrap: wrap;
}
.ev-sel { width: auto; min-width: 112px; }
.ev-search { width: 320px; flex: 1 1 200px; max-width: 380px; }
@media (max-width: 800px) { .ev-search { width: 100%; max-width: none; } }
/* 注意：.ev-range 的完整样式在文件后面（筛选栏那一节），不要在这里重复定义 */

/* ===== 近 7 天事件趋势（用户反馈第 5 条）===== */
.ev-trend {
  padding: var(--space-4) var(--space-5) var(--space-3);
  margin-bottom: var(--space-4);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
}
.ev-trend__head {
  display: flex; align-items: baseline; gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.ev-trend__title {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text);
}
.ev-trend__title .icon { color: var(--text-muted); }
.ev-trend__sum { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); }
.ev-trend__sum b { color: var(--text); font-weight: var(--weight-semibold); }

.ev-trend__chart {
  display: grid; gap: var(--space-2);
  grid-template-columns: repeat(7, minmax(0, 1fr));
  align-items: end;
}
.ev-trend__col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 0;
}
.ev-trend__n {
  font-size: var(--text-xs); color: var(--text-muted);
  font-variant-numeric: tabular-nums; height: 14px; line-height: 14px;
}
.ev-trend__barwrap {
  display: flex; align-items: flex-end; justify-content: center;
  width: 100%; height: 46px;
  border-bottom: 1px solid var(--border-subtle);
}
.ev-trend__bar {
  width: 60%; max-width: 26px; min-height: 2px;
  border-radius: 3px 3px 0 0;
  background: var(--surface-3);
  transition: height var(--duration-normal) var(--ease-out);
}
.ev-trend__bar.is-on { background: var(--accent); }
.ev-trend__bar.is-on.is-today { background: color-mix(in srgb, var(--accent) 65%, #fff); }
.ev-trend__x {
  font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap;
}
.ev-trend__x.is-today { color: var(--accent); font-weight: var(--weight-medium); }

/* 按天分组 */
.ev-group { margin-bottom: var(--space-6); }
.ev-group__head {
  display: flex; align-items: baseline; gap: var(--space-3);
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border-subtle);
}
.ev-group__label { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.ev-group__n { font-size: var(--text-base); color: var(--text-muted); }

.ev-group__items { display: flex; flex-direction: column; gap: var(--space-3); }

/* 事件卡片 */
.ev-card {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.ev-card:hover { border-color: var(--border-strong); background: var(--surface-2); }

.ev-card__thumb {
  position: relative; flex: 0 0 152px;
  width: 152px; aspect-ratio: 16/9;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12;
}
.ev-card__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ev-card__ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.ev-card__dur {
  position: absolute; right: 6px; bottom: 6px;
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff;
  font-size: var(--text-xs); font-variant-numeric: tabular-nums;
}
@media (max-width: 700px) { .ev-card__thumb { flex-basis: 110px; width: 110px; } }

.ev-card__body { flex: 1; min-width: 0; }
.ev-card__row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.ev-card__time {
  font-size: var(--text-lg); font-weight: var(--weight-medium);
  font-variant-numeric: tabular-nums;
}
.ev-card__conf { font-size: var(--text-sm); color: var(--text-muted); }
.ev-card__dev {
  font-size: var(--text-base); color: var(--text-secondary); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-card__desc {
  font-size: var(--text-sm); color: var(--text-muted); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ev-card__acts { display: flex; align-items: center; gap: var(--space-2); flex: 0 0 auto; }
@media (max-width: 700px) { .ev-card__acts { display: none; } }

/* 类型徽章 */
.ev-badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 10px;
  border-radius: 999px;
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  white-space: nowrap;
}
.ev-badge .icon { flex: 0 0 auto; }
.ev-badge.is-person  { background: rgba(59,130,246,.16);  color: #60a5fa; }
.ev-badge.is-vehicle { background: rgba(245,158,11,.16);  color: #fbbf24; }
.ev-badge.is-package { background: rgba(168,85,247,.16);  color: #c084fc; }
.ev-badge.is-motion  { background: rgba(148,163,184,.16); color: #94a3b8; }
.ev-badge.is-online  { background: rgba(34,197,94,.16);   color: #4ade80; }
.ev-badge.is-offline { background: rgba(239,68,68,.16);   color: #f87171; }

/* 更多菜单 */
.ev-menu { display: flex; flex-direction: column; gap: 2px; }
.ev-menu__item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: var(--text-base);
  text-align: left;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ev-menu__item:hover { background: var(--surface-2); color: var(--text); }
.ev-menu__item.is-danger { color: var(--danger); }
.ev-menu__item.is-danger:hover { background: rgba(239,68,68,.12); }


/* 摄像头列表页头右侧（按钮 + 日期） */
.list-head__acts {
  display: flex; align-items: center; gap: var(--space-4);
  flex: 0 0 auto;
}
@media (max-width: 700px) { .list-head__acts .list-head__date { display: none; } }


/* ==========================================================================
   GRID — 多路预览（对齐效果图）
   ========================================================================== */

/* 布局：左宫格 + 右设备面板 */
.grid-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1100px) { .grid-wrap { grid-template-columns: 1fr; } }

.ggrid {
  display: grid; gap: var(--space-3);
  grid-auto-rows: 1fr;
  min-height: calc(100vh - 372px);
}
.ggrid--1 { grid-template-columns: 1fr; }
.ggrid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ggrid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ggrid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1400px) { .ggrid--4 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 1000px) { .ggrid--3, .ggrid--4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 700px)  { .ggrid { grid-template-columns: 1fr !important; } }

.gtile {
  position: relative;
  min-height: 0;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: #0a0d12;
  cursor: pointer;
  border: 1px solid var(--border-subtle);
  transition: border-color var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-out);
}
.gtile:hover { border-color: var(--border-strong); }
.gtile.is-focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.gtile.is-dragging { opacity: .45; }
.gtile.is-over { border-color: var(--accent); border-style: dashed; }
.gtile--empty {
  border: 1.5px dashed var(--border-subtle);
  background: rgba(255, 255, 255, 0.02);
  display: flex;
  align-items: center;
  justify-content: center;
}
.gtile--empty:hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, transparent);
}
.gtile__tip {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 4px;
}

.gtile img { width: 100%; height: 100%; object-fit: cover; display: block; }

.gtile__time {
  position: absolute; top: var(--space-3); right: var(--space-3);
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  color: #fff; font-size: var(--text-sm); font-variant-numeric: tabular-nums;
}

.gtile__foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-6) var(--space-4) var(--space-3);
  background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0));
  color: #fff;
}
.gtile__info { flex: 1; min-width: 0; }
.gtile__name {
  font-size: var(--text-base); font-weight: var(--weight-medium);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gtile__name em { font-style: normal; color: rgba(255,255,255,.6); font-size: var(--text-sm); }
.gtile__meta { font-size: var(--text-sm); color: rgba(255,255,255,.65); margin-top: 1px; }

.gtile__acts { display: flex; gap: 4px; flex: 0 0 auto; opacity: 0; transition: opacity var(--duration-fast); }
.gtile:hover .gtile__acts { opacity: 1; }
.gtile__btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.14); color: #fff;
  transition: background var(--duration-fast) var(--ease-out);
}
.gtile__btn:hover { background: rgba(255,255,255,.28); }

.gtile__focusbar {
  position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: var(--accent);
}

/* 工具栏 */
.gbar {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-4);
  padding: var(--space-2) var(--space-3);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  flex-wrap: wrap;
}
.gbar__btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: var(--text-base);
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.gbar__btn:hover { background: var(--surface-2); color: var(--text); }
.gbar__btn.is-active { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--accent); }

.gbar__sel {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  transition: background var(--duration-fast) var(--ease-out);
}
.gbar__sel:hover { background: var(--surface-2); }
.gbar__sel select {
  background: transparent; border: 0; outline: none;
  color: inherit; font-size: var(--text-base); font-family: inherit;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.gbar__sel select option { background: var(--surface-2); color: var(--text); }
.gbar__right { margin-left: auto; font-size: var(--text-base); color: var(--text-muted); }

/* 右侧「可选设备」面板 */
.gd-panel {
  display: flex; flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  max-height: calc(100vh - 300px);
}
@media (max-width: 1100px) { .gd-panel { max-height: none; } }

.gd-panel__head {
  display: flex; align-items: baseline; gap: var(--space-2);
  padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
}
.gd-panel__title { font-size: var(--text-base); font-weight: var(--weight-medium); }
.gd-panel__title em { font-style: normal; color: var(--text-muted); font-weight: var(--weight-normal); }
.gd-panel__count { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); }

.gd-panel__search { margin: var(--space-3) var(--space-3) 0; }

.gd-panel__list { flex: 1; overflow-y: auto; padding: var(--space-2); }

.gd-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2);
  border-radius: var(--radius-md);
  transition: background var(--duration-fast) var(--ease-out);
}
.gd-item:hover { background: var(--surface-2); }
.gd-item.is-added { background: color-mix(in oklab, var(--accent) 8%, transparent); }

.gd-item__thumb {
  flex: 0 0 56px; width: 56px; aspect-ratio: 16/9;
  border-radius: var(--radius-sm); overflow: hidden;
  background: #0a0d12; display: block;
}
.gd-item__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gd-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.gd-item__name {
  font-size: var(--text-base); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gd-item__en { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gd-item__status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--text-muted); }

.gd-item__btn {
  flex: 0 0 auto;
  height: 26px; padding: 0 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  background: var(--accent); color: #fff;
  transition: opacity var(--duration-fast) var(--ease-out);
}
.gd-item__btn:hover { opacity: .88; }
.gd-item__btn.is-del { background: var(--surface-3); color: var(--text-secondary); }
.gd-item__btn.is-del:hover { background: var(--surface-hover); color: var(--text); }

.gd-panel__hint {
  display: flex; align-items: center; gap: 6px;
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--border-subtle);
  font-size: var(--text-xs); color: var(--text-muted);
}

/* 宫格里的离线占位 */
.gtile__off {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-2); color: var(--text-muted);
}

/* 分段按钮里带文字时不换行 */
.segmented__btn { white-space: nowrap; }
.segmented__btn .icon { flex: 0 0 auto; }


/* 只有一台时铺满整块 */
.ggrid--1 { grid-template-columns: 1fr; }


/* ==========================================================================
   AI 设置区（设置页）
   ========================================================================== */

.ai-warn {
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-4);
  background: rgba(245,158,11,.10);
  border: 1px solid rgba(245,158,11,.3);
  border-radius: var(--radius-lg);
  color: var(--warning);
  font-size: var(--text-base);
}
.ai-warn .icon { flex: 0 0 auto; margin-top: 1px; }
.ai-warn__sub { color: var(--text-muted); margin-top: 4px; font-size: var(--text-sm); line-height: 1.6; }

.ai-grid {
  margin-top: var(--space-5);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}

.ai-actions {
  display: flex; align-items: center; gap: var(--space-3);
  margin-top: var(--space-5);
  flex-wrap: wrap;
}
.ai-result {
  font-size: var(--text-base); color: var(--text-secondary);
  min-width: 0;
}

.ai-models {
  margin-top: var(--space-5);
  padding: var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-lg);
}
.ai-models__title {
  font-size: var(--text-base); color: var(--text-secondary);
  margin-bottom: var(--space-3);
}
.ai-model {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) 0;
}
.ai-model + .ai-model { border-top: 1px solid var(--border-subtle); }
.ai-model__name { font-size: var(--text-base); min-width: 90px; }
.ai-model__meta { font-size: var(--text-sm); color: var(--text-muted); flex: 1; }
.ai-models__hint {
  margin-top: var(--space-3); font-size: var(--text-xs); color: var(--text-muted);
  font-family: var(--font-mono, monospace);
}

.ai-foot {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
  font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6;
}
.ai-foot b { color: var(--online); }

/* AI 类名标签（事件卡片） */
.ev-card__ai {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--text-xs); color: var(--text-muted);
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: var(--surface-3);
}


/* ==========================================================================
   PLAYBACK — 回放（左日历 + 右播放器 + 时间轴 + 文件列表）
   ========================================================================== */

.pb-wrap {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: var(--space-5);
  align-items: start;
}
@media (max-width: 1000px) { .pb-wrap { grid-template-columns: 1fr; } }

/* 左侧日历 */
.pb-side {
  display: flex; flex-direction: column; gap: var(--space-2);
  max-height: calc(100vh - 240px); overflow-y: auto;
}
.pb-side__title {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-base); color: var(--text-secondary);
  padding: 0 var(--space-1) var(--space-2);
}

/* ===== 真正的月历（用户反馈第 2 条）===== */
.pb-cal { display: flex; flex-direction: column; gap: var(--space-3); }
.pb-mcal {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
}
.pb-mcal__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-2);
}
.pb-mcal__title { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text); }
.pb-mcal__nav {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-muted); background: transparent;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.pb-mcal__nav:hover { background: var(--surface-3); color: var(--text); }

.pb-mcal__wk {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px; margin-bottom: 2px;
}
.pb-mcal__wk span {
  text-align: center; font-size: var(--text-xs); color: var(--text-muted);
  padding: 2px 0;
}
.pb-mcal__grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.pb-mcal__pad { display: block; }
.pb-mcal__day {
  position: relative; aspect-ratio: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-secondary);
  font-size: var(--text-sm); font-variant-numeric: tabular-nums;
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.pb-mcal__day:disabled { color: var(--text-muted); opacity: .38; cursor: default; }
.pb-mcal__day.has-rec { color: var(--text); cursor: pointer; }
.pb-mcal__day.has-rec:hover { background: var(--surface-3); }
/* 录像量分档：越多越实 */
.pb-mcal__day.lv1 { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pb-mcal__day.lv2 { background: color-mix(in srgb, var(--accent) 26%, transparent); }
.pb-mcal__day.lv3 { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.pb-mcal__day.has-rec:hover { background: color-mix(in srgb, var(--accent) 50%, transparent); }
.pb-mcal__day.is-today .pb-mcal__d { color: var(--accent); font-weight: var(--weight-semibold); }
.pb-mcal__day.is-active {
  outline: 2px solid var(--accent); outline-offset: -2px;
  background: color-mix(in srgb, var(--accent) 30%, transparent);
}
.pb-mcal__d { line-height: 1; }
.pb-mcal__dot {
  width: 3px; height: 3px; border-radius: 50%;
  background: currentColor; opacity: .7;
}

.pb-mcal__sum {
  display: flex; flex-direction: column; gap: 5px;
  padding: var(--space-3);
  background: var(--surface-2);
  border-radius: var(--radius-lg);
}
.pb-mcal__sum-row {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: var(--text-sm); color: var(--text-muted);
}
.pb-mcal__sum-row b { color: var(--text); font-weight: var(--weight-medium); }

/* .pb-day 已废弃（月历取代了纵向日期卡片列表），保留选择器以免旧缓存页面错位 */

.pb-rec-on, .pb-rec-off {
  display: flex; align-items: center; gap: 6px;
  margin-top: var(--space-2); padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md); font-size: var(--text-sm);
}
.pb-rec-on  { color: var(--danger); background: rgba(239,68,68,.10); }
.pb-rec-off { color: var(--text-muted); background: var(--surface-2); }

/* 录制中的呼吸红点（强化实时感） */
.pb-rec-pulse {
  width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
  background: var(--danger);
  animation: recPulse 1.6s var(--ease-out) infinite;
}
@keyframes recPulse {
  0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.6); }
  70%  { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
  100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
}
@media (prefers-reduced-motion: reduce) { .pb-rec-pulse { animation: none; } }

/* 右侧主区 */
.pb-main { min-width: 0; }
.pb-main .player-wrap { max-height: calc(100vh - 380px); }
#recVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  cursor: pointer;
}

/* 播放器缓冲与加载动画遮罩 */
.player__loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  z-index: 3;
  pointer-events: none;
}
.player__spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255, 255, 255, 0.16);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
.player__loading-text {
  font-size: var(--text-sm);
  color: #fff;
  font-weight: var(--weight-medium);
  letter-spacing: 0.5px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}
.pbar-btn--play {
  background: var(--accent);
  color: #fff !important;
  font-weight: var(--weight-medium);
}
.pbar-btn--play:hover {
  background: var(--accent-hover);
  color: #fff !important;
}

/* 播放器工具栏排版调整（内嵌进度条 + 底部操作） */
.pb-main .player__bar {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
}
.player__bar-bot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.player__scrub-wrap {
  width: 100%;
  padding: 4px 0 2px 0;
  cursor: pointer;
}
.player__scrub-track {
  position: relative;
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  overflow: hidden;
  transition: height var(--duration-fast) var(--ease-out);
}
.player__scrub-wrap:hover .player__scrub-track {
  height: 6px;
}
.player__scrub-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 999px;
  pointer-events: none;
}

/* 时间轴 / 事件标记带（用户反馈第 4 条） */
.pb-timeline {
  display: none !important;
}

.pb-marks {
  padding: var(--space-3) var(--space-4);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.pb-marks__label {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-sm); color: var(--text-muted);
  margin-bottom: var(--space-3);
}
.pb-marks__track {
  position: relative; height: 10px; border-radius: 999px;
  background: var(--surface-3);
}
.pb-marks__fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 55%, transparent);
  pointer-events: none;
  transition: width 120ms linear;
}
/* 事件标记点：叠在进度条上，点击跳到该时刻 */
.pb-mark {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--surface-1);
  background: var(--warning);
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out);
  z-index: 2;
}
.pb-mark:hover { transform: translate(-50%, -50%) scale(1.45); }
.pb-mark--person  { background: var(--accent); }
.pb-mark--vehicle { background: #a855f7; }
.pb-mark--package { background: #14b8a6; }
.pb-mark--motion  { background: var(--warning); }
.pb-mark--offline { background: var(--text-muted); }

/* 文件列表（横向卡片） */
.pb-files {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  margin-top: var(--space-4);
}

.pb-file {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  text-align: left;
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.pb-file:hover { border-color: var(--border-strong); background: var(--surface-2); }
.pb-file > .icon, .pb-file__icon { color: var(--text-muted); flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
.pb-file.is-active > .icon, .pb-file.is-active .pb-file__icon { color: var(--accent); }

.pb-file__thumb {
  position: relative;
  flex: 0 0 76px; width: 76px; aspect-ratio: 16/9;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12; display: block;
}
.pb-file__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 正在播放的缩略图上叠一个跳动的小均衡器（用户反馈第 3 条） */
.pb-file__playing {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 2px; padding-bottom: 5px;
  background: rgba(0,0,0,.42);
}
.pb-file__playing span {
  width: 3px; border-radius: 1px; background: #fff;
  animation: pbEq 900ms var(--ease-out) infinite;
}
.pb-file__playing span:nth-child(1) { height: 7px;  animation-delay: 0ms; }
.pb-file__playing span:nth-child(2) { height: 12px; animation-delay: 150ms; }
.pb-file__playing span:nth-child(3) { height: 8px;  animation-delay: 300ms; }
@keyframes pbEq {
  0%, 100% { transform: scaleY(.45); }
  50%      { transform: scaleY(1); }
}
@media (prefers-reduced-motion: reduce) {
  .pb-file__playing span { animation: none; }
}

.pb-file__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pb-file__name {
  font-size: var(--text-base); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pb-file__meta { font-size: var(--text-sm); color: var(--text-muted); }


/* ==========================================================================
   AI INTELLIGENCE — AI 智能页（4 个 Tab）
   ========================================================================== */

/* 横向 Tab 线 */
.tabs-line {
  display: flex; align-items: center; gap: var(--space-1);
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: var(--space-5);
}
.tabline {
  position: relative;
  padding: 10px var(--space-4);
  color: var(--text-secondary);
  font-size: var(--text-base); font-weight: var(--weight-medium);
  transition: color var(--duration-fast) var(--ease-out);
}
.tabline:hover { color: var(--text); }
/* 注意：不要改 font-weight —— 会让激活项宽度变化，
   导致每次切 Tab 相邻项左右跳动。用颜色 + 下划线表达选中即可。 */
.tabline.is-active { color: var(--accent); }
.tabline::after {
  content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: -1px;
  height: 2px; background: transparent; border-radius: 2px;
  transition: background var(--duration-fast) var(--ease-out);
}
/* 选中态加强（用户反馈第 8 条）：
   原来只有 2px 细线 + 变色，和顶部主导航的下划线相比不够醒目。
   现在加高到 3px + 柔光，并给整项一层极淡的底色，层级更明确。 */
.tabline.is-active {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
}
.tabline.is-active::after {
  background: var(--accent);
  height: 3px;
  box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent);
}

/* 概览统计 */
/* 注意：.ai-stats 的完整定义在本文件后面（「4 张统计卡」那一节）。
   这里曾有一份重复定义（断点 900px），被后面的（断点 1000px）覆盖，
   属于死代码 —— 已删除（2026-10-12）。
   同一选择器定义两次，改了一处却不生效，是本项目踩过的坑。 */

/* 注意：.ai-stat 的完整定义在本文件后面（卡片样式那一节）。
   这里曾有一份重复定义（padding: space-4 / radius-lg），
   被后面的（space-4 space-5 / radius-xl）完全覆盖，属于死代码 ——
   已删除（2026-10-12，卡片规范统一时发现）。
   同一选择器定义两次会让"改了一处却不生效"，是本项目踩过的坑。 */

.ai-stat__icon {
  width: 38px; height: 38px; flex: 0 0 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-stat__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ai-stat__label { font-size: var(--text-sm); color: var(--text-muted); }
.ai-stat__val { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.1; }

/* 说明块 */
.ai-note { padding: 0 var(--space-5) var(--space-5); }
.ai-note__sub { margin-top: 6px; font-size: var(--text-base); color: var(--text-muted); line-height: 1.7; }
.ai-note b { color: var(--accent); }

/* 搜索框 */
.ai-search-box { display: flex; gap: var(--space-3); padding: 0 var(--space-5); }
.ai-search-box__input { flex: 1; }
@media (max-width: 700px) { .ai-search-box { flex-direction: column; } }

.ai-examples {
  display: flex; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-4) var(--space-5) 0;
}
.ai-examples .chip { cursor: pointer; }

.ai-hint {
  padding: var(--space-4) var(--space-5);
  font-size: var(--text-sm); color: var(--text-muted); line-height: 1.7;
}
.ai-hint b { color: var(--text-secondary); }

/* 回答块 */
.ai-answer {
  margin: var(--space-4) var(--space-5) 0;
  padding: var(--space-4);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface-2));
  border: 1px solid color-mix(in oklab, var(--accent) 24%, transparent);
  border-radius: var(--radius-lg);
}
.ai-answer__head { display: flex; align-items: center; gap: 6px; font-size: var(--text-base); color: var(--text); }
.ai-answer__head b { color: var(--accent); }
.ai-answer__q { margin-top: 6px; font-size: var(--text-sm); color: var(--text-muted); }

.ai-empty {
  padding: var(--space-8) var(--space-5);
  text-align: center; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
}
.ai-empty__sub { font-size: var(--text-sm); }

.ai-err {
  margin: var(--space-4) var(--space-5);
  padding: var(--space-3) var(--space-4);
  background: rgba(239,68,68,.10); border-radius: var(--radius-md);
  color: var(--danger); font-size: var(--text-base);
}

/* 调查页占位 */
.ai-soon {
  padding: var(--space-6) var(--space-5);
  display: flex; flex-direction: column; align-items: center;
  gap: var(--space-3); text-align: center;
  color: var(--text-muted);
}
.ai-soon__title { font-size: var(--text-lg); color: var(--text); }
.ai-soon__desc { font-size: var(--text-base); max-width: 460px; line-height: 1.7; }
.ai-soon__desc b { color: var(--text-secondary); }
.ai-soon__facts { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-2); }
.ai-fact { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-base); }
.ai-fact.is-ok { color: var(--online); }
.ai-fact.is-warn { color: var(--warning); }
.ai-fact.is-bad { color: var(--danger); }
.ai-soon__note { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }
.ai-soon__note b { color: var(--text-secondary); }

/* 能力状态表 */
.ai-rows { padding: 0 var(--space-5) var(--space-4); }
.ai-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-base);
}
.ai-row:last-child { border-bottom: 0; }
.ai-row__label { color: var(--text-muted); }
.ai-row__val {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text-secondary);
}
.ai-row__val.is-ok { color: var(--online); }
.ai-row__val.is-warn { color: var(--warning); }
.ai-row__val.is-bad { color: var(--danger); }


/* ==========================================================================
   AI INTELLIGENCE — AI 智能页（4 Tab，对齐效果图）
   ========================================================================== */

/* ---- 通用：两栏布局 ---- */
.ai-row2 {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  /* 等高：两栏内容量不同，start 会让矮的一侧下面空一大片 */
  align-items: stretch;
  margin-top: var(--space-5);
}
@media (max-width: 1100px) { .ai-row2 { grid-template-columns: 1fr; } }
/* 全局 .card + .card{margin-top:20px} 在多列网格里会把右侧卡片推下去 20px —— 网格内清零。
   ⚠️ 这是**反复踩的坑**：每新增一个并排网格容器，都要记得加进这个列表。
   2026-10-13 又漏了 .home-cols —— 首页「最近事件」与「存储」两张卡起点差 20px，
   header 高度其实完全一致（实测都是 60px），错位纯粹来自这条外边距。 */
.ai-row2 > .card + .card,
.ai-set-grid > .card + .card,
.st-row--2 > .card + .card,
.acct-side > .card + .card,
.home-cols > .card + .card,
.dev-tools > .dev-tool + .dev-tool { margin-top: 0; }

/* 两栏高度不同会留出空白：让卡片等高，缩略图区/列表区吃掉剩余高度 */
.ai-row2 > .card { display: flex; flex-direction: column; }
.ai-row2 > .card > .ai-thumbs, .ai-row2 > .card > .ai-process { flex: 1; align-content: start; }
/* 摘要卡只有 4 张缩略图，卡片被右栏拉高后会空一片：让缩略图铺成 2 行、每张更高 */
.ai-row2 .ai-thumbs { grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-4); align-content: center; }
.ai-row2 .ai-thumb { height: 100%; min-height: 120px; }
.ai-row2 .ai-thumb img { height: 100%; }

/* 自动分析卡紧贴在统计卡下面（实测间距 0）：补上和其它区块一致的 20px */
#aiAutoCard { margin-top: var(--space-5); }

/* ---- 4 张统计卡 ---- */
.ai-stats {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(4, 1fr);
}
@media (max-width: 1000px) { .ai-stats { grid-template-columns: repeat(2, 1fr); } }

.ai-stat {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  text-align: left; width: 100%;
  transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
}
.ai-stat:hover { border-color: var(--border-strong); background: var(--surface-2); }

/* 需关注：只有真的有需要关注的事才着色。
   JS 现在仅在值 > 0 时加 is-watch —— 0 表示一切正常，橙色会误导。 */
.ai-stat.is-watch .ai-stat__icon {
  color: var(--warning);
  background: color-mix(in srgb, var(--warning) 14%, var(--surface-3));
}
.ai-stat.is-watch .ai-stat__val { color: var(--warning); }
/* 值为 0 的「需关注」用中性色，并给个低调的绿点表示「无需关注」 */
.ai-stat:not(.is-watch) .ai-stat__val { color: var(--text); }

/* ===== 冷启动引导（用户反馈第 1 条）===== */
.ai-guide {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  margin-bottom: var(--space-5);
  background: color-mix(in srgb, var(--accent) 7%, var(--surface-1));
  border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--border-subtle));
  border-radius: var(--radius-xl);
}
.ai-guide__icon {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.ai-guide__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ai-guide__title { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text); }
.ai-guide__desc { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.6; }
@media (max-width: 700px) {
  .ai-guide { flex-wrap: wrap; }
  .ai-guide__body { flex: 1 1 100%; order: 2; }
  .ai-guide > .btn { order: 3; width: 100%; }
}

/* 统一的 AI 空状态块（用户反馈第 5 条） */
.ai-stat__icon {
  width: 42px; height: 42px; flex: 0 0 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-stat__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-stat__label { font-size: var(--text-base); color: var(--text-secondary); }
.ai-stat__val { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.1; }
.ai-stat__chev { color: var(--text-muted); flex: 0 0 auto; }

/* ---- 今日摘要 ---- */
.ai-summary {
  padding: 0 var(--space-5) var(--space-4);
  font-size: var(--text-base); color: var(--text-secondary); line-height: 1.7;
}
.ai-thumbs {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(4, 1fr);
  padding: 0 var(--space-5) var(--space-5);
}
@media (max-width: 900px) { .ai-thumbs { grid-template-columns: repeat(2, 1fr); } }
/* 空状态必须**跨满整行** —— 否则在 4 列网格里只会占第一个格子。
   （原来这条写在 .ai-thumbs__empty 里；统一到 emptyState() 之后，
     通用 .empty 没有 grid-column，必须在这里补上，否则是布局回归。） */
.ai-thumbs > .empty { grid-column: 1 / -1; }

.ai-thumb {
  position: relative; display: block;
  aspect-ratio: 16/9;
  border-radius: var(--radius-md); overflow: hidden;
  background: #0a0d12; cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out);
}
.ai-thumb:hover { transform: translateY(-2px); }
.ai-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-thumb__time {
  position: absolute; top: 6px; right: 6px;
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.66); color: #fff;
  font-size: var(--text-xs); font-variant-numeric: tabular-nums;
}
.ai-thumb__foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 5px;
  padding: var(--space-4) 8px 6px;
  background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
  color: #fff; font-size: var(--text-xs);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ai-thumb__foot em { font-style: normal; color: rgba(255,255,255,.6); }
.ai-thumb__date {
  position: absolute; left: 6px; top: 6px;
  padding: 1px 6px; border-radius: var(--radius-sm);
  background: rgba(59,130,246,.85); color: #fff; font-size: var(--text-xs);
}
/* ---- AI 处理情况 ---- */
/* 卡片被右栏拉高后，环图与漏斗居中，别贴顶留白 */
.ai-row2 .ai-process { flex: 1; align-items: center; justify-content: center; gap: var(--space-5); }
.ai-row2 .ai-process__ring { flex: 0 0 132px; }
.ai-row2 .ai-ring { width: 132px; height: 132px; }
.ai-process { display: flex; align-items: center; gap: var(--space-5); padding: 0 var(--space-5) var(--space-4); }
.ai-process__ring { flex: 0 0 118px; }
.ai-ring { width: 118px; height: 118px; }
.ai-ring__val { font-size: var(--text-2xl); font-weight: var(--weight-semibold); fill: var(--text); }
.ai-ring__label { font-size: var(--text-xs); fill: var(--text-muted); }
/* 轨道与填充：与首页 .stat-ring **同一套视觉规范**
   （轨道 --border-strong 满不透明、填充圆头、线宽 11）。
   原来这两处颜色写在 JS 里且用了 --surface-3，几乎看不见。 */
.ai-ring__track { stroke: var(--border-strong); stroke-width: 11; }
/* 空状态的虚线轨道也要**看得见**（用户反馈：外圈与背景太接近）。
   保留虚线以示"暂无数据"，但颜色改用与首页环相同的 --border-strong ——
   原来用 --surface-3(#1b212a)，与卡片底 #12171e 几乎同色。 */
.ai-ring__track.is-dashed { stroke-dasharray: 4 7; stroke-linecap: round; stroke: var(--border-strong); }
.ai-ring__fill { stroke: var(--accent); stroke-width: 11; stroke-linecap: round; }

/* 0% 空状态：不画进度弧，只用虚线轨道 + 「暂无数据」。
   原来 0% 会在正上方留一个孤立圆点（stroke-linecap:round 的起点），
   看起来像加载中/卡死（用户反馈第 3 条）。 */
.ai-ring.is-zero .ai-ring__val { fill: var(--text-muted); font-size: var(--text-xl); }

.ai-process__funnel { flex: 1; min-width: 0; }

/* 费用单列一行（不属于事件漏斗的环节） */
.ai-process__cost {
  display: flex; align-items: center; gap: 6px;
  padding: 0 var(--space-5) var(--space-4);
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-process__cost b { color: var(--text); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.ai-process__cost .icon { color: var(--text-muted); }

/* ===== AI 处理漏斗（用户反馈第 5 条）===== */
/* 用宽度递减 + 箭头表达「本地分析 → 过滤 → 上云」的减法关系，
   取代原来平铺的 4 行指标（用户看不出「本地已过滤」与「队列跳过」的区别）。 */
.ai-funnel { display: flex; flex-direction: column; gap: 6px; }
.ai-funnel--empty {
  flex-direction: row; align-items: center; gap: 8px;
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-funnel--empty .icon { flex: 0 0 auto; }

.ai-funnel__head {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-sm); color: var(--text-muted);
  margin-bottom: 2px;
}
.ai-funnel__step {
  display: flex; flex-direction: column; gap: 4px;
  padding: var(--space-2) var(--space-3);
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
}
.ai-funnel__row {
  display: flex; align-items: center; gap: 8px;
  width: 100%; min-width: 0;
}
.ai-funnel__ic {
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 24px;
}
.ai-funnel__step.is-local .ai-funnel__ic { background: rgba(30,136,229,.16); color: #1e88e5; }
.ai-funnel__step.is-cloud .ai-funnel__ic { background: rgba(168,85,247,.16); color: #a855f7; }

.ai-funnel__label {
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  color: var(--text);
}
.ai-funnel__val {
  margin-left: auto; font-size: var(--text-base); font-weight: var(--weight-semibold);
  color: var(--text); font-variant-numeric: tabular-nums;
}
.ai-funnel__step.is-local .ai-funnel__val { color: var(--accent); }
.ai-funnel__step.is-cloud .ai-funnel__val { color: #a855f7; }

.ai-funnel__bar {
  display: block; height: 4px; width: 100%;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
  margin: 2px 0;
}
.ai-funnel__bar-fill {
  display: block; height: 100%; width: var(--w, 0%);
  border-radius: 999px;
  transition: width var(--duration-normal) var(--ease-out);
}
.ai-funnel__step.is-local .ai-funnel__bar-fill { background: var(--accent); }
.ai-funnel__step.is-cloud .ai-funnel__bar-fill { background: #a855f7; }

.ai-funnel__sub { font-size: var(--text-xs); color: var(--text-muted); padding-left: 2px; }

/* 中间的「分流」说明 */
.ai-funnel__split {
  display: flex; align-items: center; gap: 6px;
  padding-left: var(--space-3);
  font-size: var(--text-xs); color: var(--text-muted);
}
.ai-funnel__split .icon { color: var(--warning); flex: 0 0 auto; }
.ai-funnel__split b { color: var(--warning); font-weight: var(--weight-medium); }

.ai-funnel__foot {
  margin-top: 2px; font-size: var(--text-xs); color: var(--text-muted);
}
.ai-funnel__foot b { color: var(--text-secondary); font-weight: var(--weight-medium); }

/* 旧的平铺指标行（ai-prow / ai-process__list）已随漏斗上线移除，
   相关规则一并删除，避免留下死代码。 */

.ai-row2 .ai-delta { margin-top: auto; }
.ai-delta {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: var(--space-3) var(--space-5) var(--space-4);
  font-size: var(--text-base);
}
.ai-delta.is-down { color: var(--online); }
.ai-delta.is-up { color: var(--warning); }
.ai-delta__sub { flex-basis: 100%; font-size: var(--text-sm); color: var(--text-muted); }

/* ---- 最近 AI 事件 ---- */
.ai-recent {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(4, 1fr);
  padding: 0 var(--space-5) var(--space-5);
}
@media (max-width: 1100px) { .ai-recent { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .ai-recent { grid-template-columns: 1fr; } }

.ai-rcard {
  display: flex; flex-direction: column;
  border-radius: var(--radius-lg); overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out);
}
.ai-rcard:hover { border-color: var(--border-strong); }
.ai-rcard.is-watch { border-color: color-mix(in oklab, var(--warning) 40%, transparent); }

.ai-rcard__img { position: relative; aspect-ratio: 16/9; background: #0a0d12; }
.ai-rcard__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-rcard__dur {
  position: absolute; top: 6px; right: 6px;
  padding: 1px 7px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-xs);
}
.ai-rcard__foot {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-3) 4px;
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-rcard__time { color: var(--text); font-variant-numeric: tabular-nums; }
.ai-rcard__dev { display: inline-flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-rcard__chev { margin-left: auto; flex: 0 0 auto; }
.ai-rcard__tag {
  display: flex; align-items: center; gap: 6px;
  padding: 6px var(--space-3) var(--space-3);
  font-size: var(--text-base); color: var(--text-secondary);
}
.ai-rcard__tag.is-watch { color: var(--warning); }

/* ---- 搜索 / 调查 的定位说明（用户反馈第 6 条）---- */
/* 两个 Tab 都是「自然语言输入框 + 示例问题」，外观太像容易混淆。
   这块横幅用**颜色 + 图标 + 一行定位**把差别钉死：
     搜索 = 蓝（即时、免费、查已有记录）
     调查 = 紫（多步推理、有成本、给证据链）                        */
.ai-intro {
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin: var(--space-5) var(--space-5) 0;
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: var(--surface-2);
}
.ai-intro__ic {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.ai-intro__ic.is-search {
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
/* 调查入口不再用紫色（第三强调色）。
   按用户指示：与「搜索」的区别落在**图标与文案**上，不落在色相上 ——
   两者同为主色蓝底，调查用 layers（层叠/多步）图标，搜索用放大镜。 */
.ai-intro__ic.is-investigate {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
}
.ai-intro__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ai-intro__title {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text);
}
.ai-intro__badge {
  padding: 1px 8px; border-radius: 999px;
  font-size: var(--text-xs); font-weight: var(--weight-normal);
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
/* 「多步推理 · 有成本」标签 —— 收进语义体系（用户反馈：紫色与整体不搭）。
   用**中性蓝灰**而不是强调色：它是"说明性标签"，不该抢输入框的焦点；
   橙/红会被读成"出问题了"，而"有成本"只是提示，不是警告。 */
.ai-intro__badge.is-cost {
  background: var(--surface-3);
  color: var(--text-secondary);
}
.ai-intro__desc { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.6; }
.ai-intro__desc b { color: var(--text); font-weight: var(--weight-medium); }

/* 搜索页底部指路到「调查」 */
.ai-intro__cross {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  margin: 0 var(--space-5) var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-intro__link {
  display: inline-flex; align-items: center; gap: 3px;
  color: var(--accent);   /* 收进主色系：不再用第三强调色（用户指示） */ font-size: var(--text-sm);
}
.ai-intro__link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---- 搜索 ---- */
/* ============================================================================
   ai-stage：搜索/调查页的**沉浸式容器**（2026-10-13）
   ----------------------------------------------------------------------------
   用户反馈：原来外层套一张大卡片，里面再套搜索框、一排胶囊、一行小字 ——
   "卡片套卡片"，视觉太碎太重，输入框的焦点被稀释。

   现代 AI 问答界面（ChatGPT / Claude / Spotlight）的做法是：
   页面本身即内容容器，不额外套盒子；输入框是**唯一视觉中心**。
   所以这里刻意**没有背景、没有边框、没有 padding 包装** ——
   只保留纵向节奏，让子元素直接落在页面上。
   ============================================================================ */
.ai-stage {
  display: flex; flex-direction: column;
  gap: var(--space-4);
  max-width: 1040px;      /* 适度行宽，在大屏下不局促也不过分拉伸 */
  width: 100%;
  margin: 0 auto;
}

/* ai-stage 在设置页里的引导行（原 card__head 的替代） */
.ai-stage__lead {
  font-size: var(--text-sm); color: var(--text-muted);
  line-height: 1.6;
}
.ai-stage__lead--row {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3); flex-wrap: wrap;
}
.ai-stage__lead .sec-head__more { position: relative; }

/* 输入框是这一页的**唯一视觉中心**（拆掉外层卡片后更明显）。
   padding 去掉了左右内缩 —— 原来它靠外层卡片的 padding 定位。 */
.ai-searchbox {
  display: flex; gap: var(--space-3);
  padding: 0;
}
.ai-searchbox__field {
  flex: 1; display: flex; align-items: center; gap: var(--space-3);
  height: 56px; padding: 0 var(--space-5);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  color: var(--text-muted);
  transition: border-color var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
}
/* 聚焦：一圈淡淡的蓝光（用户要求）—— 让"正在输入"有明确反馈 */
.ai-searchbox__field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
/* 打字机 placeholder 比较长（「小狗今天经过车位几次？」），
   窄屏下让省略号生效，不要把输入框撑变形。 */
.ai-searchbox__input::placeholder {
  text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
}
.ai-searchbox__input {
  flex: 1; min-width: 0; background: none; border: 0; outline: none;
  color: var(--text); font-size: var(--text-lg); font-family: inherit;
}
.ai-searchbox__clear {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.ai-searchbox__clear:hover { background: var(--surface-3); color: var(--text); }
.ai-searchbox__go { height: 52px; padding: 0 var(--space-6); font-size: var(--text-lg); }
@media (max-width: 700px) { .ai-searchbox { flex-direction: column; } }

.ai-examples {
  display: flex; align-items: center; gap: var(--space-2);
  flex-wrap: wrap; padding: 0;   /* 拆掉外层卡片后不再需要左右内缩 */
  font-size: var(--text-base); color: var(--text-muted);
}
/* 示例问题：胶囊边框本来就有，但**背景透明** ——
   实测 border 有、bg = rgba(0,0,0,0)，所以视觉上只是"灰色文字"，
   用户看不出可以点（反馈）。补浅色底 + hover/active 三级反馈。 */
.ai-example {
  padding: 6px var(--space-4);
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-secondary); font-size: var(--text-base);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}
.ai-example:hover {
  border-color: var(--accent); color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--surface-2));
}
.ai-example:active { background: color-mix(in srgb, var(--accent) 18%, var(--surface-2)); }
/* 窄屏：胶囊改单列铺满，点击热区更大（原本是 inline 宽度，
   长问句如「小狗今天经过车位几次？」在 375px 下会换行且右侧留白不齐）。 */
@media (max-width: 700px) {
  .ai-examples { flex-direction: column; align-items: stretch; gap: var(--space-2); }
  .ai-examples__label { margin-bottom: var(--space-1); }
  .ai-example {
    width: 100%; text-align: left; min-height: 44px;
    display: flex; align-items: center;
  }
}

/* AI 回答 */
.ai-answer { margin: 0 var(--space-5) var(--space-5); }
.ai-answer__head {
  display: flex; align-items: center; gap: var(--space-2);
