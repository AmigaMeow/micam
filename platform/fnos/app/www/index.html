// stopGrid 离开多路预览时停掉资源。
//
// 注意：网格的刷新定时器是局部变量，外部清不掉，
// 所以这里做两件能做的事：
//   1. 清掉网格里的 img/video 的 src（断掉 MJPEG/HLS 连接，这是最占资源的）
//   2. 清掉可能挂在全局上的定时器
//
// 这段是防御性实现 —— 之前 stopGrid 被调用但从未定义，
// 导致每次点导航都抛 ReferenceError，整个导航失效。
function stopGrid(){
  // 1) 清掉全局定时器（有就清）
  try {
    if(typeof gridTimer !== 'undefined' && gridTimer){ clearInterval(gridTimer); gridTimer = null; }
    if(typeof patrolTimer !== 'undefined' && patrolTimer){ clearInterval(patrolTimer); patrolTimer = null; }
  } catch(e){}

  // 2) 断掉网格里的媒体连接
  var box = document.getElementById('gridBody') || document.getElementById('content');
  if(box){
    Array.prototype.forEach.call(box.querySelectorAll('.gtile img, .gtile video'), function(el){
      try { if(el.tagName === 'VIDEO'){ el.pause(); } el.removeAttribute('src'); el.src = ''; } catch(e){}
    });

  Array.prototype.forEach.call(document.querySelectorAll('.gtile.is-focus'), function(el){
    el.classList.remove('is-focus');

// ===== 云台控制 =====
function ptzStatus(){
  var info = $("#ptzInfo");
  if(!currentDid) return;
  if(info) info.textContent = "云台：查询中…";

  var timeoutId = setTimeout(function(){
    if(info) info.textContent = "云台：查询超时";
  }, 8000);

  api("/api/ptz/status?did="+encodeURIComponent(currentDid)).then(function(r){
    clearTimeout(timeoutId);
    if(!info) return;
    // ⚠️ 两套坐标系（2026-10-13 实测）：
    //   miIO(siid=6 piid=12) -> 步进计数 x/y（如 1170/49），只读、不驱动电机
    //   cs2  operation=1     -> 角度 angle/elevation，但【会让镜头转动】
    //
    // 所以查询一律走 miIO；只有 miIO 失败时才退到 cs2 角度，
    // 并在提示里标明来源，避免用户以为镜头自己跑了。
    if(r.source === "miio" && typeof r.x === "number"){
      info.textContent = "云台：水平 " + r.x + " / 俯仰 " + r.y + "（步进）";
    } else if(typeof r.angle === "number" && r.angle !== null){
      info.textContent = "云台：水平 " + r.angle + "° / 俯仰 " + r.elevation + "°";
    } else {
      info.textContent = "云台：位置不可用";
    }
  }).catch(function(e){
    clearTimeout(timeoutId);
    if(info) info.textContent = "云台：查询失败（" + e.message + "）";
  });
}

// ===== 云台方向键 =====
//
// ⚠️ 性能教训（2026-09-18 用户反馈「点几下要等好久」）
//
// 原实现每条命令都做了这些事：
//   ① img.src = ""              断开视频
//   ② 命令执行                   2~3 秒（闭环绕路）
//   ③ setTimeout 1500ms          等摄像头释放连接
//   ④ startLive()                视频重连（冷启动约 5 秒）
//   => 一次点击 ≈ 9 秒！
//
// 而且所有按钮在整个过程被禁用，用户感觉「卡死」。
//
// 现在改成：
//   · 方向步进【不再断流】—— 单步命令很短，让视频自己抖动一下即可
//     只有预置位跳转（大范围移动）才值得断流
//   · 乐观反馈：点击立即高亮 + 显示「移动中…」，不等后端
//   · 连点合并：300ms 内的同方向点击累积，逐个发送但 UI 始终可点
//   · 只禁用被点的那个按钮，不禁用整组

var ptzBusy = false;
var ptzQueued = [];       // 待发送的方向键

function ptzMove(op, dir){
  if(op === 5){
    console.error("[ptz] 严禁发送 operation 5 (硬件巡航/校准)");
    return;
  }
  // 乐观反馈：立即让用户看到响应
  var info = $("#ptzInfo");
  var key = dir || ("op" + op);
  if(info) info.textContent = "云台：移动中…";

  // 高亮被点的按钮
  var el = document.querySelector('[data-ptz][data-dir="' + key + '"]');
  if(el){ el.classList.add("is-active"); setTimeout(function(){ el.classList.remove("is-active"); }, 600); }

  ptzQueued.push(op);
  if(!ptzBusy) ptzFlush();
}

// ptzFlush 串行发送排队的命令（保证同一设备同时只有一条 PTZ 命令）
function ptzFlush(){
  if(ptzBusy || !ptzQueued.length) return;
  ptzBusy = true;

  var op = ptzQueued.shift();
  var info = $("#ptzInfo");
  var timeoutId = setTimeout(function(){
    ptzBusy = false;
    // 后端现在会在"连接被预览抢走"时自动重试最多 2 次，
    // 所以前端超时要从 8 秒放宽到 15 秒，否则会先于后端重试结束就报超时。
    if(info) info.textContent = "云台：超时（摄像头可能忙，请稍后重试）";
    ptzFlush();
  }, 15000);

  api("/api/ptz/move", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({did: currentDid, operation: op})
  }).then(function(r){
    clearTimeout(timeoutId);
    ptzBusy = false;
    if(info){
      if(r.ok){
        // 注意：这里用移动响应自带的 angle/elevation，
        // 【不要】再发一次 op=1 去查 —— 那会让镜头继续转。
        info.textContent = "云台：水平 " + r.angle + "° / 俯仰 " + r.elevation + "°"
          + (ptzQueued.length ? "（还有 " + ptzQueued.length + " 步）" : "");
      } else {
        // 之前直接拼 ret，后端返回错误对象（无 ret 字段）时就显示
        // "ret=undefined"，用户完全看不出原因。改为优先显示真实错误。
        // ⚠️ 后端的 writeErr 用的是 {"msg": "..."}（不是 error/message），
        // 所以这里必须一并检查 msg，否则又会退化成"无响应"。
        var why = (r && (r.msg || r.error || r.message))
          || (r && r.atLimit ? "已到行程极限"
          : (r && typeof r.ret !== "undefined" ? ("ret=" + r.ret) : "无响应"));
        info.textContent = "云台：失败（" + why + "）";
      }
    }
    ptzFlush();
  }).catch(function(e){
    clearTimeout(timeoutId);
    ptzBusy = false;
    if(info) info.textContent = "云台：失败（" + e.message + "）";
    ptzFlush();
  });
}

  // 自动播放
  if(recState.file){
    var seekInit = recState.pendingSeek;
    recState.pendingSeek = null;
    playRecFile(recState.file, seekInit);
  }
}

function renderRecordings(c){
  var hasCache = (recState.dates && recState.dates.length && recState.files && recState.files.length);
  if(hasCache){
    // SWR 极致体验：利用内存已有数据瞬间完成渲染（0毫秒无感切换）
    doRenderRecordingsUI(c, recState.__lastCfg || { Enabled: true });
  } else {
    c.innerHTML = '<div class="page__inner">' + loading('加载录像…') + '</div>';
  }

  Promise.all([
    api('/api/recordings'),
    api('/api/recordings/dates'),
    api('/api/recordings/list' + (recState.dev ? '?name=' + encodeURIComponent(recState.dev) : '')),
    loadDevices()
  ]).then(function(res){
    var cfg   = res[0].config || {};
    var dates = (res[1].dates) || [];
    var files = (res[2].files) || [];
    recState.__lastCfg = cfg;
    recState.dates = dates;
    recState.files = files;

    if(!hasCache){
      doRenderRecordingsUI(c, cfg);
    } else {
      // 后台静默刷新日历与时间轴，不阻断正在播放的画面与交互
      paintCalendar(c);
      paintTimeline24(c);
    }
  }).catch(function(e){
    if(!hasCache){
      c.innerHTML = '<div class="page__inner">' + errorCard(e, function(){ renderRecordings(c); }) + '</div>';
    }
  });
}

// paintCalendar 左侧录像日历
//
// 用户反馈第 2 条：原来只是一个纵向日期卡片列表 + 大片空白，
// 「录像日历」名不副实。现在改成**真正的月历**：
//   · 7 列日期网格，有录像的日期高亮 + 按录像量分档显示深浅
//   · 点任意有录像的日期即切换
//   · 下方补该月统计，把原来的空白利用起来
function paintCalendar(c){
  var box = document.getElementById('pbCal');
  if(!box) return;

  // 建索引：date -> {count, sizeMB}
  var byDate = {};
  (recState.dates || []).forEach(function(d){ byDate[d.date] = d; });

  if(!recState.dates.length){
    box.innerHTML = emptyState('quiet', { title:'暂无录像', desc:'开启录像后这里会出现日历', compact:true });
    return;
  }

  // 以当前选中日期（或最新有录像的日期）所在月份为基准
  var base = recState.date || recState.dates[0].date;
  var bp = (base || '').split('-');
  var y = parseInt(bp[0], 10), m = parseInt(bp[1], 10);   // m: 1-12
  if(!y || !m){ var nd = new Date(); y = nd.getFullYear(); m = nd.getMonth()+1; }

  var first = new Date(y, m-1, 1);
  var daysInMonth = new Date(y, m, 0).getDate();
  var lead = first.getDay();            // 周日=0，作为首列

  // 该月统计
  var monthPrefix = y + '-' + pad2(m);
  var mCount = 0, mSize = 0, mDays = 0;
  Object.keys(byDate).forEach(function(k){
    if(k.indexOf(monthPrefix) === 0){ mCount += byDate[k].count; mSize += byDate[k].sizeMB; mDays++; }
  });
  var maxCount = 0;
  Object.keys(byDate).forEach(function(k){ maxCount = Math.max(maxCount, byDate[k].count); });

  var todayKey = localDate();

  var cells = '';
  for(var i = 0; i < lead; i++) cells += '<span class="pb-mcal__pad"></span>';
  for(var d = 1; d <= daysInMonth; d++){
    var key = y + '-' + pad2(m) + '-' + pad2(d);
    var info = byDate[key];
    var cls = 'pb-mcal__day';
    if(info) cls += ' has-rec';
    if(key === recState.date) cls += ' is-active';
    if(key === todayKey) cls += ' is-today';
    // 录像量分档（1-3 档），用透明度表达多少
    var lvl = '';
    if(info && maxCount > 0){
      var r = info.count / maxCount;
      lvl = r > 0.66 ? ' lv3' : r > 0.33 ? ' lv2' : ' lv1';
    }
    cells += '<button class="' + cls + lvl + '"' + (info ? ' data-date="' + esc(key) + '"' : ' disabled')
      + ' title="' + esc(key) + (info ? '：' + info.count + ' 段 · ' + fmtSizeMB(info.sizeMB) : '：无录像') + '">'
      + '<span class="pb-mcal__d">' + d + '</span>'
      + (info ? '<span class="pb-mcal__dot"></span>' : '')
      + '</button>';
  }

  var prevM = m === 1 ? y-1 : y, prevMn = m === 1 ? 12 : m-1;
  var nextM = m === 12 ? y+1 : y, nextMn = m === 12 ? 1 : m+1;

  box.innerHTML = ''
    + '<div class="pb-mcal">'
    +   '<div class="pb-mcal__head">'
    +     '<button class="pb-mcal__nav" data-mcal="' + prevM + '-' + prevMn + '" type="button" title="上个月">'
    +       icon('chevron-left',14) + '</button>'
    +     '<span class="pb-mcal__title">' + y + '年' + m + '月</span>'
    +     '<button class="pb-mcal__nav" data-mcal="' + nextM + '-' + nextMn + '" type="button" title="下个月">'
    +       icon('chevron-right',14) + '</button>'
    +   '</div>'
    +   '<div class="pb-mcal__wk">'
    +     ['日','一','二','三','四','五','六'].map(function(w){ return '<span>' + w + '</span>'; }).join('')
    +   '</div>'
    +   '<div class="pb-mcal__grid">' + cells + '</div>'
    + '</div>'
    + '<div class="pb-mcal__sum">'
    +   '<div class="pb-mcal__sum-row"><span>本月录像</span><b>' + mDays + ' 天</b></div>'
    +   '<div class="pb-mcal__sum-row"><span>片段 / 占用</span><b>' + mCount + ' 段 · ' + fmtSizeMB(mSize) + '</b></div>'
    + '</div>';

  // 月份切换（只是换基准月，不改变已选日期）
  Array.prototype.forEach.call(box.querySelectorAll('[data-mcal]'), function(b){
    b.onclick = function(){
      var p = this.dataset.mcal.split('-');
      // 用该月第一天作为基准；若该月有录像则直接选中最近一天
      var yy = p[0], mm = pad2(parseInt(p[1],10));
      var cand = (recState.dates||[]).filter(function(x){ return x.date.indexOf(yy + '-' + mm) === 0; });
      if(cand.length) recState.date = cand[0].date;
      else recState.date = yy + '-' + mm + '-01';
      paintCalendar(c); paintFiles(c);
    };
  });
}

// paintTimeline 片段内的事件标记条（用户反馈第 4 条）
//
// 取证场景的关键需求：快速跳到「有动静的那几秒」。
// 原生 video 控件上方无法叠加内容，所以单独做一条标记带放在播放器下方，
// 位置与进度一一对应（百分比定位），点标记即跳转到该时刻。
//
// 数据来源：/api/events 按当前片段日期查。事件时间戳是绝对时间，
// 片段有 startTime，两者相减得到片段内偏移。
function paintTimeline(c){
  var box = document.getElementById('pbTimeline');
  if(!box) return;
  var f = curRecFileObj();
  if(!f || !f.startTime || !f.duration){ box.innerHTML = ''; return; }

  var segStart = new Date(String(f.startTime).replace(' ', 'T')).getTime();
  if(isNaN(segStart)){ box.innerHTML = ''; return; }
  var segEnd = segStart + Math.round(f.duration) * 1000;
  var day = String(f.startTime).slice(0, 10);

  // 事件类型 -> 标记点颜色类。
  // 用显式映射而不是拿 EV_TYPES[x].cls 去 replace('is-','')：
  // 后者拼出的是运行期字符串，静态检查器看不到，也容易在 cls 改名时静默失效。
  var MARK_CLS = { person:'person', vehicle:'vehicle', package:'package',
                   motion:'motion', online:'motion', offline:'offline' };

  function render(events){
    var marks = (events || []).map(function(e){
      var t = new Date(String(e.time).replace(' ', 'T')).getTime();
      if(isNaN(t) || t < segStart || t > segEnd) return null;
      var pct = (t - segStart) / (segEnd - segStart) * 100;
      var mk = MARK_CLS[e.type] || 'motion';
      return '<button class="pb-mark pb-mark--' + mk + '"'
        + ' style="left:' + pct.toFixed(2) + '%"'
        + ' data-seek="' + ((t - segStart) / 1000).toFixed(2) + '"'
        + ' title="' + esc(String(e.time).slice(11,19)) + ' · ' + esc(e.device || '') + (e.aiCls ? ' · ' + esc(e.aiCls) : '') + '">'
        + '</button>';
    }).filter(Boolean);

    box.innerHTML = '<div class="pb-marks">'
      + '<div class="pb-marks__label">' + icon('activity',12)
      +   (marks.length ? '本片段 ' + marks.length + ' 个事件' : '本片段无事件标记') + '</div>'
      + '<div class="pb-marks__track">'
      +   '<span class="pb-marks__fill" id="pbMarksFill"></span>'
      +   marks.join('')
      + '</div>'
      + '</div>';

    Array.prototype.forEach.call(box.querySelectorAll('[data-seek]'), function(b){
      b.onclick = function(){
        var v = document.getElementById('recVideo');
        if(!v) return;
        var s = parseFloat(this.dataset.seek) || 0;
        var curF = curRecFileObj();
        if(isStaticMP4Cache(v, curF ? curF.duration : 0)){
          try { v.currentTime = Math.min(s, v.duration - 0.2); } catch(err){}
          v.play().catch(function(){});
          updateTimeline24Needle();
        } else {
          if(curF) playRecFile(curF, s);
        }
      };
    });
  }

  // 事件数据可能已在别处加载；没有就按当天查一次（量小，可缓存）
  if(recState.evDay === day && recState.evCache){
    render(recState.evCache);
    return;
  }
  api('/api/events?days=1&limit=500').then(function(r){
    var list = (r.events || []).filter(function(e){ return String(e.time||'').slice(0,10) === day; });
    recState.evDay = day;
    recState.evCache = list;
    render(list);
  }).catch(function(){ render([]); });
}

// paintFiles 文件列表（按日期过滤）
function paintFiles(c){
  var box = document.getElementById('pbFiles');
  if(!box) return;
  var list = recState.files || [];
  if(recState.dev){
    list = list.filter(function(f){ return f.dev === recState.dev || f.name.indexOf(recState.dev) >= 0 || (f.device && f.device === recState.dev); });
  }
  if(recState.date){
    list = list.filter(function(f){ return f.date === recState.date; });
  }
  if(!list.length){
    box.innerHTML = empty('film','这天没有录像','换个日期，或在「存储」页检查录像设置','');
    return;
  }
  box.innerHTML = list.map(function(f){
    var on = (f.name === recState.file) && (!recState.activeDev || f.dev === recState.activeDev);
    var hm = (f.startTime||'').slice(11,16);
    var dur = Math.round(f.duration || 0);
    var devTag = (!recState.dev && f.dev) ? '<span class="pb-file__cam-badge">' + esc(f.dev.replace('小米室外摄像机', '')) + '</span>' : '';
    return '<button class="pb-file' + (on ? ' is-active' : '') + '" data-file="' + esc(f.name) + '" data-dev="' + esc(f.dev || '') + '"'
      + ' type="button" title="' + esc((f.dev ? f.dev + ' · ' : '') + f.name) + '">'
      + '<span class="pb-file__thumb">'
      +   '<img loading="lazy" src="' + apiUrl(f.thumbUrl) + '" alt="">'
      +   (on ? '<span class="pb-file__playing" aria-hidden="true"><span></span><span></span><span></span></span>' : '')
      +   devTag
      + '</span>'
      + '<span class="pb-file__body">'
      +   '<span class="pb-file__name">' + esc(hm) + '</span>'
      +   '<span class="pb-file__meta">' + fmtDur(dur) + ' · ' + fmtSizeMB(f.sizeMB) + '</span>'
      + '</span>'
      + '<span class="pb-file__icon">' + (on ? icon('pause', 15) : icon('play', 15)) + '</span>'
      + '</button>';
  }).join('');
}

// highlightActiveFile 轻量高亮活动片段，绝不摧毁并重建 280+ 个 DOM 节点与缩略图请求
function highlightActiveFile(fileName, devName){
  var box = document.getElementById('pbFiles');
  if(!box) return;
  var prev = box.querySelector('.pb-file.is-active');
  if(prev){
    prev.classList.remove('is-active');
    var pPlay = prev.querySelector('.pb-file__playing');
    if(pPlay) pPlay.remove();
    var pIcon = prev.querySelector('.pb-file__icon');
    if(pIcon) pIcon.innerHTML = icon('play', 15);
  }
  var sel = '[data-file="' + esc(fileName) + '"]';
  if(devName) sel += '[data-dev="' + esc(devName) + '"]';
  var cur = box.querySelector(sel) || box.querySelector('[data-file="' + esc(fileName) + '"]');
  if(cur){
    cur.classList.add('is-active');
    var thumb = cur.querySelector('.pb-file__thumb');
    if(thumb && !thumb.querySelector('.pb-file__playing')){
      var pSpan = document.createElement('span');
      pSpan.className = 'pb-file__playing';
      pSpan.setAttribute('aria-hidden', 'true');
      pSpan.innerHTML = '<span></span><span></span><span></span>';
      thumb.appendChild(pSpan);
    }
    var cIcon = cur.querySelector('.pb-file__icon');
    if(cIcon) cIcon.innerHTML = icon('pause', 15);
    // 保持用户视口锁定在上方主播放器画面，仅在 #pbFiles 容器内部平滑对齐，绝不让整个页面下跳
    var bRect = box.getBoundingClientRect();
    var cRect = cur.getBoundingClientRect();
    if(cRect.top < bRect.top || cRect.bottom > bRect.bottom){
      box.scrollTop += (cRect.top - bRect.top) - (bRect.height / 2) + (cRect.height / 2);
    }
  }
}

// setRecLoading 全局录像缓冲与加载状态提示
function setRecLoading(show, txt){
  var el = document.getElementById('recLoading');
  var tx = document.getElementById('recLoadingText');
  if(!el) return;
  if(tx && txt) tx.textContent = txt;
  el.style.display = show ? 'flex' : 'none';
}

// bindReplay 交互
function bindReplay(c){
  var calBox = document.getElementById('pbCal');
  if(calBox){
    calBox.onclick = function(e){
      var b = e.target.closest('[data-date]');
      if(!b) return;
      recState.date = b.dataset.date;
      paintCalendar(c);
      paintFiles(c);
      paintTimeline24(c);
      var df = (recState.files || []).filter(function(x){
        return (!recState.dev || x.dev === recState.dev || x.name.indexOf(recState.dev) >= 0 || (x.device && x.device === recState.dev)) &&
               (x.date === recState.date);
      });
      if(df.length){
        recState.file = df[0].name;
        highlightActiveFile(recState.file, df[0].dev);
        paintTimeline(c);
        playRecFile(df[0], 0);
        updateTimeline24Needle();
      }
    };
  }

  var filesBox = document.getElementById('pbFiles');
  if(filesBox){
    filesBox.onclick = function(e){
      var b = e.target.closest('[data-file]');
      if(!b) return;
      var fileObj = (recState.files || []).filter(function(x){
        return x.name === b.dataset.file &&
               (!b.dataset.dev || x.dev === b.dataset.dev) &&
               (!recState.date || x.date === recState.date);
      })[0] || findRecFileObj(b.dataset.file);
      if(fileObj){
        recState.file = fileObj.name;
        highlightActiveFile(fileObj.name, fileObj.dev);
        paintTimeline(c);
        playRecFile(fileObj, 0);
        updateTimeline24Needle();
      }
    };
  }

  var dv = document.getElementById('recDev');
  if(dv) dv.onchange = function(){ recState.dev = this.value; recState.file = null; renderRecordings(c); };

  var v = document.getElementById('recVideo');
  var bPlay = document.getElementById('btnPlayPause');

  function updatePlayBtn(){
    if(!bPlay || !v) return;
    var isPaused = v.paused;
    var ico = document.getElementById('btnPlayPauseIcon');
    var txt = document.getElementById('btnPlayPauseTxt');
    if(ico) ico.innerHTML = icon(isPaused ? 'play' : 'pause', 14);
    if(txt) txt.textContent = isPaused ? '播放' : '暂停';
  }
  if(v){
    v.onloadedmetadata = function(){ setRecLoading(false); restorePos(recState.file, v); updatePlayBtn(); };
    v.onloadeddata = function(){ setRecLoading(false); };
    v.addEventListener('loadstart', function(){ setRecLoading(true, '正在缓冲录像…'); });
    v.addEventListener('waiting', function(){ setRecLoading(true, '正在缓冲数据…'); });
    v.addEventListener('seeking', function(){ setRecLoading(true, '正在定位画面…'); });
    v.addEventListener('canplay', function(){ setRecLoading(false); });
    v.addEventListener('playing', function(){ setRecLoading(false); updatePlayBtn(); });
    v.addEventListener('pause', function(){ setRecLoading(false); updatePlayBtn(); });
    v.addEventListener('seeked', function(){ setRecLoading(false); });
    v.ontimeupdate = function(){
      if((v.currentTime > 0 || !v.paused) && v.videoWidth > 0){
        setRecLoading(false);
      }
      var streamOff = window._currentStreamOffset || 0;
      var curDisplayTime = streamOff + (v.currentTime || 0);
      var curF = curRecFileObj();
      var dur = (curF && curF.duration) ? curF.duration : (v.duration || 0);
      var t = document.getElementById('pbTime');
      if(t) t.textContent = fmtDur(curDisplayTime) + ' / ' + fmtDur(dur);
      var fill = document.getElementById('recScrubFill');
      if(fill && dur) fill.style.width = ((curDisplayTime / dur) * 100).toFixed(2) + '%';
      updateTimeline24Needle();
    };
    v.onended = function(){
      var curF = curRecFileObj();
      if(!curF) return;
      var curDate = recState.date || (curF.date || '');
      var curDev = recState.dev || (curF.dev || '');
      var list = (recState.files || []).filter(function(f){
        return (!curDev || f.dev === curDev || f.name.indexOf(curDev) >= 0 || (f.device && f.device === curDev)) &&
               (!curDate || f.date === curDate);
      });
      list.sort(function(a, b){ return timeToSec(a.startTime) - timeToSec(b.startTime); });
      var idx = -1;
      for(var i = 0; i < list.length; i++){
        if(list[i].name === curF.name && list[i].dev === curF.dev){ idx = i; break; }
      }
      if(idx >= 0 && idx + 1 < list.length){
        var nextF = list[idx + 1];
        recState.file = nextF.name;
        highlightActiveFile(nextF.name, nextF.dev);
        playRecFile(nextF, 0);
      } else {
        toast('当天录像已播放完毕', 'info');
      }
    };
    v.addEventListener('play', updatePlayBtn);
    v.addEventListener('pause', updatePlayBtn);
    v.onclick = function(){
      if(v.paused){ v.play().catch(function(){}); } else { v.pause(); }
    };
    if(bPlay){
      bPlay.onclick = function(){
        if(v.paused){ v.play().catch(function(){}); } else { v.pause(); }
      };
    }
    // 记忆播放位置
    v.addEventListener('pause', function(){ if(recState.file) savePos(recState.file, v.currentTime); });
    window.addEventListener('beforeunload', function(){ if(recState.file && v) savePos(recState.file, v.currentTime); });
  }

  var rsw = document.getElementById('recScrubWrap');
  if(rsw){
    rsw.onclick = function(e){
      if(!v) return;
      var curF = curRecFileObj();
      var totalDur = (curF && curF.duration > 0) ? curF.duration : (isFinite(v.duration) && v.duration > 0 ? v.duration : 0);
      if(totalDur <= 0) return;
      var rect = this.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      var targetSec = Math.max(0, Math.min(totalDur - 0.5, pct * totalDur));
      if(!isFinite(targetSec) || isNaN(targetSec)) return;

      // 若当前视频是完整静态 MP4 缓存，支持毫秒级 Range 寻道，绝不重置连接！
      if(isStaticMP4Cache(v, totalDur)){
        try { v.currentTime = Math.min(targetSec, v.duration - 0.2); } catch(err){}
        v.play().catch(function(){});
        updateTimeline24Needle();
        return;
      }

      // 未转码完成的实时分片流：必须向服务端重新请求 &t=targetSec 偏移流，绝不就地截断到未缓冲区域！
      if(curF) playRecFile(curF, targetSec);
    };
  }

  var sp = document.getElementById('recSpeed');
  if(sp) sp.onchange = function(){ if(v) v.playbackRate = parseFloat(this.value) || 1; };

  var bd = document.getElementById('btnDownload');
  if(bd) bd.onclick = function(){
    var f = curRecFileObj();
    if(!f){ toast('请先选择录像', 'warn'); return; }
    window.open(apiUrl(f.url.replace('/play?', '/download?')), '_blank');
  };

  var be = document.getElementById('btnExportClip');
  if(be) be.onclick = exportClip;

  var bf = document.getElementById('btnFull');
  if(bf) bf.onclick = function(){
    var w = document.querySelector('.player-wrap');
    var vid = document.getElementById('recVideo');
    toggleFullscreen(w, vid);
  };

  // ---- 逐帧（用户反馈第 4 条）----
  //
  // 浏览器 video 没有「上一帧/下一帧」API，标准做法是
  // 暂停 + 按 ~1/25 秒步进 currentTime。步长取 0.04s（25fps 近似），
  // 摄像头实测 20fps，所以 0.05s 更贴近；这里用 0.05。
  function stepFrame(dir){
    var v2 = document.getElementById('recVideo');
    if(!v2){ return; }
    if(!v2.paused) v2.pause();
    var step = 0.05;
    var nt = (v2.currentTime || 0) + dir * step;
    if(nt < 0) nt = 0;
    if(v2.duration && nt > v2.duration) nt = v2.duration;
    v2.currentTime = nt;
  }
  var fb = document.getElementById('btnFrameBack');
  if(fb) fb.onclick = function(){ stepFrame(-1); };
  var ff = document.getElementById('btnFrameFwd');
  if(ff) ff.onclick = function(){ stepFrame(1); };

  // 键盘 ←/→ 逐帧，空格播放/暂停（输入框内不拦截）
  document.addEventListener('keydown', function(e){
    if(page !== 'recordings') return;
    var tg = e.target || {};
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName || '')) return;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); stepFrame(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); stepFrame(1); }
    else if(e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      var v2 = document.getElementById('recVideo');
      if(v2){ if(v2.paused){ v2.play().catch(function(){}); } else { v2.pause(); } }
    }
  });

  // ---- 截图当前画面（用户反馈第 5 条）----
  // 用于举报/留证：把 video 当前帧画到 canvas 再下载为 PNG。
  var bs = document.getElementById('btnSnap');
  if(bs) bs.onclick = function(){
    var v3 = document.getElementById('recVideo');
    if(!v3 || !v3.videoWidth){ toast('画面还没准备好', 'warn'); return; }
    try {
      var cv = document.createElement('canvas');
      cv.width = v3.videoWidth; cv.height = v3.videoHeight;
      cv.getContext('2d').drawImage(v3, 0, 0, cv.width, cv.height);
      var f2 = curRecFileObj();
      var base = (f2 ? f2.name.replace(/\.mkv$/,'') : 'snapshot');
      var stamp = fmtDur(Math.round(v3.currentTime || 0)).replace(':','-');
      cv.toBlob(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = base + '_' + stamp + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        toast('已保存截图', 'ok');
      }, 'image/png');
    } catch(err){ toast('截图失败：' + err.message, 'err'); }
  };

  // ---- 静音切换 ----
  var bmute = document.getElementById('btnMute');
  if(bmute) bmute.onclick = function(){
    var v4 = document.getElementById('recVideo');
    if(!v4) return;
    v4.muted = !v4.muted;
    this.classList.toggle('is-off', v4.muted);
    this.title = v4.muted ? '取消静音' : '静音';
  };

  var bc = document.getElementById('btnClean');
  if(bc) bc.onclick = cleanupRecordings;

  var bm = document.getElementById('btnExportMgr');
  if(bm) bm.onclick = showExportManager;
}

function findRecFileObj(target){
  if(!target) return null;
  if(typeof target === 'object' && target.name && target.url) return target;
  var name = String(target);
  var list = recState.files || [];
  // 1. 严格匹配 dev + date + name
  var f = list.filter(function(x){
    var matchDev = !recState.dev || x.dev === recState.dev || (x.device && x.device === recState.dev);
    var matchDate = !recState.date || x.date === recState.date;
    return x.name === name && matchDev && matchDate;
  })[0];
  if(f) return f;
  // 2. 匹配 date + name
  f = list.filter(function(x){
    return x.name === name && (!recState.date || x.date === recState.date);
  })[0];
  if(f) return f;
  // 3. 匹配 dev + name
  f = list.filter(function(x){
    return x.name === name && (!recState.dev || x.dev === recState.dev || (x.device && x.device === recState.dev));
  })[0];
  if(f) return f;
  // 4. 兜底任意同名
  return list.filter(function(x){ return x.name === name; })[0] || null;
}

function curRecFileObj(){
  return findRecFileObj(recState.file);
}

function updateRecPlayBtn(){
  var bPlay = document.getElementById('btnPlayPause');
  var v = document.getElementById('recVideo');
  if(!bPlay || !v) return;
  var isPaused = v.paused;
  var ico = document.getElementById('btnPlayPauseIcon');
  var txt = document.getElementById('btnPlayPauseTxt');
  if(ico) ico.innerHTML = icon(isPaused ? 'play' : 'pause', 14);
  if(txt) txt.textContent = isPaused ? '播放' : '暂停';
}

var currentRecName = '';
var currentRecFile = null;

var recCachePollTimer = null;
var recLoadSeq = 0;

function isStaticMP4Cache(v, expectedDur){
  if(!v || !isFinite(v.duration) || v.duration <= 2) return false;
  var dur = expectedDur || 0;
  if(dur <= 0){
    var f = curRecFileObj();
    if(f && f.duration > 0) dur = f.duration;
  }
  if(dur <= 0) return true;
  return (Math.abs(v.duration - dur) < 25 || v.duration >= dur * 0.75);
}

function updateRecBadge(f){
  var t = document.getElementById('pbTitle');
  if(t && f){
    var st = f.startTime || '';
    var dur = Math.round(f.duration || 0);
    var range = st ? st.slice(11,16) : '';
    if(st && dur){
      var d0 = new Date(st.replace(' ', 'T'));
      if(!isNaN(d0)){
        var d1 = new Date(d0.getTime() + dur * 1000);
        var sameDay = d0.toDateString() === d1.toDateString();
        var hm = function(d){
          return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
        };
        var dp = function(d){ return (d.getMonth()+1) + '/' + d.getDate() + ' '; };
        range = (sameDay ? '' : dp(d0)) + hm(d0) + '–' + (sameDay ? '' : dp(d1)) + hm(d1);
      }
    }
    t.innerHTML = icon('play',13) + '片段 ' + esc(range) + ' <span class="pb__en">' + fmtDur(dur) + '</span>';
  }
  var pt = document.getElementById('pbTime');
  if(pt && f){
    var initSec = window._currentStreamOffset || 0;
    pt.textContent = fmtDur(initSec) + ' / ' + fmtDur(Math.round(f.duration || 0));
  }
}

// playRecFile 播放指定录像（瞬时秒开 + 绝对防止多摄像机/日期串段）
function playRecFile(target, seekSec){
  var v = document.getElementById('recVideo');
  var f = findRecFileObj(target);
  if(!v || !f) return;

  var thisLoadSeq = ++recLoadSeq;
  if(recCachePollTimer){
    clearTimeout(recCachePollTimer);
    recCachePollTimer = null;
  }

  recState.file = f.name;
  if(f.dev) recState.activeDev = f.dev;
  if(f.date) recState.date = f.date;
  currentRecFile = f.name;
  currentRecName = f.name;

  var devName = f.dev || recState.dev || '';
  var dateStr = f.date || recState.date || '';
  var targetKey = devName + '/' + dateStr + '/' + f.name;
  var doSeek = (typeof seekSec === 'number' && isFinite(seekSec) && seekSec >= 0);
  window._currentStreamOffset = (doSeek && seekSec > 0 ? seekSec : 0);

  updateRecBadge(f);

  var isSame = (window._currentRecKey === targetKey && v.src && v.src.indexOf(encodeURIComponent(f.name)) >= 0);

  if(isSame){
    if(doSeek){
      if(isStaticMP4Cache(v, f.duration)){
        setRecLoading(true, '正在定位画面…');
        var onSeekDone = function(){
          setRecLoading(false);
          v.removeEventListener('seeked', onSeekDone);
          v.play().catch(function(){});
          updateRecPlayBtn();
        };
        v.addEventListener('seeked', onSeekDone);
        window._currentStreamOffset = 0;
        try { v.currentTime = Math.min(seekSec, v.duration - 0.2); } catch(e){}
        updateTimeline24Needle();
        setTimeout(function(){ setRecLoading(false); }, 600);
        v.play().catch(function(){});
        return;
      }
      // 非完整静态缓存（实时分片流）：不能就地截断返回，必须继续往下向服务端发起带 &t= 偏移的新连接！
    } else {
      v.play().then(function(){
        setRecLoading(false);
        updateRecPlayBtn();
      }).catch(function(){
        setRecLoading(false);
        updateRecPlayBtn();
      });
      return;
    }
  }

  // 关键修复 1：立即暂停旧视频，彻底终结旧视频进度继续污染时间轴
  v.pause();
  window._currentRecKey = targetKey;

  setRecLoading(true, '正在载入画面…');

  // 构建播放 URL：若需跳转，向后端传递 t= 参数支持服务端毫秒级关键帧寻址
  var playUrl = f.url;
  if(doSeek && seekSec > 0){
    playUrl += '&t=' + encodeURIComponent(seekSec.toFixed(1));
  }
  var targetSrc = apiUrl(playUrl);

  function startDirectPlay(){
    if(recCachePollTimer){
      clearTimeout(recCachePollTimer);
      recCachePollTimer = null;
    }
    var readyHandled = false;
    function onPlayReady(){
      if(thisLoadSeq !== recLoadSeq || readyHandled) return;
      readyHandled = true;
      setRecLoading(false);
      updateRecPlayBtn();
      v.removeEventListener('canplay', onPlayReady);
      v.removeEventListener('playing', onPlayReady);
      v.removeEventListener('loadeddata', onPlayReady);
    }
    v.addEventListener('canplay', onPlayReady);
    v.addEventListener('playing', onPlayReady);
    v.addEventListener('seeked', onPlayReady);
    v.addEventListener('loadeddata', onPlayReady);

    var playRetries = 0;
    v.onerror = function(){
      if(thisLoadSeq !== recLoadSeq) return;
      var err = v.error;
      // 关键拦截：用户主动跳转、切换片段或浏览器中止请求 (MEDIA_ERR_ABORTED = 1 / code 20)，绝不重试也不遮罩！
      if(!v.src || !err || err.code === 1 || err.code === 20 || (err.message && err.message.indexOf('abort') >= 0)){
        return;
      }
      console.warn('[recordings] 播放遇到微小抖动 (code=' + err.code + ')，正在自愈连接…', err);
      playRetries++;

      if(playRetries <= 1){
        setRecLoading(true, '正在缓冲画面…');
        recCachePollTimer = setTimeout(function(){
          if(thisLoadSeq === recLoadSeq){
            v.load();
            v.play().catch(function(){});
          }
        }, 1000);
      } else {
        // 多次自愈未果：平滑移除遮罩，保留播放界面，绝不抛出阻塞性报错或卡死转圈
        setRecLoading(false);
      }
    };

    // 默认静音以确保浏览器自动起播政策放行
    v.muted = true;
    var bmM = document.getElementById('btnMute');
    if(bmM) bmM.classList.add('is-active');

    // 关键修复 2：立即切换播放源到目标片段（转换为完整绝对 URL 进行精确比较，防止相对路径与完整路径因字符比较不一致造成误重置连接）！
    var targetAbsUrl = '';
    try { targetAbsUrl = new URL(targetSrc, location.href).href; } catch(e){ targetAbsUrl = targetSrc; }
    if(v.src !== targetAbsUrl){
      v.src = targetSrc;
    }

    if(doSeek && seekSec > 0){
      var seekDone = false;
      function applySeek(){
        if(seekDone) return;
        // 关键保护：仅在就绪元数据确实属于当前目标片段时应用
        if(!v.src || v.src.indexOf(encodeURIComponent(f.name)) < 0) return;
        try {
          // 仅在视频具备有限总时长（即本地静态 MP4 缓存）时应用前端 currentTime 寻址。
          // 静态缓存 MP4 具有完整 duration（与元数据 f.duration 一致）。
          if(isStaticMP4Cache(v, f.duration)){
            seekDone = true;
            window._currentStreamOffset = 0;
            try { v.currentTime = Math.min(seekSec, v.duration - 0.2); } catch(e){}
            var onSeeked = function(){
              v.removeEventListener('seeked', onSeeked);
              v.play().catch(function(){});
              setRecLoading(false);
              updateRecPlayBtn();
            };
            v.addEventListener('seeked', onSeeked);
            v.play().catch(function(){});
          } else {
            // 实时分片流：服务端已带 -ss 偏移，首帧即目标时间
            seekDone = true;
            v.play().catch(function(){});
          }
        } catch(e){
          seekDone = true;
          v.play().catch(function(){});
        }
        updateTimeline24Needle();
      }
      v.addEventListener('loadedmetadata', applySeek, { once: true });
      v.addEventListener('canplay', applySeek, { once: true });
      v.addEventListener('loadeddata', applySeek, { once: true });
    }

    v.play().then(function(){
      if(thisLoadSeq === recLoadSeq && (v.videoWidth > 0 || v.currentTime > 0)){
        setRecLoading(false);
        updateRecPlayBtn();
      }
    }).catch(function(){
      if(thisLoadSeq === recLoadSeq){
        setRecLoading(false);
        updateRecPlayBtn();
      }
    });

    var onRealFrame = function(){
      if(thisLoadSeq === recLoadSeq){
        setRecLoading(false);
        updateRecPlayBtn();
      }
    };
    v.addEventListener('playing', onRealFrame);
    v.addEventListener('timeupdate', onRealFrame);

    // 强力看门狗：只有在视频确实进入就绪状态且解码出首帧画面尺寸 (videoWidth > 0) 后才移除遮罩层，杜绝黑屏无提示
    var playWatchdog = setInterval(function(){
      if(thisLoadSeq !== recLoadSeq){
        clearInterval(playWatchdog);
        return;
      }
      if(v && v.readyState >= 2 && v.videoWidth > 0 && (v.currentTime > 0 || !v.paused)){
        setRecLoading(false);
        updateRecPlayBtn();
        clearInterval(playWatchdog);
      }
    }, 200);
    // 超时保底：6秒后无论如何必须移除遮罩，绝不让转圈死锁遮挡用户视线
    setTimeout(function(){
      if(thisLoadSeq === recLoadSeq){
        setRecLoading(false);
        clearInterval(playWatchdog);
      }
    }, 6000);
  }

  // 关键修复 3：直接起播！
  startDirectPlay();

  var statusUrl = '/api/recordings/cache-status?name=' + encodeURIComponent(devName)
    + '&file=' + encodeURIComponent(f.name)
    + '&date=' + encodeURIComponent(dateStr);
  api(statusUrl).catch(function(){});

  // 预测式智能预热（Smart Read-Ahead）：提前预热下一个片段
  // 当用户在播放片段 N 时，自动触发片段 N+1 的转码缓存，保证连续播放/切换时 100% 命中 SSD 静态缓存（70ms 瞬开）
  try {
    var curList = (recState.files || []).filter(function(x){
      return (!recState.dev || x.dev === recState.dev || (x.device && x.device === recState.dev)) &&
             (!recState.date || x.date === recState.date);
    });
    curList.sort(function(a, b){ return timeToSec(a.startTime) - timeToSec(b.startTime); });
    var curIdx = -1;
    for(var ci = 0; ci < curList.length; ci++){
      if(curList[ci].name === f.name && (!f.dev || curList[ci].dev === f.dev)){
        curIdx = ci;
        break;
      }
    }
    if(curIdx >= 0 && curIdx + 1 < curList.length){
      var nxt = curList[curIdx + 1];
      var nxtDev = nxt.dev || recState.dev || '';
      var nxtDate = nxt.date || recState.date || '';
      var nxtUrl = '/api/recordings/cache-status?name=' + encodeURIComponent(nxtDev)
        + '&file=' + encodeURIComponent(nxt.name)
        + '&date=' + encodeURIComponent(nxtDate);
      api(nxtUrl).catch(function(){});
    }
  } catch(e){}
}

// ---- 播放位置记忆 ----
function posKey(f){ return 'micam.pos.' + f; }
function savePos(f, t){
  try { localStorage.setItem(posKey(f), String(Math.floor(t||0))); } catch(e){}
}
function restorePos(f, v){
  try {
    var t = parseInt(localStorage.getItem(posKey(f)) || '0', 10);
    // 关键保护：仅在有限时长静态缓存且 t 在当前已缓冲范围内时才恢复位置，严禁对刚起播的实时分片流越界赋值 currentTime
    if(t > 3 && v && isFinite(v.duration) && v.seekable && v.seekable.length > 0 && t <= v.seekable.end(0)){
      v.currentTime = t;
      toast('已跳转到上次位置 ' + fmtDur(t), 'ok');
    }
  } catch(e){}
}

// ---- 清理 ----
function cleanupRecordings(){
  api('/api/recordings/cleanup-preview').then(function(d){
    if(!d.fileCount){ toast('没有可清理的文件（保留 ' + d.keepDays + ' 天）', 'ok'); return; }
    if(!confirm('将清理 ' + d.fileCount + ' 个文件，释放 ' + fmtSizeMB(d.totalMB) + '\n保留最近 ' + d.keepDays + ' 天\n\n确定？')) return;
    api('/api/recordings/cleanup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ days: String(d.keepDays || 7), allPools: true })
    }).then(function(r){
      toast('已清理 ' + (r.deleted||0) + ' 个，释放 ' + fmtSizeMB(r.freedMB||0), 'ok');
      setTimeout(function(){ page='recordings'; render(); }, 1200);
    }).catch(function(e){ toast('清理失败：' + e.message, 'err'); });
  }).catch(function(e){ toast('查询失败：' + e.message, 'err'); });
}

function renderStorage(c){
  c.innerHTML = '<div class="page__inner">' + loading('加载存储信息…') + '</div>';

  Promise.all([
    api('/api/storage/detail').catch(function(){ return null; }),
    api('/api/recordings/cache').catch(function(){ return {}; }),
    api('/api/storage/cleanup-preview').catch(function(){ return {}; }),
    api('/api/ui/config').catch(function(){ return {}; }),
    api('/api/storage/locations').catch(function(){ return {}; }),
  ]).then(function(res){
    if(!res[0]) throw new Error('读取存储信息失败');
    stUIPref = ((res[3] && res[3].config) || {});
    stLocs = (res[4] && res[4].locations) || [];

  }).catch(function(err){
    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderStorage(c); }) + '</div>';
  });

function fmtGB(g){
  if(g == null) return '—';
  if(g >= 1024) return (g/1024).toFixed(2) + ' TB';
  if(g >= 1)    return g.toFixed(1) + ' GB';
  return (g*1024).toFixed(0) + ' MB';
}

function stRecDirCard(status, stLocs, unified){
  var curPath = (status && status.recPath) || '';
  var curLoc = (stLocs || []).filter(function(l){ return l.path === curPath; })[0] || {};
  var freeText = curLoc.freeGB ? (fmtGB(curLoc.freeGB) + ' 可用') : '';
  var spaceSummary = (curLoc.freeGB != null && curLoc.totalGB != null)
    ? (fmtGB(curLoc.freeGB) + ' / ' + fmtGB(curLoc.totalGB))
    : (freeText || '—');
  var spaceTitle = (curLoc.freeGB != null && curLoc.totalGB != null)
    ? ('剩余 ' + fmtGB(curLoc.freeGB) + ' 可用，总空间 ' + fmtGB(curLoc.totalGB))
    : '';
  var usedPct = (curLoc.freeGB != null && curLoc.totalGB != null && curLoc.totalGB > 0)
    ? Math.max(0, Math.min(100, ((curLoc.totalGB - curLoc.freeGB) / curLoc.totalGB * 100))).toFixed(1)
    : null;

  var needPerm = curLoc && curLoc.writable === false;
  var guideInitStyle = needPerm ? 'display:flex;' : 'display:none;';
  var guideBtnText = needPerm ? '收起指引' : '展开指引';
  var guideBtnIcon = needPerm ? 'chevron-up' : 'chevron-down';
  var guideCardClass = 'st-perm-guide' + (needPerm ? ' is-expanded' : '');

  var u = unified || stUnified || {};
  var totalFiles = u.totalFiles || 0;
  var totalGB = u.totalGB || 0;
  var pools = u.pools || [];

  var userShares = (stLocs || []).filter(function(l){ return l.kind === 'share' || l.kind === 'volume'; });
  var appShares = (stLocs || []).filter(function(l){ return l.kind === 'appshare' || l.kind === 'appdata' || (!l.kind && l.path !== curPath); });

  // 统一存储池汇总卡
  var poolsHtml = '';
  if(pools.length > 0){
    poolsHtml = '<div class="st-vault-pools">'
      + pools.map(function(p){
          var isAct = p.current;
          var pName = p.name || p.path;
          var tag = isAct
            ? '<span class="st-vault-pool-tag is-active">当前写入</span>'
            : '<span class="st-vault-pool-tag is-archive">历史纳管</span>';
          var statStr = (p.files > 0 ? (p.files.toLocaleString() + ' 个文件 · ' + fmtGB(p.sizeGB)) : '当前无文件');
          var datesStr = p.dates ? ('<span class="st-vault-pool-dates">' + esc(p.dates) + '</span>') : '';
          return '<div class="st-vault-pool-item' + (isAct ? ' is-current' : '') + '">'
            + '<div class="st-vault-pool-main">'
            +   tag
            +   '<span class="st-vault-pool-name" title="' + esc(pName) + '">' + esc(pName) + '</span>'
            +   '<span class="st-vault-pool-path" title="' + esc(p.path) + '">' + esc(p.path) + '</span>'
            + '</div>'
            + '<div class="st-vault-pool-stat">'
            +   '<b>' + esc(statStr) + '</b>'
            +   datesStr
            + '</div>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  // 下拉选项
  var optUserShares = userShares.map(function(l){
    var isSel = l.path === curPath;
    var label = (l.writable ? '[已授权] ' : '[需授权] ') + (l.name || l.path);
    if(l.freeGB != null) label += ' (剩余 ' + fmtGB(l.freeGB);
    if(l.hasRec) label += ' · 存有录像 ' + fmtGB(l.recGB);
    if(l.freeGB != null) label += ')';
    return '<option value="' + esc(l.path) + '"' + (isSel ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');

  var optAppShares = appShares.map(function(l){
    var isSel = l.path === curPath;
    var label = '[已授权] ' + (l.name || l.path);
    if(l.freeGB != null) label += ' (剩余 ' + fmtGB(l.freeGB);

function paintStorage(c, d, cleanup){
  var disk = d.disk || {};
  var types = d.types || [];
  var cams = d.cameras || [];
  var cache = d.cache || {};
  var trend = d.trend || [];
  var pol = d.policy || {};
  var status = d.status || {};

  function fmtGB(g){
    if(g == null) return '—';
    if(g >= 1024) return (g/1024).toFixed(2) + ' TB';
    if(g >= 1)    return g.toFixed(1) + ' GB';
    return (g*1024).toFixed(0) + ' MB';
  }

  // 可录时长
  //
  // ⚠️ 用后端给的 estimateHours（2026-10-12 修复）。
  //
  // 原来这里自己拿「已录文件数 × 5 分钟」当已录时长，反推码率：
  //   hours = files × 5/60，perHour = recGB / hours，h = freeGB / perHour
  // 本机实测 17 个文件 / 20MB：hours=1.42h，perHour=14MB/h，
  // 128GB / 14MB/h = 约 9400 小时 = **390 天**。
  // 而首页用后端估算得 6.2 天 —— 同一件事差 60 倍，
  // 和「68.9% vs 67.5%」是同一类信任问题。
  //
  // 注意数据源：本函数收到的是 **/api/storage/detail** 的响应（参数 d），
  // 不是 /api/storage。曾经写成 s.estimateHours 导致
  // 「加载失败：s is not defined」整页报错（2026-10-12 回归）。
  // 字段缺失时退化为按 0.9GB/小时粗算，绝不抛错。
  var estTxt = '—';
  var estHours = Number(d.estimateHours) || 0;
  if(!estHours && disk.freeGB > 0) estHours = disk.freeGB / 0.9;   // 兜底粗估
  if(estHours > 0){
    var ed = Math.floor(estHours / 24), eh = Math.round(estHours % 24);
    estTxt = ed > 0 ? ed + ' 天 ' + eh + ' 小时' : eh + ' 小时';
  }

  // 趋势图（SVG 折线）
  var maxGB = (disk.totalGB || 1);
  var W = 560, H = 180, padL = 44, padR = 12, padT = 12, padB = 26;
  function pts(key){
    return trend.map(function(p, i){
      var x = padL + (W-padL-padR) * (trend.length>1 ? i/(trend.length-1) : 0);
      var y = padT + (H-padT-padB) * (1 - (p[key]||0)/maxGB);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }
  var grid = '';
  for(var gi = 0; gi <= 4; gi++){
    var gy = padT + (H-padT-padB) * gi/4;
    var gv = maxGB * (1 - gi/4);
    grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--border-subtle)" stroke-dasharray="3 4"/>'
         +  '<text x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end" class="st-chart__ylab">'+fmtGB(gv)+'</text>';
  }
  var xlab = trend.map(function(p,i){
    var x = padL + (W-padL-padR) * (trend.length>1 ? i/(trend.length-1) : 0);
    return '<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" class="st-chart__xlab">'+esc(p.label||'')+'</text>';
  }).join('');

  c.innerHTML = '<div class="page__inner">'

    // 页头
    + '<div class="list-head">'
    +   '<div class="list-head__main">'
    +     '<h1 class="list-head__title">存储监控</h1>'
    +     '<div class="list-head__en">磁盘占用、录像与清理策略</div>'
    +   '</div>'
    +   '<div class="list-head__acts">'
    +     '<button class="btn" id="stCleanPre">清理预览</button>'
    +     '<button class="btn" id="stMigrate">迁移录像</button>'
    +     '<button class="btn" id="stReport">导出报告</button>'
    +   '</div>'
    + '</div>'

    + '<div class="set3">'
    +   '<aside class="set3__nav">'
    +     [['ov','概览','Overview','hard-drive'],['rec','录像与策略','Recording','film'],['clean','迁移与清理','Cleanup','trash']].map(function(x){
            return '<button class="set3__tab' + (stTab === x[0] ? ' is-active' : '') + '" data-sttab="' + x[0] + '">'
              + icon(x[3],17)
              + '<span class="set3__tab-body">'
              +   '<span class="set3__tab-name">' + x[1] + '</span>'
              +   '<span class="set3__tab-en">' + x[2] + '</span>'
              + '</span>'
              + '</button>';
          }).join('')
    +   '</aside>'
    +   '<div class="set3__main">'
    +   '<div class="pnl' + (stTab === 'ov' ? ' is-on' : '') + '" data-pnl="ov">'

    // 4 现代化数据看板统计卡
    + (function(){
        var totalFiles = cams.reduce(function(a,x){ return a+(x.files||0); }, 0);
        var recType = (types.filter(function(t){ return t.key==='recordings'; })[0] || {});
        var recGB = recType.sizeGB || 0;
        var usedPct = (disk.usedPct || 0).toFixed(1);
        var recRatio = disk.totalGB > 0 ? (recGB / disk.totalGB * 100).toFixed(1) : 0;

        // 设备分布迷你条
        var camSegs = cams.map(function(c, i){
          var pct = totalFiles > 0 ? ((c.files||0) / totalFiles * 100).toFixed(1) : 0;
          var colors = ['var(--accent)', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899'];
          var col = colors[i % colors.length];
          return '<span style="width:' + pct + '%;background:' + col + '" title="' + esc(c.name) + ': ' + (c.files||0) + ' 个 (' + pct + '%)"></span>';
        }).join('') || '<span style="width:100%;background:var(--accent)"></span>';

        return '<div class="st-stats">'
          + stStat('hard-drive', '总存储容量',
              '<span class="st-stat__num">' + fmtGB(disk.usedGB) + '</span><span class="st-stat__total">/ ' + fmtGB(disk.totalGB) + '</span>',
              '<div class="st-bar"><span style="width:' + usedPct + '%"></span></div>',
              '<span>已使用 <b>' + usedPct + '%</b></span><span>剩余 ' + fmtGB(disk.freeGB) + ' 可用</span>',
              '<span class="st-stat__badge" style="background:rgba(37,99,235,0.12);color:var(--accent)">使用率 ' + usedPct + '%</span>')
          + stStat('clock', '预计可录时长',
              '<span class="st-stat__num">' + estTxt + '</span>',
              '<div class="st-bar"><span style="width:100%;background:linear-gradient(90deg, #10B981, var(--accent))"></span></div>',
              '<span>全机综合码率估算</span><span>支持连续覆盖</span>',
              '<span class="st-stat__badge" style="background:rgba(16,185,129,0.12);color:#10B981">' + (status && status.healthy ? '就绪正常' : '需关注') + '</span>')
          + stStat('film', '监控录像文件',
              '<span class="st-stat__num">' + totalFiles.toLocaleString() + '</span><span class="st-stat__unit">个</span>',
              '<div class="st-bar st-bar--multi">' + camSegs + '</div>',
              '<span>多通道并发落盘</span><span>共 <b>' + cams.length + '</b> 台在线设备</span>',
              '<span class="st-stat__badge" style="background:rgba(139,92,246,0.12);color:#8B5CF6">' + cams.length + ' 路通道</span>')
          + stStat('database', '录像数据占用',
              '<span class="st-stat__num">' + fmtGB(recGB) + '</span>',
              '<div class="st-bar"><span style="width:' + recRatio + '%;background:#F59E0B"></span></div>',
              '<span>历史与连续录像</span><span>余量 <b>' + fmtGB(disk.freeGB) + '</b></span>',
              '<span class="st-stat__badge" style="background:rgba(245,158,11,0.12);color:#F59E0B">占总盘 ' + recRatio + '%</span>')
          + '</div>';
      })()

    // 概览页直接展示核心录像存储目录卡片
    + stRecDirCard(status, stLocs, stUnified)

    // 趋势 + 类型
    + '<div class="st-row st-row--2">'
    +   '<div class="card">'
    +     '<div class="card__head">' + icon('chart',15) + '<span class="card__title">存储趋势</span>'
    +       '<select class="input st-sel" id="stRange">'
    +         ['7:过去 7 天','14:过去 14 天','30:过去 30 天'].map(function(x){
                  var p = x.split(':'); return '<option value="'+p[0]+'">'+p[1]+'</option>';
                }).join('')
    +       '</select></div>'
    +     '<div class="st-chart">'
    +     (trend.length
        ? '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="st-chart__svg">'
          + grid
          + '<polyline points="' + pts('usedGB') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'
          + xlab + '</svg>'
        : '<div class="st-chart__empty">' + icon('chart',28) + '<div>还没有趋势数据</div>'
          + '<div class="st-chart__empty-sub">系统每天会自动记录一次占用，明天就能看到曲线</div></div>')
    +     '</div>'
    +   '</div>'

    +   '<div class="card">'
    +     '<div class="card__head">' + icon('layers',15) + '<span class="card__title">按类型统计</span></div>'
    +     '<div class="st-types">'

          return '<div class="st-type">'

        }).join('') : emptyState('no-result', { title:'暂无数据', compact:true }))
    +     '</div>'
    +     '<div class="st-note">' + icon('info',12)

    +   '</div>'
    + '</div>'
    + '</div>'
    + '<div class="pnl' + (stTab === 'rec' ? ' is-on' : '') + '" data-pnl="rec">'

    // 录像策略页核心存储目录卡片
    + stRecDirCard(status, stLocs, stUnified)

    // 摄像头 + 策略
    + '<div class="st-row st-row--2">'
    +   '<div class="card">'
    +     '<div class="card__head">'
    +       '<span class="card__title">' + icon('camera',16) + '按摄像头统计</span>'
    +       '<span class="badge" style="font-size:12px;">共 ' + cams.length + ' 台设备</span>'
    +     '</div>'
    +     '<div class="st-table-wrap">'
    +       '<div class="st-table">'
    +         '<div class="st-table__head">'
    +           '<span>摄像头设备</span><span>已用容量与占比</span><span>录像文件</span><span>保留策略</span><span>预计可录</span>'
    +         '</div>'
    +         (cams.length ? cams.map(function(x){
              var isLow = x.estDays != null && x.estDays < 3;
              var estBadge = (x.estDays >= 999)

              return '<div class="st-table__row">'
                + '<span class="st-cam">'
                +   '<span class="status-dot ' + (x.online?'is-online':'') + '"></span>'

                + '</span>'
                + '<span class="st-cell">'
                +   '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">'
                +     '<span class="st-cell__val">' + fmtGB(x.sizeGB) + '</span>'

var stTab = stTab || 'ov';        // 存储页左侧导航：ov=概览 / rec=录像与策略 / clean=迁移与清理
var stUIPref = {};       // /api/ui/config（含是否常显底部状态栏）
var stLocs = [];
var stUnified = {};         // /api/storage/locations（可选的录像目录）

// bindMigrate 录像迁移（2026-09-23）。
//
// 后端：/api/storage/migrate/{plan,status,cancel} + POST /api/storage/migrate
// 安全：后端会拒绝「目标在源内部 / 目标不存在 / 目标不可写」，
//       且【先复制、校验大小、再删源】—— 大小不一致时保留源文件。
function bindMigrate(){
  var dst  = document.getElementById('stMigDst');
  var from = document.getElementById('stMigFrom');
  var to   = document.getElementById('stMigTo');
  var cam  = document.getElementById('stMigCam');
  var del  = document.getElementById('stMigDel');
  var est  = document.getElementById('stMigEst');
  var prog = document.getElementById('stMigProg');
  var bar  = document.getElementById('stMigBar');
  var msg  = document.getElementById('stMigMsg');
  var go   = document.getElementById('stMigGo');
  if(!go) return;

  var poll = null;

  function stopPoll(){ if(poll){ clearInterval(poll); poll = null; } }

  // 预估
  function refreshEst(){
    var d = dst ? dst.value.trim() : '';
    if(!d){ if(est) est.innerHTML = '<span class="st-hint">填写目标路径后可预估大小</span>'; return; }
    var q = '/api/storage/migrate/plan?dst=' + encodeURIComponent(d)
          + '&from=' + encodeURIComponent(from ? from.value : '')
          + '&to='   + encodeURIComponent(to ? to.value : '')
          + '&cam='  + encodeURIComponent(cam ? cam.value : '');
    api(q).then(function(r){
      if(!r || r.msg){ if(est) est.innerHTML = '<span class="st-hint">' + esc((r&&r.msg)||'预估失败') + '</span>'; return; }
      if(r.dstErr){ if(est) est.innerHTML = '<span class="st-hint" style="color:var(--destructive)">' + esc(r.dstErr) + '</span>'; return; }
      if(!r.files){ if(est) est.innerHTML = '<span class="st-hint">该条件下没有可迁移的录像</span>'; return; }
      var freeTxt = r.dstFreeGB ? (' · 目标可用 ' + r.dstFreeGB.toFixed(1) + ' GB') : '';
      var warn = r.enough ? '' : ' <b style="color:var(--destructive)">空间可能不足</b>';
      if(est) est.innerHTML = '<span class="st-hint">预计 <b>' + esc(r.sizeText) + '</b> · '
        + r.files + ' 个文件' + esc(freeTxt) + warn + '</span>';
    }).catch(function(){ if(est) est.innerHTML = '<span class="st-hint">预估失败</span>'; });
  }

  [dst, from, to, cam].forEach(function(el){
    if(!el) return;
    el.addEventListener('change', refreshEst);
    if(el === dst) el.addEventListener('blur', refreshEst);
  });
  refreshEst();

  // 进度轮询
  function pollStatus(){
    api('/api/storage/migrate/status').then(function(s){
      if(!s) return;
      var pct = s.totalFiles ? Math.round((s.doneFiles + s.failed) / s.totalFiles * 100) : 0;
      if(bar) bar.style.width = pct + '%';
      if(prog) prog.style.display = 'block';
      var head = s.state === 'running' ? ('迁移中 ' + (s.doneFiles + s.failed) + '/' + s.totalFiles)
               : s.state === 'done' ? '已完成'
               : s.state === 'cancelled' ? '已取消'
               : s.state === 'error' ? '出错' : '';
      var cur = s.current ? (' · ' + s.current) : '';
      var line = head + ' · ' + (s.doneText || '') + esc(cur);
      if(s.failed) line += ' · 失败 ' + s.failed;
      if(msg) msg.textContent = line;
      if(go) go.disabled = (s.state === 'running');
      if(s.state !== 'running'){
        stopPoll();
        if(s.message) toast(s.message + (s.failed ? '（有失败项）' : ''), s.failed ? 'warn' : 'ok');
        if(s.errors && s.errors.length){ console.log('迁移错误:', s.errors); }
      }
    }).catch(function(){});
  }

  go.onclick = function(){
    var d = dst ? dst.value.trim() : '';
    if(!d){ toast('请填写目标路径', 'err'); return; }
    var willDelete = del ? del.checked : true;
    var msgTxt = willDelete
      ? ('确定把录像迁移到：\n' + d + '\n\n迁移后【原位置的文件会被删除】。\n\n继续？')
      : ('确定把录像复制到：\n' + d + '\n\n原文件会保留。\n\n继续？');
    if(!confirm(msgTxt)) return;

    go.disabled = true;
    api('/api/storage/migrate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        dst: d,
        from: from ? from.value : '',
        to: to ? to.value : '',
        cam: cam ? cam.value : '',
        deleteSource: willDelete
      })
    }).then(function(r){
      if(!r || r.msg && !r.ok){ toast((r&&r.msg)||'启动失败', 'err'); go.disabled = false; return; }
      toast('开始迁移 ' + r.total + ' 个文件', 'ok');
      if(prog) prog.style.display = 'block';
      stopPoll();
      poll = setInterval(pollStatus, 800);
      pollStatus();
    }).catch(function(e){ toast('启动失败：' + e.message, 'err'); go.disabled = false; });
  };

  // 页面离开时停掉轮询（避免累积）
  var oldRender = window.__migUnload;
  if(!oldRender){
    window.__migUnload = true;
  }
  // 如果已有任务在跑，恢复显示
  api('/api/storage/migrate/status').then(function(s){
    if(s && s.state === 'running'){ if(prog) prog.style.display='block'; stopPoll(); poll = setInterval(pollStatus, 800); pollStatus(); }
  }).catch(function(){});
}

function bindStorage(c, cams){
  // 快速搜索过滤共享文件夹
  var searchInp = c.querySelector('#stLocSearch');
  if(searchInp){
    searchInp.oninput = function(){
      var q = this.value.trim().toLowerCase();
      var items = c.querySelectorAll('.st-loc-item');
      Array.prototype.forEach.call(items, function(el){
        var txt = el.innerText.toLowerCase();
        if(!q || txt.indexOf(q) !== -1){
          el.style.display = 'flex';
        } else {
          el.style.display = 'none';
        }
      });
      var groups = c.querySelectorAll('.st-loc-group');
      Array.prototype.forEach.call(groups, function(g){
        var visItems = g.querySelectorAll('.st-loc-item:not([style*="display: none"])');
        g.style.display = visItems.length ? 'flex' : 'none';
      });
    };
  }

  function applyRecordDir(dir){
    if(!dir) return;
    if(!confirm('把录像存储目录切换为：\n' + dir + '\n\n新录像将自动写入新目录，已有历史录像安全保留在原路径。\n如需整体搬迁历史录像，可使用「迁移已有录像」。确定？')) return;
    api('/api/storage/record-dir', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ dir: dir }) })
      .then(function(r){
        if(r && r.ok){
          toast('录像存储目录已成功更新: ' + r.dir, 'ok');
          setTimeout(function(){ renderStorage(c); }, 600);
        } else {
          toast('设置失败: ' + ((r && r.error) || (r && r.msg) || '未知错误'), 'err');
        }
      }).catch(function(e){ toast('设置失败：' + e.message, 'err'); });
  }

  // 刷新存储列表
  Array.prototype.forEach.call(c.querySelectorAll('.st-locs-refresh'), function(btn){
    btn.onclick = function(){
      var origText = this.innerHTML;
      var self = this;
      self.disabled = true;
      self.innerHTML = icon('refresh', 13) + ' 正在扫描...';
      api('/api/storage/locations').then(function(res){
        stLocs = (res && res.locations) || [];
        toast('已重新扫描，发现 ' + stLocs.length + ' 个存储位置', 'ok');
        renderStorage(c);
      }).catch(function(err){
        toast('扫描失败: ' + err.message, 'err');
        self.disabled = false;
        self.innerHTML = origText;
      });
    };
  });

  // 自定义绝对路径面板展开/折叠
  Array.prototype.forEach.call(c.querySelectorAll('.st-toggle-custom'), function(btn){
    btn.onclick = function(){
      var card = this.closest('.st-dir-card') || document;
      var pnl = card.querySelector('.st-custom-panel') || document.getElementById('stCustomPanel');
      if(pnl){
        pnl.style.display = (pnl.style.display === 'none') ? 'block' : 'none';
        if(pnl.style.display === 'block'){
          var inp = pnl.querySelector('.st-custom-inp');
          if(inp) inp.focus();
        }
      }
    };
  });

  // 飞牛权限指引折叠/展开与快捷跳转
  Array.prototype.forEach.call(c.querySelectorAll('.st-perm-guide'), function(guide){
    var head = guide.querySelector('.st-perm-guide__head');
    var btn = guide.querySelector('.st-perm-guide__toggle-btn');
    var body = guide.querySelector('.st-perm-body');
    var txt = guide.querySelector('.st-perm-guide__toggle-text');
    var icn = guide.querySelector('.st-perm-guide__toggle-icon');
    if(!head || !body) return;

    var toggle = function(e){
      if(e){
        e.preventDefault();
        e.stopPropagation();
      }
      var isHidden = (body.style.display === 'none' || getComputedStyle(body).display === 'none');
      body.style.display = isHidden ? 'flex' : 'none';
      guide.classList.toggle('is-expanded', isHidden);
      if(txt) txt.textContent = isHidden ? '收起指引' : '展开指引';
      else if(btn) btn.textContent = isHidden ? '收起指引' : '展开指引';
      if(icn) icn.innerHTML = icon(isHidden ? 'chevron-up' : 'chevron-down', 13);
    };

    head.onclick = toggle;
    head.onkeydown = function(e){
      if(e.key === 'Enter' || e.key === ' '){
        toggle(e);
      }
    };
    if(btn){
      btn.onclick = toggle;
    }
  });

  // 点击未授权提示徽章，平滑滚动至指引并自动展开
  Array.prototype.forEach.call(c.querySelectorAll('.st-jump-perm'), function(badge){
    badge.onclick = function(e){
      e.stopPropagation();
      var card = this.closest('.st-dir-card') || document;
      var guide = card.querySelector('.st-perm-guide');
      if(guide){
        var body = guide.querySelector('.st-perm-body');
        var txt = guide.querySelector('.st-perm-guide__toggle-text');
        var icn = guide.querySelector('.st-perm-guide__toggle-icon');
        if(body){
          body.style.display = 'flex';
          guide.classList.add('is-expanded');
          if(txt) txt.textContent = '收起指引';
          if(icn) icn.innerHTML = icon('chevron-up', 13);
        }
        guide.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    };
  });

  // 应用自定义路径
  Array.prototype.forEach.call(c.querySelectorAll('.st-custom-apply'), function(btn){
    btn.onclick = function(){
      var card = this.closest('.st-dir-card') || document;
      var inp = card.querySelector('.st-custom-inp') || document.getElementById('stCustomInp');
      var dir = inp ? inp.value.trim() : '';
      if(!dir){
        toast('请输入自定义存储路径', 'warn');
        return;
      }
      applyRecordDir(dir);
    };
  });

  // 快捷一键切换存储目录
  Array.prototype.forEach.call(c.querySelectorAll('.st-apply-dir'), function(btn){
    btn.onclick = function(){
      var p = this.dataset.path;
      if(p) applyRecordDir(p);
    };
  });
  Array.prototype.forEach.call(c.querySelectorAll('.st-go-migrate'), function(btn){
    btn.onclick = function(){ stTab = 'clean'; render(); };
  });

  Array.prototype.forEach.call(c.querySelectorAll('[data-sttab]'), function(b){
    b.onclick = function(){ stTab = this.dataset.sttab; render(); };
  });
  var seg = document.getElementById('stSeg');
  var keep = document.getElementById('stKeep');
  var th = document.getElementById('stThresh');
  var auto = document.getElementById('stAuto');
  var low = document.getElementById('stLow');

  var sv = document.getElementById('stSave');
  if(sv) sv.onclick = function(){
    // 直接读 GB，不再「百分比 -> 换算 GB」反推（见字段处的说明）。
    // 顺带省掉一次 /api/storage/detail 往返 —— 那个请求原本只为拿 totalGB 做换算。
    var minFree = parseInt((th||{}).value, 10) || 10;
    if(minFree < 1) minFree = 1;
    api('/api/recordings/config', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        segmentSec: parseInt((seg||{}).value,10) || 300,
        keepDays: parseInt((keep||{}).value,10) || 7,
        minFreeGB: minFree,
      }) })
    .then(function(){
      toast('策略已保存（最低保留 ' + minFree + ' GB）', 'ok');
      render();
    }).catch(function(e){ toast('保存失败：' + e.message, 'err'); });
  };

  var cc = document.getElementById('stCacheClear');
  if(cc) cc.onclick = function(){
    if(!confirm('清空转码缓存？\n\n缓存会重新生成，不影响录像文件。')) return;
    api('/api/recordings/cache/clear', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' })
      .then(function(){ toast('缓存已清空', 'ok'); render(); })
      .catch(function(e){ toast('失败：' + e.message, 'err'); });
  };
  var cs = document.getElementById('stCacheSet');
  if(cs) cs.onclick = function(){ toast('缓存上限请在「存储策略」里调整', 'warn'); };

  var cg = document.getElementById('stCleanGo');
  if(cg) cg.onclick = function(){
    if(!confirm('确认清理过期录像？\n\n此操作不可恢复。')) return;
    api('/api/recordings/cleanup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ days: '7', allPools: true })
    })
      .then(function(r){ toast('已清理 ' + (r.deleted||0) + ' 个文件，释放 ' + Math.round(r.freedMB||0) + ' MB', 'ok'); render(); })
      .catch(function(e){ toast('清理失败：' + e.message, 'err'); });
  };
  var cp = document.getElementById('stCleanPre');
  if(cp) cp.onclick = function(){
    var el = document.querySelector('.st-clean');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  };
  var mg = document.getElementById('stMigrate');
  if(mg) mg.onclick = function(){
    var el = document.querySelector('.st-migrate');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  };
  bindMigrate();
  // 1. 下拉框选择录像目录与设为写入目录
  var recDirSelect = document.getElementById('stRecDirSelect');
  var recDirApply = document.getElementById('stRecDirApply');
  if(recDirSelect && recDirApply){
    recDirSelect.onchange = function(){
      var isSame = (recDirSelect.value === ((status||{}).recPath||''));
      recDirApply.disabled = isSame;
      if(!isSame){
        recDirApply.classList.add('btn--pulse');
      } else {
        recDirApply.classList.remove('btn--pulse');
      }

      var selVal = recDirSelect.value;
      var selLoc = (stLocs || []).filter(function(l){ return l.path === selVal; })[0];
      if(selLoc && selLoc.writable === false){
        var card = recDirSelect.closest('.st-dir-card') || document;
        var guide = card.querySelector('.st-perm-guide');
        if(guide){
          var body = guide.querySelector('.st-perm-body');
          var txt = guide.querySelector('.st-perm-guide__toggle-text');
          var icn = guide.querySelector('.st-perm-guide__toggle-icon');
          if(body && (body.style.display === 'none' || getComputedStyle(body).display === 'none')){
            body.style.display = 'flex';
            guide.classList.add('is-expanded');
            if(txt) txt.textContent = '收起指引';
            if(icn) icn.innerHTML = icon('chevron-up', 13);
          }
        }
      }
    };
    recDirApply.onclick = function(){
      var targetDir = recDirSelect.value;
      if(!targetDir) return;
      applyRecordDir(targetDir);
    };
  }

  // 2. 清理面板交互与实时估算
  var cleanDays = document.getElementById('stCleanDaysSelect');
  var cleanDev = document.getElementById('stCleanDevSelect');
  var cleanAI = document.getElementById('stCleanProtectAICheck');
  var cleanCache = document.getElementById('stCleanCacheCheck');
  var cleanPools = document.getElementById('stCleanAllPoolsCheck');
  var cleanSubmit = document.getElementById('stCleanSubmit');
  var cleanSubmitTxt = document.getElementById('stCleanSubmitTxt');
  var cleanEstGB = document.getElementById('stCleanEstGB');
  var cleanEstFiles = document.getElementById('stCleanEstFiles');
  var cleanEstDetail = document.getElementById('stCleanEstDetail');
  var cleanEstStatus = document.getElementById('stCleanEstStatus');

  var cleanDebounceTimer = null;
  function updateCleanPreview(){
    if(!cleanDays || !cleanSubmit) return;
    if(cleanEstStatus) cleanEstStatus.textContent = '计算中...';
    var days = cleanDays.value;
    var dev = cleanDev ? cleanDev.value : '';
    var ai = cleanAI ? (cleanAI.checked ? 'true' : 'false') : 'true';
    var cache = cleanCache ? (cleanCache.checked ? 'true' : 'false') : 'false';
    var pools = cleanPools ? (cleanPools.checked ? 'true' : 'false') : 'true';

    var query = '?days=' + encodeURIComponent(days)
      + '&device=' + encodeURIComponent(dev)
      + '&protectAI=' + encodeURIComponent(ai)
      + '&cleanCache=' + encodeURIComponent(cache)
      + '&allPools=' + encodeURIComponent(pools);

    api('/api/storage/cleanup-preview' + query).then(function(r){
      if(cleanEstStatus) cleanEstStatus.textContent = '就绪';
      var gb = r.totalGB || ((r.totalMB || 0) / 1024);
      var files = r.fileCount || 0;
      if(cleanEstGB) cleanEstGB.textContent = fmtGB(gb);
      if(cleanEstFiles) cleanEstFiles.textContent = '(' + files.toLocaleString() + ' 个文件)';
      if(cleanSubmitTxt){
        cleanSubmitTxt.textContent = (gb > 0 || files > 0)
          ? ('确认执行清理 (' + fmtGB(gb) + ')')
          : '所选范围暂无可清理文件';
      }
      cleanSubmit.disabled = (gb <= 0 && files <= 0);

      var details = [];
      if(r.deadline) details.push('清理截止时间点：' + r.deadline + ' 以前的常规视频');
      if(r.protectedAICount > 0){
        details.push('已智能保护 ' + r.protectedAICount + ' 个重要 AI 告警事件录像（约 ' + fmtGB(r.protectedAIGB || 0) + '，安全保留）');
      } else if(ai === 'true'){
        details.push('AI 告警事件保护已开启');
      }
      if(cleanCache && cleanCache.checked && r.cacheMB > 0){
        details.push('包含清空 ' + Math.round(r.cacheMB) + ' MB 转码切片缓存');
      }
      if(files === 0){
        details.push('<span style="color:var(--text-secondary);font-size:12px;margin-top:6px;display:block;line-height:1.6;border-top:1px dashed var(--border-subtle);padding-top:6px;">'
          + '💡 <b>录像存储现状说明</b>：系统历史录像录制于 <b>2026-10-11 至今（共 542 个文件，11.8 GB）</b>，全部都在最近 6 天以内。<br>'
          + '若选择「7 天以前」因尚未到期因此暂无旧文件。如需立即释放存储空间，请在上方选择 <b>「清理 3 天以前」</b> 或 <b>「清理 1 天以前」</b>。'
          + '</span>');
      }
      if(cleanEstDetail) cleanEstDetail.innerHTML = details.join('<br>') || '可立即释放存储空间';
    }).catch(function(err){
      if(cleanEstStatus) cleanEstStatus.textContent = '查询失败';
    });
  }

  [cleanDays, cleanDev, cleanAI, cleanCache, cleanPools].forEach(function(el){
    if(el){
      el.onchange = function(){
        clearTimeout(cleanDebounceTimer);
        cleanDebounceTimer = setTimeout(updateCleanPreview, 150);
      };
      el.oninput = el.onchange;
    }
  });

  if(cleanDays){
    updateCleanPreview();
  }

  if(cleanSubmit){
    cleanSubmit.onclick = function(){
      var days = cleanDays ? cleanDays.value : '7';
      var dev = cleanDev ? cleanDev.value : '';
      var ai = cleanAI ? cleanAI.checked : true;
      var cache = cleanCache ? cleanCache.checked : false;
      var pools = cleanPools ? cleanPools.checked : true;
      var gbTxt = cleanEstGB ? cleanEstGB.textContent : '';

      var confirmMsg = '确认执行深度录像清理？\n\n'
        + '· 清理范围: ' + (days === '0' ? '全部历史录像' : (days + ' 天以前的录像')) + '\n'
        + '· 目标设备: ' + (dev || '全部摄像头') + '\n'
        + '· 预计释放: ' + gbTxt + '\n'
        + '· AI 事件保护: ' + (ai ? '已保护（不删除告警片段）' : '未保护') + '\n\n'
        + '清理后相关录像文件将永久删除且不可恢复，是否继续？';

      if(!confirm(confirmMsg)) return;

      cleanSubmit.disabled = true;
      api('/api/recordings/cleanup', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          days: String(days),
          device: dev,
          protectAI: ai,
          cleanCache: cache,
          allPools: pools,
        })
      }).then(function(res){
        toast('清理完成：已删除 ' + (res.deleted || 0) + ' 个文件，释放 ' + fmtGB(res.freedGB || ((res.freedMB || 0)/1024)) + ' 空间', 'ok');
        setTimeout(function(){ renderStorage(c); }, 800);
      }).catch(function(err){
        toast('清理失败: ' + err.message, 'err');
        cleanSubmit.disabled = false;
      });
    };
  }

  // 3. 右侧自动守护策略保存
  var saveClean = document.getElementById('stSaveClean');
  if(saveClean){
    saveClean.onclick = function(){
      var keepVal = parseInt(document.getElementById('stKeepClean').value, 10) || 7;
      var threshVal = parseFloat(document.getElementById('stThreshClean').value) || 10;
      var autoVal = document.getElementById('stAutoClean').checked;
      var lowVal = document.getElementById('stLowClean').value;
      saveClean.disabled = true;
      api('/api/storage/policy', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          keepDays: keepVal,
          minFreeGB: threshVal,
          autoClean: autoVal,
          lowSpaceMode: lowVal,
        })
      }).then(function(){
        toast('存储守护策略已保存生效', 'ok');
        saveClean.disabled = false;
      }).catch(function(err){
        toast('保存失败: ' + err.message, 'err');
        saveClean.disabled = false;
      });
    };
  }

  var rp = document.getElementById('stReport');
  if(rp) rp.onclick = function(){
    window.open(apiUrl('/api/diag/report'), '_blank');
  };
}

// ===== 页面：账号管理 =====
// ===== 页面：账号管理（对齐效果图）=====
//
// 布局：
//   页头 + 顶部操作栏（扫码/导入/导出 + 实时刷新开关）
//   左：账号卡片列表（缩略图 + 名称 + 掩码ID + 设备数 + 会话剩余 + 三层凭据胶囊 + 操作）
//   右：三层凭据说明 / 备份与恢复 / 连接与同步 + 最近活动
//   （原「扫码添加引导（预览）」区块已按需求删除，扫码入口只保留顶部按钮）

var acctAuto = null;
var acctSelected = '';
var acctCloudDevs = [];   // 当前账号的云端设备清单   // 当前选中的账号（右栏显示谁的设备）
var acctDevOpen = '';      // 展开了哪个账号的设备清单
var devIndex = {};         // did -> /api/devices 元数据（别名 / 隐藏）
var recByDid = {};         // did -> 录像状态

// renderAccounts 账号管理页 —— 【纯展示，无副作用】
//
// ⚠️ 设计红线（2026-09-18 用户反馈后确立）
//
// 这里【绝对不能】调 /api/devices！
//
// 原因：/api/devices 内部会调 AllCameras()，
//       那会向小米云端发起真实请求（拉设备列表 + 家庭 + 共享设备）。
//       也就是说 —— 光打开账号页，就等于「获取设备」了。
//
//       用户反馈「我点稍后它还自动获取」就是这个引起的。
//
// 所以：账号页只读【后端已有的缓存】（/api/accounts/detail 里的 byAccount），
//       要拉新设备必须由用户明确点「获取设备」按钮。
//
// byAccount 来自后端缓存（上次拉取的结果），不是实时拉的。
function renderAccounts(c){
  if(acctAuto){ clearInterval(acctAuto); acctAuto = null; }
  c.innerHTML = '<div class="page__inner">' + loading('加载账号…') + '</div>';

  Promise.all([
    api('/api/accounts/detail').catch(function(){ return {}; }),
    api('/api/accounts/status').catch(function(){ return {}; }),
    api('/api/recordings').catch(function(){ return { recordings: [] }; }),
  ]).then(function(res){
    // 注意第三个参数是空的 devices —— 见上方说明，这里不拉设备
    paintAccounts(c, res[0] || {}, res[1] || {}, { devices: [] }, res[2] || {});
  }).catch(function(err){
    c.innerHTML = '<div class="page__inner">' + errorCard(err, function(){ renderAccounts(c); }) + '</div>';
  });
}

function paintAccounts(c, d, st, devs, recs){
  var accts = d.accounts || [];
  var byAcct = d.byAccount || {};

  // 当前选中的账号
  if (!acctSelected && accts.length) acctSelected = accts[0].userId;
  if (acctSelected && !accts.some(function(a){ return a.userId === acctSelected; })){
    acctSelected = accts.length ? accts[0].userId : '';
  }

  var cur = null;
  for (var i=0;i<accts.length;i++){ if(accts[i].userId === acctSelected) cur = accts[i]; }


  c.innerHTML = '<div class="page__inner">'

    + '<div class="list-head">'
    +   '<div class="list-head__main">'
    +     '<h1 class="list-head__title">设备与账号管理</h1>'
    +     '<div class="list-head__en">管理已关联账号，获取并维护摄像头设备。</div>'
    +   '</div>'
    +   '<div class="list-head__ops">'
    +     '<button class="btn" id="acctImport">' + icon('upload',14) + '导入备份</button>'
    +     '<button class="btn" id="acctExport">' + icon('download',14) + '导出全部</button>'
    +   '</div>'
    + '</div>'

    + '<div class="acct2">'

      // ===== 左：用户列表 =====
    +   '<section class="acct2__users">'
    +     '<div class="acct2__head">'
    +       '<div><div class="acct2__title">用户列表</div>'
    +         '<div class="acct2__sub">已登录 ' + accts.length + ' 个用户</div></div>'
    +       '<button class="btn btn--primary btn--sm" id="acctAdd">' + icon('plus',14) + '添加用户</button>'
    +     '</div>'
    +     '<div class="acct2__body">'
    +     (accts.length ? accts.map(function(a){
          var on = (a.userId === acctSelected);
          var ds = (byAcct[a.userId] || []);
          var managedN = ds.filter(function(x){ return x.managed !== false; }).length;
          var displayName = a.name && a.name !== a.userId ? a.name : maskUser(a.userId);
          var subName = a.name && a.name !== a.userId ? maskUser(a.userId) : ('小米 UID: ' + (a.userId || ''));
          var isOk = (a.passTokenOk !== false);
          return '<div class="acct2__user' + (on ? ' is-on' : '') + '" data-acct-sel="' + esc(a.userId) + '">'
            +   '<div class="acct2__user-top">'
            +     '<div class="acct2__user-profile">'
            +       '<div class="acct2__avatar">' + icon('user',18) + '</div>'
            +       '<div class="acct2__info">'
            +         '<div class="acct2__uid" title="' + esc(a.name || a.userId) + '">' + esc(displayName) + '</div>'
            +         '<div class="acct2__meta">' + esc(subName) + '</div>'
            +       '</div>'
            +     '</div>'
            +     '<div class="acct2__ops">'

// maskUser 账号掩码（提成顶层，供多个渲染函数共用）
function maskUser(u){ u = String(u||''); return 'xiaomi_' + u.slice(0,3) + '****' + u.slice(-4); }

// checkCredBanner 检查凭据状态，受限时在页面顶部显示提示横幅。
//
// 为什么需要：用户看到「画面坏了/缩略图是灰的」，
// 但根本原因是「设备凭据申请被小米限流」。
// 界面必须说出来，否则用户以为摄像头坏了，去折腾设备。
function checkCredBanner(){
  // ⚠️ 官方通道已授权时不显示这个横幅（2026-10-11）。
  //
  // 原因：这个横幅说的是「miss_get_vendor 被限流」，
  // 但官方通道（OAuth2 + PPCS）【根本不走那个端点】，
  // 所以画面完全正常。此时显示"实时画面暂时不可用"是误报 ——
  // 用户实测反馈："明明能看，上面却说不可用"。
  if(miotBound) {
    var ob = document.getElementById('credBanner');
    if(ob) ob.remove();
    return;
  }
  api('/api/live/cred-status').then(function(d){
    var s = (d && d.summary) || {};
    var old = document.getElementById('credBanner');
    if(old) old.remove();
    if(miotBound){ if(old) old.remove(); return; }  // 查询期间可能已授权
    if(s.healthy !== false) return;   // 正常就不显示

    var box = document.querySelector('.page__inner');
    if(!box) return;
    var el = document.createElement('div');
    el.id = 'credBanner';
    el.className = 'cred-banner';
    el.innerHTML = icon('alert',16)
      + '<div class="cred-banner__body">'
      +   '<div class="cred-banner__title">设备凭据受限，实时画面暂时不可用</div>'
      +   '<div class="cred-banner__desc">' + esc(s.message || '正在重试') + '</div>'
      + '</div>'
      + '<button class="btn btn--sm" id="credBannerRetry">立即重试</button>';
    box.insertBefore(el, box.firstChild);

    var btn = document.getElementById('credBannerRetry');
    if(btn) btn.onclick = function(){
      var b = this;
      b.disabled = true; b.textContent = '重试中…';
      var dids = (devices || []).map(function(x){ return x.did; });
      if(!dids.length){ toast('没有设备', 'warn'); b.disabled=false; b.textContent='立即重试'; return; }
      var done = 0, ok = 0;
      dids.forEach(function(did){
        api('/api/live/renew?did=' + encodeURIComponent(did), { method:'POST' })
          .then(function(r){
            var o = r && r.results && r.results[0];
            if(o && o.ok) ok++;
          })
          .catch(function(){})
          .then(function(){
            done++;
            if(done === dids.length){
              toast(ok > 0 ? ('凭据已恢复 ' + ok + ' 台') : '仍被限流，请稍后再试', ok > 0 ? 'ok' : 'warn');
              render();
            }
          });
      });
    };
  }).catch(function(){});
}

// dot2 状态点（提成顶层函数 —— 之前定义在 paintAccounts 内部，
// acctDevTable 访问不到，抛 ReferenceError 被 catch 吞掉，
