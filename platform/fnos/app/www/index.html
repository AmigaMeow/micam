<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>小米摄像头</title>
<style>
:root{
  --primary:#1677ff; --primary-hover:#4096ff; --primary-active:#0958d9;
  --success:#52c41a; --warning:#faad14; --error:#ff4d4f;
  --text:rgba(0,0,0,.88); --text-2:rgba(0,0,0,.65); --text-3:rgba(0,0,0,.45);
  --border:#f0f0f0; --border-2:#d9d9d9; --split:rgba(5,5,5,.06);
  --bg:#f5f5f5; --card:#fff; --hover:rgba(0,0,0,.04);
  --sider:#001529; --sider-hover:rgba(255,255,255,.08);
  --sider-text:rgba(255,255,255,.65); --sider-active:#fff;
  --radius:8px; --radius-sm:6px; --radius-lg:12px;
  --shadow:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
  --shadow-hover:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --text:rgba(255,255,255,.85); --text-2:rgba(255,255,255,.65); --text-3:rgba(255,255,255,.45);
  --border:#303030; --border-2:#424242; --split:rgba(255,255,255,.08);
  --bg:#141414; --card:#1f1f1f; --hover:rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.5715;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
svg{display:block}
.layout{display:flex;height:100vh;overflow:hidden}
.sider{width:208px;background:var(--sider);flex-shrink:0;display:flex;flex-direction:column;
  transition:width .2s;overflow:hidden}
.sider-logo{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;flex-shrink:0;
  color:#fff;font-size:16px;font-weight:600;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.06)}
.sider-logo .mark{width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#00b96b,#009e5a);display:flex;align-items:center;
  justify-content:center;box-shadow:0 2px 8px rgba(0,185,107,.35)}
.menu{padding:12px 0;flex:1;overflow-y:auto}
.menu-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 24px;margin:2px 0;
  color:var(--sider-text);cursor:pointer;font-size:14px;transition:all .2s;
  border-left:3px solid transparent;user-select:none}
.menu-item:hover{color:var(--sider-active);background:var(--sider-hover)}
.menu-item.active{color:var(--sider-active);background:var(--primary);border-left-color:#fff}
.menu-item svg{width:16px;height:16px;flex-shrink:0;opacity:.9}
.sider-foot{padding:16px 24px;font-size:12px;color:rgba(255,255,255,.35);
  border-top:1px solid rgba(255,255,255,.06)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:64px;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.header h1{font-size:16px;font-weight:500;letter-spacing:.2px}
.header-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;
  box-shadow:0 0 0 2px rgba(82,196,26,.15)}
.content{flex:1;overflow-y:auto;padding:24px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:16px;overflow:hidden}
.card-head{padding:16px 24px;border-bottom:1px solid var(--split);display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:500}
.card-body{padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;
  padding:0 15px;border-radius:var(--radius-sm);border:1px solid var(--border-2);
  background:var(--card);color:var(--text);cursor:pointer;font-size:14px;font-family:var(--font);
  transition:all .2s;white-space:nowrap;user-select:none}
.btn:hover{color:var(--primary);border-color:var(--primary)}
.btn:active{color:var(--primary-active);border-color:var(--primary-active)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 2px 0 rgba(5,145,255,.1)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-danger{color:var(--error);border-color:var(--error)}
.btn-danger:hover{background:var(--error);border-color:var(--error);color:#fff}
.btn-sm{height:24px;padding:0 7px;font-size:13px;border-radius:4px}
.btn-sm svg{width:12px;height:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;
  border-radius:4px;font-size:12px;line-height:1;border:1px solid transparent;white-space:nowrap}
.tag-on{background:#f6ffed;color:#389e0d;border-color:#b7eb8f}
.tag-warn{background:rgba(250,173,20,.12);color:var(--warning)}
.tag-off{background:#fff2f0;color:#cf1322;border-color:#ffccc7}
.tag-share{background:#e6f4ff;color:#0958d9;border-color:#91caff}
.tag-def{background:#fafafa;color:var(--text-2);border-color:var(--border-2)}
[data-theme="dark"] .tag-on{background:#162312;border-color:#274916;color:#73d13d}
[data-theme="dark"] .tag-off{background:#2c1618;border-color:#58181c;color:#ff7875}
[data-theme="dark"] .tag-share{background:#111a2c;border-color:#15325b;color:#4096ff}
[data-theme="dark"] .tag-def{background:#262626;border-color:#303030}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.device{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;transition:box-shadow .25s,transform .25s;border:1px solid var(--border)}
.device:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.dev-preview{position:relative;width:100%;aspect-ratio:16/9;background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.dev-preview img{width:100%;height:100%;object-fit:contain;display:block}
.dev-preview .ph{display:flex;flex-direction:column;align-items:center;gap:8px;
  color:rgba(255,255,255,.35);font-size:13px;transition:color .2s}
.dev-preview:hover .ph{color:rgba(255,255,255,.7)}
.dev-preview .ph svg{width:32px;height:32px}
.dev-badge{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.dev-body{padding:16px 20px}
.dev-name{font-size:15px;font-weight:500;margin-bottom:8px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev-tags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.dev-meta{font-size:12px;color:var(--text-3);line-height:2}
.dev-meta b{color:var(--text-2);font-weight:400}
.dev-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--split)}
.player{background:#0a0a0a;border-radius:var(--radius);overflow:hidden;
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative}
.player img{width:100%;height:100%;object-fit:contain;display:block}
.player .ph{color:rgba(255,255,255,.35);font-size:14px;display:flex;
  flex-direction:column;align-items:center;gap:10px}
.player .ph svg{width:40px;height:40px}
.player-bar{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ptz{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;
  background:var(--bg);border-radius:var(--radius);margin-top:16px}
.ptz-grid{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:6px}
.ptz-btn{width:42px;height:42px;border-radius:var(--radius-sm);border:1px solid var(--border-2);
  background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;font-size:14px;font-family:var(--font)}
.ptz-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.ptz-btn:active{transform:scale(.94)}
.ptz-btn:disabled{opacity:.4;cursor:not-allowed}
.ptz-center{background:var(--primary);border-color:var(--primary);color:#fff}
.ptz-info{font-size:12px;color:var(--text-3)}
.progress{width:100%;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;background:var(--primary);border-radius:2px;transition:width .3s;width:0}
.progress-text{font-size:12px;color:var(--text-3);text-align:center;margin-top:6px}
.loading-overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;z-index:10}
.loading-overlay .spin{border-color:rgba(255,255,255,.2);border-top-color:#fff;width:28px;height:28px}
.loading-overlay .txt{font-size:13px;opacity:.9}
/* 安装向导 */
.wizard{max-width:760px;margin:0 auto}
.wizard-hero{text-align:center;padding:32px 24px 24px}
.wizard-hero .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
  background:linear-gradient(135deg,#00b96b,#009e5a);display:flex;align-items:center;
  justify-content:center;box-shadow:0 8px 24px rgba(0,185,107,.25)}
.wizard-hero h2{font-size:22px;font-weight:600;margin-bottom:8px}
.wizard-hero p{font-size:14px;color:var(--text-3)}
.wizard-steps{display:flex;gap:8px;margin:24px 0;padding:0 24px}
.wizard-step{flex:1;text-align:center;position:relative}
.wizard-step .num{width:28px;height:28px;border-radius:50%;background:var(--border);
  color:var(--text-3);display:flex;align-items:center;justify-content:center;
  margin:0 auto 8px;font-size:13px;font-weight:500;transition:all .3s}
.wizard-step.done .num{background:var(--success);color:#fff}
.wizard-step.active .num{background:var(--primary);color:#fff;
  box-shadow:0 0 0 4px rgba(22,119,255,.15)}
.wizard-step .label{font-size:12px;color:var(--text-3)}
.wizard-step.active .label{color:var(--primary);font-weight:500}
.check-list{display:flex;flex-direction:column;gap:2px}
.check-item{display:flex;align-items:center;gap:12px;padding:14px 24px;
  border-bottom:1px solid var(--split);transition:background .2s}
.check-item:last-child{border-bottom:0}
.check-item:hover{background:var(--hover)}
.check-icon{width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.check-icon.ok{background:var(--success)}
.check-icon.warn{background:var(--warning)}
.check-icon.error{background:var(--error)}
.check-body{flex:1;min-width:0}
.check-name{font-size:14px;font-weight:500;margin-bottom:2px}
.check-detail{font-size:12px;color:var(--text-3);word-break:break-all}
.check-hint{font-size:12px;color:var(--warning);margin-top:4px}
.wizard-actions{padding:20px 24px;display:flex;gap:12px;justify-content:center;
  border-top:1px solid var(--split);flex-wrap:wrap}
table{width:100%;border-collapse:separate;border-spacing:0}
th{padding:12px 16px;text-align:left;font-weight:500;font-size:13px;color:var(--text-2);
  background:#fafafa;border-bottom:1px solid var(--border)}
[data-theme="dark"] th{background:#262626}
td{padding:12px 16px;border-bottom:1px solid var(--split);font-size:13px}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 24px;color:var(--text-3);gap:12px}
.empty svg{width:56px;height:56px;opacity:.25}
.empty p{font-size:14px}
.empty .sub{font-size:13px;color:var(--text-3);opacity:.8}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-hover);
  min-width:360px;max-width:92vw;animation:zoomIn .2s}
@keyframes zoomIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:20px 24px 0;font-size:16px;font-weight:500}
.modal-body{padding:20px 24px}
.modal-foot{padding:0 24px 20px;display:flex;justify-content:flex-end;gap:8px}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.qr-wrap img{width:240px;height:240px;border-radius:var(--radius);background:#fff;padding:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qr-tip{font-size:13px;color:var(--text-3)}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2000;
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);
  background:var(--card);box-shadow:var(--shadow-hover);font-size:14px;
  border:1px solid var(--border);animation:slideDown .25s}
@keyframes slideDown{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast-ok svg{color:var(--success)}
.toast-err svg{color:var(--error)}
.spin{width:20px;height:20px;border:2px solid var(--border-2);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;cursor:pointer;inset:0;background:var(--border-2);
  border-radius:11px;transition:.2s}
.switch span:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + span{background:var(--primary)}
.switch input:checked + span:before{transform:translateX(18px)}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:8px 24px 18px}
.rec-item{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.rec-thumb{position:relative;aspect-ratio:16/9;background:#111;cursor:pointer;overflow:hidden}
.rec-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rec-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;background:rgba(0,0,0,.28);opacity:0;transition:opacity .15s}
.rec-thumb:hover .rec-play{opacity:1}
.rec-dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;
  font-size:11px;padding:1px 5px;border-radius:3px}
.rec-meta{padding:8px 10px}
.rec-name{font-size:12px;font-family:ui-monospace,monospace;word-break:break-all}
.rec-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.rec-del{position:absolute;right:6px;top:6px;opacity:0;transition:opacity .15s}
.rec-item:hover .rec-del{opacity:1}
@media (max-width:640px){
  .rec-grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 12px 14px}
  .rec-del{opacity:1}
}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-box{padding:14px 16px;background:var(--hover);border-radius:8px}
.stat-label{font-size:12px;color:var(--text-3);margin-bottom:6px}
.stat-value{font-size:20px;font-weight:600;line-height:1.2}
.stat-sub{font-size:11px;color:var(--text-3);margin-top:4px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;
  padding:48px;color:var(--text-3);font-size:14px}
/* ============ 移动端适配 ============ */
/* 汉堡菜单按钮（仅移动端显示） */
.hamburger{display:none;width:40px;height:40px;border-radius:8px;border:0;
  background:transparent;color:var(--text);cursor:pointer;align-items:center;
  justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.hamburger:active{background:var(--hover)}
.hamburger svg{width:20px;height:20px}

/* 侧边栏遮罩（移动端） */
.sider-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:99;-webkit-tap-highlight-color:transparent}

/* 触摸优化：按钮最小 44px 高 */
.btn{min-height:36px}
.btn-sm{min-height:32px}
@media (hover:none){
  .btn:hover{border-color:var(--border-2);color:var(--text)}
  .btn-primary:hover{background:var(--primary);border-color:var(--primary)}
  .device:hover{box-shadow:var(--shadow);transform:none}
  .menu-item:hover{background:transparent;color:var(--sider-text)}
  .menu-item.active:hover{background:var(--primary);color:#fff}
}

/* ===== 手机竖屏 ===== */
@media (max-width:640px){
  .sider{position:fixed;left:0;top:0;bottom:0;z-index:100;
    transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:2px 0 12px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top)}
  .sider.open{transform:translateX(0)}
  .sider-mask.show{display:block}
  .hamburger{display:flex}

  .header{height:56px;padding:0 12px;padding-top:env(safe-area-inset-top);
    height:calc(56px + env(safe-area-inset-top))}
  .header h1{font-size:15px}
  .header-right{font-size:12px;gap:10px}
  .header-right .sysinfo-hide{display:none}

  .content{padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .card{margin-bottom:10px;border-radius:10px}
  .card-head{padding:12px 16px}
  .card-body{padding:16px}
  .card-title{font-size:14px}

  .grid{grid-template-columns:1fr;gap:10px}

  .device{border-radius:10px}
  .dev-body{padding:12px 14px}
  .dev-name{font-size:14px}
  .dev-actions{margin-top:10px;padding-top:10px;gap:6px}

  /* 播放器全宽 */
  .player{border-radius:10px}
  .player-bar{gap:8px;margin-top:12px}
  .player-bar .btn{flex:1;min-width:0;padding:0 8px;font-size:13px}
  .player-bar select{flex:1;min-width:0}

  /* 云台面板放大触摸区 */
  .ptz{padding:12px 8px;margin-top:12px}
  .ptz-grid{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:8px}
  .ptz-btn{width:52px;height:52px;font-size:16px;border-radius:10px}

  /* 表格横向滚动 */
  table{font-size:12px}
  th,td{padding:10px 12px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* 弹窗全屏 */
  .modal{min-width:auto;width:calc(100vw - 32px);max-width:400px;border-radius:12px}
  .modal-head{padding:16px 18px 0;font-size:15px}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:0 18px 16px}
  .qr-wrap img{width:min(240px,70vw);height:min(240px,70vw)}

  /* Toast 适配 */
  .toast{top:auto;bottom:calc(24px + env(safe-area-inset-bottom));
    left:16px;right:16px;transform:none;justify-content:center;
    animation:slideUp .25s}
  @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* 向导 */
  .wizard-hero{padding:24px 16px 16px}
  .wizard-hero h2{font-size:19px}
  .wizard-hero .logo{width:56px;height:56px}
  .wizard-steps{margin:18px 0;padding:0 12px}
  .wizard-step .num{width:26px;height:26px;font-size:12px}
  .wizard-step .label{font-size:11px}
  .check-item{padding:12px 16px;gap:10px}
  .check-name{font-size:13px}
  .wizard-actions{padding:16px;flex-direction:column}
  .wizard-actions .btn{width:100%}
}

/* ===== 平板 ===== */
@media (min-width:641px) and (max-width:1024px){
  .sider{width:180px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .content{padding:16px}
}

/* ===== 横屏手机 ===== */
@media (max-width:812px) and (orientation:landscape){
  .header{height:48px;height:calc(48px + env(safe-area-inset-top))}
  .content{padding:8px}
  .player{max-height:calc(100vh - 200px)}
}

<script>
(function(){
"use strict";

// ===== 状态 =====
var devices = [];
var page = "devices";
var currentDid = null;
var liveWidth = 0;      // 0 = 2K 原画
var liveMode = "hls";   // hls / mjpeg
var liveTimer = null;
var APP_VER = "";        // 版本号（从 /api/health 拉取）
var DEV_UNLOCKED = false; // 开发者模式是否解锁
var DEV_TAP = 0;          // 本次点击计数

// ===== 工具 =====
function $(s){ return document.querySelector(s); }

// 计算 API 基础路径。
//
// 关键：通过飞牛网关访问时，页面 URL 是 /app/micam/，
// 此时必须请求 /app/micam/api/xxx 而不是 /api/xxx
// （后者会打到飞牛根路径，不是我们的应用）。
var API_BASE = (function(){
  var p = location.pathname;
  // 去掉末尾的 index.html 或 /
  p = p.replace(/\/index\.html$/, "").replace(/\/$/, "");
  // 如果路径以 /app/<name> 结尾，就用它作为前缀
  if (/\/app\/[^/]+$/.test(p)) return p;
  return "";
})();

function apiUrl(path){
  // path 形如 "/api/devices"
  return API_BASE + path;
}

function api(path, opt){ return fetch(apiUrl(path), opt).then(function(r){ return r.json(); }); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function icon(name, size){
  var s = size || 14;
  return "<svg width=\""+s+"\" height=\""+s+"\"><use href=\"#i-"+name+"\"/></svg>";
}
function fmtSize(b){
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(1)+" KB";
  if(b<1073741824) return (b/1048576).toFixed(1)+" MB";
  return (b/1073741824).toFixed(2)+" GB";
}
function toast(msg, type){
  var el = document.createElement("div");
  el.className = "toast" + (type==="ok"?" toast-ok":type==="err"?" toast-err":"");
  el.innerHTML = icon(type==="ok"?"check":type==="err"?"close":"refresh",16) + "<span>"+esc(msg)+"</span>";
  document.body.appendChild(el);
  setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .3s";
    setTimeout(function(){ el.remove(); }, 300); }, 2600);
}
function loading(text){
  return "<div class=\"loading\"><div class=\"spin\"></div><span>"+(text||"加载中…")+"</span></div>";
}
function empty(iconName, title, sub, action){
  return "<div class=\"empty\">"+icon(iconName,56)+"<p>"+esc(title)+"</p>"
    + (sub?"<p class=\"sub\">"+esc(sub)+"</p>":"") + (action||"") + "</div>";
}

// ===== 移动端菜单 =====
function openSider(){
  var s = document.querySelector(".sider");
  var m = document.getElementById("siderMask");
  if(s) s.classList.add("open");
  if(m) m.classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeSider(){
  var s = document.querySelector(".sider");
  var m = document.getElementById("siderMask");
  if(s) s.classList.remove("open");
  if(m) m.classList.remove("show");
  document.body.style.overflow = "";
}
function isMobile(){
  return window.innerWidth <= 640;
}

// ===== 菜单 =====
var MENU = [
  {k:"devices",   t:"设备列表", i:"device"},
  {k:"live",      t:"实时预览", i:"play"},
  {k:"storage",   t:"存储监控", i:"inbox"},
  {k:"recordings",t:"录像管理", i:"rec"},
  {k:"accounts",  t:"账号管理", i:"user"},
  {k:"setup",     t:"安装向导", i:"check"},
  {k:"settings",  t:"系统设置", i:"set"},
  {k:"dev",       t:"开发者",   i:"code", dev:true}
];

function renderMenu(){
  $("#menu").innerHTML = MENU.map(function(m){
    return "<div class=\"menu-item"+(m.k===page?" active":"")+"\" data-k=\""+m.k+"\">"
      + icon(m.i,16) + "<span>"+m.t+"</span></div>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".menu-item"), function(el){
    el.onclick = function(){
      page = el.dataset.k;
      var m = MENU.filter(function(x){ return x.k===page; })[0];
      $("#pageTitle").textContent = m ? m.t : "";
      stopLive();
      renderMenu();
      render();
      if(isMobile()) closeSider();
    };
  });
}

// ===== 绑定移动端交互 =====
(function(){
  var btn = document.getElementById("btnMenu");
  var mask = document.getElementById("siderMask");
  if(btn) btn.onclick = function(e){ e.stopPropagation(); openSider(); };
  if(mask) mask.onclick = closeSider;

  // 窗口变化时重置状态
  var lastMobile = isMobile();
  window.addEventListener("resize", function(){
    var now = isMobile();
    if(now !== lastMobile){
      lastMobile = now;
      if(!now) closeSider();
    }
  });

  // 左滑手势打开菜单（边缘滑动）
  var touchStartX = 0, touchStartY = 0;
  document.addEventListener("touchstart", function(e){
    if(!isMobile()) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener("touchend", function(e){
    if(!isMobile()) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    // 从屏幕左边缘（<30px）右滑，或任意位置右滑 >80px
    if(dy < 60 && dx > 80){
      var s = document.querySelector(".sider");
      if(s && !s.classList.contains("open")) openSider();
    }
    // 左滑关闭
    if(dy < 60 && dx < -80){
      var s2 = document.querySelector(".sider");
      if(s2 && s2.classList.contains("open")) closeSider();
    }
  }, { passive: true });

  // ESC 关闭
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeSider();
  });
})();

// ===== 数据 =====
function loadDevices(){
  return api("/api/devices").then(function(r){
    if(r.needLogin){ devices = []; return {needLogin:true}; }
    devices = r.devices || [];
    return {needLogin:false};
  }).catch(function(e){ return {needLogin:false, error:e.message}; });
}

function render(){
  var c = $("#content");
  if(page==="devices") return renderDevices(c);
  if(page==="live") return renderLive(c);
  if(page==="storage") return renderStorage(c);
  if(page==="recordings") return renderRecordings(c);
  if(page==="accounts") return renderAccounts(c);
  if(page==="setup") return renderWizard(c);
  if(page==="dev") return renderDev(c);
  if(page==="settings") return renderSettings(c);
}

// ===== 页面：设备列表 =====
function renderDevices(c){
  c.innerHTML = loading();
  loadDevices().then(function(st){
    if(st.needLogin){
      c.innerHTML = "<div class=\"card\">" + empty("qr","还没有添加小米账号","请用米家 App 扫码登录",
        "<button class=\"btn btn-primary\" id=\"btnQR\">"+icon("plus")+"扫码添加账号</button>") + "</div>";
      $("#btnQR").onclick = showQR;
      return;
    }
    if(!devices.length){
      c.innerHTML = "<div class=\"card\">" + empty("inbox","没有发现摄像头","","") + "</div>";
      return;
    }
    // 统计（含共享设备）
  var onlineCount = devices.filter(function(d){ return d.isOnline; }).length;
  var sharedCount = devices.filter(function(d){ return d.shared || d.shareFlag===1; }).length;
  var summary = "<div class=\"card\" style=\"margin-bottom:12px\">"
    + "<div style=\"padding:14px 20px;display:flex;gap:24px;flex-wrap:wrap;font-size:13px\">"
    +   "<span>共 <b>" + devices.length + "</b> 台</span>"
    +   "<span style=\"color:var(--success)\">在线 <b>" + onlineCount + "</b></span>"
    +   (sharedCount ? "<span style=\"color:var(--primary)\">共享 <b>" + sharedCount + "</b></span>" : "")
    + "</div></div>";

  var cards = devices.map(function(d){
      var tags = d.isOnline
        ? "<span class=\"tag tag-on\">在线</span>"
        : "<span class=\"tag tag-off\">离线</span>";
      if(d.shared || d.shareFlag===1) tags += "<span class=\"tag tag-share\">共享</span>";
      return "<div class=\"device\">"
        + "<div class=\"dev-preview\" data-did=\""+esc(d.did)+"\">"
        +   "<div class=\"ph\">"+icon("play",32)+"<span>点击预览</span></div>"
        +   "<div class=\"dev-badge\">"+tags+"</div>"
        + "</div>"
        + "<div class=\"dev-body\">"
        +   "<div class=\"dev-name\" title=\""+esc(d.name)+"\">"+esc(d.name)+"</div>"
        +   "<div class=\"dev-meta\">"
        +     "<div><b>型号</b> "+esc(d.model||"—")+"</div>"
        +     "<div><b>IP</b> "+esc(d.localip||"—")+"</div>"
        +     "<div><b>DID</b> "+esc(d.did)+"</div>"
        +   "</div>"
        +   "<div class=\"dev-actions\">"
        +     "<button class=\"btn btn-sm btn-primary\" data-act=\"live\" data-did=\""+esc(d.did)+"\">"+icon("play",12)+"预览</button>"
        +     "<button class=\"btn btn-sm\" data-act=\"snap\" data-did=\""+esc(d.did)+"\">"+icon("snap",12)+"截图</button>"
        +     "<button class=\"btn btn-sm\" data-act=\"rec\" data-did=\""+esc(d.did)+"\">"+icon("rec",12)+"录像</button>"
        +   "</div>"
        + "</div></div>";
    }).join("");
    c.innerHTML = summary + "<div class=\"grid\">"+cards+"</div>";
    bindDeviceActions();
  });
}

function bindDeviceActions(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var did = b.dataset.did, act = b.dataset.act;
      if(act==="live") gotoLive(did);
      else if(act==="snap") snap(did);
      else if(act==="rec") startRec(did);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".dev-preview"), function(el){
    el.onclick = function(){ gotoLive(el.dataset.did); };
  });
}

function gotoLive(did){
  page = "live";
  currentDid = did;
  $("#pageTitle").textContent = "实时预览";
  renderMenu();
  render();
}

// ===== 页面：实时预览 =====
function renderLive(c){
  c.innerHTML = loading();
  loadDevices().then(function(st){
    if(st.needLogin || !devices.length){
      c.innerHTML = "<div class=\"card\">" + empty("inbox","请先添加账号并发现设备","","") + "</div>";
      return;
    }
    var online = devices.filter(function(d){ return d.isOnline; });
    if(!currentDid){
      currentDid = (online[0] || devices[0]).did;
    }
    var tabs = devices.map(function(d){
      return "<button class=\"btn btn-sm"+(d.did===currentDid?" btn-primary":"")+"\" data-tab=\""+esc(d.did)+"\">"
        + (d.isOnline?"":"⊘ ") + esc(d.name) + "</button>";
    }).join("");
    c.innerHTML = "<div class=\"card\">"
      + "<div class=\"card-head\"><span class=\"card-title\">实时画面</span>"
      +   "<span style=\"font-size:12px;color:var(--text-3)\" id=\"liveHint\"></span></div>"
      + "<div class=\"card-body\">"
      +   "<div class=\"tabs\">"+tabs+"</div>"
      +   "<div class=\"player\" id=\"player\">"
      +     "<div class=\"ph\">"+icon("play",40)+"<span>正在连接…</span></div>"
      +   "</div>"
      +   "<div class=\"player-bar\">"
      +     "<button class=\"btn\" id=\"btnStop\">"+icon("stop",12)+"停止</button>"
      +     "<button class=\"btn\" id=\"btnSnap\">"+icon("snap",12)+"截图</button>"
      +     "<button class=\"btn\" id=\"btnRec\">"+icon("rec",12)+"录像</button>"
      +     "<select class=\"btn\" id=\"selMode\" style=\"min-width:120px\">"
      +       "<option value=\"hls\">流畅模式 (HLS)</option>"
      +       "<option value=\"mjpeg\">兼容模式 (MJPEG)</option>"
      +     "</select>"
      +     "<select class=\"btn\" id=\"selQuality\" style=\"min-width:110px\">"
      +       "<option value=\"0\">2K 原画</option>"
      +       "<option value=\"1280\">高清 1280</option>"
      +       "<option value=\"640\">流畅 640</option>"
      +     "</select>"
      +     "<span id=\"liveState\" style=\"font-size:13px;color:var(--text-3);margin-left:auto\"></span>"
      +   "</div>"
      +   "<div class=\"ptz\">"
      +     "<div class=\"ptz-grid\">"
      +       "<div></div>"
      +       "<button class=\"ptz-btn\" data-dir=\"up\" data-ptz=\"3\" title=\"上\">▲</button>"
      +       "<div></div>"
      +       "<button class=\"ptz-btn\" data-dir=\"left\" data-ptz=\"2\" title=\"左\">◀</button>"
      +       "<button class=\"ptz-btn ptz-center\" id=\"ptzHome\" title=\"查询位置\">●</button>"
      +       "<button class=\"ptz-btn\" data-dir=\"right\" data-ptz=\"5\" title=\"右\">▶</button>"
      +       "<div></div>"
      +       "<button class=\"ptz-btn\" data-dir=\"down\" data-ptz=\"4\" title=\"下\">▼</button>"
      +       "<div></div>"
      +     "</div>"
      +     "<div class=\"ptz-info\" id=\"ptzInfo\">云台：点击 ● 查询当前位置</div>"
      +     "<div id=\"credBar\" style=\"margin-top:10px;font-size:12px;display:none;padding:8px 12px;border-radius:8px\"></div>"
      +     "<div style=\"margin-top:10px;font-size:12px\">"
      +       "<a href=\"javascript:;\" id=\"ptzFlipToggle\" style=\"color:var(--primary)\">方向不对？</a>"
      +       "<div id=\"ptzFlipPanel\" style=\"display:none;margin-top:8px;padding:10px 12px;background:var(--hover);border-radius:8px\">"
      +         "<div style=\"color:var(--text-3);margin-bottom:8px\">不同摄像头安装方向不同，可单独调整（按设备记住）</div>"
      +         "<label style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">"
      +           "<input type=\"checkbox\" id=\"flipPan\"> 左右翻转</label>"
      +         "<label style=\"display:flex;align-items:center;gap:8px\">"
      +           "<input type=\"checkbox\" id=\"flipTilt\"> 上下翻转</label>"
      +       "</div>"
      +     "</div>"
      +   "</div>"
      + "</div></div>";
    Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function(b){
      b.onclick = function(){ currentDid = b.dataset.tab; stopLive(); render(); };
    });
    $("#btnStop").onclick = stopLive;
    loadCredBar();
    $("#selQuality").onchange = function(){
      liveWidth = parseInt(this.value, 10) || 0;
      if(currentDid) startLive(currentDid);
    };
    $("#selMode").onchange = function(){
      liveMode = this.value;
      if(currentDid) startLive(currentDid);
    };
    $("#btnSnap").onclick = function(){ snap(currentDid); };
    $("#btnRec").onclick = function(){ startRec(currentDid); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-ptz]"), function(b){
      b.onclick = function(){
        var op = parseInt(b.dataset.ptz, 10);
        var dir = b.dataset.dir;
        // 应用每台设备的方向翻转
        if(dir === "left" || dir === "right"){
          if(ptzFlip().pan) op = (dir === "left") ? 5 : 2;
        }
        if(dir === "up" || dir === "down"){
          if(ptzFlip().tilt) op = (dir === "up") ? 4 : 3;
        }
        ptzMove(op);
      };
    });
    // 翻转面板
    var ft = $("#ptzFlipToggle");
    if(ft) ft.onclick = function(){
      var panel = $("#ptzFlipPanel");
      if(panel) panel.style.display = (panel.style.display === "none") ? "block" : "none";
    };
    var fp = $("#flipPan");
    if(fp){
      fp.checked = ptzFlip().pan;
      fp.onchange = function(){ setPtzFlip("pan", this.checked); };
    }
    var fti = $("#flipTilt");
    if(fti){
      fti.checked = ptzFlip().tilt;
      fti.onchange = function(){ setPtzFlip("tilt", this.checked); };
    }
    $("#ptzHome").onclick = ptzStatus;
    startLive(currentDid);
  });
}

function startLive(did){
  var box = $("#player");
  var st = $("#liveState");
  var hint = $("#liveHint");
  if(!box) return;
  var dev = devices.filter(function(d){ return d.did===did; })[0];
  if(dev && !dev.isOnline){
    box.innerHTML = "<div class=\"ph\">"+icon("cam-off",40)+"<span>设备离线，无法播放</span></div>";
    if(st) st.textContent = "离线";
    return;
  }

  if(liveMode === "hls"){ startLiveHLS(did); return; }
  startLiveMJPEG(did);
}

// HLS 播放（推荐：2K 流畅，CPU 低）
function startLiveHLS(did){
  var box = $("#player");
  var st = $("#liveState");
  var hint = $("#liveHint");
  if(!box) return;

  // ---- 构建 DOM：video 在底层，overlay 在上层 ----
  //
  // 关键：不能先设 innerHTML 再清空，否则 overlay 会被删掉，
  // 表现就是「黑屏但没有转圈」。
  var video = document.createElement("video");
  video.id = "liveVideo";
  video.style.cssText = "width:100%;height:100%;object-fit:contain;display:block;background:#000;position:absolute;inset:0";
  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  video.controls = false;

  var overlay = document.createElement("div");
  overlay.className = "loading-overlay";
  overlay.id = "liveOverlay";
  overlay.innerHTML = "<div class=\"spin\"></div>"
    + "<div class=\"txt\" id=\"liveStep\">正在连接摄像头…</div>"
    + "<div style=\"width:200px\"><div class=\"progress\" style=\"margin-top:0\">"
    +   "<div class=\"progress-bar\" id=\"liveBar\" style=\"width:5%\"></div>"
    + "</div></div>"
    + "<div class=\"txt\" id=\"livePct\" style=\"font-size:12px;opacity:.7\">5%</div>";

  box.style.position = "relative";
  box.innerHTML = "";
  box.appendChild(video);     // 底层
  box.appendChild(overlay);   // 上层（后加的在上）

  // ---- 进度推进 ----
  var pct = 5;
  var stepIdx = 0;
  var steps = [
    [20, "正在连接摄像头…"],
    [55, "启动视频流（约 5 秒）…"],
    [85, "即将播放…"]
  ];

  var progTimer = setInterval(function(){
    stepIdx++;
    if(stepIdx < steps.length){
      pct = steps[stepIdx][0];
    } else {
      pct = Math.min(pct + 1, 92);
    }
    var bar = document.getElementById("liveBar");
    var pctEl = document.getElementById("livePct");
    var stp = document.getElementById("liveStep");
    if(bar) bar.style.width = pct + "%";
    if(pctEl) pctEl.textContent = pct + "%";
    if(stp && stepIdx < steps.length) stp.textContent = steps[stepIdx][1];
  }, 1200);

  var cleared = false;
  function clearProg(){
    if(cleared) return;
    cleared = true;
    if(progTimer) clearInterval(progTimer);
    var ov = document.getElementById("liveOverlay");
    if(ov) ov.remove();
  }
  function showError(msg){
    if(cleared) return;
    var stp = document.getElementById("liveStep");
    if(stp){ stp.textContent = msg; stp.style.color = "#ff7875"; }
    var sp = overlay.querySelector(".spin");
    if(sp) sp.style.display = "none";
    if(progTimer) clearInterval(progTimer);
  }

  if(st) st.textContent = "连接中";
  if(hint) hint.textContent = "HLS 模式（2K 流畅）";

  // 说明：不再用抓拍图占位。
  //
  // 服务端已改成「连接共享」架构——同一摄像头的多个请求复用一条 cs2 连接。
  // 实测热连接下 HLS 只要 0.01s，冷连接 5s。
  // 抓拍占位反而会多一次请求，可能和 HLS 抢连接（旧架构下会等 60 秒）。

  var src = apiUrl("/api/live/hls?did="+encodeURIComponent(did)+"&fps=15&w="+liveWidth);
  var started = false;
  var hlsObj = null;

  function ok(){
    if(started) return;
    started = true;
    if(st) st.textContent = "播放中";
    clearProg();
  }

  function fallback(reason){
    if(started) return;
    console.log("[micam] HLS 失败，降级 MJPEG: " + reason);
    if(hint) hint.textContent = reason + "，已切到兼容模式";
    loadCredBar();   // 失败时检查是不是凭据/限流问题
    if(hlsObj){ try { hlsObj.destroy(); } catch(e){} }
    cleared = false;              // 允许 MJPEG 重建覆盖层
    clearProg();
    liveMode = "mjpeg";
    var sel = document.getElementById("selMode");
    if(sel) sel.value = "mjpeg";
    startLiveMJPEG(did);
  }

  if(video.canPlayType("application/vnd.apple.mpegurl")){
    // Safari 原生 HLS
    video.src = src;
    video.onplaying = ok;
    video.onerror = function(){ fallback("HLS 播放失败"); };
  } else if(window.Hls && window.Hls.isSupported()){
    hlsObj = new window.Hls({
      // 延迟优化：只缓冲 1 个分片（原来是 2）
      lowLatencyMode: true,
      liveSyncDurationCount: 1,
      liveMaxLatencyDurationCount: 3,
      maxBufferLength: 4,
      manifestLoadingTimeOut: 15000,
      fragLoadingTimeOut: 15000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      levelLoadingMaxRetry: 3,
      fragLoadingMaxRetry: 3
    });
    hlsObj.loadSource(src);
    hlsObj.attachMedia(video);
    hlsObj.on(window.Hls.Events.ERROR, function(e, data){
      if(!data || !data.fatal) return;
      console.log("[micam] hls.js 致命错误: " + data.type + "/" + data.details);
      showError("播放失败：" + data.details);
      setTimeout(function(){ fallback("HLS 加载失败"); }, 800);
    });
    video.onplaying = ok;
  } else {
    fallback(window.__hlsFailed ? "hls.js 加载失败" : "浏览器不支持 HLS");
    return;
  }

  video.play().catch(function(){});

  // 兜底：20 秒还没画面就降级
  if(liveTimer) clearTimeout(liveTimer);
  liveTimer = setTimeout(function(){
    if(started) return;
    if(video.readyState >= 2){
      ok();
      return;
    }
    fallback("HLS 超时（12 秒无画面）");
  }, 12000);
}

// MJPEG 播放（兼容模式）
function startLiveMJPEG(did){
  var box = $("#player");
  var st = $("#liveState");
  var hint = $("#liveHint");
  // 进度覆盖层（在画面内显示，不在外面）

  var pct = 0;
  // 说明：部分机型（如 CW500）关键帧间隔长达 15 秒以上，
  // 首帧可能要等 20-40 秒，所以进度提示要耐心。
  var steps = [
    [5,  "正在连接摄像头…"],
    [15, "建立 P2P 通道…"],
    [30, "等待视频流…"],
    [50, "等待关键帧（部分机型较慢）…"],
    [70, "解码首帧…"],
    [85, "即将显示…"]
  ];

  // 进度覆盖层直接放在画面里
  box.innerHTML = "<div class=\"loading-overlay\" id=\"liveOverlay\">"
    + "<div class=\"spin\"></div>"
    + "<div class=\"txt\" id=\"liveStep\">正在连接摄像头…</div>"
    + "<div style=\"width:200px\"><div class=\"progress\" style=\"margin-top:0\">"
    +   "<div class=\"progress-bar\" id=\"liveBar\" style=\"width:5%\"></div>"
    + "</div></div>"
    + "<div class=\"txt\" id=\"livePct\" style=\"font-size:12px;opacity:.7\">5%</div>"
    + "</div>";

  var stepIdx = 0;
  var progTimer = setInterval(function(){
    stepIdx++;
    if(stepIdx < steps.length){
      pct = steps[stepIdx][0];
      var bar = document.getElementById("liveBar");
      var stp = document.getElementById("liveStep");
      var pctEl = document.getElementById("livePct");
      if(bar) bar.style.width = pct + "%";
      if(stp) stp.textContent = steps[stepIdx][1];
      if(pctEl) pctEl.textContent = pct + "%";
    } else {
      pct = Math.min(pct + 1, 95);
      var bar2 = document.getElementById("liveBar");
      var pctEl2 = document.getElementById("livePct");
      if(bar2) bar2.style.width = pct + "%";
      if(pctEl2) pctEl2.textContent = pct + "%";
    }
  }, 2500);

  function clearProg(){
    if(progTimer) clearInterval(progTimer);
    var ov = document.getElementById("liveOverlay");
    if(ov) ov.remove();
  }
  window.__clearProg = clearProg;
  if(st) st.textContent = "连接中";
  if(hint) hint.textContent = "首次连接约 3-10 秒";

  var img = new Image();
  img.style.cssText = "width:100%;height:100%;object-fit:contain;display:block";
  img.onload = function(){
    if(st) st.textContent = "播放中";
    if(hint) hint.textContent = "";
    if(window.__clearProg) window.__clearProg();
  };
  // MJPEG 是流，onload 可能不触发，用定时器兜底清除
  setTimeout(function(){
    if(window.__clearProg) window.__clearProg();
  }, 45000);
  img.onerror = function(){
    box.innerHTML = "<div class=\"ph\">"+icon("cam-off",40)+"<span>播放失败</span></div>";
    if(st) st.textContent = "失败";
    if(hint) hint.textContent = "摄像头可能被米家 App 占用";
    if(window.__clearProg) window.__clearProg();
  };
  // 画质参数：w=0 表示不缩放（保持源分辨率 2K = 2560x1440）
  // 需要降低带宽时可以改成 w=1280 或 w=640
  img.src = apiUrl("/api/live/mjpeg?did="+encodeURIComponent(did)+"&fps=12&w="+liveWidth+"&t="+Date.now());

  // 关键：不能清空后再放 img，否则加载层被删掉（黑屏无转圈）。
  // 顺序：清空 -> img（底层）-> overlay（上层）
  img.style.position = "absolute";
  img.style.inset = "0";
  img.style.width = "100%";
  img.style.height = "100%";
  img.style.objectFit = "contain";
  box.style.position = "relative";
  box.innerHTML = "";
  box.appendChild(img);

  var ov = document.getElementById("liveOverlay");
  if(!ov){
    ov = document.createElement("div");
    ov.className = "loading-overlay";
    ov.id = "liveOverlay";
    ov.innerHTML = "<div class=\"spin\"></div>"
      + "<div class=\"txt\">正在连接摄像头…</div>";
    box.appendChild(ov);
  } else {
    // 重新挂到最上层
    box.appendChild(ov);
  }

  // 首帧到达时移除加载层
  img.onload = function(){
    if(st) st.textContent = "播放中";
    if(hint) hint.textContent = "兼容模式（MJPEG）";
    if(window.__clearProg) window.__clearProg();
  };
  // MJPEG 是无限流，onload 可能不触发，用定时器兜底
  if(liveTimer) clearTimeout(liveTimer);
  liveTimer = setTimeout(function(){
    if(st && st.textContent === "连接中"){
      st.textContent = "已连接";
      if(hint) hint.textContent = "";
    }
    if(window.__clearProg) window.__clearProg();
  }, 40000);   // 部分机型首帧慢，给 40 秒
}

function stopLive(){
  if(liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
  var box = $("#player");
  if(box){
    var img = box.querySelector("img");
    if(img) img.src = "";
    box.innerHTML = "<div class=\"ph\">"+icon("play",40)+"<span>已停止</span></div>";
  }
  var st = $("#liveState");
  if(st) st.textContent = "已停止";
}

// ===== 云台控制 =====
function ptzStatus(){
  var info = $("#ptzInfo");
  if(!currentDid) return;
  if(info) info.textContent = "云台：查询中…";

  var timeoutId = setTimeout(function(){
    if(info) info.textContent = "云台：查询超时";
  }, 8000);

  api("/api/ptz/status?did="+encodeURIComponent(currentDid)).then(function(r){
    clearTimeout(timeoutId);
    if(info) info.textContent = "云台：水平 " + r.angle + "° / 俯仰 " + r.elevation + "°";
  }).catch(function(e){
    clearTimeout(timeoutId);
    if(info) info.textContent = "云台：查询失败（" + e.message + "）";
  });
}

function ptzMove(op){
  var info = $("#ptzInfo");
  var btns = document.querySelectorAll("[data-ptz]");
  Array.prototype.forEach.call(btns, function(b){ b.disabled = true; });
  if(info) info.textContent = "云台：执行中…";

  // 重要：cs2 同一设备只允许一路连接。
  // 云台操作会挤掉视频流，所以先主动断开视频，操作完再重连。
  var img = document.querySelector("#liveImg");
  var wasPlaying = img && img.src;
  if(img && wasPlaying){
    img.src = "";
  }

  // 5 秒超时保护（避免按钮永久卡住）
  var timeoutId = setTimeout(function(){
    Array.prototype.forEach.call(btns, function(b){ b.disabled = false; });
    if(info) info.textContent = "云台：超时（摄像头可能忙）";
  }, 8000);

  api("/api/ptz/move", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({did: currentDid, operation: op})
  }).then(function(r){
    clearTimeout(timeoutId);
    Array.prototype.forEach.call(btns, function(b){ b.disabled = false; });
    if(r.ok){
      if(info) info.textContent = "云台：水平 " + r.angle + "° / 俯仰 " + r.elevation + "°";
    } else {
      if(info) info.textContent = "云台：失败 ret=" + r.ret;
    }
    // 恢复视频（延迟 1.5 秒让摄像头释放连接）
    if(wasPlaying){
      setTimeout(function(){ startLive(currentDid); }, 1500);
    }
  }).catch(function(e){
    clearTimeout(timeoutId);
    Array.prototype.forEach.call(btns, function(b){ b.disabled = false; });
    if(info) info.textContent = "云台：失败（" + e.message + "）";
    if(wasPlaying){
      setTimeout(function(){ startLive(currentDid); }, 1500);
    }
  });
}

// 大小格式化（GB）
function fmtSize(v, unit){
  if(v == null) return "—";
  if(v < 0.01) return (v * 1024).toFixed(0) + " MB";
  if(v < 1) return v.toFixed(2) + " GB";
  return v.toFixed(1) + " GB";
}
// 大小格式化（MB 输入）
function fmtSizeMB(v){
  if(v == null) return "—";
  if(v < 1) return (v * 1024).toFixed(0) + " KB";
  if(v < 1024) return v.toFixed(1) + " MB";
  return (v / 1024).toFixed(2) + " GB";
}

// 加载录像文件（带缩略图）
function loadRecFiles(){
  var box = $("#files");
  if(!currentRecName){ box.innerHTML = empty("inbox","请选择设备查看录像","",""); return; }
  var date = ($("#recDate") || {}).value || "";
  box.innerHTML = loading("加载中…");

  var q = "name=" + encodeURIComponent(currentRecName) + (date ? "&date=" + encodeURIComponent(date) : "");
  api("/api/recordings/list?" + q).then(function(r){
    var files = r.files || [];
    if(!files.length){ box.innerHTML = empty("inbox","该设备暂无录像","",""); return; }

    // 按日期分组
    var byDate = {};
    files.forEach(function(f){

          +   "<div class=\"rec-thumb\" data-play='" + JSON.stringify({n:currentRecName, d:f.date, f:f.name}) + "'>"
          +     "<img loading=\"lazy\" src=\"" + apiUrl(f.thumbUrl) + "\" alt=\"\" onerror=\"this.style.display='none'\">"
          +     "<div class=\"rec-play\">▶</div>"
          +     "<div class=\"rec-dur\">" + fmtDur(f.duration) + "</div>"
          +   "</div>"

  });

// ===== 导出片段 =====
//
// 为什么要两步（先转码再下载）：
//   转码需要时间（2K 素材约 0.6 倍速）。
//   如果直接流式返回，用户看到的是「点了没反应」。
//   所以先创建任务，轮询进度，完成后再给下载链接。
function showExportPanel(video){
  var panel = $("#exportPanel");
  if(!panel || !currentRecFile) return;

  var dur = (video && isFinite(video.duration)) ? video.duration : 0;
  var cur = (video && isFinite(video.currentTime)) ? video.currentTime : 0;
  var end = dur > 0 ? Math.min(dur, cur + 30) : (cur + 30);

  panel.style.display = "block";
  panel.innerHTML = ""
    + "<div class=\"cfg-row\">"
    +   "<div class=\"cfg-label\">开始</div>"
    +   "<input class=\"btn cfg-input\" id=\"expStart\" type=\"number\" step=\"0.1\" min=\"0\" value=\"" + cur.toFixed(1) + "\">"
    +   "<div class=\"cfg-hint\">秒</div>"
    + "</div>"
    + "<div class=\"cfg-row\">"
    +   "<div class=\"cfg-label\">结束</div>"
    +   "<input class=\"btn cfg-input\" id=\"expEnd\" type=\"number\" step=\"0.1\" min=\"0\" value=\"" + end.toFixed(1) + "\">"
    +   "<div class=\"cfg-hint\">秒" + (dur > 0 ? "（总长 " + fmtDur(dur) + "）" : "") + "</div>"
    + "</div>"
    + "<div class=\"btn-group\" style=\"margin-top:10px\">"
    +   "<button class=\"btn btn-primary\" id=\"btnDoExport\">开始导出</button>"
    +   "<button class=\"btn\" id=\"btnHideExport\">取消</button>"
    + "</div>"
    + "<div id=\"exportResult\" style=\"margin-top:10px\"></div>";

  $("#btnHideExport").onclick = function(){ panel.style.display = "none"; };
  $("#btnDoExport").onclick = function(){
    var s = parseFloat(($("#expStart")||{}).value) || 0;
    var e = parseFloat(($("#expEnd")||{}).value) || 0;
    if(e <= s){ toast("结束时间必须大于开始时间", "err"); return; }
    doExport(s, e);
  };
}

function doExport(start, end){
  var box = $("#exportResult");
  if(box) box.innerHTML = "<div style=\"font-size:12px;color:var(--text-3)\">正在创建导出任务…</div>";

  api("/api/recordings/export", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: currentRecFile.n, date: currentRecFile.d, file: currentRecFile.f,
      start: start, end: end
    })
  }).then(function(r){
    if(box) box.innerHTML = "<div style=\"font-size:12px;color:var(--text-3)\">转码中…（0%）</div>";
    pollExport(r.id, box);
  }).catch(function(e){
    if(box) box.innerHTML = "<div style=\"color:var(--error);font-size:12px\">创建失败：" + esc(e.message) + "</div>";
  });
}

function pollExport(id, box){
  var n = 0;
  var t = setInterval(function(){
    n++;
    api("/api/recordings/export/status?id=" + encodeURIComponent(id)).then(function(j){
      if(j.status === "done"){
        clearInterval(t);
        if(box) box.innerHTML = ""
          + "<div style=\"font-size:12px;color:var(--success);margin-bottom:8px\">"
          +   "✅ 导出完成（" + fmtSizeMB(j.sizeMB||0) + "）</div>"
          + "<a class=\"btn btn-primary btn-sm\" href=\"" + apiUrl("/api/recordings/export/download?id=" + id) + "\" download>下载 MP4</a>";
      } else if(j.status === "failed"){
        clearInterval(t);
        if(box) box.innerHTML = "<div style=\"color:var(--error);font-size:12px\">导出失败：" + esc(j.error||"") + "</div>";
      } else {
        // 估算进度（2K 约 0.6 倍速，粗略显示）
        var pct = Math.min(95, Math.round((j.end - j.start) * 0.6 * n * 2));
        if(box) box.innerHTML = "<div style=\"font-size:12px;color:var(--text-3)\">转码中…（约 " + pct + "%）</div>";
      }
    }).catch(function(){});
    if(n > 300) clearInterval(t);   // 最多轮询 5 分钟
  }, 1000);
}

// 时长格式化
function fmtDur(sec){
  if(!sec || sec <= 0) return "—";
  var m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

// 播放录像
function playRec(info){
  currentRecFile = info;
  var card = $("#playerCard");
  var video = $("#recVideo");
  var infoBox = $("#playInfo");
  if(!card || !video) return;

  card.style.display = "block";
  $("#playTitle").textContent = "回放 · " + info.f;
  infoBox.textContent = "正在转码…（首次较慢，之后会缓存加速）";

  var url = apiUrl("/api/recordings/play?name=" + encodeURIComponent(info.n)
    + "&date=" + encodeURIComponent(info.d)
    + "&file=" + encodeURIComponent(info.f));

  video.src = url;
  video.load();
  video.play().catch(function(){});

  video.oncanplay = function(){ infoBox.textContent = "时长 " + fmtDur(video.duration) + " · " + info.f; };
  video.onloadeddata = function(){
    // 缓存命中时 Content-Length 存在 -> 可拖动
    infoBox.textContent = "时长 " + fmtDur(video.duration) + " · " + info.f
      + (cached ? " · 已缓存（可拖动）" : " · 转码中（首次播放）");
  };
  var cached = false;
  fetch(url, { method: "HEAD" }).then(function(r){
    cached = (r.headers.get("accept-ranges") === "bytes");
  }).catch(function(){});
  video.onerror = function(){ infoBox.textContent = "播放失败（可能转码中，稍候重试）"; };

  card.scrollIntoView({ behavior: "smooth", block: "start" });

  var ebtn = $("#btnExportClip");
  if(ebtn) ebtn.onclick = function(){ showExportPanel(video); };

  var dbtn = $("#btnDownload");
  if(dbtn) dbtn.onclick = function(){
    window.open(apiUrl("/api/recordings/download?name=" + encodeURIComponent(info.n)
      + "&date=" + encodeURIComponent(info.d) + "&file=" + encodeURIComponent(info.f)), "_blank");
  };
}

// 删除录像
function delRec(info){
  if(!confirm("删除这个录像文件？\n" + info.f + "\n\n不可恢复。")) return;
  api("/api/recordings/delete", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: info.n, date: info.d, file: info.f })
  }).then(function(r){
    toast("已删除，释放 " + fmtSizeMB(r.freedMB || 0), "ok");
    loadRecFiles();
  }).catch(function(e){ toast("删除失败：" + e.message, "err"); });
}

// ===== 凭据状态提示 =====
//
// 为什么要显示：cs2 凭据有有效期（实测 8 小时），
// 过期后需要向小米云申请，而小米云有限流。
// 限流期间用户什么都不做就一直是黑屏 —— 必须让他知道原因。
function loadCredBar(){
  var bar = $("#credBar");
  if(!bar) return;
  api("/api/live/cred-status").then(function(d){
    var devs = d.devices || [];
    var dev = null;
    for(var i=0;i<devs.length;i++){ if(devs[i].did === currentDid){ dev = devs[i]; break; } }
    if(!dev || !dev.hasCred){ bar.style.display = "none"; return; }

    var msg = "", bg = "", color = "";
    if(dev.cooldownMinutes > 0){
      bg = "rgba(255,77,79,.12)"; color = "var(--error)";
      msg = "⚠️ 摄像头凭据需要刷新，但小米云正在限流。约 " + dev.cooldownMinutes + " 分钟后自动重试。"
          + "<br>期间可能无法播放。可稍后再试，或重启路由器换个出口 IP。";
    } else if(dev.expiresInMinutes < 60){
      bg = "rgba(250,173,20,.12)"; color = "var(--warning)";
      msg = "⚠️ 摄像头凭据约 " + dev.expiresInMinutes + " 分钟后过期，到期会自动续期。";
    } else {
      return;   // 正常状态不打扰
    }

    bar.style.display = "block";
    bar.style.background = bg;
    bar.style.color = color;
    bar.innerHTML = msg
      + "<div style=\"margin-top:8px\">"
      +   "<button class=\"btn btn-sm\" id=\"btnRenew\">立即重试刷新</button>"
      + "</div>";

    var btn = $("#btnRenew");
    if(btn) btn.onclick = function(){
      btn.disabled = true;
      btn.textContent = "刷新中…";
      api("/api/live/renew?did=" + encodeURIComponent(currentDid), { method: "POST" })
        .then(function(r){
          var res = (r.results || [])[0] || {};
          if(res.ok){
            toast("凭据已刷新", "ok");
            loadCredBar();
          } else {
            toast("刷新失败：" + (res.error || "未知错误"), "err");
          }
        })
        .catch(function(e){ toast("刷新失败：" + e.message, "err"); })
        .then(function(){ btn.disabled = false; btn.textContent = "立即重试刷新"; });
    };
  }).catch(function(){});
}

// ===== 云台方向翻转（按设备记住）=====
//
// 为什么需要：不同摄像头安装方向不同（正装/倒装/侧装），
// 实测 CW300 的云台方向与标称不一致。
// 让用户在界面上自己校正，比在代码里写死更灵活。
function ptzFlipKey(axis){
  return "micam.flip." + axis + "." + (currentDid || "default");
}
function ptzFlip(){
  return {
    pan:  localStorage.getItem(ptzFlipKey("pan")) === "1",
    tilt: localStorage.getItem(ptzFlipKey("tilt")) === "1"
  };
}
function setPtzFlip(axis, on){
  localStorage.setItem(ptzFlipKey(axis), on ? "1" : "0");
  toast(axis === "pan" ? "左右方向已保存" : "上下方向已保存", "ok");
}

// ===== 动作 =====
function snap(did){
  toast("正在抓图…");
  fetch(apiUrl("/api/live/snapshot?did="+encodeURIComponent(did)+"&w=0"))
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.blob(); })
    .then(function(b){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = did+"_"+Date.now()+".jpg";
      a.click();
      toast("截图已保存","ok");
    })
    .catch(function(e){ toast("截图失败："+e.message,"err"); });
}

function startRec(did){
  api("/api/recordings", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({did:did})
  }).then(function(r){
    if(r.ok) toast("已开始录像","ok");
    else toast(r.msg||"启动失败","err");
  }).catch(function(e){ toast("启动失败："+e.message,"err"); });
}

function stopRec(did){
  api("/api/recordings/stop", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({did:did})
  }).then(function(){ toast("已停止录像","ok"); render(); });
}

function cleanup(){
  api("/api/recordings/cleanup", {method:"POST"}).then(function(r){
    toast("已清理 "+(r.deleted||0)+" 个文件，释放 "+(r.freedMB||0)+" MB","ok");
  });
}

// ===== 扫码登录 =====
function showQR(){
  var mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = "<div class=\"modal\">"
    + "<div class=\"modal-head\">扫码添加小米账号</div>"
    + "<div class=\"modal-body\"><div class=\"qr-wrap\" id=\"qrWrap\">"+loading("正在获取二维码…")+"</div></div>"
    + "<div class=\"modal-foot\"><button class=\"btn\" id=\"qrClose\">关闭</button></div></div>";
  document.body.appendChild(mask);
  var timer = null;
  mask.querySelector("#qrClose").onclick = function(){ if(timer) clearInterval(timer); mask.remove(); };
  mask.onclick = function(e){ if(e.target===mask){ if(timer) clearInterval(timer); mask.remove(); } };

  api("/api/accounts/qr", {method:"POST"}).then(function(r){
    if(!r.id){
      mask.querySelector("#qrWrap").innerHTML = empty("close","获取失败", r.msg||"","");
      return;
    }
    mask.querySelector("#qrWrap").innerHTML =
      "<img src=\""+r.qrBase64+"\" alt=\"二维码\"><div class=\"qr-tip\">请用 <b>米家 App</b> 扫码登录</div>";
    timer = setInterval(function(){
      api("/api/accounts/qr/status?id="+encodeURIComponent(r.id)).then(function(s){
        if(s.state==="success"){
          clearInterval(timer); mask.remove();
          toast("登录成功","ok");
          loadDevices().then(function(){ render(); });
        } else if(s.state==="scanned"){
          var tip = mask.querySelector(".qr-tip");
          if(tip) tip.innerHTML = "已扫码，请在手机上确认";
        } else if(s.state==="failed"){
          clearInterval(timer);
          mask.querySelector("#qrWrap").innerHTML = empty("close","登录失败", s.error||"","");
        }
      });
    }, 2000);
  }).catch(function(e){
    mask.querySelector("#qrWrap").innerHTML = empty("close","错误", e.message,"");
  });
}

// ===== 宿主 SDK 集成 =====
function initSDK(){
  // 动态加载宿主 SDK（失败则降级为独立模式）
  import("https://unpkg.com/@trimjs/web-app/dist/index.js")
    .then(function(m){
      var app = new m.TrimApp();
      return app.getPlatformConfig().then(function(c){
        if(c.theme === "dark") document.documentElement.dataset.theme = "dark";
        var el = document.getElementById("sysInfo");
        if(el) el.textContent = "系统 " + (c.systemVersion || "") + " · " + (c.language || "");
        if(app.isWeb === true && app.isStandaloneWeb === false){
          app.$on("os/theme", function(t){
            document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
          });
        }
        return app.setTitle("小米摄像头");
      });
    })
    .catch(function(){
      var el = document.getElementById("sysInfo");
      if(el) el.textContent = "独立模式";
    });
}

        + "<tr><td style=\"color:var(--text-3)\">核心数</td><td>" + (hw.cpuCores || "-") + "</td></tr>"
        + "<tr><td style=\"color:var(--text-3)\">核显</td><td>" + (hw.hasDRI ? "有" : "无") + "</td></tr>"
        + "<tr><td style=\"color:var(--text-3)\">GPU</td><td style=\"word-break:break-all\">" + esc(hw.gpuInfo || "-") + "</td></tr>"
        + "<tr><td style=\"color:var(--text-3)\">首选编码器</td><td>" + esc(hw.preferred || "-") + "</td></tr>"
        + "<tr><td style=\"color:var(--text-3)\">可用编码器</td><td>" + esc(enc) + "</td></tr>"
        + "<tr><td style=\"color:var(--text-3)\">Go 版本</td><td>" + esc((r.runtime||{}).goVersion || "-") + "</td></tr>"
        + "<tr><td style=\"color:var(--text-3)\">设备数</td><td>" + ((r.devices||[]).length) + "</td></tr>"
        + "</table>";

  if(t.id === "btnShowLog"){
    var box2 = document.getElementById("diagResult");
    if(box2) box2.innerHTML = loading("加载中…");
    fetch(apiUrl("/api/diag/bundle")).then(function(resp){

      var el2 = document.getElementById("diagResult");
      if(el2) el2.innerHTML = "<div style=\"font-size:13px;color:var(--text-3)\">日志已包含在诊断包中，请点击「导出诊断包」下载查看。</div>";
    }).catch(function(){
      var el3 = document.getElementById("diagResult");
      if(el3) el3.innerHTML = "<div style=\"font-size:13px;color:var(--text-3)\">请点击「导出诊断包」下载日志。</div>";
    });
  }
});

// ===== 加载 hls.js（HLS 播放库）=====
//
// 注意：优先用 CDN，失败时降级到 MJPEG 模式。
// 如果要离线使用，可以把 hls.min.js 放到 www/ 目录，改用本地路径。
(function(){
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
  s.onerror = function(){
    console.warn("hls.js 加载失败，将自动使用 MJPEG 模式");
    window.__hlsFailed = true;
  };
  s.onload = function(){ window.__hlsReady = true; };
  document.head.appendChild(s);
})();

// ===== 开放模式（开发者选项）解锁 =====
//
// 参照 Android：连续点击版本号 7 次解锁。
function bindDevUnlock(){
  var el = document.getElementById("appVer");
  if(!el) return;
  el.onclick = function(){
    if(DEV_UNLOCKED){
      toast("开发者模式已开启", "ok");
      return;
    }
    DEV_TAP++;
    api("/api/dev/tap", { method: "POST" }).then(function(r){
      if(r.unlocked){
        DEV_UNLOCKED = true;
        toast("🔓 开发者模式已开启", "ok");
        renderMenu();
      } else {
        var left = r.remaining || (7 - DEV_TAP);
        toast("再点击 " + left + " 次开启开发者模式");
      }
    }).catch(function(){
      var left = 7 - DEV_TAP;
      if(left > 0) toast("再点击 " + left + " 次开启开发者模式");
    });
  };
}
