  font-size: var(--text-lg); font-weight: var(--weight-medium);
  margin-bottom: var(--space-3);
}
.ai-answer__head .icon { color: var(--accent); }
.ai-answer__meta { margin-left: auto; font-size: var(--text-sm); color: var(--text-muted); font-weight: var(--weight-normal); }
.ai-answer__retry { margin-left: var(--space-3); }

.ai-answer__conclusion {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-lg);
  font-size: var(--text-lg);
}
.ai-answer__conclusion.is-ok { background: rgba(34,197,94,.12); color: #4ade80; }
.ai-answer__conclusion.is-none { background: rgba(245,158,11,.12); color: var(--warning); }
.ai-answer__sub { margin-top: var(--space-2); font-size: var(--text-base); color: var(--text-muted); }

.ai-evidence {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  margin-top: var(--space-5);
}
@media (max-width: 1000px) { .ai-evidence { grid-template-columns: 1fr; } }
.ai-evidence__label { font-size: var(--text-base); color: var(--text-secondary); margin-bottom: var(--space-3); }

.ai-evidence__box {
  display: grid; gap: var(--space-4);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
@media (max-width: 700px) { .ai-evidence__box { grid-template-columns: 1fr; } }

.ai-evidence__img { position: relative; aspect-ratio: 16/9; border-radius: var(--radius-md); overflow: hidden; background: #0a0d12; }
.ai-evidence__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-evidence__ts {
  position: absolute; top: 8px; right: 8px; padding: 2px 8px;
  border-radius: var(--radius-sm); background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-sm);
}
.ai-evidence__play {
  position: absolute; left: 8px; bottom: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-sm);
}
.ai-evidence__info { display: flex; flex-direction: column; gap: 6px; }
.ai-evidence__dev { display: flex; align-items: center; gap: 5px; font-size: var(--text-sm); color: var(--text-muted); }
.ai-evidence__title { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.2; }
.ai-evidence__meta { display: flex; align-items: center; gap: 5px; font-size: var(--text-base); color: var(--text-secondary); }
.ai-evidence__desc { font-size: var(--text-base); color: var(--text-muted); line-height: 1.6; margin-top: 4px; }
.ai-evidence__play-btn { margin-top: auto; width: 100%; }

/* 关键时刻 */
.ai-moments { display: flex; flex-direction: column; gap: var(--space-4); padding-left: 6px; }
.ai-moment { position: relative; padding-left: var(--space-5); }
.ai-moment::before {
  content: ""; position: absolute; left: 3px; top: 14px; bottom: -14px;
  width: 2px; background: var(--border);
}
.ai-moment:last-child::before { display: none; }
.ai-moment__dot {
  position: absolute; left: 0; top: 5px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
}
.ai-moment__body { font-size: var(--text-base); color: var(--text-secondary); line-height: 1.6; }
.ai-moment__body b { color: var(--text); }
.ai-moment__sub { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
.ai-moments__hint { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }

.ai-related { margin-top: var(--space-5); }
.ai-related__grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .ai-related__grid { grid-template-columns: repeat(2, 1fr); } }

/* ---- 调查 ---- */
.ai-inv-wrap {
  display: grid; gap: var(--space-5);
  grid-template-columns: 300px minmax(0, 1fr);
  align-items: start;
}
@media (max-width: 1000px) { .ai-inv-wrap { grid-template-columns: 1fr; } }

.ai-inv-list {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.ai-inv-list__head {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-lg); font-weight: var(--weight-medium);
}
.ai-inv-list__head .btn { margin-left: auto; }
.ai-inv-empty { padding: var(--space-6); text-align: center; color: var(--text-muted); font-size: var(--text-base); line-height: 1.8; }
.ai-inv-empty span { font-size: var(--text-sm); }

.ai-inv-item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; padding: var(--space-3) var(--space-4);
  text-align: left;
  border-left: 3px solid transparent;
  transition: background var(--duration-fast) var(--ease-out);
}
.ai-inv-item:hover { background: var(--surface-2); }
.ai-inv-item.is-active {
  background: color-mix(in oklab, var(--accent) 10%, transparent);
  border-left-color: var(--accent);
}
.ai-inv-item__icon {
  width: 34px; height: 34px; flex: 0 0 34px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-inv-item.is-active .ai-inv-item__icon { background: var(--accent); color: #fff; }
.ai-inv-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-inv-item__name { font-size: var(--text-base); color: var(--text); }
.ai-inv-item__meta { font-size: var(--text-sm); color: var(--text-muted); }
.ai-inv-item > .icon { color: var(--text-muted); flex: 0 0 auto; }

.ai-inv-detail { min-width: 0; }
.ai-inv-detail .card { padding-bottom: var(--space-5); }

.ai-inv-detail__head {
  display: flex; align-items: flex-start; gap: var(--space-4);
  padding: var(--space-5);
}
.ai-inv-detail__icon {
  width: 44px; height: 44px; flex: 0 0 44px;
  border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
}
.ai-inv-detail__title { flex: 1; min-width: 0; }
.ai-inv-detail__title h3 { font-size: var(--text-xl, 20px); font-weight: var(--weight-semibold); }
.ai-inv-detail__title p { font-size: var(--text-base); color: var(--text-muted); margin-top: 4px; line-height: 1.6; }

.ai-inv-stats {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(3, 1fr);
  padding: 0 var(--space-5) var(--space-5);
}
.ai-inv-stat {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.ai-inv-stat__icon { color: var(--text-muted); flex: 0 0 auto; }
.ai-inv-stat__body { display: flex; flex-direction: column; gap: 2px; }
.ai-inv-stat__label { font-size: var(--text-sm); color: var(--text-muted); }
.ai-inv-stat__val { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.1; }

.ai-inv-cols {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  padding: 0 var(--space-5);
}
@media (max-width: 900px) { .ai-inv-cols { grid-template-columns: 1fr; } }

.ai-inv-summary, .ai-inv-timeline {
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.ai-inv-summary__head, .ai-inv-timeline__head {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-base); color: var(--text-secondary);
  margin-bottom: var(--space-3);
}
.ai-inv-summary__head .icon { color: var(--accent); }
.ai-inv-summary__body { font-size: var(--text-base); color: var(--text-secondary); line-height: 1.8; }

.ai-sim { margin: var(--space-5) var(--space-5) 0; padding-top: var(--space-5); border-top: 1px solid var(--border-subtle); }
.ai-sim__head { display: flex; align-items: center; gap: 6px; font-size: var(--text-base); color: var(--text-secondary); margin-bottom: var(--space-3); }
.ai-sim__row { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
@media (max-width: 900px) { .ai-sim__row { grid-template-columns: 1fr; } }

.ai-sim__drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: var(--space-6);
  border: 1px dashed var(--border-strong); border-radius: var(--radius-lg);
  color: var(--text-muted); cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ai-sim__drop:hover { border-color: var(--accent); color: var(--accent); }
.ai-sim__drop-title { font-size: var(--text-base); color: var(--text-secondary); }
.ai-sim__drop-sub { font-size: var(--text-sm); }
.ai-sim__desc b { font-size: var(--text-base); color: var(--text); }
.ai-sim__desc p { font-size: var(--text-base); color: var(--text-muted); line-height: 1.7; margin-top: 6px; }
.ai-sim__facts { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-3); font-size: var(--text-sm); }

/* ---- 设置：AI 模式选择卡 ---- */
.ai-modes {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 0 0 var(--space-4);
  align-items: stretch;
}
@media (max-width: 960px) { .ai-modes { grid-template-columns: 1fr; } }

.ai-mode {
  position: relative;
  height: 100%;
  display: flex; flex-direction: column;
  padding: var(--space-5);
  background: var(--surface-1);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-xl);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
}
.ai-mode:hover { border-color: var(--border-strong); background: var(--surface-2); }
.ai-mode.is-active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface-1));
  box-shadow: 0 0 0 1px var(--accent), 0 4px 20px rgba(59, 130, 246, 0.16);
}
.ai-mode input[type="radio"] { display: none; }

.ai-mode__top {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.ai-mode__icon {
  width: 44px; height: 44px; flex: 0 0 44px;
  border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
}
.ai-mode__icon--local { background: rgba(59, 130, 246, 0.14); color: #3b82f6; }
.ai-mode__icon--balanced { background: rgba(16, 185, 129, 0.14); color: #10b981; }
.ai-mode__icon--full { background: rgba(168, 85, 247, 0.14); color: #a855f7; }
.ai-mode.is-active .ai-mode__icon--local { background: #3b82f6; color: #fff; }
.ai-mode.is-active .ai-mode__icon--balanced { background: #10b981; color: #fff; }
.ai-mode.is-active .ai-mode__icon--full { background: #a855f7; color: #fff; }

.ai-mode__title-wrap {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: var(--space-2);
  flex-wrap: wrap;
}
.ai-mode__title {
  font-size: var(--text-lg); font-weight: var(--weight-semibold);
  color: var(--text);
}
.ai-mode__radio-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 22px; margin-left: auto;
  transition: all var(--duration-fast) var(--ease-out);
  color: #fff;
}
.ai-mode.is-active .ai-mode__radio-check {
  border-color: var(--accent);
  background: var(--accent);
}

.ai-mode__cost-wrap {
  display: flex; align-items: baseline; gap: var(--space-2);
  margin-bottom: var(--space-3); padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
}
.ai-mode__cost {
  font-size: var(--text-base); font-weight: var(--weight-semibold);
  color: var(--text-secondary);
}
.ai-mode.is-active .ai-mode__cost { color: var(--accent); }

.ai-mode__desc {
  font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6;
  margin-bottom: var(--space-4); flex: 1;
}

.ai-mode__features {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 6px;
  font-size: var(--text-xs); color: var(--text-secondary);
}
.ai-mode__feature {
  display: flex; align-items: center; gap: 6px;
}
.ai-mode__feature .icon { color: var(--accent); flex: 0 0 auto; }

.ai-mode-status {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); font-size: var(--text-sm);
  color: var(--text-secondary); margin-top: var(--space-2);
}
.ai-mode-status b { color: var(--text); }
.ai-mode-status__note { color: var(--text-muted); margin-left: auto; }
@media (max-width: 900px) {
  .ai-mode-status { flex-direction: column; align-items: flex-start; gap: 4px; }
  .ai-mode-status__note { margin-left: 0; }
}

.ai-cfg { padding: 0 var(--space-5); }
.ai-cfg .cfg-row__control { padding-right: 2px; }
.ai-cfg .cfg-row__control > .input { max-width: 100%; }
/* 数字框与单位的宽度规则已统一在 components.css 里 */
.ai-foot-line { padding: var(--space-3) var(--space-5); font-size: var(--text-sm); color: var(--text-muted); }
.ai-prov { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-5); flex-wrap: wrap; }

.ai-others { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-subtle); }
.ai-others__title { font-size: var(--text-base); color: var(--text-secondary); margin-bottom: var(--space-3); }
.ai-other { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: var(--text-base); color: var(--text-muted); }
.ai-others__hint { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }

/* 隐私表 */
.ai-priv { padding: 0 var(--space-5); }
/* ⚠️ 摄像头名称列必须够宽且**允许换行**（2026-10-12 修 P0 截断）。
   原来 1.1fr + nowrap + ellipsis：小米的默认名（"小米室外摄像机CW500双摄版"）
   会被截成 "小米室外摄像机CW:"，而 CW300 与 CW500 在截断后**长得一样**。
   在「隐私控制」这种决定数据往哪传的页面里，认不出是哪台设备
   会直接导致用户做错隐私选择 —— 所以宁可换行也不截断。
   列宽比例从 1.1 : 0.8 : 1.6 调成 1.5 : 0.75 : 1.5，把空间让给设备名。 */
.ai-priv__head, .ai-priv__row {
  display: grid; gap: var(--space-3);
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.75fr) minmax(0, 1.5fr);
  align-items: center;
  padding: var(--space-3) 0;
}
.ai-priv__head { font-size: var(--text-sm); color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
.ai-priv__row { border-bottom: 1px solid var(--border-subtle); }
.ai-priv__row:last-child { border-bottom: 0; }
.ai-priv__cam { display: flex; align-items: center; gap: 6px; font-size: var(--text-base); min-width: 0; }
.ai-priv__sel { width: 100%; }
.ai-priv__modes { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.ai-radio { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; }
.ai-radio input { accent-color: var(--accent); }

/* 用量 */
.ai-usage { padding: 0 var(--space-5) var(--space-3); }
.ai-urow { display: flex; align-items: center; gap: var(--space-3); padding: 10px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-base); }
.ai-urow:last-child { border-bottom: 0; }
.ai-urow__icon { color: var(--text-muted); flex: 0 0 auto; }
.ai-urow__label { flex: 1; color: var(--text-muted); }
.ai-urow__val { font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }


/* AI 设置页：两栏网格（卡片自动等高） */
/* AI 设置页：面板内的网格不再需要顶部 margin（面板之间由导航切换） */
.pnl[data-pnl] .ai-set-grid { margin-top: 0; }
.pnl[data-pnl] > .card + .ai-set-grid, .pnl[data-pnl] > .card + .card { margin-top: var(--space-5); }

.ai-set-grid {
  display: grid; gap: var(--space-5);
  grid-template-columns: repeat(2, minmax(0, 1fr));
  /* 自然高度：两侧卡片内容量不同，强制等高会留一大片空白 */
  align-items: start;
  margin-top: var(--space-5);
}
.ai-set-grid > .card { display: flex; flex-direction: column; }
.ai-set-grid > .card > .sec-head { flex: 0 0 auto; }
@media (max-width: 1000px) { .ai-set-grid { grid-template-columns: 1fr; } }

/* 卡片内的开关：去掉左右多余缩进（.switch-row 自己带 padding）*/
.ai-set-grid .switch-row { padding-left: var(--space-5); padding-right: var(--space-5); }
.ai-set-grid .switch-row:first-of-type { border-top: 1px solid var(--border-subtle); }

/* 卡片底部按钮：贴底、占满内宽 */
.ai-card-bottom {
  margin: var(--space-4) var(--space-5) var(--space-5);
  width: calc(100% - var(--space-5) * 2);
  flex: 0 0 auto;
}

/* 保存栏（2026-10-12）：按钮文字写明保存范围 + 旁边小字说明。
   解决「策略与隐私页左右各一个『保存』，不知道各自生效哪部分」。
   margin-top:auto 让按钮在两栏不等高时仍贴住卡片底部。 */
.ai-savebar {
  display: flex; align-items: center; gap: var(--space-3);
  margin: auto var(--space-5) var(--space-5);
  padding-top: var(--space-4);
}
.ai-savebar__hint {
  font-size: var(--text-xs); color: var(--text-muted);
  line-height: 1.5; min-width: 0;
}
@media (max-width: 700px) {
  .ai-savebar { flex-wrap: wrap; }
  .ai-savebar .btn { width: 100%; }
}

/* 单列网格（隐私表 / 用量 需要整行） */
.ai-set-grid--1 { grid-template-columns: minmax(0, 1fr); }

/* 状态行 */
.ai-foot-line {
  display: flex; align-items: center; gap: 6px;
  padding: var(--space-3) var(--space-5);
  font-size: var(--text-sm); color: var(--text-muted);
}

/* 隐私表格：表头 sticky + 行分隔更清晰 */
.ai-priv__head { position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
.ai-priv__row:hover { background: var(--surface-2); margin: 0 calc(var(--space-5) * -1); padding-left: var(--space-5); padding-right: var(--space-5); }


/* ==========================================================================
   SETTINGS — 系统设置（���组卡片）
   ========================================================================== */

.set-group { margin-bottom: var(--space-6); }
.set-group:last-child { margin-bottom: 0; }
.set-group__label {
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  color: var(--text-muted); letter-spacing: .04em;
  text-transform: uppercase;
  margin-bottom: var(--space-3); padding-left: 2px;
}

.set-text {
  font-size: var(--text-base); color: var(--text-secondary); line-height: 1.8;
}

.set-hint {
  margin-top: var(--space-3);
  font-size: var(--text-sm); color: var(--text-muted);
}

.set-mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: var(--text-sm); font-weight: var(--weight-normal); }

.set-kv { display: flex; flex-direction: column; }
.set-kv__row {
  display: flex; align-items: baseline; gap: var(--space-4);
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-base);
}
.set-kv__row:last-child { border-bottom: 0; }
.set-kv__row > span { flex: 0 0 120px; color: var(--text-muted); }
.set-kv__row > b { flex: 1; min-width: 0; font-weight: var(--weight-normal); color: var(--text); word-break: break-all; }
.set-kv__row .badge { display: inline-flex; }

.set-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-4); }
.set-result { margin-top: var(--space-4); }
.set-result:empty { display: none; }

/* 卡头右侧的状态/链接 */
.set-status { margin-left: auto; margin-right: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }
.card__head { display: flex; align-items: center; gap: var(--space-2); }
.card__head .card__title { display: inline-flex; align-items: center; gap: 6px; }
.card__head .btn, .card__head a.btn { margin-left: auto; }
.card__head .set-status + .btn, .card__head .set-status + a.btn { margin-left: 0; }


/* ==========================================================================
   AI SETTINGS（精致版，对齐效果图 P0-2）
   ========================================================================== */

/* 卡头里的副说明 */
.card__hint {
  font-size: var(--text-sm); color: var(--text-muted);
  font-weight: var(--weight-normal); margin-left: var(--space-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  /* ⚠️ min-width:0 必须加：否则 hint 无法收缩，会把同一行的徽章挤成
     一条竖着的窄条（实测「外部 Provider」卡头的「未配置」被压成 1 字宽）。 */
  min-width: 0;
}
@media (max-width: 900px) { .card__hint { display: none; } }

/* 已合并至顶部统一 .ai-mode 规范 */

/* ---- 阈值滑块 ---- */
/* 检测阈值滑块。
   用户反馈：原来是**纯色实心轨道**，看不出"往左/往右"分别意味着什么，
   必须读下面的文字说明。现在轨道本身是色阶：
     橙（左·低阈值=更灵敏，但误报多） -> 蓝（右·高阈值=更严格，误报少）
   再配两端的小字标签，方向含义不用看说明就能理解。 */
.ai-range__wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
/* 轨道与「推荐区间」色带需要同一个定位上下文 */
.ai-range__field { position: relative; display: flex; align-items: center; }
.ai-range {
  width: 100%; min-width: 80px;
  -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right,
    color-mix(in srgb, var(--warning) 85%, transparent),
    color-mix(in srgb, var(--accent) 85%, transparent));
  outline: none;
  position: relative; z-index: 2;
}
/* 推荐区间色带：叠在轨道后面，用一层浅色底标出"甜点区间" */
.ai-range__band {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 10px; border-radius: 3px;
  background: color-mix(in srgb, var(--online) 22%, transparent);
  border-left: 1px solid color-mix(in srgb, var(--online) 55%, transparent);
  border-right: 1px solid color-mix(in srgb, var(--online) 55%, transparent);
  pointer-events: none; z-index: 1;
}
.ai-range__ends {
  display: flex; justify-content: space-between;
  font-size: var(--text-xs); color: var(--text-muted);
}
.ai-range__ends span:nth-child(2) { color: var(--online); }
.ai-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  border: 2px solid var(--surface-1);
}
.ai-range::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid var(--surface-1);
}
/* 滑块行的控件区要容纳「轨道 + 值」 */
.cfg-row__control--range { display: flex; align-items: center; gap: var(--space-3); }
.ai-range__val {
  flex: 0 0 40px; text-align: right;
  font-size: var(--text-base); font-variant-numeric: tabular-nums;
  color: var(--text);
}

/* ---- 检测类别 2x2 网格 ---- */
.ai-cats { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-subtle); }
.ai-cats__title { font-size: var(--text-base); color: var(--text-secondary); margin-bottom: var(--space-3); }
.ai-cats__grid {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.ai-cat {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
}
.ai-cat:hover { border-color: var(--border-strong); }
.ai-cat.is-on { border-color: color-mix(in oklab, var(--accent) 40%, transparent); background: color-mix(in oklab, var(--accent) 6%, var(--surface-2)); }
.ai-cat__icon { color: var(--text-muted); flex: 0 0 auto; }
.ai-cat.is-on .ai-cat__icon { color: var(--accent); }
.ai-cat__label { flex: 1; min-width: 0; font-size: var(--text-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-cats__hint { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); }

/* ---- Provider 选择卡 ---- */
.ai-prov-badge {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 10px; border-radius: 999px;
  font-size: var(--text-sm); color: var(--text-muted);
  background: var(--surface-3);
  /* 徽章是固定宽度内容，绝不允许被压缩换行 */
  flex: 0 0 auto; white-space: nowrap;
}
.ai-prov-badge.is-ok { color: var(--online); background: rgba(34,197,94,.14); }

.ai-prov-cards {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: var(--space-4) var(--space-5) 0;
}
@media (max-width: 1200px) { .ai-prov-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .ai-prov-cards { grid-template-columns: 1fr; } }

.ai-prov-card {
  position: relative;
  display: flex; flex-direction: column; gap: 6px;
  padding: var(--space-3) var(--space-4);
  background: var(--surface-1);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
}
.ai-prov-card:hover { border-color: var(--border-strong); background: var(--surface-2); }
.ai-prov-card.is-active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, var(--surface-1));
  box-shadow: 0 0 0 1px var(--accent);
}
.ai-prov-card.is-soon { opacity: .6; cursor: not-allowed; }
.ai-prov-card input { display: none; }

.ai-prov-card__top {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
}
.ai-prov-card__brand {
  width: 32px; height: 32px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 32px;
}
.ai-prov-card__brand .icon {
  fill: currentColor !important;
  stroke: none !important;
}
.ai-prov-card__brand--deepseek { background: rgba(30,136,229,.16); color: #1e88e5; }
.ai-prov-card__brand--openai { background: rgba(16,163,127,.16); color: #10a37f; }
.ai-prov-card__brand--gemini { background: rgba(99,102,241,.16); color: #6366f1; }
.ai-prov-card__brand--qwen { background: rgba(245,158,11,.16); color: #f59e0b; }
.ai-prov-card__brand--ollama { background: rgba(16,185,129,.16); color: #10b981; }
.ai-prov-card__brand--custom { background: rgba(168,85,247,.16); color: #a855f7; }

/* AI 模式与自适应挂起横幅 */
.ai-mode-suspend-notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
}
.ai-mode-suspend-notice b {
  color: var(--text);
}
.ai-card--dimmed {
  opacity: 0.72;
  transition: opacity 0.2s ease;
}
.ai-card--dimmed:hover {
  opacity: 0.9;
}

.ai-prov-card__meta {
  display: flex; flex-direction: column; gap: 2px;
  width: 100%; min-width: 0; margin-top: 2px;
}
.ai-prov-card__name {
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ai-prov-card__sub {
  font-size: var(--text-xs); color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ai-prov-card__tag {
  font-size: var(--text-xs); padding: 2px 8px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-muted); flex: 0 0 auto;
  white-space: nowrap;
}
.ai-prov-card.is-active .ai-prov-card__tag { background: var(--accent); color: #fff; font-weight: var(--weight-medium); }

/* 连接状态卡 */
/* 连接状态卡 —— 四种状态要有**一眼可辨**的视觉（2026-10-12）
   用户反馈：测完只改右下角小字，卡片本身不动，看不出成功/失败。
   状态色沿用全局语义：绿=成功、红=失败、蓝=进行中、灰=未测试。 */
.ai-conn {
  display: flex; align-items: center; gap: var(--space-3);
  margin: var(--space-4) var(--space-5) 0;
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  /* 左侧色条：把「这是一个需要留意的状态指示器」表达出来。
     原来底色与容器背景几乎同色（surface-2 vs surface-1），层次很弱。
     色条随状态变色：灰=未测试 / 蓝=测试中 / 绿=已连接 / 红=失败。 */
  border-left: 3px solid var(--text-muted);
  border-radius: var(--radius-lg);
  transition: border-color var(--duration-fast) var(--ease-out),
              background var(--duration-fast) var(--ease-out);
}
.ai-conn__dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--text-muted); flex: 0 0 auto;
}
.ai-conn__dot.is-ok { background: var(--online); box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
.ai-conn__dot.is-bad { background: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
.ai-conn__dot.is-pending { background: #eab308; box-shadow: 0 0 0 3px rgba(234,179,8,.18); }
.ai-conn__dot.is-testing {
  background: var(--accent);
  animation: dot-pulse 1.1s var(--ease-out) infinite;
}
/* 左侧色条跟随状态（见 .ai-conn 注释）。
   用卡片上的 state class 而不是 :has()：兼容性更好，也更好读。 */
.ai-conn.is-ok      { border-left-color: var(--online); }
.ai-conn.is-bad     { border-left-color: var(--danger); }
.ai-conn.is-pending { border-left-color: #eab308; }
.ai-conn.is-testing { border-left-color: var(--accent); }
/* 失败时整卡变红调，配合图标能立刻看出"这步没过" */
.ai-conn.is-bad {
  border-color: color-mix(in srgb, var(--danger) 45%, var(--border-subtle));
  background: color-mix(in srgb, var(--danger) 7%, var(--surface-2));
}
.ai-conn.is-bad .ai-conn__title { color: var(--danger); }
.ai-conn__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ai-conn__title { font-size: var(--text-base); color: var(--text); }
.ai-conn__sub { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.6; }

/* 「去哪申请密钥」原是一个带边框+底色的卡片，视觉权重接近按钮，抢了
   「API 密钥」输入框的焦点。用户反馈后**降级为一行小字链接**，
   与「密钥只保存在…」同级（同字号、同颜色，无边框无底色）。 */
.ai-keyhelp {
  display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap;
  margin-top: 4px;
  font-size: var(--text-xs); color: var(--text-muted);
  line-height: 1.6;
}
.ai-keyhelp .icon { color: var(--text-muted); flex: 0 0 auto; }
.ai-keyhelp:empty { display: none; }
.ai-keyhelp__link {
  color: var(--accent);
  text-decoration: none;
  /* 链接整块换行，不要断在「DeepSeek」与「申请」之间 */
  white-space: nowrap;
}
.ai-keyhelp__link:hover { text-decoration: underline; text-underline-offset: 3px; }
.ai-keyhelp__ok { color: var(--online); display: inline-flex; }

/* 字段旁的「?」说明入口（模型说明等） */
.cfg-help {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; flex: 0 0 auto;
  border-radius: 50%;
  color: var(--text-muted); cursor: pointer;
}
.cfg-help:hover { color: var(--accent); background: var(--surface-3); }
.cfg-row__hint.is-hidden { display: none; }

/* 测试连接 + 结果；保存按钮改为整宽贴底（与左侧卡一致），
   所以这里不再留 bottom padding。 */
.ai-prov-actions {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5) 0;
  flex-wrap: wrap;
}
.ai-prov-res { font-size: var(--text-sm); color: var(--text-muted); }

/* ---- 分析策略 ---- */
.ai-rules { padding: var(--space-3) var(--space-5) var(--space-2); }
.ai-rule {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: var(--space-3);
  row-gap: 2px;
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
}
.ai-rule:last-child { border-bottom: 0; }
.ai-rule input {
  width: 16px; height: 16px; margin-top: 2px;
  accent-color: var(--accent); cursor: pointer;
}
.ai-rule__label { font-size: var(--text-base); color: var(--text); }
.ai-rule__hint { grid-column: 2; font-size: var(--text-sm); color: var(--text-muted); }
.ai-rule input:not(:checked) ~ .ai-rule__label { color: var(--text-muted); }

/* 依赖未满足的策略：整条弱化 + 琥珀色提示，明确「这条不会触发」 */
.ai-rule.is-blocked { opacity: .62; }
.ai-rule.is-blocked .ai-rule__label { color: var(--text-muted); }
.ai-rule__dep {
  grid-column: 2;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--text-xs); color: var(--warning);
}
.ai-rule__dep .icon { flex: 0 0 auto; }

/* 顶部指路提示：告诉用户去哪个 tab 开检测类别 */
.ai-rules__warn {
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin: var(--space-4) var(--space-5) 0;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--warning) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--warning) 32%, transparent);
  font-size: var(--text-sm); color: var(--warning); line-height: 1.6;
}
.ai-rules__warn .icon { flex: 0 0 auto; margin-top: 2px; }
.ai-rules__warn b { color: var(--warning); font-weight: var(--weight-semibold); }

.ai-rule-note {
  display: flex; align-items: center; gap: 6px;
  margin: var(--space-3) var(--space-5) 0;
  padding: var(--space-3) var(--space-4);
  background: color-mix(in oklab, var(--accent) 8%, transparent);
  border-radius: var(--radius-md);
  font-size: var(--text-sm); color: var(--text-secondary);
}
.ai-rule-note .icon { color: var(--accent); flex: 0 0 auto; }

/* ---- 隐私表格（新版）---- */
.ai-priv__head, .ai-priv__row {
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) minmax(0, 1.6fr);
}
.ai-priv__cam { gap: 8px; }
/* 名称允许换行，不截断（截断会让 CW300 / CW500 变得无法区分） */
.ai-priv__camname { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex-wrap: wrap; }
.ai-priv__camname > span, .ai-priv__camname > b { overflow-wrap: anywhere; min-width: 0; }
.ai-priv__camname em { font-style: normal; font-size: var(--text-xs); color: var(--text-muted); flex: 0 0 auto; }
.ai-priv__allow { display: flex; align-items: center; }
.ai-check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; }
.ai-check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
.ai-priv__foot {
  padding: var(--space-3) 0 var(--space-1);
  font-size: var(--text-sm); color: var(--text-muted);
  border-top: 1px solid var(--border-subtle);
  margin-top: var(--space-2);
}

/* ---- 用量与成本 ---- */
.ai-usage-wrap { padding: 0 var(--space-5) var(--space-5); }
.ai-usage-today {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  position: relative;
}
@media (max-width: 900px) { .ai-usage-today { grid-template-columns: repeat(2, 1fr); } }

.ai-ucard {
  display: flex; flex-direction: column; gap: 4px;
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.ai-ucard__icon { color: var(--text-muted); }
.ai-ucard__label { font-size: var(--text-sm); color: var(--text-muted); }
.ai-ucard__val { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.1; }
.ai-usage-updated {
  position: absolute; right: 0; top: -22px;
  font-size: var(--text-xs); color: var(--text-muted);
}

.ai-usage-cols {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  margin-top: var(--space-5);
  align-items: stretch;
}
@media (max-width: 900px) { .ai-usage-cols { grid-template-columns: 1fr; } }

.ai-usage-chart {
  padding: var(--space-5);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
}
.ai-usage-chart__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-4); gap: var(--space-3); flex-wrap: wrap;
}
.ai-usage-chart__title { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text); }
.ai-usage-chart__sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
.ai-usage-legend {
  display: flex; gap: var(--space-4); font-size: var(--text-xs); color: var(--text-secondary);
}
.ai-usage-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ai-usage-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.ai-chart-wrap { position: relative; width: 100%; }
.ai-chart { width: 100%; height: 120px; display: block; }
.ai-chart__labels {
  display: flex; justify-content: space-between;
  margin-top: 8px; font-size: var(--text-xs); color: var(--text-muted);
  padding: 0 4px;
}

.ai-usage-budget {
  padding: var(--space-5);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
}
.ai-usage-budget__title { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text); margin-bottom: var(--space-3); }
.ai-budget-meter {
  padding: var(--space-3); background: var(--surface-1);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  margin-bottom: var(--space-4);
}
.ai-budget-meter__top {
  display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 6px;
}
.ai-budget-meter__bar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.ai-budget-meter__fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.ai-usage-budget .cfg-row { padding: var(--space-3) 0; }
.ai-usage-budget .cfg-row__label { flex: 0 0 100px; }
.ai-radio-group { display: flex; gap: var(--space-4); flex-wrap: wrap; }


/* 分析策略 | 隐私控制：等高（内容量不同，强制等高避免右侧留白） */
.ai-set-grid--tall { align-items: stretch; }
.ai-set-grid--tall > .card { display: flex; flex-direction: column; }
.ai-set-grid--tall .ai-priv { flex: 1; }


/* ==========================================================================
   EVENTS ENHANCED — 事件中心增强版（对齐效果图 P0-3）
   ========================================================================== */

/* 筛选栏 */
/* 日期范围是主要筛选维度 -> 用强调色描边，与其他下拉区分开。
   ⚠️ 高度必须是 34px，与 .input/.ev-sel/.ev-search 一致 ——
      原来写 36px，导致筛选行里这一个控件比邻居高 2px（实测）。
   ⚠️ 左内边距与 .search 对齐（10px 图标 + 同样的文字起点），
      否则「今天」和「搜索」两个控件的图标到文字距离不一致。 */
.ev-range {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 var(--space-3) 0 10px;
  background: color-mix(in srgb, var(--accent) 7%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  border-radius: var(--radius-md);
  color: var(--accent);
  height: 34px;
}
.ev-range .icon { flex: 0 0 auto; }
/* 日期范围是主要筛选维度 -> 用强调色描边，与其他下拉区分开 */
.ev-range:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.ev-range select {
  background: transparent; border: 0; outline: none;
  color: var(--text); font-size: var(--text-base); font-family: inherit;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.ev-range select option { background: var(--surface-2); }
.ev-date { width: 140px; }
.ev-sep { color: var(--text-muted); }

/* 按天分组 */
.ev-group__head { display: flex; align-items: baseline; gap: var(--space-3); }
.ev-group__sub { font-size: var(--text-sm); color: var(--text-muted); }

/* 3 列网格 */
.ev-grid {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: var(--space-6);
}
@media (max-width: 1400px) { .ev-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 800px)  { .ev-grid { grid-template-columns: 1fr; } }

/* 事件卡片（新版） */
.ev-card2 {
  display: flex; flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
}
.ev-card2:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.ev-card2.is-sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.ev-card2__img { position: relative; aspect-ratio: 16/9; background: #0a0d12; }
.ev-card2__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ev-card2__ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.ev-card2__time, .ev-card2__dur {
  position: absolute; padding: 1px 7px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.7); color: #fff; font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
}
.ev-card2__time {
  /* 放在左下：摄像头自己会在画面左上角烧录时间，��免重叠 */
  bottom: 8px; left: 8px;
}
.ev-card2__dur  { top: 8px; right: 8px; }

.ev-card2__watch {
  position: absolute; right: 8px; bottom: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  background: rgba(239,68,68,.9); color: #fff; font-size: var(--text-xs);
}

.ev-card2__check {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  width: 20px; height: 20px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.5); border: 1.5px solid rgba(255,255,255,.7);
  color: #fff;
}
.ev-card2.is-sel .ev-card2__check { background: var(--accent); border-color: var(--accent); }
.ev-card2.is-sel .ev-card2__check svg { color: #fff; }

.ev-card2__body { flex: 1; padding: var(--space-3) var(--space-4) var(--space-2); min-width: 0; }
.ev-card2__dev {
  display: flex; align-items: center; gap: 5px;
  font-size: var(--text-sm); color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-card2__dev em { font-style: normal; color: var(--text-muted); opacity: .8; }
.ev-card2__title {
  font-size: var(--text-lg); font-weight: var(--weight-medium);
  color: var(--text); margin-top: 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-card2__tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ev-card2__conf {
  margin-left: auto; font-size: var(--text-sm); color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.ev-card2__desc {
  font-size: var(--text-sm); color: var(--text-muted);
  margin-top: 8px; line-height: 1.6;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-card2__desc:empty { display: none; }

.ev-card2__acts {
  display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  padding: var(--space-2) var(--space-3);
  border-top: 1px solid var(--border-subtle);
}
.ev-icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--text-secondary);
  transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.ev-icon-btn:hover { background: var(--surface-3); color: var(--text); }
.ev-icon-btn.is-on { color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, transparent); }

/* 类型标签 */
.ev-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: var(--text-xs);
  background: var(--surface-3); color: var(--text-secondary);
  white-space: nowrap;
}
.ev-tag.is-custom { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--accent); }

/* 批量工具栏 */
.ev-bulkbar {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-5);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface-1));
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: var(--radius-lg);
  flex-wrap: wrap;
}
.ev-bulkbar__count { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-base); }
.ev-bulkbar__count .icon { color: var(--accent); }
.ev-bulklink {
  font-size: var(--text-base); color: var(--accent);
  text-decoration: underline; text-underline-offset: 3px;
}
.ev-bulkbar__spacer { flex: 1; }
.ev-bulkbar .btn--danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 40%, transparent); }

/* ==========================================================================
   事件详情弹窗
   ========================================================================== */

.dialog--wide { width: min(1280px, 94vw) !important; max-width: none !important; }

.evd { display: flex; flex-direction: column; gap: var(--space-4); }
.evd__head { display: flex; align-items: flex-start; gap: var(--space-4); }
.evd__title-wrap { flex: 1; min-width: 0; }
.evd__title { font-size: var(--text-title); font-weight: var(--weight-semibold); line-height: 1.2; }
.evd__sub { display: flex; align-items: center; gap: 6px; font-size: var(--text-base); color: var(--text-muted); margin-top: 4px; }
.evd__sub em { font-style: normal; opacity: .8; }
.evd__meta { display: flex; align-items: center; gap: var(--space-4); font-size: var(--text-base); color: var(--text-secondary); flex-shrink: 0; }
.evd__meta span { display: inline-flex; align-items: center; gap: 5px; }
.evd__tags { display: flex; gap: 6px; flex-wrap: wrap; }

.evd__body {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  align-items: start;
}
@media (max-width: 1000px) { .evd__body { grid-template-columns: 1fr; } }

.evd__left { min-width: 0; }
.evd__player { position: relative; aspect-ratio: 16/9; background: #000; border-radius: var(--radius-lg); overflow: hidden; }
.evd__player video { width: 100%; height: 100%; object-fit: contain; display: block; }
.evd__player-ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
}
.evd__player-ph img { width: 100%; height: 100%; object-fit: cover; }
.evd__player-ph.is-hidden { display: none; }

.evd__frames { margin-top: var(--space-4); }
.evd__frames-head { font-size: var(--text-base); color: var(--text-secondary); margin-bottom: var(--space-3); }
.evd__frames-list { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.evd__frame {
  width: 140px; border-radius: var(--radius-md); overflow: hidden;
  border: 2px solid transparent; cursor: pointer;
}
.evd__frame.is-active { border-color: var(--accent); }
.evd__frame img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.evd__frame-time, .evd__frame-label { display: block; padding: 2px 6px; font-size: var(--text-xs); }
.evd__frame-time { background: rgba(0,0,0,.6); color: #fff; margin-top: -22px; position: relative; }
.evd__frame-label { color: var(--text-muted); }
.evd__strip { width: 100%; }
.evd__strip img { width: 100%; border-radius: var(--radius-md); display: block; }
.evd__frames-hint { font-size: var(--text-sm); color: var(--text-muted); padding: var(--space-3) 0; }

.evd__right { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.evd__block {
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.evd__block-head {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-base); color: var(--text);
  margin-bottom: var(--space-3);
}
.evd__block-head .icon { color: var(--text-muted); }
.evd__block-body { font-size: var(--text-base); color: var(--text-secondary); line-height: 1.7; }
.evd__kv { display: flex; align-items: baseline; gap: var(--space-3); padding: 3px 0; font-size: var(--text-base); }
.evd__kv > span { flex: 0 0 110px; color: var(--text-muted); }
.evd__kv > b { flex: 1; min-width: 0; font-weight: var(--weight-normal); color: var(--text); word-break: break-all; }
.evd__notice { margin-top: 6px; font-size: var(--text-sm); color: var(--text-muted); }

.evd__foot {
  display: flex; align-items: center; gap: var(--space-3);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}
.evd__foot-spacer { flex: 1; }


/* ==========================================================================
   DEVICE DETAIL — 设备详情页（P1）
   ========================================================================== */

/* 面包屑 */
.crumb {
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-base); color: var(--text-muted);
  margin-bottom: var(--space-3);
}
.crumb a { color: var(--text-muted); }
.crumb a:hover { color: var(--accent); }
.crumb__sep { display: inline-flex; opacity: .6; }

.dd-en { font-size: var(--text-base); font-weight: var(--weight-normal); color: var(--text-muted); margin-left: 6px; }

/* 两栏 */
.dd-grid {
  display: grid; gap: var(--space-5);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  align-items: start;
}
@media (max-width: 1000px) { .dd-grid { grid-template-columns: 1fr; } }
.dd-left, .dd-right { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }

/* 左列跟随滚动（右列信息多时，左边不留下大片空白） */
@media (min-width: 1001px) {
  .dd-left { position: sticky; top: var(--space-5); }
}

/* 预览 */
.dd-preview {
  position: relative;
  margin: 0 var(--space-5);
  aspect-ratio: 16/9;
  background: #0a0d12;
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.dd-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dd-preview__ph {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-2); color: var(--text-muted); font-size: var(--text-base);
}
.dd-preview__live {
  position: absolute; top: 10px; left: 10px;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  background: rgba(239,68,68,.9); color: #fff; font-size: var(--text-xs);
}

.dd-acts { display: flex; gap: var(--space-3); padding: var(--space-4) var(--space-5) var(--space-5); flex-wrap: wrap; }
.dd-acts .btn { flex: 1 1 auto; justify-content: center; }

/* ---- 设备详情：近 30 天活动重构与美化 ---- */
.dd-act-card .card__head {
  border-bottom: none;
  padding: var(--space-4) var(--space-5) var(--space-3);
}
.dd-act-head-note {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: var(--weight-normal);
  background: var(--surface-2);
  padding: 3px 9px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
}

/* 14 天活动迷你柱状分布 */
.dd-act-chart {
  padding: 0 var(--space-5) var(--space-3);
}
.dd-act-chart__bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 40px;
  padding: 5px 8px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.dd-act-bar {
  flex: 1;
  min-height: 4px;
  border-radius: 2px;
  background: var(--surface-3);
  transition: all var(--duration-fast) var(--ease-out);
  cursor: pointer;
}
.dd-act-bar.has-events {
  background: var(--accent);
}
.dd-act-bar.has-events:hover {
  filter: brightness(1.2);
  transform: scaleY(1.08);
}
.dd-act-chart__labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 2px 0;
}

/* 4 个指标卡（呼吸感与色彩区分） */
.dd-stats {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: var(--space-1) var(--space-5) var(--space-3);
}
@media (max-width: 700px) {
  .dd-stats { grid-template-columns: repeat(2, 1fr); }
}
.dd-stat {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  transition: border-color var(--duration-fast), transform var(--duration-fast);
}
.dd-stat:hover {
  border-color: var(--border);
}
.dd-stat__icbox {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
}
.dd-stat__icbox.is-total   { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }
.dd-stat__icbox.is-person  { background: rgba(16, 185, 129, 0.12); color: #10b981; }
.dd-stat__icbox.is-vehicle { background: rgba(139, 92, 246, 0.12); color: #8b5cf6; }
.dd-stat__icbox.is-ai      { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }

.dd-stat__body {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.dd-stat__label {
  font-size: var(--text-xs);
  color: var(--text-muted);
  white-space: nowrap;
}
.dd-stat__val {
  font-size: var(--text-xl);
  font-weight: var(--weight-bold);
  line-height: 1.1;
  color: var(--text);
}

/* 最近动态条 */
.dd-last-badge {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: 0 var(--space-5) var(--space-5);
  padding: 9px var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  font-size: var(--text-xs);
}
.dd-last-badge .dd-last-title {
  color: var(--text-muted);
  font-weight: var(--weight-medium);
}
.dd-last-badge .dd-last-desc {
  color: var(--text);
  margin-left: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.dd-last { display: none; }

/* 键值表 */
.dd-body { padding: 0 var(--space-5) var(--space-4); }
.dd-kv {
  display: flex; align-items: baseline; gap: var(--space-4);
  padding: 9px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-base);
}
.dd-kv:last-child { border-bottom: 0; }
.dd-kv > span { flex: 0 0 96px; color: var(--text-muted); }
.dd-kv > b { flex: 1; min-width: 0; font-weight: var(--weight-normal); color: var(--text); word-break: break-all; }
.dd-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-sm); }
.dd-ok { color: var(--online); }
.dd-muted { color: var(--text-muted); }

.dd-note {
  display: flex; align-items: center; gap: 6px;
  margin: 0 var(--space-5) var(--space-5);
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-md);
  font-size: var(--text-sm); color: var(--text-muted);
}
.dd-note .icon { flex: 0 0 auto; }

/* 预置位 */
.dd-presets { padding: 0 var(--space-5) var(--space-4); }
.dd-empty { padding: var(--space-5); text-align: center; color: var(--text-muted); font-size: var(--text-base); line-height: 1.8; }
.dd-empty span { font-size: var(--text-sm); }
.dd-preset {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border-subtle);
}
.dd-preset:last-child { border-bottom: 0; }
.dd-preset__slot {
  width: 30px; height: 30px; flex: 0 0 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--text-secondary);
  font-size: var(--text-base); font-weight: var(--weight-medium);
}
.dd-preset__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dd-preset__name { font-size: var(--text-base); color: var(--text); }
.dd-preset__meta { font-size: var(--text-sm); color: var(--text-muted); }

/* 操作 */
.dd-ops { display: flex; gap: var(--space-3); padding: var(--space-4) var(--space-5) var(--space-5); flex-wrap: wrap; }
.dd-ops .btn { flex: 1 1 auto; justify-content: center; }


/* ---- 自动分析状态卡 ---- */
.ai-auto { margin-bottom: var(--space-5); }

/* ⚠️ 这一行元素多（图标 + 标题 + 运行胶囊 + 模式 + 口径标签 + 策略设置链接），
   而 .card__head 是**不换行**的 flex 行 —— 窄屏下会把「自动分析」挤成
   一列一个汉字（实测 414px 竖排，2026-10-12）。
   修法：允许换行 + 标题不折行。 */
.ai-auto .card__head { flex-wrap: wrap; row-gap: var(--space-2); }
.ai-auto .card__head .card__title { white-space: nowrap; }
@media (max-width: 560px) {
  /* 极窄屏：模式与口径标签单独占一行，别和标题抢宽度 */
  .ai-auto .card__head .ai-auto__mode { margin-left: 0; margin-right: 0; }
  .ai-auto__scope { order: 10; }
  .ai-auto .card__head .sec-head__more { margin-left: auto; }
}

.ai-auto__mode {
  margin-left: auto; margin-right: var(--space-3);
  font-size: var(--text-sm); color: var(--text-muted);
  white-space: nowrap;
}
/* 口径标签：说明本卡统计的是「云端队列」，
   与下方「AI 处理情况」（今日事件累计）区分开（用户反馈第 2 条）。 */
.ai-auto__scope {
  margin-right: var(--space-3);
  padding: 2px 8px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-muted);
  font-size: var(--text-xs); white-space: nowrap;
}
.card__head .ai-auto__mode + .sec-head__more { margin-left: 0; }

/* 预算进度条（用户反馈第 7 条） */
.ai-budget { display: flex; flex-direction: column; gap: 5px; margin-top: 2px; min-width: 84px; }
.ai-budget__bar {
  display: block; height: 4px; border-radius: 999px;
  background: var(--surface-3); overflow: hidden;
}
.ai-budget__fill {
  display: block; height: 100%; border-radius: 999px;
  background: var(--accent);
  transition: width var(--duration-normal) var(--ease-out);
}
.ai-budget__fill.is-over { background: var(--danger); }
.ai-budget__txt { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }

.ai-auto__stats {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: var(--space-5) var(--space-5);
}
@media (max-width: 1000px) { .ai-auto__stats { grid-template-columns: repeat(2, 1fr); } }

.ai-autostat { display: flex; align-items: flex-start; gap: var(--space-3); min-width: 0; }
.ai-auto__stats > .ai-autostat + .ai-autostat { border-left: 1px solid var(--border-subtle); padding-left: var(--space-4); }
.ai-autostat__body { min-width: 0; }
.ai-autostat__label, .ai-autostat__hint, .ai-autostat__val { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-autostat__icon { color: var(--text-muted); flex: 0 0 auto; margin-top: 2px; }
.ai-autostat__body { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.ai-autostat__label { margin-bottom: 1px; }
.ai-autostat__label { font-size: var(--text-sm); color: var(--text-muted); }
.ai-autostat__val { font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1.2; }
.ai-autostat__hint { font-size: var(--text-xs); color: var(--text-muted); }

.ai-auto__warn {
  display: flex; align-items: center; gap: 6px;
  margin: 0 var(--space-5) var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: rgba(245,158,11,.10);
  border-radius: var(--radius-md);
  font-size: var(--text-sm); color: var(--warning);
}

.ai-jobs { padding: 0 var(--space-5) var(--space-5); }
.ai-jobs__head {
  font-size: var(--text-sm); color: var(--text-muted);
  padding: var(--space-4) 0 var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: var(--space-2);
}
.ai-job {
  display: grid; align-items: center; gap: var(--space-3);
  grid-template-columns: 58px minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.1fr) 56px;
  padding: 11px 0;
  font-size: var(--text-sm);
  border-bottom: 1px solid var(--border-subtle);
}
.ai-job:last-child { border-bottom: 0; }
.ai-job__time { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.ai-job__dev { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-job__reason { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-job__title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-job__st { text-align: right; color: var(--text-muted); }
.ai-job__st.is-ok { color: var(--online); }
.ai-job__st.is-bad { color: var(--danger); }
.ai-job__st.is-run { color: var(--accent); }


/* ==========================================================================
   AI 查找任务（阶段 1a）
   ========================================================================== */

.ai-find__input { display: flex; gap: var(--space-3); padding: 0 var(--space-5); }
@media (max-width: 700px) { .ai-find__input { flex-direction: column; } }
/* 费用说明：小字挂在输入框下方（原来被做成按钮主文案，主次颠倒） */
.ai-find__cost {
  display: flex; align-items: center; gap: 6px;
  padding: var(--space-2) var(--space-5) 0;
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-find__cost .icon { flex: 0 0 auto; color: var(--text-muted); }

.ai-find__examples {
  display: flex; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-4) var(--space-5) var(--space-4);
}

.ai-find__warn {
  display: flex; gap: var(--space-3); align-items: flex-start;
  margin: var(--space-4) 0; padding: var(--space-4);
  background: rgba(245,158,11,.10); border-radius: var(--radius-lg);
  color: var(--warning); font-size: var(--text-base);
}
.ai-find__warn-sub { font-size: var(--text-sm); color: var(--text-muted); margin-top: 4px; }

/* 预估卡片 */
.ai-find__est { padding: var(--space-4) 0 var(--space-5); }
.ai-find__est-head {
  display: flex; align-items: center; gap: 6px;
  padding: 0 var(--space-5) var(--space-3);
  font-size: var(--text-base); color: var(--text-secondary);
}
.ai-find__est-grid {
  display: grid; gap: var(--space-3);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 0 var(--space-5);
}
@media (max-width: 900px) { .ai-find__est-grid { grid-template-columns: repeat(2, 1fr); } }
.ai-find__est-item {
  display: flex; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-3);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.ai-find__est-icon { color: var(--text-muted); flex: 0 0 auto; margin-top: 2px; }
.ai-find__est-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ai-find__est-label { font-size: var(--text-sm); color: var(--text-muted); }
.ai-find__est-val { font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1.2; }
.ai-find__est-hint { font-size: var(--text-xs); color: var(--text-muted); }

.ai-find__plan { padding: var(--space-4) var(--space-5) 0; }
.ai-find__plan-row {
  display: flex; align-items: baseline; gap: var(--space-3);
  font-size: var(--text-base); padding: 6px 0;
}
.ai-find__plan-row > span { flex: 0 0 72px; color: var(--text-muted); }
.ai-find__plan-row > b { flex: 1; font-weight: var(--weight-normal); color: var(--text); }

.ai-find__cover {
  display: flex; align-items: center; gap: 6px;
  margin-top: var(--space-3); padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
}
.ai-find__cover.is-ok { background: rgba(34,197,94,.10); color: #4ade80; }
.ai-find__cover.is-warn { background: rgba(245,158,11,.10); color: var(--warning); }

.ai-find__actions {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-5) var(--space-3);
  flex-wrap: wrap;
}
.ai-find__zero { font-size: var(--text-base); color: var(--text-muted); }
.ai-find__tip {
  display: flex; align-items: center; gap: 6px;
  padding: 0 var(--space-5) var(--space-5);
  font-size: var(--text-sm); color: var(--text-muted);
}

/* 进度 */
.ai-find__prog { padding: var(--space-5); }
.ai-find__prog-head {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--text-lg); margin-bottom: var(--space-4);
}
.ai-find__bar {
  height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden;
}
.ai-find__bar > span {
  display: block; height: 100%; background: var(--accent);
  transition: width var(--duration-normal) var(--ease-out);
}
/* 当前正在核实的那一条（真实来自后端循环的 t.current） */
.ai-find__now {
  display: flex; align-items: center; gap: var(--space-3);
  margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
  background: var(--surface-2); border-radius: var(--radius-md);
  border-left: 3px solid var(--accent);
}
.ai-find__now-idx {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: var(--text-sm); font-weight: var(--weight-semibold);
}
.ai-find__now-body { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.ai-find__now-line {
  display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap;
  font-size: var(--text-base); color: var(--text);
}
.ai-find__now-sep { color: var(--text-muted); }
.ai-find__now-sub {
  display: flex; align-items: center; gap: var(--space-1);
  font-size: var(--text-sm); color: var(--accent);
}
/* 闪烁动画：表达"确实在跑"，而不是卡住了 */
.ai-find__now-sub .icon { animation: aiPulse 1.4s ease-in-out infinite; }
@keyframes aiPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  .ai-find__now-sub .icon { animation: none; }
}

.ai-find__prog-meta {
  display: flex; gap: var(--space-5); flex-wrap: wrap;
  margin-top: var(--space-3); font-size: var(--text-base); color: var(--text-muted);
}
.ai-find__prog-meta span { display: flex; align-items: center; gap: var(--space-1); }
.ai-find__prog-meta b { color: var(--text); font-weight: var(--weight-semibold); }

.ai-find__log {
  margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
  background: var(--surface-2); border-radius: var(--radius-md);
  font-size: var(--text-sm); color: var(--text-muted); line-height: 1.9;
  /* 长事件描述不换行会撑破容器（日志里带设备名+时间） */
  overflow-wrap: anywhere;
}

/* 进度区窄屏适配：
   默认左右各 20px 内边距在 375px 屏上只剩 335px，
   而「编号圆点 + 时间 + 设备 + 秒数」一行放不下会挤成一坨。 */
@media (max-width: 700px) {
  .ai-find__prog { padding: var(--space-4); }
  .ai-find__prog-head { font-size: var(--text-base); }
  .ai-find__now { gap: var(--space-2); padding: var(--space-3); }
  .ai-find__now-idx { width: 22px; height: 22px; font-size: var(--text-xs); }
  .ai-find__now-line { font-size: var(--text-sm); }
  .ai-find__prog-meta { gap: var(--space-4); font-size: var(--text-sm); }
  .ai-find__log { font-size: var(--text-xs); line-height: 1.8; }
}

/* 结果 */
.ai-find__result { padding: var(--space-4) 0 var(--space-5); }
.ai-find__answer {
  display: flex; align-items: flex-start; gap: var(--space-3);
  margin: 0 var(--space-5); padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-lg);
  font-size: var(--text-lg); line-height: 1.7;
}
.ai-find__answer.is-hit { background: rgba(34,197,94,.12); color: #4ade80; }
.ai-find__answer.is-none { background: rgba(148,163,184,.12); color: var(--text-secondary); }
.ai-find__answer .icon { flex: 0 0 auto; margin-top: 3px; }

.ai-find__meta {
  margin: var(--space-3) var(--space-5) 0;
  font-size: var(--text-sm); color: var(--text-muted);
}

.ai-find__ev-head {
  display: flex; align-items: center; gap: 6px;
  padding: var(--space-5) var(--space-5) var(--space-3);
  font-size: var(--text-base); color: var(--text-secondary);
}
.ai-find__evs {
  display: grid; gap: var(--space-4);
  grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 0 var(--space-5);
}
@media (max-width: 1000px) { .ai-find__evs { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px)  { .ai-find__evs { grid-template-columns: 1fr; } }

.ai-find__ev {
  display: flex; flex-direction: column;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden; cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out);
}
.ai-find__ev:hover { border-color: var(--accent); }
.ai-find__ev-img { position: relative; aspect-ratio: 16/9; background: #0a0d12; }
.ai-find__ev-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* 置信度徽章
   原来无论多少置信度都是同一个绿色 —— 等于告诉用户"找到的都一样可信"。
   实际上 0.85 和 0.45 差别很大，混在一起展示会让用户要么全信要么全不信。
   现在按档位分色，低档额外标「建议人工确认」。 */
.ai-find__ev-conf {
  position: absolute; top: 6px; right: 6px;
  padding: 1px 7px; border-radius: var(--radius-sm);
  color: #fff; font-size: var(--text-xs);
}
.ai-find__ev-conf.is-high { background: rgba(34,197,94,.9); }   /* 高：绿 */
.ai-find__ev-conf.is-mid  { background: rgba(234,179,8,.92); }  /* 中：黄 */
.ai-find__ev-conf.is-low  { background: rgba(148,163,184,.9); } /* 低：灰 */

/* 低置信度提示条：让"不确定"自己说出来，而不是伪装成确定 */
.ai-find__ev-warn {
  display: flex; align-items: center; gap: var(--space-1);
  margin-top: var(--space-2); font-size: var(--text-xs);
  color: #eab308;
}
.ai-find__ev-body { padding: var(--space-3) var(--space-4) var(--space-4); }
.ai-find__ev-time, .ai-find__ev-dev {
  display: flex; align-items: center; gap: 5px;
  font-size: var(--text-sm); color: var(--text-muted);
}
.ai-find__ev-note {
  margin-top: 6px; font-size: var(--text-base); color: var(--text);
  line-height: 1.6;
}
.ai-find__ev-btn { margin-top: var(--space-3); width: 100%; justify-content: center; }
/* 窄屏：单列布局下卡片变宽，16:9 的图会占掉半屏，
   缩成 21:9 更像"证据缩略图"而不是"主图"，把正文留在首屏内。 */
@media (max-width: 700px) {
  .ai-find__ev-img { aspect-ratio: 21/9; }
  .ai-find__ev-body { padding: var(--space-3); }
  /* 触控热区：项目规范要求可点元素不小于 44px */
  .ai-find__ev-btn { min-height: 44px; }
}

.ai-find__again { padding: var(--space-5) var(--space-5) 0; }


/* ---- 车牌展示 ---- */

/* 事件卡片上的车牌徽章（蓝底白字，模仿真实车牌）*/
.ev-card2__plate {
  position: absolute;
  left: 8px;
  bottom: 8px;
  padding: 2px 10px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #1e40af 0%, #1d4ed8 100%);
  border: 1px solid rgba(255,255,255,.35);
  color: #fff;
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  letter-spacing: .06em;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  box-shadow: 0 1px 4px rgba(0,0,0,.4);
  white-space: nowrap;
}
/* 有时间角标时并排 */
.ev-card2__time + .ev-card2__plate { left: auto; right: 8px; bottom: 8px; }

/* 详情弹窗里的车牌块 */
.evd__plate {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.evd__plate-num {
  padding: 5px 14px;
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, #1e40af 0%, #1d4ed8 100%);
  border: 1px solid rgba(255,255,255,.35);
  color: #fff;
  font-size: var(--text-lg);
  font-weight: var(--weight-semibold);
  letter-spacing: .1em;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.evd__plate-conf { font-size: var(--text-sm); color: var(--text-muted); }


/* ==========================================================================
   STORAGE — 存储监控（现代化数据看板风格）
   ========================================================================== */

/* 4 个统计卡 */
.st-stats {
  display: grid;
  gap: var(--space-4);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: var(--space-5);
}
@media (max-width: 1100px) {
  .st-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .st-stats { grid-template-columns: 1fr; }
}

.st-stat {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  display: flex;
  flex-direction: column;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  min-height: 140px;
  justify-content: space-between;
}
.st-stat:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.12);
}
.st-stat__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.st-stat__title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.st-stat__icon-wrap {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.st-stat__label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}
.st-stat__badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.st-stat__val-wrap {
  display: flex;
  align-items: baseline;
  gap: 6px;
  line-height: 1.2;
}
.st-stat__num {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.st-stat__total {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 400;
}
.st-stat__unit {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

/* 进度条增强 */
.st-bar {
  height: 6px;
  border-radius: 4px;
  background: var(--surface-3);
  overflow: hidden;
  margin-top: 10px;
  display: flex;
}
.st-bar > span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width .3s ease;
}
.st-bar--multi > span {
  border-radius: 0;
}
.st-bar--multi > span:first-child {
  border-radius: 4px 0 0 4px;
}
.st-bar--multi > span:last-child {
  border-radius: 0 4px 4px 0;
}
.st-bar--sm {
  height: 4px;
  margin-top: 4px;
}
.st-stat-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 10px;
}
.st-stat-foot b {
  color: var(--text);
  font-weight: 600;
}

/* 趋势图与图表卡片 */
.st-row {
  display: grid;
  gap: var(--space-5);
  align-items: start;
  margin-bottom: var(--space-5);
}
.st-row--2 {
  align-items: stretch;
}
.st-row--2 > .card {
  display: flex;
  flex-direction: column;
}
.st-row--2 .st-chart {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.st-row--2 .st-chart .st-chart__svg {
  flex: 1;
  height: auto;
  min-height: 200px;
}
.pnl[data-pnl="ov"] .st-row--2 {
  grid-template-columns: 1fr;
}
.st-row--2 {
  grid-template-columns: minmax(0,1.55fr) minmax(0,1fr);
}
@media (max-width: 1100px) {
  .st-row--2 { grid-template-columns: 1fr; }
}

.st-sel {
  width: auto;
  margin-left: auto;
  height: 32px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: var(--text-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
}
.st-chart {
  padding: var(--space-4) var(--space-5) var(--space-5);
}
.st-chart__svg {
  width: 100%;
  height: 200px;
  display: block;
}
.st-chart__ylab {
  font-size: var(--text-xs);
  fill: var(--text-muted);
}
.st-chart__xlab {
  font-size: var(--text-xs);
  fill: var(--text-muted);
}
.st-chart__empty {
  height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: var(--text-base);
  background: var(--surface-2);
  border-radius: var(--radius-lg);
  border: 1px dashed var(--border);
