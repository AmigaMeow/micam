name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 校验前端
        run: bash build/validate-web.sh

      - name: 编译（全部架构）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/micamd-amd64 ./cmd/micamd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/micamd-arm64 ./cmd/micamd
          ls -la /tmp/micamd-*

      - name: go vet
        run: go vet ./... || true

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: micamd-binaries
          path: /tmp/micamd-*
          retention-days: 7
