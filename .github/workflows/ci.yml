name: CI

# 一个工作流搞定构建校验 + 自动发布，方便手动创建。
#
# 触发：
#   push / PR        -> 校验 + 编译（不发布）
#   打 tag v*        -> 校验 + 编译 + 打包 + 发布 Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 校验前端结构
        run: bash build/validate-web.sh

      - name: 编译（amd64 + arm64）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/micamd-amd64 ./cmd/micamd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/micamd-arm64 ./cmd/micamd
          ls -lh /tmp/micamd-*

      - name: go vet
        run: go vet ./... || true

      - name: 上传二进制产物
        uses: actions/upload-artifact@v7
        with:
          name: micamd-binaries
          path: /tmp/micamd-*
          retention-days: 7

      # ---- 以下只在打 tag 时执行 ----

      - name: 编译飞牛版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w" \
            -o platform/fnos/app/server/micamd ./cmd/micamd

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
