name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 编译飞牛版本
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w" \
            -o platform/fnos/app/server/micamd ./cmd/micamd

      - name: 校验前端
        run: bash build/validate-web.sh

      - name: 安装 fnpack 并打包
        run: |
          # fnpack 是飞牛的打包工具，这里用官方脚本获取
          # 如果失败则跳过（用户可以本地构建）
          curl -fsSL -o /tmp/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-linux-amd64 || exit 0
          chmod +x /tmp/fnpack
          cd platform/fnos && /tmp/fnpack build
        continue-on-error: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            platform/fnos/micam.fpk
            /tmp/micamd-*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
