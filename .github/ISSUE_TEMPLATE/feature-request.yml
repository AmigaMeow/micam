name: 功能建议
description: 想要新功能
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说功能
      placeholder: |
        例如：我想在有人经过时自动录像并通知我
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案（可选）
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: 现在的替代做法（可选）
      description: 你现在怎么绕过这个问题的
    validations:
      required: false
